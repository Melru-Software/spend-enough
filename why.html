  <h1>Why I built Spend Enough</h1>
  <figure>
    <blockquote>
      <p>I've always been good at saving and bad at spending. Even when the numbers said we were fine, I didn't feel it. The future felt unknowable, and my habit was to throw up my hands, say we can never know, and keep saving out of fear.</p>
      <h2>Can we afford for me not to go back to work?</h2>
      <p>On maternity leave I wanted to play out whether we could afford for me not to go back to work, and what that would do to retirement. If we didn't save every spare dollar, would we still be okay? And if we did, were we going to end up with a pile at 80 that we wish we'd used at 40?</p>
      <p>I tried to do it in a spreadsheet first. It was clunky to set up the formulas, and hard to get it to just show me what I wanted to see. I briefly looked at some of the FIRE tools and thought this is way too hard for an average person. I could probably do it, but I'm not really that type of nerd. I'm on the cusp of being able to understand it, but I would rather have something just tell me the answer in a way I can see, and let me mess around with it without having to change hundreds of inputs. What I kept wishing for was a button. Play out this scenario for me. What if I take two years off, what if we pay off the house. That became the preset scenarios. And past that, could it tell me which levers I'd have to move to reach a target? That became "what would it take." I couldn't find any of that at a price I'd pay, and I didn't want to hire a planner just to ask what-ifs. I'm a software engineer, so I built one.</p>
      <h2>What did it show me?</h2>
      <p>I was running the numbers to find out if we could live on one salary. We could, but stopping work now would add about ten years of working at the end of my career. That settled it, and I felt at peace with it, because I could see what the decision cost and what it bought. Then my husband got laid off, and I went straight back to the numbers, and they made me feel a lot better about that too. I'd wanted to know whether we could live on one salary. I'd always imagined it would be his.</p>
      <p>The chart also showed me things I'd never had a way to see. How much we could actually spend each year. What our retirement accounts would grow to if we never put in another dollar. What working part time for a few years would do. I tend to think in all or nothing, and the chart kept showing me the middle.</p>
      <h2>What did I get wrong about certainty?</h2>
      <p>I thought there would be a number I could say, with 100% certainty, would last to the end of my life. I kept asking, okay, but what can I spend for sure? In historical mode there's an answer of sorts, the amount that came through every stretch of the market since 1926, and even that only means it hasn't failed yet. In simulated mode, where the tool makes up hundreds of possible futures, the amount that survived every single one was unrealistically small. Push for 100% and you can't live on what's left. That was the thing I had to get my head around. Certainty isn't on offer at any number. What is on offer is a plan that came through all but the few worst starting years of the last century, and the ability to see it coming and adjust if we ever land in one of those. That turned out to be enough.</p>
      <p>What surprised me more was the spread. The same plan, run through every market history, ended anywhere from running out to several million dollars. The spread comes from the market. Thirty years of compounding turns a few bad years early on into a completely different life than the same bad years late. At first that made me feel like we can't know anything.</p>
      <p>But a small change in what we spend moved that whole range, and changed how many of the histories failed, by more than I expected. I don't really understand statistics. Playing with the numbers made this much clear to me. The certainty I was looking for was never going to come from a single number, because that number is unknowable. What you can know is the shape of the range, which outcomes are far more likely than others, and how much each choice moves them.</p>
      <h2>So what changed?</h2>
      <p>I feel empowered to turn the dials in our finances and adjust as we go. I didn't stop working, but we spend more on a nanny, and I am less stressed about retirement savings. I'm grateful to my past self for setting us up this well. Using what she saved for the good life she was hoping for seems like the right way to thank her. And if this turns out to be useful to other people, maybe it becomes one of the ways we get there.</p>
    </blockquote>

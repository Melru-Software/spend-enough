  <p class="eyebrow">Why I built it</p>
  <h1>If we don't save every spare dollar, are we still okay?</h1>
  <figure>
    <blockquote>
      <p>I've always been good at saving and bad at spending. Even when the numbers said we were fine, I didn't feel it. The future felt unknowable, and my habit was to throw up my hands, say we can never know, and keep saving out of fear. On maternity leave I wanted to play out whether we could afford for me not to go back to work, and what that would do to retirement. If we didn't save every spare dollar, would we still be okay? And if we did, were we going to end up with a pile at 80 that we wish we'd used at 40? I couldn't find a tool that showed me that in a way I understood, at a price I'd pay, and I didn't want to hire a planner just to ask what-ifs. So I built one. It turns out, the certainty I was looking for was never going to come from a single number, because that number is unknowable. What I learned was why it's hard to predict that far out, and why a small change now can have an outsized effect later. But now, I feel empowered to turn the dials in our finances and adjust as we go. I didn't stop working, but we spend more on a nanny, and I am less stressed about retirement savings. I'm grateful to my past self for setting us up this well. Using what she saved for the good life she was hoping for seems like the right way to thank her.</p>
    </blockquote>

    <summary>Assumptions behind this result <span class="asm-hint">every default, and where to change it</span></summary>
    <div class="asm-body">${rows.join('')}
      <div class="asm-sources">Sources: <a href="${DATA_SOURCE.url}" target="_blank" rel="noopener">Robert Shiller’s U.S. stock market dataset</a> (Yale) for S&amp;P composite prices, dividends, CPI, and 10-year Treasury yields, 1926–${HISTORICAL_END_YEAR}, rebuilt by a script in the code (${HISTORICAL_END_YEAR} is a partial year); 2026 IRS brackets and standard deduction; 2026 SSA bend points and wage base; state rates from the Tax Foundation. This is not the Ibbotson data the original 4% rule studies used.</div>
    </div></details>`;
}

// ===== WHAT WOULD IT TAKE =====
let wwitCache = null, wwitStale = true;
function renderWhatItTakes(result) {
  if (!isPaid() || result.mode !== 'historical') return '';
  if (wwitStale || !wwitCache) {
    const th = state.successThreshold || 0.85;
    const need = Math.ceil(th * result.totalPeriods);
    const c = { th, need, total: result.totalPeriods, clears: result.successRate >= th };
    const ratio = state.spending > 0 ? state.lateSpending / state.spending : 0.85;
    const ms = findMaxSpendAtSuccess({ ...state, spending: state.spending || 100000, lateSpending: (state.spending || 100000) * ratio }, th);
    c.maxSpend = Math.round((ms.spend + state.housing) / 1000) * 1000;
    if (!c.clears) {
      c.age = findRetireAgeAtSuccess(state, th);
      c.portfolio = findPortfolioAtSuccess(state, th);
    }
    wwitCache = c; wwitStale = false;
  }
  const c = wwitCache;
  const pctTh = Math.round(c.th * 100);
  const nowSpend = state.spending + state.housing;
  if (c.clears) {
    const room = c.maxSpend - nowSpend;
    return `<div class="wwit"><div class="wwit-title">Room to spend</div>This plan lasts in at least ${c.need} of ${c.total} periods (${pctTh}% of history). ${room >= 1000 ? 'Spending could go up to <strong>' + fmtMoney(c.maxSpend) + '</strong> a year all in, ' + fmtMoneyShort(room) + ' more than now, and still clear that line.' : 'At ' + fmtMoney(nowSpend) + ' a year it is right at that line.'} That is with steady spending and no guardrail cuts.</div>`;
  }
  const items = [];
  if (c.maxSpend < nowSpend) items.push('Spend <strong>' + fmtMoney(c.maxSpend) + '</strong> a year all in, ' + fmtMoneyShort(nowSpend - c.maxSpend) + ' less than now.');
  if (c.age && c.age.age > state.yourStopWorkAge) items.push('Work until <strong>' + c.age.age + '</strong> instead of ' + state.yourStopWorkAge + ', ' + (c.age.age - state.yourStopWorkAge) + ' more year' + (c.age.age - state.yourStopWorkAge > 1 ? 's' : '') + '.');
  if (c.portfolio && !c.portfolio.alreadyThere) items.push('Have <strong>' + fmtMoney(c.portfolio.portfolio) + '</strong> saved today, ' + fmtMoneyShort(c.portfolio.portfolio - state.portfolio) + ' more than now.');
  if (!items.length) return '';
  return `<div class="wwit"><div class="wwit-title">What would it take</div>To last in at least ${c.need} of ${c.total} periods (${pctTh}% of history), any one of these would do it on its own:<ul>${items.map(i => '<li>' + i + '</li>').join('')}</ul></div>`;
}

// ===== YEAR BY YEAR =====
function yearRows(result) {
  const run = result.medianRun || [];
  return run.map((y, i) => {
    const p = result.percentiles[i] || {};
    return { age: y.age, year: y.year, wages: y.yourIncome + y.partnerIncome, ss: y.ssIncome, spending: y.spending, fromPortfolio: y.withdrawal > 0 ? y.withdrawal : 0, added: y.withdrawal < 0 ? -y.withdrawal : 0, tax: y.tax, ret: y.marketReturn, balance: y.portfolio, p10: p.p10, p90: p.p90, ranOut: y.ranOut };
  });
}
function renderYearTable(result) {
  const rows = yearRows(result);
  const notFixed = result.mode !== 'fixed';
  return `<div class="section-heading">Year by year</div>
    <div class="section-sub">The median path, in today’s dollars.${notFixed ? ' The last two columns are where the worst 10% and best 10% of ' + (result.mode === 'historical' ? 'periods' : 'futures') + ' stood at each age.' : ''} <button class="link-btn year-actions" onclick="downloadCsv()">Download as a spreadsheet (CSV)</button></div>
    <div class="year-table-wrap"><table class="data-table"><thead><tr><th>Age</th><th>Wages</th><th>Social Security</th><th>Spending</th><th>From portfolio</th><th>Added</th><th>Return</th><th>Balance</th>${notFixed ? '<th>Worst 10%</th><th>Best 10%</th>' : ''}</tr></thead><tbody>
    ${rows.map(r => `<tr class="${r.ranOut ? 'out' : ''}"><td>${r.age}</td><td>${r.wages > 0 ? fmtMoneyShort(r.wages) : ''}</td><td>${r.ss > 0 ? fmtMoneyShort(r.ss) : ''}</td><td>${fmtMoneyShort(r.spending)}</td><td>${r.fromPortfolio > 0 ? fmtMoneyShort(r.fromPortfolio) : ''}</td><td>${r.added > 0 ? fmtMoneyShort(r.added) : ''}</td><td>${(r.ret * 100).toFixed(1)}%</td><td>${r.ranOut ? 'ran out' : fmtMoneyShort(r.balance)}</td>${notFixed ? '<td>' + (r.p10 <= 0 ? 'ran out' : fmtMoneyShort(r.p10)) + '</td><td>' + fmtMoneyShort(r.p90) + '</td>' : ''}</tr>`).join('')}
    </tbody></table></div>`;
}
window.downloadCsv = function() {
  if (!isPaid()) { showUnlockModal(); return; }
  const r = lastSimResult; if (!r) return;
  const rows = yearRows(r);
  const head = ['Age', 'Year', 'Wages', 'Social Security', 'Spending (all in)', 'From portfolio', 'Added to portfolio', 'Tax on withdrawals', 'Real return', 'Balance (median path)', 'Balance worst 10%', 'Balance best 10%', 'Ran out'];
  const lines = [head.join(',')].concat(rows.map(x => [x.age, x.year, Math.round(x.wages), Math.round(x.ss), Math.round(x.spending), Math.round(x.fromPortfolio), Math.round(x.added), Math.round(x.tax), (x.ret * 100).toFixed(2) + '%', Math.round(x.balance), Math.round(x.p10 || 0), Math.round(x.p90 || 0), x.ranOut ? 'yes' : 'no'].join(',')));
  lines.push('');
  lines.push('"Spend Enough scenario export, ' + new Date().toISOString().slice(0, 10) + '. ' + modeName(r.mode) + ' mode, ' + mixLabel() + ' stocks/bonds, fees ' + pct(state.feeRate || 0, 2) + '. Today\'s dollars. Educational model, not advice."');
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'spend-enough-' + (currentName !== 'Current' ? currentName : 'scenario').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.csv';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  track('downloaded_csv');
};

// ===== PRINT =====
window.printReport = function() {
  if (!isPaid()) { showUnlockModal(); return; }
  const prevA = assumptionsOpen, prevD = deepOpen, prevR = readFirstOpen;
  assumptionsOpen = true; deepOpen = true; readFirstOpen = false;
  document.body.classList.add('printing');
  render();
  const done = () => { document.body.classList.remove('printing'); assumptionsOpen = prevA; deepOpen = prevD; readFirstOpen = prevR; window.removeEventListener('afterprint', done); render(); };
  window.addEventListener('afterprint', done);
  setTimeout(() => { if (lastSimResult) drawCashflowChart(lastSimResult); setTimeout(() => window.print(), 250); }, 200);
  track('printed_report');
};

// ===== SIDE BY SIDE =====
function renderCompareSummary(a, b) {
  const last = r => r.percentiles[r.percentiles.length - 1];
  const range = r => r.mode === 'fixed' ? fmtMoneyShort(last(r).p50) + ' (steady return)' : (last(r).p10 <= 0 ? 'ran out' : fmtMoneyShort(last(r).p10)) + ' to ' + fmtMoneyShort(last(r).p90);
  const im = computeImpact();
  const diffs = im ? im.changes.map(c => c.label + ' ' + c.from + ' → ' + c.to).join('; ') : 'no inputs differ yet';
  return `<div class="section-heading">Side by side</div>
    <div class="section-sub">${baselineName} and ${currentName}, both run in ${modeName(b.mode)} mode. What differs: ${diffs}. <button class="link-btn" onclick="toggleCompare()">Stop comparing</button></div>
    <table class="data-table compare-table"><thead><tr><th></th><th>${baselineName}</th><th>${currentName}</th></tr></thead><tbody>
      <tr><td>Lasted to age ${state.targetAge}</td><td>${periodsLabel(a)}</td><td style="font-weight:600;color:var(--ink)">${periodsLabel(b)}</td></tr>
      <tr><td>Ending balance, worst 10% to best 10%</td><td>${range(a)}</td><td>${range(b)}</td></tr>
      <tr><td>Median ending balance</td><td>${fmtMoneyShort(a.medianFinal)}</td><td>${fmtMoneyShort(b.medianFinal)}</td></tr>
      <tr><td>Spending, all in</td><td>${fmtMoney(baselineState.spending + baselineState.housing)}</td><td>${fmtMoney(state.spending + state.housing)}</td></tr>
      <tr><td>Portfolio today</td><td>${fmtMoneyShort(baselineState.portfolio)}</td><td>${fmtMoneyShort(state.portfolio)}</td></tr>
    </tbody></table>`;
}

// ===== CONFIDENCE BANDS =====
function renderBands(result) {
  const last = result.percentiles[result.percentiles.length - 1];
  if (result.mode === 'fixed') {
    return `<div class="bands"><div class="band neutral" style="grid-column:1/-1"><div class="band-label">Projected ending balance</div><div class="band-sub">At a steady ${(state.returnRate*100).toFixed(1)}% real return</div><div class="band-value">${last.p50 <= 0 ? 'Depleted at age '+result.medianRunOutAge : fmtMoneyShort(last.p50)}</div></div></div>`;
  }
  const unit = result.mode === 'historical' ? 'periods' : 'futures';
  // p10 <= 0 means at least 10% of runs were depleted by the end; say that, not a single age.
  const consTxt = last.p10 <= 0 ? 'Ran out' : fmtMoneyShort(last.p10);
  const consSub = last.p10 <= 0 ? `${result.failureCount} of ${result.totalPeriods} ${unit} ran out; among those, half by age ${result.medianRunOutAge}` : `10% of ${unit} ended below this`;
  return `<div class="section-heading">Ending balance at age ${state.targetAge}</div>
  <div class="section-sub">Where the ${result.totalPeriods} ${unit} finished. Every figure is in today's dollars.</div>
  <div class="bands">
    <div class="band warn"><div class="band-label">Worst 10%</div><div class="band-sub">${consSub}</div><div class="band-value">${consTxt}</div></div>
    <div class="band ok"><div class="band-label">Middle 50%</div><div class="band-sub">Half of ${unit} ended in this range</div><div class="band-value">${fmtMoneyShort(last.p25)}\u2013${fmtMoneyShort(last.p75)}</div></div>
    <div class="band neutral"><div class="band-label">Best 10%</div><div class="band-sub">10% of ${unit} ended above this</div><div class="band-value">${fmtMoneyShort(last.p90)}</div></div>
  </div>`;
}

// ===== EVENT TIMELINE =====
function renderEventTimeline() {
  const events = [];
  if (state.yourPartTimeAmount > 0) {
    const glide = state.yourPartTimeEnd >= state.yourStopWorkAge;
    events.push({ age: state.yourPartTimeStart, label: 'Part-time', detail: 'Income drops from ' + fmtMoneyShort(state.yourIncome) + ' to ' + fmtMoneyShort(state.yourPartTimeAmount) });
    events.push({ age: state.yourPartTimeEnd, label: glide ? 'You stop working' : 'Back to full time', detail: glide ? 'Part-time income ends' : 'Income returns to ' + fmtMoneyShort(state.yourIncome) });
    if (!glide && state.yourStopWorkAge > state.yourPartTimeEnd) events.push({ age: state.yourStopWorkAge, label: 'You retire', detail: 'Income drops to $0' });
  }
  else if (state.yourStopWorkAge > state.age && state.yourIncome > 0) events.push({ age: state.yourStopWorkAge, label: 'You retire', detail: 'Income drops from ' + fmtMoneyShort(state.yourIncome) + ' to $0' });
  if (state.hasPartner && state.partnerStopWorkAge > state.partnerAge && state.partnerIncome > 0) events.push({ age: state.partnerStopWorkAge, label: 'Partner retires', detail: 'Partner income drops to $0' });
  if (state.housing > 0 && state.mortgagePayoffAge > state.age && (!has(state.homeSaleAge) || state.mortgagePayoffAge < state.homeSaleAge)) events.push({ age: state.mortgagePayoffAge, label: 'Mortgage paid off', detail: fmtMoneyShort(state.housing) + '/yr payment ends' + (state.postPayoffSpend > 0 ? '; ' + fmtMoneyShort(state.postPayoffSpend) + '/yr of it goes to spending' : '') });
  if (has(state.homeSaleAge)) events.push({ age: state.homeSaleAge, label: 'House sold', detail: fmtMoneyShort(state.homeSaleProceeds) + ' into the portfolio; housing ' + fmtMoneyShort(state.postSaleHousing || 0) + '/yr after' });
  if (has(state.yourBreakStart) && state.yourBreakStart >= state.age) { events.push({ age: state.yourBreakStart, label: 'Career break', detail: 'No wages from ' + state.yourBreakStart + ' to ' + state.yourBreakEnd }); events.push({ age: state.yourBreakEnd, label: 'Back to work', detail: 'Wages resume' }); }
  if (state.hasPartner && has(state.partnerBreakStart)) { events.push({ age: state.age + (state.partnerBreakStart - state.partnerAge), label: 'Partner’s break', detail: 'Partner has no wages for ' + (state.partnerBreakEnd - state.partnerBreakStart) + ' years' }); }
  if (state.shockEra && has(state.shockAge)) events.push({ age: state.shockAge, label: 'Bad decade starts', detail: shockLabel(state.shockEra) + ' returns for ten years' });
  if (state.extraSpend > 0 && has(state.extraSpendStart)) { events.push({ age: state.extraSpendStart, label: 'Extra spending', detail: '+' + fmtMoneyShort(state.extraSpend) + '/yr until ' + state.extraSpendEnd }); events.push({ age: state.extraSpendEnd, label: 'Extra spending ends', detail: '' }); }
  if (state.ssStartAge > state.age && (state.yourSSAmount > 0 || state.partnerSSAmount > 0)) events.push({ age: state.ssStartAge, label: 'Social Security begins', detail: fmtMoneyShort(state.yourSSAmount + state.partnerSSAmount) + '/yr starts' });
  if (state.slowDownAge > state.age && state.lateSpending !== state.spending) events.push({ age: state.slowDownAge, label: 'Spending changes', detail: fmtMoneyShort(state.spending) + ' \u2192 ' + fmtMoneyShort(state.lateSpending) + '/yr' });
  if (state.oneTimeEvents) state.oneTimeEvents.forEach(ev => events.push({ age: ev.age, label: ev.label, detail: fmtMoneyShort(ev.amount) }));
  events.sort((a, b) => a.age - b.age);
  if (!events.length) return '';
  return `<div style="display:flex;flex-wrap:wrap;gap:6px 10px;margin-bottom:18px;padding:0 4px">${events.map(ev =>
    `<div style="font-size:14px;color:var(--ink-mute);background:var(--paper);border:1px solid var(--line-soft);border-radius:3px;padding:4px 8px" title="${ev.detail}"><span style="font-family:'Inter Tight',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-soft);margin-right:4px">${ev.age}</span>${ev.label}</div>`
  ).join('')}</div>`;
}

// ===== SPENDING EXPLORER =====
function computeSpendingLevels() {
  if (!spendingLevelsStale && spendingLevelsCache) return spendingLevelsCache;
  const base = state.spending || 50000;
  const ratio = state.spending > 0 ? state.lateSpending / state.spending : 0.85;
  const mults = [0.8, 0.9, 1.0, 1.1, 1.2];
  const rows = mults.map(m => {
    const spend = Math.round(base * m / 1000) * 1000;
    const ts = { ...state, spending: spend, lateSpending: Math.round(spend * ratio) };
    const r = runForState(ts);
    const last = r.percentiles[r.percentiles.length - 1];
    return { spending: spend, successRate: r.successRate, successCount: r.successCount, totalPeriods: r.totalPeriods, medianFinal: r.medianFinal, p10: last.p10, isCurrent: spend === (Math.round(base/1000)*1000) && m === 1.0 };
  });
  spendingLevelsCache = rows; spendingLevelsStale = false;
  return rows;
}
function renderSpendingExplorer() {
  const rows = computeSpendingLevels();
  const isHist = state.simMode === 'historical';
  return `<table class="data-table"><thead><tr><th>Spending, all in</th><th>${isHist?'Historical success':'Success'}</th><th>Median ending</th><th>Worst 10%</th></tr></thead><tbody>
    ${rows.map(r => `<tr class="${r.isCurrent?'current-row':''} clickable" onclick="applySpending(${r.spending})" title="Click to set spending to ${fmtMoney(r.spending)}/yr"><td>${fmtMoney(r.spending + state.housing)}/yr ${r.isCurrent?'<span class="tag-current">current</span>':''}</td><td>${isHist ? r.successCount+' of '+r.totalPeriods : Math.round(r.successRate*100)+'%'}</td><td>${fmtMoneyShort(r.medianFinal)}</td><td>${r.p10<=0?'<span class="fail">Ran out</span>':fmtMoneyShort(r.p10)}</td></tr>`).join('')}
  </tbody></table>`;
}

// ===== FLEXIBILITY IMPACT =====
function renderFlexibilityImpact() {
  const isHist = state.simMode === 'historical';
  const withFlex = runForState({ ...state, guardrailsEnabled: true });
  const withoutFlex = runForState({ ...state, guardrailsEnabled: false });
  const fmtShort = (r) => isHist ? r.successCount + '/' + r.totalPeriods : Math.round(r.successRate * 100) + '%';
  const improved = isHist ? (withFlex.successCount > withoutFlex.successCount) : (withFlex.successRate > withoutFlex.successRate);
  const activeLeft = !state.guardrailsEnabled;
  const activeRight = state.guardrailsEnabled;

  return `<div class="section-heading">Spending flexibility</div>
    <div class="section-sub">What happens if you adjust spending when your portfolio is under pressure?</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px">
      <div onclick="update('guardrailsEnabled',false)" style="background:var(--paper);border:${activeLeft?'2px solid var(--ink)':'1px solid var(--line)'};border-radius:4px;padding:${activeLeft?'19px':'20px'};cursor:pointer;text-align:center;transition:border-color 0.15s">
        <div style="font-size:14px;text-transform:uppercase;letter-spacing:0.08em;color:${activeLeft?'var(--ink)':'var(--ink-mute)'};margin-bottom:8px;font-weight:${activeLeft?'700':'500'}">Fixed spending</div>
        <div style="font-size:28px;font-weight:600;font-family:'Inter Tight',system-ui,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink)">${fmtShort(withoutFlex)}</div>
        <div style="font-size:14px;color:var(--ink-faint);margin-top:4px">${isHist?'periods survived':'of simulations'}</div>
      </div>
      <div onclick="update('guardrailsEnabled',true)" style="background:var(--paper);border:${activeRight?'2px solid var(--ink)':'1px solid var(--line)'};border-radius:4px;padding:${activeRight?'19px':'20px'};cursor:pointer;text-align:center;transition:border-color 0.15s">
        <div style="font-size:14px;text-transform:uppercase;letter-spacing:0.08em;color:${activeRight?'var(--ink)':'var(--ink-mute)'};margin-bottom:8px;font-weight:${activeRight?'700':'500'}">With flexibility</div>
        <div style="font-size:28px;font-weight:600;font-family:'Inter Tight',system-ui,sans-serif;font-variant-numeric:tabular-nums;color:${improved?'var(--moss)':'var(--ink)'}">${fmtShort(withFlex)}</div>
        <div style="font-size:14px;color:var(--ink-faint);margin-top:4px">${isHist?'periods survived':'of simulations'}</div>
        <div style="display:flex;gap:12px;justify-content:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line-soft)">
          <div>
            <div style="font-size:14px;color:var(--ink-mute);margin-bottom:3px">Cut</div>
            <div style="display:inline-flex;align-items:baseline;gap:1px">
              <input type="number" min="0" max="50" step="5" value="${Math.round(state.guardrailCutPct*100)}" onclick="event.stopPropagation()" onchange="update('guardrailCutPct',+this.value/100)" style="width:42px;text-align:center;font-family:'Inter Tight',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;background:var(--bone);border:1px solid var(--line);border-radius:3px;padding:4px 2px;color:var(--ink)"/><span style="font-size:14px;color:var(--ink-mute)">%</span>
            </div>
          </div>
          <div>
            <div style="font-size:14px;color:var(--ink-mute);margin-bottom:3px">Boost</div>
            <div style="display:inline-flex;align-items:baseline;gap:1px">
              <input type="number" min="0" max="50" step="5" value="${Math.round(state.guardrailBoostPct*100)}" onclick="event.stopPropagation()" onchange="update('guardrailBoostPct',+this.value/100)" style="width:42px;text-align:center;font-family:'Inter Tight',system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;background:var(--bone);border:1px solid var(--line);border-radius:3px;padding:4px 2px;color:var(--ink)"/><span style="font-size:14px;color:var(--ink-mute)">%</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="flex-note">${state.guardrailsEnabled && improved ? 'Cutting spending by '+Math.round(state.guardrailCutPct*100)+'% when your portfolio is stressed improves the count. In some years you would live on less, and the portfolio recovers faster.' : state.guardrailsEnabled ? 'At these settings, flexibility has minimal impact on outcomes.' : 'With fixed spending, the same amount is withdrawn every year regardless of market conditions.'}</div>`;
}

// ===== STRESS TESTS =====
function renderStressTests() {
  const cards = HISTORICAL_SCENARIOS.map(s => {
    const run = runNamedScenario(state, s);
    const final = run.years[run.years.length - 1];
    const survived = !run.years.some(y => y.ranOut);
    const ranOut = run.years.find(y => y.ranOut);
    return `<div class="scenario-card ${survived?'survived':'failed'}" onclick="showScenarioDetail('${s.id}')">
      <div class="scenario-name">${s.name}</div>
      <div class="scenario-years">${s.startYear}\u2013${s.startYear + (state.targetAge - state.age)}${run.padded?'*':''}</div>
      <div class="scenario-result ${survived?'ok':'fail'}">${survived ? 'Ended with '+fmtMoneyShort(final.portfolio) : 'Ran out at age '+ranOut.age}</div>
      <div class="scenario-desc">${s.description}</div>
    </div>`;
  }).join('');
  return `<div class="section-heading">Historical stress tests</div>
    <div class="section-sub">How this scenario would have played out starting in specific market environments.</div>
    <div class="scenario-cards">${cards}</div>
    ${HISTORICAL_SCENARIOS.some(s => runNamedScenario(state, s).padded) ? '<div class="section-sub" style="margin-top:-8px">* Your horizon runs past the end of the data; padded years use the mix’s long-run compound return.</div>' : ''}`;
}

// ===== SS COMPARISON =====
function renderSSComparison() {
  const ages = [62, 67, 70];
  const factors = { 62: 0.70, 67: 1.00, 70: 1.24 };
  const baseYour = state.ssStartAge === 67 ? state.yourSSAmount : state.yourSSAmount / (factors[state.ssStartAge] || 1);
  const basePartner = state.ssStartAge === 67 ? state.partnerSSAmount : state.partnerSSAmount / (factors[state.ssStartAge] || 1);
  const isHist = state.simMode === 'historical';
  const cards = ages.map(a => {
    const ts = { ...state, ssStartAge: a, yourSSAmount: Math.round(baseYour * factors[a]), partnerSSAmount: Math.round(basePartner * factors[a]) };
    const r = runForState(ts);
    const benefit = ts.yourSSAmount + ts.partnerSSAmount;
    const label = a === 62 ? 'Early' : a === 67 ? 'Full retirement' : 'Delayed';
    const highlight = a === state.ssStartAge ? 'highlight' : '';
    return `<div class="ss-card ${highlight}" onclick="applySSAge(${a})" style="cursor:pointer" title="Click to use age ${a}"><div class="ss-age">${a}</div><div class="ss-label">${label}</div><div class="ss-benefit">${fmtMoney(benefit)}/yr</div><div class="ss-success" style="color:${r.successRate>=0.85?'var(--moss)':r.successRate>=0.6?'var(--gold)':'var(--danger)'}">${isHist ? 'Survived ' + r.successCount+' of '+r.totalPeriods : Math.round(r.successRate*100)+'%'}</div></div>`;
  }).join('');
  return `<div class="section-heading">Social Security claiming</div>
    <div class="section-sub">Claiming earlier means smaller payments for more years; later means larger payments for fewer. Click a card to see what happens if you claim at that age.</div>
    <div class="ss-grid">${cards}</div>`;
}

// ===== TAX COMPARISON =====
function renderTaxComparison() {
  // Use fixed mode for clean apples-to-apples comparison regardless of current mode
  const propState = { ...state, withdrawalStrategy: 'proportional' };
  const smartState = { ...state, withdrawalStrategy: 'taxSmart' };
  const prop = runFixed(propState);
  const smart = runFixed(smartState);
  const taxTotal = (r) => r.medianRun ? Math.round(r.medianRun.reduce((s, y) => s + (y.tax || 0), 0)) : 0;
  const propTax = taxTotal(prop), smartTax = taxTotal(smart);
  // After-tax ending wealth: Roth is worth 100%, traditional worth (1-taxRate), taxable worth (1-capGainsTax*0.5)
  const afterTaxWealth = (r) => {
    const fa = r.medianRun && r.medianRun.finalAccounts;
    if (!fa) return r.medianFinal;
    return fa.roth + fa.traditional * (1 - state.taxRate) + fa.taxable * (1 - state.capGainsTax * 0.5);
  };
  const propATW = afterTaxWealth(prop), smartATW = afterTaxWealth(smart);
  const smartBetter = smartATW > propATW;
  return `<div class="section-heading">Withdrawal strategy</div>
    <div class="section-sub">How you draw from different account types affects after-tax wealth. Preserving Roth (tax-free) growth typically leaves more usable money. These are simplified estimates at a steady ${(state.returnRate*100).toFixed(1)}% return.</div>
    <table class="data-table"><thead><tr><th></th><th>Proportional</th><th>Tax-aware order</th></tr></thead><tbody>
      <tr><td>After-tax ending wealth</td><td>${fmtMoneyShort(propATW)}</td><td style="color:${smartBetter?'var(--moss)':'var(--ink-soft)'};font-weight:600">${fmtMoneyShort(smartATW)}</td></tr>
      <tr><td>Estimated total tax paid</td><td>${fmtMoneyShort(propTax)}</td><td>${fmtMoneyShort(smartTax)}</td></tr>
      <tr><td>Pre-tax ending balance</td><td>${fmtMoneyShort(prop.medianFinal)}</td><td>${fmtMoneyShort(smart.medianFinal)}</td></tr>
    </tbody></table>
    <div class="flex-note">Tax-aware ordering (taxable \u2192 traditional \u2192 Roth) preserves tax-free Roth growth. It may show higher nominal tax, but the leftover money is worth more after tax. Estimated difference in after-tax wealth: ${fmtMoneyShort(Math.abs(smartATW - propATW))}. A tax professional can model your specific situation.</div>`;
}

        <p>This matters because of sequence of returns risk. A market crash in year two of retirement is far more damaging than the same crash in year twenty, even if the long-run average return is identical. In year two you sell at the bottom to cover expenses, and the shares you sold are not there for the recovery. Historical mode shows how many real sequences your plan survives, including the ones that started right before 1929, 1966, 2000, and 2008.</p>

        <ul>

      <summary>Why do small changes make such a big difference?</summary>
      <div class="faq-body">
        <p>Retirement portfolios are sensitive to small changes because the effects compound over decades and the math is nonlinear. A few forces drive this:</p>
        <ul>
          <li><strong>Compounding cuts both ways.</strong> An extra $5,000 a year in spending costs $5,000 plus the growth that money would have earned over the next 20 or 30 years. At 5% real returns, $5,000 today becomes roughly $13,000 in 20 years.</li>
          <li><strong>Withdrawal rate.</strong> ${(() => { const c = (w) => runForState({ ...DEFAULT_STATE, age: 65, targetAge: 94, hasPartner: false, partnerAge: 0, portfolio: 1000000, spending: w, lateSpending: w, slowDownAge: 200, yourIncome: 0, yourStopWorkAge: 65, yourSSAmount: 0, housing: 0, taxRate: 0, capGainsTax: 0, feeRate: 0, guardrailsEnabled: false, simMode: 'historical', stockPct: state.stockPct }); const a = c(35000), b = c(40000), d = c(45000), e = c(50000); return 'On $1 million over 30 years with your ' + mixLabel() + ' mix and no taxes or fees, spending $35,000 a year lasted in ' + a.successCount + ' of ' + a.totalPeriods + ' periods, $40,000 in ' + b.successCount + ', $45,000 in ' + d.successCount + ', and $50,000 in ' + e.successCount + '. Each extra $5,000 costs more periods than the last, because each step runs into more of the bad sequences.'; })()}</li>
          <li><strong>Early retirement is especially sensitive.</strong> Retiring 10 years earlier adds 10 years of withdrawals and removes 10 years of contributions and growth. The two effects stack.</li>

        </ul>
        <p>This is why the tool uses historical sequences rather than averages.</p>
      </div>
    </details>

    <details class="faq-item">
      <summary>What is sequence of returns risk?</summary>
      <div class="faq-body">
        <p>Two retirees can experience the exact same average market return over 30 years and end up in completely different places, depending on whether the good years came first or the bad years did.</p>
        <p>If your portfolio drops 40% in year two of retirement, you sell investments at the bottom to cover expenses, and the shares you sold are not there for the recovery. A crash in year twenty, with fewer years of withdrawals left, does far less damage.</p>

        <p>Historical mode runs your plan through every real sequence since 1926 rather than a smoothed average of them.</p>
      </div>
    </details>

      <summary>What is the 4% rule, and does this tool use it?</summary>
      <div class="faq-body">
        <p>The 4% rule comes from William Bengen's 1994 research, later expanded by the Trinity Study. The finding: a retiree withdrawing 4% of a portfolio that was 50 to 75% stocks and the rest intermediate-term government bonds in year one, then adjusting for inflation each year, had not run out of money over any 30-year period in the data those studies used. ${(() => { const t = runForState({ ...DEFAULT_STATE, age: 65, targetAge: 94, hasPartner: false, partnerAge: 0, portfolio: 1000000, spending: 40000, lateSpending: 40000, slowDownAge: 200, yourIncome: 0, yourStopWorkAge: 65, yourSSAmount: 0, housing: 0, taxRate: 0, capGainsTax: 0, feeRate: 0, guardrailsEnabled: false, simMode: 'historical', stockPct: state.stockPct }); return 'On this tool’s own data, with your current ' + mixLabel() + ' mix, no fees and no taxes, 4% for 30 years lasted in ' + t.successCount + ' of ' + t.totalPeriods + ' periods.'; })()}</p>
        <p>It became the dominant rule of thumb in financial planning, and it works for what it was designed to do. It has limits:</p>
        <ul>
          <li>It assumes a fixed withdrawal regardless of what the market does, with no adjustments in bad years.</li>
          <li>It was calibrated for a 30-year horizon. Retire at 55 planning to 95 and you need something more conservative.</li>
          <li>It ignores income. A household spending $80,000 with $30,000 of Social Security only needs the portfolio to cover $50,000.</li>
          <li>It does not account for spending that changes in late life. Healthcare costs may rise even as travel and discretionary spending fall.</li>
        </ul>
        <p>This tool does not apply the 4% rule. It runs your own numbers through historical and simulated market sequences, with your income, Social Security, housing costs, and the spending changes you set.</p>
      </div>
    </details>

    <details class="faq-item">
      <summary>How does the flexible spending (guardrails) system work?</summary>
      <div class="faq-body">
        <p>The idea comes from financial planner Jonathan Guyton: rather than withdrawing a fixed amount every year, you set a target and let it flex based on how hard the portfolio is being drawn.</p>
        <p>In the first year you draw from the portfolio with no wages coming in, the tool records your withdrawal rate as the baseline. Each year after that:</p>
        <ul>
          <li>If your withdrawal rate climbs more than ${pct(state.guardrailBandPct, 0)} above that baseline, your portfolio is under stress and that year's spending is cut by ${pct(state.guardrailCutPct, 0)}.</li>
          <li>If it falls more than ${pct(state.guardrailBandPct, 0)} below, your portfolio is running ahead and that year's spending is boosted by ${pct(state.guardrailBoostPct, 0)}.</li>
        </ul>
        <p>Cuts apply to one year at a time and do not compound. A plan with guardrails on will tighten in bad market stretches and loosen in good ones, which raises the survival count versus rigid spending. The verdict tells you how many years the median path cut spending, so you can judge whether you would live that way. There is one known quirk. If Social Security starts years after you retire, the baseline is set in a bridge year with a high withdrawal rate, which makes boosts more likely once benefits begin.</p>
        <p>Toggle guardrails on or off under Assumptions. The cut and boost percentages are in the Spending flexibility section (Pro).</p>
      </div>
    </details>

    <details class="faq-item">
      <summary>What are account types and which withdrawal strategy should I use?</summary>
      <div class="faq-body">
        <p>Most people have savings spread across different kinds of accounts, and they are not all taxed the same way. The account types feature lets you model this.</p>
        <ul>
          <li><strong>Traditional (IRA, 401k).</strong> Contributions went in pre-tax, so withdrawals are taxed as ordinary income. The model gross-ups each withdrawal to cover the tax owed, meaning you need to pull out more than you actually spend.</li>
          <li><strong>Roth (IRA, 401k).</strong> Contributions went in after-tax, so qualified withdrawals are tax-free. This makes Roth dollars worth more than traditional dollars of the same nominal amount.</li>
          <li><strong>Taxable brokerage.</strong> No special tax treatment going in or out, but gains are taxed at the lower capital gains rate rather than ordinary income rates. The model approximates this by assuming about half of each withdrawal is gain.</li>
        </ul>
        <p>The withdrawal strategy controls the order you draw from these accounts:</p>
        <ul>
          <li><strong>Proportional</strong> draws from all three in proportion to their current balances. Simple and predictable.</li>
          <li><strong>Tax-aware</strong> draws from taxable first, then traditional, then Roth last. Because Roth grows tax-free, leaving it untouched longer lets it compound tax-free longer. This usually leaves more usable after-tax wealth at the end, though it may show higher taxes in the early years. The withdrawal strategy comparison table (visible in Historical and Simulated modes) shows the estimated difference for your specific numbers.</li>
        </ul>
        <p>The right answer depends on your tax bracket now versus in retirement, and on whether RMDs will force traditional withdrawals anyway after age 73. A tax professional can model your specific situation.</p>
      </div>
    </details>

    <details class="faq-item">
      <summary>What are the model's limitations?</summary>
      <div class="faq-body">
        <p>A few things the model does not capture or simplifies:</p>
        <ul>
          <li><strong>Asset classes.</strong> The portfolio is U.S. large-cap stocks and 10-year Treasuries only. No international stocks, cash, TIPS, or real estate, and the bond series is a constant-maturity approximation rather than a fund's actual record.</li>
          <li><strong>History is one sample.</strong> Overlapping U.S. periods since 1926 share most of their years, and the best-performing major market of the century is not a neutral sample. Simulated mode picks each year from a bell curve, so bad years cluster only by chance and the worst years are milder than the worst real ones. Because it also ignores the way markets tend to recover, over long horizons it usually lands close to the historical count, or a little below it.</li>
          <li><strong>Fees default to 0.10%,</strong> a typical index fund. Set your own under Assumptions. On a $1M portfolio spending $40,000 a year at 60/40, a 0.5% fee turns 66 of 71 surviving periods into 63.</li>
          <li><strong>Healthcare costs</strong> are not broken out separately. Include them in your annual spending, or add pre-Medicare premiums as a life event if they will differ significantly from your regular retirement spending.</li>
          <li><strong>Required Minimum Distributions</strong> (RMDs) starting at age 73 are not modeled. For most people the impact is limited, but a large traditional IRA can push forced withdrawals into a higher tax bracket.</li>
          <li><strong>Medicare premium surcharges</strong> (IRMAA) for higher-income retirees are not included.</li>
          <li><strong>Roth conversions and tax-loss harvesting</strong> are not modeled. An accountant may find savings here that no simple model will.</li>
          <li><strong>Spousal and survivor Social Security benefits</strong> are entered manually but not calculated automatically from each other's records.</li>
          <li><strong>State income tax</strong> is approximated for most states. Set your state in More options for a closer number, or edit the rates directly under Assumptions.</li>
          <li><strong>A fixed mortgage payment</strong> is treated as if it rose with inflation. In reality it shrinks in today's dollars each year, so late-year housing cost is slightly overstated.</li>
        </ul>
        <p>Take the numbers to a professional before making a major decision.</p>
      </div>
    </details>

    <details class="faq-item">
      <summary>Should I talk to a financial advisor?</summary>
      <div class="faq-body">
        <p>This tool is a starting point. A good advisor can account for your full picture: estate planning, insurance, tax optimization, account structure, and the things a model cannot capture about your situation.</p>
        <p>Find one: <a href="https://www.napfa.org/find-an-advisor" target="_blank">fee-only advisors (NAPFA)</a> &middot; <a href="https://www.letsmakeaplan.org/" target="_blank">certified planners (CFP Board)</a> &middot; <a href="https://www.aicpa.org" target="_blank">tax professionals (AICPA)</a></p>
      </div>
    </details>

  </div></div>` : ''}
  `;

function drawMainChart(result, compare) {
  const ctx = document.getElementById('mainChart'); if (!ctx) return;
  if (chart) chart.destroy();
  const p = result.percentiles;
  const labels = p.map(x => x.age);
  const fill = (data, color, alpha) => ({ data, borderColor: color, backgroundColor: alpha, borderWidth: 1.5, pointRadius: 0, fill: false, tension: 0.1 });
  const datasets = [];
  if (result.mode !== 'fixed') {
    datasets.push({ label: 'p90', data: p.map(x => x.p90), borderColor: 'transparent', backgroundColor: 'rgba(91,110,58,0.10)', pointRadius: 0, fill: '+1', tension: 0.1 });
    datasets.push({ label: 'p10', data: p.map(x => x.p10), borderColor: 'transparent', backgroundColor: 'transparent', pointRadius: 0, fill: false, tension: 0.1 });
    datasets.push({ label: 'p75', data: p.map(x => x.p75), borderColor: 'transparent', backgroundColor: 'rgba(91,110,58,0.16)', pointRadius: 0, fill: '+1', tension: 0.1 });
    datasets.push({ label: 'p25', data: p.map(x => x.p25), borderColor: 'transparent', backgroundColor: 'transparent', pointRadius: 0, fill: false, tension: 0.1 });
  }
  datasets.push(Object.assign(fill(p.map(x => x.p50), '#a04a28', 'transparent'), { label: 'Median', borderWidth: 2 }));
  // Side-by-side: the baseline's range as a faint rust band and its median as a dashed line.
  if (compare && compare.percentiles && compare.percentiles.length === p.length) {
    const cp = compare.percentiles;
    if (compare.mode !== 'fixed') {
      datasets.push({ label: 'Baseline p90', data: cp.map(x => x.p90), borderColor: 'transparent', backgroundColor: 'rgba(160,74,40,0.09)', pointRadius: 0, fill: '+1', tension: 0.1 });
      datasets.push({ label: 'Baseline p10', data: cp.map(x => x.p10), borderColor: 'transparent', backgroundColor: 'transparent', pointRadius: 0, fill: false, tension: 0.1 });
    }
    datasets.push({ label: 'Baseline median', data: cp.map(x => x.p50), borderColor: '#6b6356', borderDash: [5, 4], borderWidth: 1.5, pointRadius: 0, fill: false, tension: 0.1 });
  }

  // Key event ages for annotations
  const events = [];
  if (state.yourPartTimeAmount > 0) { const glide = state.yourPartTimeEnd >= state.yourStopWorkAge; events.push({ age: state.yourPartTimeStart, label: 'Part-time' }); events.push({ age: state.yourPartTimeEnd, label: glide ? 'Stop working' : 'Full time' }); if (!glide && state.yourStopWorkAge < state.targetAge) events.push({ age: state.yourStopWorkAge, label: 'Retire' }); }
  else if (state.yourStopWorkAge > state.age && state.yourStopWorkAge < state.targetAge) events.push({ age: state.yourStopWorkAge, label: 'Retire' });
  if (state.ssStartAge > state.age) events.push({ age: state.ssStartAge, label: 'SS starts' });
  if (state.mortgagePayoffAge > state.age && state.housing > 0 && (!has(state.homeSaleAge) || state.mortgagePayoffAge < state.homeSaleAge)) events.push({ age: state.mortgagePayoffAge, label: 'Mortgage done' });
  if (has(state.homeSaleAge)) events.push({ age: state.homeSaleAge, label: 'House sold' });
  if (has(state.yourBreakStart) && state.yourBreakStart >= state.age) { events.push({ age: state.yourBreakStart, label: 'Break' }); events.push({ age: state.yourBreakEnd, label: 'Back to work' }); }
  if (state.extraSpend > 0 && has(state.extraSpendStart)) events.push({ age: state.extraSpendStart, label: 'Extra spending' });
  if (state.shockEra && has(state.shockAge)) events.push({ age: state.shockAge, label: 'Bad decade' });
  if (state.slowDownAge > state.age && state.lateSpending !== state.spending) events.push({ age: state.slowDownAge, label: state.lateSpending < state.spending ? 'Spending drops' : 'Spending rises' });

  // Chart.js plugin for vertical annotation lines
  const annotationPlugin = {
    id: 'eventAnnotations',
    afterDraw(chart) {
      const xScale = chart.scales.x;
      const yScale = chart.scales.y;
      const ctx2 = chart.ctx;
      // Sort events and calculate pixel positions to detect collisions
      const positioned = events.map(ev => {
        const idx = labels.indexOf(ev.age);
        if (idx < 0) return null;
        return { ...ev, idx, x: xScale.getPixelForValue(idx) };
      }).filter(Boolean);
      // Assign each label to the lowest stagger row with no nearby label, so labels that
      // share an age (or sit close together) stack vertically instead of overlapping.
      positioned.sort((a, b) => a.x - b.x);
      const rowLastX = [];
      positioned.forEach(ev => {
        let row = 0;
        while (rowLastX[row] !== undefined && Math.abs(rowLastX[row] - ev.x) < 64) row++;
        ev.row = row;
        rowLastX[row] = ev.x;
      });
      positioned.forEach(ev => {
        ctx2.save();
        ctx2.strokeStyle = '#d4cab8';
        ctx2.lineWidth = 1;
        ctx2.setLineDash([4, 3]);
        ctx2.beginPath();
        ctx2.moveTo(ev.x, yScale.top);
        ctx2.lineTo(ev.x, yScale.bottom);
        ctx2.stroke();
        ctx2.setLineDash([]);
        ctx2.fillStyle = '#75695a';
        ctx2.font = '10px Inter Tight, sans-serif';
        ctx2.textAlign = 'center';
        ctx2.fillText(ev.label, ev.x, yScale.top - 4 - ev.row * 12);
        ctx2.restore();
      });
    }
  };

  // Crosshair plugin: draws a vertical line at hover position
  const crosshairPlugin = {
    id: 'crosshair',
    afterDraw(chart) {
      if (chart.tooltip && chart.tooltip._active && chart.tooltip._active.length) {
        const x = chart.tooltip._active[0].element.x;
        const yScale = chart.scales.y;
        const ctx2 = chart.ctx;
        ctx2.save();
        ctx2.strokeStyle = 'rgba(26,24,20,0.15)';
        ctx2.lineWidth = 1;
        ctx2.beginPath();
        ctx2.moveTo(x, yScale.top);
        ctx2.lineTo(x, yScale.bottom);
        ctx2.stroke();
        ctx2.restore();
      }
    }
  };

  // Enhanced tooltip showing breakdown
  const medianRun = result.medianRun;
  chart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    plugins: [annotationPlugin, crosshairPlugin],
    options: {
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { top: 34 } },
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: {
        mode: 'index', intersect: false,
        callbacks: {
          title: (t) => 'Age ' + t[0].label,
          label: (c) => {
            if (!['Median','p10','p90','Baseline median'].includes(c.dataset.label)) return null;
            const nice = { Median: 'Median', p10: 'Worst 10% edge', p90: 'Best 10% edge', 'Baseline median': baselineName + ' median' };
            const lines = [nice[c.dataset.label] + ': ' + fmtMoneyShort(c.parsed.y)];
            if (c.dataset.label === 'Median' && medianRun && medianRun[c.dataIndex]) {
              const yr = medianRun[c.dataIndex];
              if (yr.yourIncome > 0) lines.push('Income: ' + fmtMoneyShort(yr.yourIncome + yr.partnerIncome));
              if (yr.ssIncome > 0) lines.push('Social Security: ' + fmtMoneyShort(yr.ssIncome));
              lines.push('Spending: ' + fmtMoneyShort(yr.spending));
              if (yr.withdrawal > 0) lines.push('Withdrawal: ' + fmtMoneyShort(yr.withdrawal));
            }
            return lines;
          },
          afterBody: (t) => {
            const idx = t[0].dataIndex;

          }
        },
        filter: (t) => ['Median','p10','p90','Baseline median'].includes(t.dataset.label)
      } },
      scales: {
        x: { title: { display: true, text: 'Age', color: '#6b6356', font: { size: 11 } }, ticks: { color: '#75695a', maxTicksLimit: 10 }, grid: { color: 'rgba(212,202,184,0.4)' } },
        y: { ticks: { color: '#75695a', callback: (v) => fmtMoneyShort(v) }, grid: { color: 'rgba(212,202,184,0.4)' } }

}
let cashflowRows = null;

function computeCashflowData(rows, mode) {
  if (mode === 'breakdown') {
    return {
      d0: { data: rows.map(y => y.yourIncome + y.partnerIncome), bg: 'rgba(91,110,58,0.6)', label: 'Work income' },
      d1: { data: rows.map(y => y.ssIncome), bg: 'rgba(201,164,73,0.7)', label: 'Social Security' },
      d2: { data: rows.map(y => -(y.spending)), bg: 'rgba(184,92,56,0.5)', label: 'Spending' },
    };
  }
  const netData = rows.map(y => {
    const gross = y.yourIncome + y.partnerIncome + y.ssIncome;
    const tax = y.tax || ((y.yourIncome + y.partnerIncome) * state.taxRate + y.ssIncome * state.taxRate * 0.5);
    return Math.round(gross - tax - y.spending);
  });
  return {
    d0: { data: netData.map(v => Math.max(0, v)), bg: 'rgba(91,110,58,0.7)', label: 'Surplus' },
    d1: { data: netData.map(() => 0), bg: 'transparent', label: '' },
    d2: { data: netData.map(v => Math.min(0, v)), bg: 'rgba(184,92,56,0.6)', label: 'Deficit' },
  };
}

function drawCashflowChart(result) {
  const ctx = document.getElementById('cashflowChart'); if (!ctx) return;
  const rows = result.medianRun || [];
  if (!rows.length) return;
  cashflowRows = rows;
  const labels = rows.map(y => y.age);
  const d = computeCashflowData(rows, cashflowMode);

  // If chart exists but canvas was replaced by re-render, destroy stale chart
  if (cashflowChart && cashflowChart.canvas !== ctx) {
    cashflowChart.destroy();
    cashflowChart = null;
  }

  if (cashflowChart) {
    // Update existing chart for animation
    cashflowChart.data.labels = labels;
    cashflowChart.data.datasets[0].data = d.d0.data;
    cashflowChart.data.datasets[0].backgroundColor = d.d0.bg;
    cashflowChart.data.datasets[0].label = d.d0.label;
    cashflowChart.data.datasets[1].data = d.d1.data;
    cashflowChart.data.datasets[1].backgroundColor = d.d1.bg;
    cashflowChart.data.datasets[1].label = d.d1.label;
    cashflowChart.data.datasets[2].data = d.d2.data;
    cashflowChart.data.datasets[2].backgroundColor = d.d2.bg;
    cashflowChart.data.datasets[2].label = d.d2.label;
    cashflowChart.options.plugins.legend.display = (cashflowMode === 'breakdown');
    cashflowChart.update();
    return;
  }

  cashflowChart = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [
      { label: d.d0.label, data: d.d0.data, backgroundColor: d.d0.bg, stack: 'in', borderRadius: 1 },
      { label: d.d1.label, data: d.d1.data, backgroundColor: d.d1.bg, stack: 'in', borderRadius: 1 },
      { label: d.d2.label, data: d.d2.data, backgroundColor: d.d2.bg, stack: 'out', borderRadius: 1 },
    ] },
    options: { responsive: true, maintainAspectRatio: false,
      animation: { duration: 700, easing: 'easeInOutQuart' },
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: cashflowMode === 'breakdown', labels: { color: '#6b6356', font: { size: 11 }, boxWidth: 10, padding: 12, filter: (item) => item.text !== '' } },
        tooltip: { mode: 'index', intersect: false, callbacks: {
          title: (t) => 'Age ' + t[0].label,
          label: (c) => {
            if (c.dataset.label === '') return null;
            const yr = cashflowRows && cashflowRows[c.dataIndex];
            if (cashflowMode === 'breakdown') {
              return c.dataset.label + ': ' + fmtMoneyShort(Math.abs(c.parsed.y));
            }
            const net = yr ? Math.round((yr.yourIncome + yr.partnerIncome + yr.ssIncome) - ((yr.yourIncome + yr.partnerIncome) * state.taxRate + yr.ssIncome * state.taxRate * 0.5) - yr.spending) : c.parsed.y;
            if (c.datasetIndex === 1) return null;
            const lines = [(net >= 0 ? 'Surplus: +' : 'Deficit: ') + fmtMoneyShort(net) + '/yr'];
            if (yr) {
              if (yr.yourIncome + yr.partnerIncome > 0) lines.push('Income: ' + fmtMoneyShort(yr.yourIncome + yr.partnerIncome));
              if (yr.ssIncome > 0) lines.push('SS: ' + fmtMoneyShort(yr.ssIncome));
              lines.push('Spending: ' + fmtMoneyShort(yr.spending));
            }
            return lines;
          }
        },
        filter: (t) => t.dataset.label !== ''
        }
      },
      scales: {
        x: { stacked: true, ticks: { color: '#75695a', maxTicksLimit: 10 }, grid: { display: false } },
        y: { stacked: true, ticks: { color: '#75695a', callback: (v) => { const a = Math.abs(v); return (v < 0 ? '-' : '') + (a >= 1e6 ? '$'+(a/1e6).toFixed(0)+'M' : a >= 1e3 ? '$'+Math.round(a/1e3)+'k' : '$'+a); } }, grid: { color: 'rgba(212,202,184,0.4)' } }
      }
    }
  });
}

// Estimate both tax rates from household wages: the wage rate includes FICA, the

  state.retirementTaxRate = Math.round(r.incomeTaxRate * 100) / 100;

  state[key] = val;
  // Recalculate mortgage payment when payoff age changes
  if (key === 'mortgagePayoffAge' && state.mortgageBalance > 0 && state.mortgageRate > 0) {
    const years = Math.max(1, val - state.age);
    state.housing = Math.round(calcAnnualMortgagePayment(state.mortgageBalance, state.mortgageRate, years) / 100) * 100;
  }
  // Immediate label update
  const row = el.parentElement.querySelector('.control-value');
  if (row) row.textContent = fmtSliderVal(key, key === 'spending' ? val + state.housing : val);
  // Debounced chart redraw (fast, keeps slider alive)
  clearTimeout(liveChartTimer);
  liveChartTimer = setTimeout(() => {
    invalidateCaches();
    const result = runForState(state); lastSimResult = result;
    drawMainChart(result, liveCompare()); if (isPaid()) drawCashflowChart(result);

// Called on onchange (slider release) — full render with all sections
window.sliderCommit = function(key, rawVal) {
  if (key === 'totalSpending') { key = 'spending'; rawVal = Math.max(0, +rawVal - state.housing); }
  state[key] = +rawVal;
  maxSpendView = false;
  // Recalculate mortgage payment when payoff age changes (if balance/rate are known)
  if (key === 'mortgagePayoffAge' && state.mortgageBalance > 0 && state.mortgageRate > 0) {
    const years = Math.max(1, state.mortgagePayoffAge - state.age);
    state.housing = Math.round(calcAnnualMortgagePayment(state.mortgageBalance, state.mortgageRate, years) / 100) * 100;
  }
  // Sync accounts proportionally when portfolio changes
  if (key === 'portfolio' && state.accountsEnabled) {
    const total = state.accounts.traditional + state.accounts.roth + state.accounts.taxable;
    if (total > 0) {
      const ratio = state.portfolio / total;
      state.accounts.traditional = Math.round(state.accounts.traditional * ratio);
      state.accounts.roth = Math.round(state.accounts.roth * ratio);
      state.accounts.taxable = Math.round(state.accounts.taxable * ratio);
    }
  }
  invalidateCaches();
  const scrollY = window.scrollY;
  render();
  window.scrollTo(0, scrollY);
};

window.applySSAge = function(age) {

  // Convert current amounts back to FRA-basis, then apply new factor
  state.yourSSAmount = Math.round((state.yourSSAmount / curFactor) * newFactor);

function dlgNum(id) { const el = document.getElementById(id); const v = el ? parseFloat(el.value) : NaN; return isNaN(v) ? null : Math.round(v); }

window.removeScenario = function(id) {
  if (id === 'careerBreak') state.yourBreakStart = state.yourBreakEnd = null;
  else if (id === 'partnerBreak') state.partnerBreakStart = state.partnerBreakEnd = null;
  else if (id === 'spendMore') { state.extraSpend = 0; state.extraSpendStart = state.extraSpendEnd = null; }
  else if (id === 'sellHouse') { state.homeSaleAge = null; state.homeSaleProceeds = 0; state.postSaleHousing = 0; }
  else if (id === 'shockAtRetirement') { state.shockEra = null; state.shockAge = null; }
  else if (id === 'partTime') { if (state.yourStopWorkAge === state.yourPartTimeStart) state.yourStopWorkAge = state.yourPartTimeEnd; state.yourPartTimeAmount = 0; }
  closeModal(); maxSpendView = false; invalidateCaches(); render();
};
window.applyPreset = function(id) {
  if (SCENARIO_TITLES[id]) { showScenarioModal(id); return; }
  if (id === 'payoffHouse') { showPayoffModal(true); return; }
  startComparison(presetLabel(id));
  switch (id) {
    case 'stopNow': state.yourStopWorkAge = state.age; break;
    case 'retire5early': state.yourStopWorkAge = Math.max(state.age, state.yourStopWorkAge - 5); break;
    case 'work2more': state.yourStopWorkAge = state.yourStopWorkAge + 2; if (state.hasPartner && state.partnerIncome > 0) state.partnerStopWorkAge = state.partnerStopWorkAge + 2; break;
    case 'bothRetire': state.yourStopWorkAge = state.age; state.partnerStopWorkAge = state.partnerAge; break;
    case 'partnerStarts': state.partnerIncome = 50000; state.partnerStopWorkAge = Math.max(state.partnerAge + 5, 62); break;
    case 'partnerRetires': state.partnerStopWorkAge = state.partnerAge; break;
    case 'partnerReturns': state.partnerIncome = state.partnerIncome > 0 ? state.partnerIncome : 60000; state.partnerStopWorkAge = Math.max(state.partnerAge + 5, 60); break;
    case 'maxSpend': {
      // In Fixed mode: the steady-return ceiling. Otherwise: the most that survived >= 85% of history.
      const ratio = state.spending > 0 ? state.lateSpending / state.spending : 0.85;
      const ms = state.simMode === 'fixed' ? findMaxSpend(state) : findMaxSpendAtSuccess({ ...state, spending: 100000, lateSpending: 100000 * ratio });
      state.spending = Math.round(ms.spend / 1000) * 1000; state.lateSpending = Math.round(state.spending * ratio); maxSpendView = true; break;
    }
    case 'delaySS': { const f = 1.24; state.ssStartAge = 70; state.yourSSAmount = Math.round(state.yourSSAmount * f); state.partnerSSAmount = Math.round(state.partnerSSAmount * f); break; }
    case 'earlySS': { const ssFactors = { 62: 0.70, 67: 1.00, 70: 1.24 }; const base = ssFactors[state.ssStartAge] || 1; state.ssStartAge = 62; state.yourSSAmount = Math.round(state.yourSSAmount / base * 0.70); state.partnerSSAmount = Math.round(state.partnerSSAmount / base * 0.70); break; }
    case 'sellHome': if (!state.oneTimeEvents) state.oneTimeEvents = []; state.oneTimeEvents.push({ label: 'Home sale', age: 70, amount: 400000 }); break;
    case 'ltc': if (!state.oneTimeEvents) state.oneTimeEvents = []; for (let a = 85; a < 90; a++) state.oneTimeEvents.push({ label: 'Long-term care', age: a, amount: -90000 }); break;
  }
  invalidateCaches(); render();
};

// ===== SAVE / LOAD SCENARIOS =====
window.saveScenario = function() {
  const el = document.getElementById('scenarioName'); const name = (el.value || '').trim();
  if (!name) { el.focus(); return; }
  if (savedScenarios.length >= 8) { alert('Max 8 saved scenarios. Delete one first.'); return; }
  const noteEl = document.getElementById('scenarioNote'); const note = noteEl ? (noteEl.value || '').trim().slice(0, 200) : '';
  savedScenarios.push({ name, note, state: JSON.parse(JSON.stringify(state)) });
  localStorage.setItem('zeroline_scenarios', JSON.stringify(savedScenarios));
  render();
};
window.loadScenario = function(i) { state = withDefaults(savedScenarios[i].state); invalidateCaches(); render(); };
window.deleteScenario = function(i) { savedScenarios.splice(i, 1); localStorage.setItem('zeroline_scenarios', JSON.stringify(savedScenarios)); render(); };

window.showScenarioDetail = function(id) {
  const s = HISTORICAL_SCENARIOS.find(x => x.id === id); if (!s) return;
  const run = runNamedScenario(state, s);
  const years = run.years;
  const survived = !years.some(y => y.ranOut);
  const final = years[years.length - 1];
  // worst drawdown
  let peak = years[0].portfolio, maxDD = 0, ddAge = years[0].age;
  years.forEach(y => { if (y.portfolio > peak) peak = y.portfolio; const dd = peak > 0 ? (peak - y.portfolio) / peak : 0; if (dd > maxDD) { maxDD = dd; ddAge = y.age; } });
  const crashYears = years.filter(y => y.marketReturn <= -0.15).length;
  let narrative = 'Starting in ' + s.startYear + ', ';
  if (maxDD > 0.25) narrative += 'the portfolio saw a drawdown of about ' + Math.round(maxDD * 100) + '% (around age ' + ddAge + '). ';
  if (crashYears > 0) narrative += 'There were ' + crashYears + ' year' + (crashYears > 1 ? 's' : '') + ' with a real market drop over 15%. ';
  narrative += survived ? 'The portfolio still lasted to age ' + state.targetAge + ', ending near ' + fmtMoneyShort(final.portfolio) + '.' : 'The portfolio was depleted around age ' + years.find(y => y.ranOut).age + '.';

  const sampleRows = years.filter((y, i) => i % 5 === 0 || y.ranOut).slice(0, 16);
  const table = `<table class="data-table"><thead><tr><th>Age</th><th>Market</th><th>Portfolio</th><th>Spending</th></tr></thead><tbody>${sampleRows.map(y => `<tr><td>${y.age}</td><td style="color:${y.marketReturn<0?'var(--danger)':'var(--moss)'}">${(y.marketReturn*100).toFixed(0)}%</td><td>${fmtMoneyShort(y.portfolio)}</td><td>${fmtMoneyShort(y.spending)}</td></tr>`).join('')}</tbody></table>`;
  openModal(`<h2>${s.name} \u00b7 ${s.startYear}\u2013${s.startYear + (state.targetAge - state.age)}${run.padded?'*':''}</h2>
    <div class="detail-narrative">${narrative}</div>
    ${table}
    ${run.padded ? '<p style="font-size:14px;color:var(--ink-faint)">*This horizon extends beyond available history; the last ' + run.paddedYears + ' year' + (run.paddedYears === 1 ? '' : 's') + ' use the mix’s long-run compound return (' + pct(historicalStats(state.stockPct).geo) + ').</p>' : ''}
    <p style="font-size:14px;color:var(--ink-faint)">Past performance does not predict future results.</p>`);
};

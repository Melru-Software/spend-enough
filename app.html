// Reads a field whether it holds a plain number or formatted money.
function num(id) { const el = document.getElementById(id); if (!el) return 0; const v = moneyParse(el.value); return isNaN(v) ? 0 : v; }

// A step counts as done when the fields that matter to it are filled. Partner and
// optional fields never block it, so the ticks track real progress, not every box.
const STEP_FIELDS = [['ob_age'], ['ob_portfolio'], ['ob_yourIncome', 'ob_housing'], ['ob_yourSS']];
// "Just me" or "Me and a partner". The answer lives in a hidden ob_ input so the draft
// remembers it like any other box; every partner field follows it.
function planHasPartner() { const el = document.getElementById('ob_hasPartner'); return !!el && el.value === '1'; }
function syncPartnerFields() {
  const on = planHasPartner();
  document.querySelectorAll('.onboarding .partner-field').forEach(el => { el.hidden = !on; });
  document.querySelectorAll('.onboarding .plan-for .toggle-btn').forEach((b, i) => { const active = (i === 1) === on; b.classList.toggle('active', active); b.setAttribute('aria-pressed', String(active)); });
  const hint = document.getElementById('ob_hint3');
  if (hint) hint.textContent = on ? 'Work income, partner income, and what you pay for housing.' : 'Work income and what you pay for housing.';
}
// Mortgage, rent, or owned outright. Like the partner answer, it lives in a hidden ob_ input
// so the draft remembers it; blank (a new plan) means mortgage.
const OB_HOUSING_COPY = {
  mortgage: { label: 'Of that, your mortgage payment', hint: 'Principal and interest per year, the part that ends when it is paid off. Taxes and insurance stay in spending.' },
  rent: { label: 'Of that, your rent', hint: 'Per year. Rent continues for the whole plan. You can try buying a home later under Try a scenario.' }
};
function obHousingType() { const el = document.getElementById('ob_housingType'); const v = el ? el.value : ''; return v === 'rent' || v === 'none' ? v : 'mortgage'; }
function syncHousingFields() {
  const t = obHousingType();
  document.querySelectorAll('.onboarding .home-type .toggle-btn').forEach(b => { const on = b.dataset.ht === t; b.classList.toggle('active', on); b.setAttribute('aria-pressed', String(on)); });
  document.querySelectorAll('.onboarding .housing-field').forEach(el => { el.hidden = t === 'none'; });
  document.querySelectorAll('.onboarding .mortgage-field').forEach(el => { el.hidden = t !== 'mortgage'; });
  const c = OB_HOUSING_COPY[t];
  const l = document.getElementById('ob_housingLabel'), h = document.getElementById('ob_housingHint');
  if (c && l) l.textContent = c.label;
  if (c && h) h.textContent = c.hint;
}
window.setHousingChoice = function(t) {
  const el = document.getElementById('ob_housingType');
  if (el) el.value = t;
  syncHousingFields();
  stepProgress();
};
window.setPlanFor = function(withPartner) {
  const el = document.getElementById('ob_hasPartner');
  if (el) el.value = withPartner ? '1' : '';
  syncPartnerFields();
  stepProgress();
  if (withPartner) { const a = document.getElementById('ob_partnerAge'); if (a && !a.value) a.focus(); }
};

window.stepProgress = function() {
  syncPartnerFields();
  syncHousingFields();
  // Clear the "please enter your age" style message as soon as the field is filled,
  // rather than making people press the button again to find out.
  const msg = document.getElementById('ob_validation');
  if (msg && msg.textContent) {
    const ageOk = num('ob_age') >= 18;
    const portfolioOk = num('ob_portfolio') > 0;
    if (ageOk && portfolioOk) msg.textContent = '';
    else if (msg.dataset.field === 'age' && ageOk) msg.textContent = portfolioOk ? '' : 'Enter your portfolio value to get started.';
    else if (msg.dataset.field === 'portfolio' && portfolioOk) msg.textContent = ageOk ? '' : 'Please enter your age to continue.';
    else if (msg.dataset.field === 'partnerAge' && (!planHasPartner() || num('ob_partnerAge') >= 18)) msg.textContent = '';
  }
  const steps = document.querySelectorAll('.onboard-step');
  STEP_FIELDS.forEach((ids, i) => {
    const step = steps[i];
    if (!step) return;
    const done = ids.some(id => { const el = document.getElementById(id); return el && moneyParse(el.value) > 0; });
    if (done === step.classList.contains('done')) return;
    step.classList.toggle('done', done);
  });
  saveDraft();
};

window.finishOnboarding = function() {
  const age = num('ob_age');
  const portfolio = num('ob_portfolio');
  const housingType = obHousingType();
  const mortgage = housingType === 'none' ? 0 : num('ob_housing');
  const spending = num('ob_spending') > 0 ? Math.max(0, num('ob_spending') - mortgage) : 0; // spending excludes the housing payment internally
  const msgEl = document.getElementById('ob_validation');
  if (age < 18) { msgEl.textContent = 'Please enter your age to continue.'; msgEl.dataset.field = 'age'; markInvalid('ob_age'); return; }
  if (portfolio <= 0) { msgEl.textContent = 'Enter your portfolio value to get started.'; msgEl.dataset.field = 'portfolio'; markInvalid('ob_portfolio'); return; }
  const withPartner = planHasPartner();
  const pAge = withPartner ? num('ob_partnerAge') : 0;
  if (withPartner && pAge < 18) { msgEl.textContent = "Enter your partner's age, or choose Just me."; msgEl.dataset.field = 'partnerAge'; markInvalid('ob_partnerAge'); return; }
  if (age > 100 || pAge > 100) { msgEl.textContent = 'Check the ages. They should be between 18 and 100.'; msgEl.dataset.field = ''; markInvalid(age > 100 ? 'ob_age' : 'ob_partnerAge'); return; }
  if (housingType === 'mortgage' && mortgage > 0 && num('ob_mortgagePayoff') > 0 && num('ob_mortgagePayoff') <= age) { msgEl.textContent = 'The mortgage payoff age should be after your current age. If it is already paid off, choose Own it outright.'; msgEl.dataset.field = ''; markInvalid('ob_mortgagePayoff'); return; }
  msgEl.textContent = ''; msgEl.dataset.field = '';
  document.querySelectorAll('[aria-invalid="true"]').forEach(el => { el.removeAttribute('aria-invalid'); el.removeAttribute('aria-describedby'); });

  state.age = age;
  const hadPartner = !!state.hasPartner, firstPlan = !baselineState;
  state.partnerAge = pAge;
  state.hasPartner = withPartner;
  // Taxes follow the answer: a couple files jointly, one person files single. Someone who
  // changed it under More about you keeps their choice unless the answer itself changes.
  if (firstPlan || hadPartner !== withPartner) state.filingStatus = withPartner ? 'mfj' : 'single';
  state.portfolio = portfolio;
  state.spending = spending;
  state.lateSpending = spending > 0 ? Math.round(spending * 0.85) : 0;
  state.slowDownAge = 75;
  state.yourIncome = num('ob_yourIncome');
  state.partnerIncome = withPartner ? num('ob_partnerIncome') : 0;
  state.housingType = housingType;
  state.housing = mortgage;
  state.mortgagePayoffAge = (housingType === 'mortgage' && num('ob_mortgagePayoff')) || 60;
  clearHomeBuy(state);
  state.otherIncome = num('ob_otherIncome');
  const oiStart = num('ob_otherIncomeStart');
  state.otherIncomeStart = oiStart >= 18 ? oiStart : Math.max(state.age, state.yourIncome > 0 ? state.yourStopWorkAge : state.age);
  // A blank Social Security box would otherwise mean "none", which is both wrong for
  // most workers and the most pessimistic thing the model could assume. Estimate it from
  // income instead, and remember that we did so the Assumptions panel can say so.
  const ssTyped = num('ob_yourSS'), partnerSsTyped = withPartner ? num('ob_partnerSS') : 0;
  const ssBlank = (id) => { const el = document.getElementById(id); return !el || String(el.value).trim() === ''; };
  state.yourSSAmount = ssTyped;
  state.partnerSSAmount = partnerSsTyped;
  state.ssEstimated = false;
  if (ssBlank('ob_yourSS') && state.yourIncome > 0) { state.yourSSAmount = Math.round(estimateSSBenefit(state.yourIncome)); state.ssEstimated = true; }
  if (ssBlank('ob_partnerSS') && state.hasPartner && state.partnerIncome > 0) { state.partnerSSAmount = Math.round(estimateSSBenefit(state.partnerIncome)); state.ssEstimated = true; }
  state.yourBreakStart = state.yourBreakEnd = state.partnerBreakStart = state.partnerBreakEnd = null;
  state.contribPauseStart = state.contribPauseEnd = null;
  state.extraSpend = 0; state.extraSpendStart = state.extraSpendEnd = null;
  state.shockEra = null; state.shockAge = null;
  state.yourPartTimeAmount = 0; state.partnerPartTimeAmount = 0;
  // Reset any preset-derived state (home sale, life events) so nothing carries over
  state.homeSaleAge = null;
  state.homeSaleProceeds = 0; state.postSaleHousing = 0; state.postPayoffSpend = 0;
  state.oneTimeEvents = [];
  normalizeHousing(state);
  // Auto-estimate tax rates from income: the wage rate includes payroll tax, the
  // retirement rate (traditional withdrawals, half of SS) is federal + state only.
  applyEstimatedTaxRates();
  if (state.yourStopWorkAge < state.age) state.yourStopWorkAge = Math.max(state.age + 1, 65);
  if (state.partnerStopWorkAge < state.partnerAge) state.partnerStopWorkAge = Math.max(state.partnerAge + 1, 65);

  // The first thing a stranger sees is the range, not a single line.
  state.simMode = 'historical';

  // If spending was left blank, find the most they could spend and still make it through
  // at least 85% of history (steady spending, guardrails off), with the 85% late-life ratio.
  if (spending <= 0) {
    const ms = findMaxSpendAtSuccess({ ...state, spending: 100000, lateSpending: 85000 });
    state.spending = Math.round(ms.spend / 1000) * 1000;
    state.lateSpending = Math.round(state.spending * 0.85);
    maxSpendView = true;
  }

  activeView = 'dashboard';
  maxSpendStale = true; spendingLevelsStale = true;
  baselineState = JSON.parse(JSON.stringify(state));
  baselineResult = null; baselineName = 'Starting point'; currentName = 'Current'; compareOn = false;
  clearDraft();
  track('ran_model');
  render();
  runPendingScenario();
};

window.loadSample = function() {
  state = JSON.parse(JSON.stringify(SAMPLE_STATE));
  activeView = 'dashboard';
  maxSpendStale = true; spendingLevelsStale = true;
  baselineState = JSON.parse(JSON.stringify(state));
  baselineResult = null; baselineName = 'Starting point'; currentName = 'Current'; compareOn = false;
  render();
  runPendingScenario();
};
function runPendingScenario() {
  if (!pendingScenario) return;
  const id = pendingScenario; pendingScenario = null;
  if (generatePresets(state, true).some(p => p.id === id)) applyPreset(id);
}

window.goToOnboarding = function() { activeView = 'onboarding'; render(); };
window.resetToDefaults = function() {
  if (confirm('Reset to your starting values?')) { state = withDefaults(baselineState); maxSpendStale = true; spendingLevelsStale = true; render(); }
};
window.startOver = function() {
  if (!confirm('Clear your numbers and start from a blank plan? Saved scenarios are kept.')) return;

  baselineState = null; baselineResult = null; baselineName = 'Starting point'; currentName = 'Current'; compareOn = false;
  maxSpendView = false; invalidateCaches();
  activeView = 'onboarding';
  render();
};

// The compact bar that rides along on a phone: the count and what is left, so a change
// made anywhere on the page shows its effect without scrolling back to the verdict.
let miniObserver = null;
function updateMiniVerdict(result) {
  const el = document.getElementById('miniVerdict');
  if (!el) return;
  const last = result.percentiles[result.percentiles.length - 1];
  const count = result.mode === 'historical'
    ? result.successCount + ' of ' + result.totalPeriods
    : Math.round(result.successRate * 100) + '%';
  const left = last.p50 > 0 ? fmtMoneyShort(last.p50) + ' left' : 'ran out';
  el.innerHTML = `<span class="mini-count">${count}</span><span class="mini-left">${left} at ${state.targetAge}</span>`;
  const verdict = document.querySelector('.verdict');
  if (miniObserver) miniObserver.disconnect();
  if (!verdict || !('IntersectionObserver' in window)) return;
  miniObserver = new IntersectionObserver(([entry]) => { el.hidden = entry.isIntersecting; }, { threshold: 0 });
  miniObserver.observe(verdict);
}

// ===== VERDICT =====
function getVerdict(result) {
  // headline + lead show in the verdict card; detail, caveat and wedge show under the chart.
  const v = { headline: '', lead: '', detail: '', caveat: '' };
  const yc = state.targetAge - state.age + 1;
  const cuts = result.medianRunFlexCuts || 0;
  const flexNote = state.guardrailsEnabled && cuts > 0 ? ' The median path includes spending cuts in ' + cuts + ' year' + (cuts > 1 ? 's' : '') + ' (guardrails are on; see Assumptions).' : '';
  const threshold = Math.round((state.successThreshold || 0.85) * 100);
  if (result.mode === 'historical') {
    const { successCount, totalPeriods, failures, windows } = result;
    const rate = successCount / totalPeriods;
    // The method sentence now lives under "How to read the results", so the line under the
    // chart stays short; only the interpretation remains there.
    v.method = 'We ran your plan through every rolling ' + yc + '-year stretch of real U.S. market returns since 1926 for a ' + mixLabel() + ' stock/bond mix: ' + totalPeriods + ' stretches, starting ' + windows.firstStart + ' through ' + windows.lastStart + '.' + shockSentence('stretch');
    const tested = '';
    if (maxSpendView) {
      // The level is chosen with steady spending and no cuts, so the headline count is that
      // run's count. The chart may have guardrails on, which usually lasts in more stretches.
      const nc = state.guardrailsEnabled ? runForState({ ...state, guardrailsEnabled: false }) : result;
      v.headline = 'You could spend about ' + fmtMoney(state.spending + state.housing) + ' a year and still make it through ' + nc.successCount + ' of ' + nc.totalPeriods + ' stretches';
      v.lead = 'This is the highest spending level that lasted to age ' + state.targetAge + ' in at least ' + threshold + '% of history, with steady spending and no cuts' + (housingPhrase(state) ? ', including ' + housingPhrase(state) : '') + '.' + (state.guardrailsEnabled && nc.successCount !== successCount ? ' With guardrails on, as in the chart, it lasted in ' + successCount + ' of ' + totalPeriods + '.' : '');
      v.detail = tested + ' The spending explorer below shows how the count moves if you spend a little more or less.';
    } else if (successCount === totalPeriods) {
      v.headline = 'This plan lasted through every stretch of the market since 1926';
      v.lead = 'That includes the stretches that began in the Great Depression, the 1970s, and 2000.';
      v.detail = tested + flexNote + ' Surviving every stretch, including the one that starts in 1929, usually means there is room to spend more.';
    } else {
      v.headline = 'This plan lasted in ' + successCount + ' of ' + totalPeriods + ' stretches';
      const failCount = totalPeriods - successCount;
      const worst = failures[0];
      v.lead = 'In ' + failCount + ' stretch' + (failCount > 1 ? 'es' : '') + ' the portfolio ran out before age ' + state.targetAge + (worst ? '. The hardest started in ' + worst.label.split('–')[0] + ' and ran out around age ' + worst.ranOutAge + '.' : '.');
      v.detail = tested + (failCount > 1 ? ' Among the stretches that failed, half had run out by age ' + result.medianRunOutAge + '.' : '') + flexNote;
      if (rate >= 0.85) v.detail += ' Failures cluster around retiring into a long downturn.';
      else if (rate >= 0.6) v.detail += ' At this spending level the outcome depends heavily on which market you retire into.';
      else v.detail += ' This spending level is risky by historical standards. Try a lower level in the spending explorer.';
    }
    v.caveat = 'Past performance does not predict future results. These ' + totalPeriods + ' stretches overlap heavily, and all of them come from one country’s history.';
  } else if (result.mode === 'montecarlo') {
    const rate = result.successRate;
    const src = mcParams(state).fromHistory ? 'the historical figures for your ' + mixLabel() + ' mix' : 'figures you set';
    v.headline = 'The portfolio lasted to age ' + state.targetAge + ' in ' + Math.round(rate * 100) + '% of ' + result.mcSims + ' simulated futures';
    v.lead = 'The median ending balance was ' + fmtMoneyShort(result.medianFinal) + '.';
    v.detail = (maxSpendView ? fmtMoney(state.spending + state.housing) + ' a year is the most that made it through ' + threshold + '% of history. ' : '') + 'Each of the ' + result.mcSims + ' futures draws every year’s return from a bell curve with ' + pct(result.mcSd, 1) + ' volatility around a ' + pct(result.mcMean, 1) + ' average real return (' + src + ').' + flexNote;
    v.caveat = 'Each year’s return is picked at random from a bell curve around the average. Bad years come in runs only as often as chance would put them there, and the worst years are milder than the worst real ones. The two counts usually land close together. When they are far apart, the plan is close enough to the edge that a small change in how the market behaves changes the answer.';
  } else {
    const lasts = result.successRate >= 1;
    const r = pct(state.returnRate, 1);
    if (maxSpendView) {
      v.headline = 'At a steady ' + r + ' return, the most you could spend is about ' + fmtMoney(state.spending + state.housing) + ' a year';
      v.lead = lasts ? 'This is the highest annual spending that keeps the portfolio going to age ' + state.targetAge + ' if returns were the same every year.' : 'At a steady ' + r + ' return the portfolio would run out around age ' + result.medianRunOutAge + '.';
      v.detail = 'Real markets are not steady, and bad years early on can sink a plan whose average is fine. Switch to Historical mode to see how this level held up in real sequences.';
    } else {
      v.headline = lasts ? 'At a steady ' + r + ' return, the portfolio lasts past age ' + state.targetAge : 'At a steady ' + r + ' return, the portfolio runs out around age ' + result.medianRunOutAge;
      v.lead = lasts ? 'Ending balance at age ' + state.targetAge + ' would be about ' + fmtMoneyShort(result.medianFinal) + '.' : 'The same return every year is assumed.';
      v.detail = 'This assumes the same return every year, so it hides sequence-of-returns risk. Historical mode runs the same plan through every real market stretch since 1926.' + flexNote;
    }
    v.caveat = 'A steady return hides the good and bad years. Historical mode shows them.';
  }
  if (!maxSpendView && result.medianFinal > 10000) {
    v.wedge = fmtMoneyShort(result.medianFinal);
    if (result.mode === 'historical') v.wedgeSub = 'Half of the ' + result.totalPeriods + ' stretches ended with more than this at age ' + state.targetAge + ', half with less. The spending explorer below shows what happens to the count if you spend some of it now.';
    else if (result.mode === 'montecarlo') v.wedgeSub = 'Half of the simulated futures ended with more than this at age ' + state.targetAge + ', half with less.';
    else v.wedgeSub = 'At a steady ' + pct(state.returnRate, 1) + ' return, this is what you would have left at age ' + state.targetAge + '.';
  }
  return v;
}

const IMPACT_FIELDS = () => ({ housingType: 'Housing', spending: 'Spending (besides housing)', lateSpending: 'Late-life spending', yourStopWorkAge: state.yourIncome > 0 ? 'Your retirement age' : null, partnerStopWorkAge: "Partner's retirement age", yourIncome: 'Your income', partnerIncome: "Partner's income", portfolio: 'Portfolio', ssStartAge: 'SS start age', mortgagePayoffAge: 'Mortgage payoff age', housing: housingKind(state) === 'rent' ? 'Rent' : 'Mortgage payment', targetAge: 'Money needs to last to', returnRate: 'Steady return', stockPct: 'Stocks', feeRate: 'Fees', guardrailsEnabled: 'Guardrails', taxRate: 'Wage tax', capGainsTax: 'Withdrawal tax', yourBreakStart: 'Break starts', yourBreakEnd: 'Back to work', partnerBreakStart: 'Partner break starts', partnerBreakEnd: 'Partner back to work', extraSpend: 'Extra spending', extraSpendStart: 'Extra spending from', extraSpendEnd: 'Extra spending until', otherIncome: 'Pension or other income', otherIncomeStart: 'Other income from', otherIncomeEnd: 'Other income until', otherIncomeFixed: 'Other income in fixed dollars', otherIncome2: 'Second income source', otherIncome2Start: 'Second income source from', otherIncome2End: 'Second income source until', otherIncome2Fixed: 'Second income source in fixed dollars', postPayoffSpend: 'Freed payment spent', homeBuyAge: 'Home bought at', homeBuyDownPayment: 'Down payment', homeBuyPayment: 'New mortgage payment', homeBuyPayoffAge: 'New mortgage paid off at', homeBuyUpkeep: 'Cost of owning', homeSaleAge: 'House sold at', homeSaleProceeds: 'Sale proceeds', postSaleHousing: 'Housing after sale', shockEra: 'Bad decade', shockAge: 'Bad decade starts', yourPartTimeAmount: 'Part-time income', yourPartTimeStart: 'Part-time from', yourPartTimeEnd: 'Part-time until' });
function fmtField(k, v) {
  if ((k === 'otherIncomeEnd' || k === 'otherIncome2End') && (v === null || v === undefined)) return 'plan end';
  if (v === null || v === undefined) return 'none';
  if (k === 'shockEra') return shockLabel(v);
  if (k === 'housingType') return { mortgage: 'mortgage', rent: 'renting', none: 'owned outright' }[v] || String(v);
  if (['spending','lateSpending','portfolio','yourIncome','partnerIncome','housing','extraSpend','yourPartTimeAmount','postPayoffSpend','homeSaleProceeds','postSaleHousing','otherIncome','otherIncome2','homeBuyDownPayment','homeBuyPayment','homeBuyUpkeep'].includes(k)) return v > 0 ? fmtMoneyShort(v) : (k === 'postSaleHousing' ? '$0' : 'none');
  if (k === 'otherIncomeFixed' || k === 'otherIncome2Fixed') return v ? 'yes' : 'no';
  if (['returnRate','stockPct'].includes(k)) return pct(v, k === 'stockPct' ? 0 : 1);
  if (k === 'feeRate') return pct(v, 2);
  if (['taxRate','capGainsTax'].includes(k)) return pct(v, 0);
  if (k === 'guardrailsEnabled') return v ? 'on' : 'off';
  return String(v);
}
function computeImpact() {
  if (!baselineState || !baselineResult) return null;
  const fields = IMPACT_FIELDS();
  const changes = [];
  for (const k in fields) {
    if (!fields[k]) continue;
    if (JSON.stringify(baselineState[k]) !== JSON.stringify(state[k])) changes.push({ key: k, label: fields[k], from: fmtField(k, baselineState[k]), to: fmtField(k, state[k]) });
  }
  if (!changes.length) return null;
  return { changes, successDelta: lastSimResult.successRate - baselineResult.successRate, finalDelta: lastSimResult.medianFinal - baselineResult.medianFinal };
}
// The result of the change, in words: how often it lasted before and now, and how the middle
// outcome's ending balance moved.
function impactResultText(a, b, finalDelta) {
  if (!a || !b) return '';
  let lasted;
  if (b.mode === 'historical') lasted = 'Lasted in <strong style="color:var(--ink)">' + b.successCount + ' of ' + b.totalPeriods + '</strong> stretches' + (b.successCount === a.successCount ? ', the same as before' : ', ' + (b.successCount > a.successCount ? 'up' : 'down') + ' from ' + a.successCount);
  else if (b.mode === 'montecarlo') { const pa = Math.round(a.successRate * 100), pb = Math.round(b.successRate * 100); lasted = 'Lasted in <strong style="color:var(--ink)">' + pb + '%</strong> of simulated futures' + (pa === pb ? ', the same as before' : ', ' + (pb > pa ? 'up' : 'down') + ' from ' + pa + '%'); }
  else { const said = (r) => r.successRate >= 1 ? 'lasts to ' + state.targetAge : 'runs out at ' + r.medianRunOutAge; lasted = 'At a steady return it <strong style="color:var(--ink)">' + said(b) + '</strong>' + (said(a) === said(b) ? ', the same as before' : '; before, it ' + said(a)); }
  const moved = Math.abs(finalDelta) < 1000 ? 'about the same' : fmtMoneyShort(Math.abs(finalDelta)) + (finalDelta > 0 ? ' more' : ' less');
  return lasted + '. The middle outcome ends with ' + moved + ' at ' + state.targetAge + '.';
}
function renderSidebarImpact() {
  const im = computeImpact();
  const compareBtn = `<button class="compare-btn" onclick="toggleCompare()">${compareOn && isPaid() ? 'Stop comparing' : 'Compare side by side'}${!isPaid() ? ' <span class="lock-icon">&#x1f512;</span>' : ''}</button>`;
  if (!im) {
    if (compareOn && isPaid()) return `<div class="impact">Side by side is on, against <strong style="color:var(--ink)">${baselineName}</strong>. Change something and both futures show on the chart. ${compareBtn}</div>`;
    return '';
  }
  const changeRows = im.changes.map(c =>
    `<div style="display:flex;align-items:baseline;gap:6px;line-height:1;margin-bottom:3px">
      <span style="flex:1;min-width:0;font-size:13px;color:var(--ink-soft)"><strong style="color:var(--ink)">${c.label}:</strong> ${c.from} \u2192 ${c.to}</span>
      <button onclick="revertChange('${c.key}')" title="Undo this change" style="flex-shrink:0;background:none;border:none;cursor:pointer;font-size:11px;color:var(--ink-mute);padding:0;font-family:inherit;text-decoration:underline;text-decoration-style:dotted">undo</button>
    </div>`
  ).join('');
  return `<div class="impact">
    <div class="impact-title">${currentName !== 'Current' ? currentName + ', compared with ' + baselineName : 'Compared with ' + baselineName}</div>
    ${changeRows}
    <div style="font-size:13px;color:var(--ink-mute);margin-top:6px;padding-top:6px;border-top:1px solid var(--line-soft);line-height:1.45">${impactResultText(baselineResult, lastSimResult, im.finalDelta)}</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <button style="font-size:13px;color:var(--rust);background:none;border:none;cursor:pointer;padding:2px 0;font-family:inherit;margin-top:2px" onclick="resetBaseline()">Make this the new starting point</button>
      ${compareBtn}
    </div>
  </div>`;
}

// ===== HOW TO READ THIS =====
function renderReadFirst(result) {
  const n = result.totalPeriods;
  const unit = result.mode === 'historical' ? 'stretches' : result.mode === 'montecarlo' ? 'simulated futures' : 'path';
  const yrs = state.targetAge - state.age + 1;
  const bandLine = result.mode === 'fixed'
    ? `Everything here is in today’s dollars. Fixed mode draws one line at a steady ${pct(state.returnRate)} return, so there is no band. Historical mode shows the spread.`
    : `Everything here is in today’s dollars. ${result.mode === 'historical' ? 'A stretch is your plan run through the real market from one starting year, so 1926 to ' + (1926 + yrs - 1) + ' is one stretch, 1927 to ' + (1927 + yrs - 1) + ' the next, and so on. There are ' + n + ' of them, each its own path' : 'Each of the ' + n + ' simulated futures is its own path'}, and at every age the chart shows where those paths sit. The lighter band runs from the worst tenth to the best tenth, so eight in ten ${unit} fall inside it. The darker band is the middle half. The line is the middle outcome at each age, with as many paths above it as below. The count says how the plan would have done in every past you could have started in, and the future is not obliged to look like any of them. A wide band means ${result.mode === 'historical' ? 'the starting year' : 'the draw'} mattered a lot at that age, and a narrow one means it didn’t. If the bottom edge touches zero, the plan ran out in at least some ${unit}, and the spending explorer below shows how much less you would need to spend to change that.`;
  const v = lastVerdict || {};
  return `<details class="read-first" ${readFirstOpen ? 'open' : ''} ontoggle="readFirstOpen=this.open">
    <summary><span class="sum-title">How to read the results, and how the model works</span></summary>
    <div class="read-first-body">
      ${v.method ? `<p>${v.method}</p>` : ''}
      <p>${bandLine}</p>
      ${v.caveat ? `<p class="verdict-caveat">${v.caveat}</p>` : ''}
      <p>Running out here means the balance hits zero before age ${state.targetAge} in that ${result.mode === 'historical' ? 'stretch' : 'run'}. It usually happens in the last few years, after decades of the plan working. We’re assuming most people would notice a bad run and adjust long before then. The guardrails setting under Assumptions is a rough version of that adjustment.</p>
      <p>The model covers your portfolio, wages until the age you stop, Social Security from the age you set, housing (a mortgage until it is paid off, or rent), one-time events you add, and taxes as one flat rate on wages and one on withdrawals, both of which you can change under Assumptions. Healthcare is not a separate line, so it belongs in your spending number. It does not model tax brackets, required minimum distributions, or Medicare surcharges. The portfolio is your stock/bond mix rebalanced once a year, minus the fee you set. The market history is U.S. returns since 1926, and ${yrs}-year stretches overlap, so ${result.mode === 'historical' ? n + ' stretches are not ' + n + ' separate tests' : 'the historical count is not a count of separate tests'}.</p>
      <p>If you are about to make a decision based on this, take the scenario to a planner or tax professional first.</p>
    </div></details>`;
}

// ===== ASSUMPTIONS =====
function chWidth(v) { const s = String(v); const dots = (s.match(/[.,-]/g) || []).length; return (s.length - dots + dots * 0.35 + 0.15).toFixed(2) + 'ch'; }
function asmInput(key, val, opts) {
  const w = chWidth(val);
  return `<input type="number" class="asm-input" style="width:${w}" min="${opts.min}" max="${opts.max}" step="${opts.step}" value="${val}" onchange="update('${key}', clampIn(this)/100)" oninput="this.style.width=chWidth(this.value)" aria-label="${opts.label}"/>%`;
}
function asmRow(label, html) { return `<div class="asm-row"><div class="asm-label">${label}</div><div class="asm-text">${html}</div></div>`; }
function renderAssumptions(result) {
  const mix = state.stockPct, h = historicalStats(mix);
  const isHist = result.mode === 'historical', isMC = result.mode === 'montecarlo';
  const w = result.windows;
  const retRate = retirementTaxRate(state);
  const mixWords = Math.round(mix * 100) + '% stocks / ' + Math.round((1 - mix) * 100) + '% bonds';
  const rows = [];
  rows.push(asmRow('Returns', isHist
    ? `Every rolling ${w.years}-year window of real U.S. returns for a ${mixWords} portfolio, 1926–${HISTORICAL_END_YEAR}: <strong>${w.count} windows</strong> starting ${w.firstStart} through ${w.lastStart}.${w.paddedYears ? ' Your horizon is longer than the data, so each window is padded with the mix’s long-run compound return (' + pct(h.geo) + ') for up to ' + w.paddedYears + ' years.' : ''} Windows overlap heavily, so they are not ${w.count} independent trials.${shockSentence('stretch')}`
    : isMC
    ? `<strong>${result.mcSims}</strong> randomized futures. Each year’s return is drawn from a bell curve with average <strong>${pct(result.mcMean)}</strong> and volatility <strong>${pct(result.mcSd)}</strong>${mcParams(state).fromHistory ? ', the 1926–' + HISTORICAL_END_YEAR + ' average and volatility of your ' + mixWords + ' mix' : ' (you set these; history for this mix is ' + pct(h.mean) + ' and ' + pct(h.sd) + ')'}. Bad years come in runs only as often as chance puts them there, and the worst years are milder than the worst real ones.${shockSentence('run')}`
    : `One path at a steady <strong>${pct(state.returnRate)}</strong> real return every year, so no good or bad years and no sequence-of-returns risk. For comparison, the ${mixWords} mix compounded at ${pct(h.geo)} a year over 1926–${HISTORICAL_END_YEAR}.`));
  rows.push(asmRow('Asset mix', `<strong>${mixWords}</strong>, rebalanced yearly. Stocks are the S&amp;P composite with dividends reinvested; bonds are 10-year U.S. Treasuries. History for this mix, 1926–${HISTORICAL_END_YEAR}: average ${pct(h.mean)}, volatility ${pct(h.sd)}, compound ${pct(h.geo)}, worst year ${pct(h.min)}, best ${pct(h.max)}.
    <div class="asm-slider"><span>All bonds</span><input type="range" class="asm-range" min="0" max="100" step="5" value="${Math.round(mix * 100)}" oninput="this.parentElement.querySelector('output').textContent=this.value+'% stocks / '+(100-this.value)+'% bonds'" onchange="update('stockPct', +this.value/100)" aria-label="Percent in stocks"/><span>All stocks</span><output>${Math.round(mix * 100)}% stocks / ${Math.round((1 - mix) * 100)}% bonds</output></div>`));
  rows.push(asmRow('Fees', `${asmInput('feeRate', ((state.feeRate || 0) * 100).toFixed(2), { min: 0, max: 3, step: 0.05, label: 'Annual fee percent' })} a year is subtracted from every year’s return. That covers fund expense ratios and any advisor fee. The default, 0.10%, is a typical low-cost index fund. Index funds run about 0.03 to 0.2%, and with an advisor the total is often near 1%.`));
  rows.push(asmRow('Inflation', `Everything is in today’s dollars. Spending, Social Security${housingKind(state) === 'rent' ? ', rent' : ''} and the return data are all held constant in real terms.${hasMortgage(state) || hasBuy(state) ? ' A mortgage payment is the exception, since it is fixed in nominal dollars: each year it is deflated by that year’s inflation in Historical mode, and by the long-run average in the other modes.' : ''} Wages grow <strong>${pct(state.yourIncomeGrowth)}</strong> a year above inflation${isPaid() ? ' (change it under More options)' : ''}.`));
  const gr = state.guardrailsEnabled;
  rows.push(asmRow('Spending rule', `<strong>${fmtMoney(state.spending + state.housing)}</strong> a year${hasMortgage(state) ? ', of which ' + fmtMoney(state.housing) + ' is the mortgage payment until it ends at ' + state.mortgagePayoffAge : (housingKind(state) === 'rent' && state.housing > 0) ? ', of which ' + fmtMoney(state.housing) + ' is rent' : ''}. From age ${state.slowDownAge}, <strong>${fmtMoney(state.lateSpending)}</strong> a year besides any housing${state.extraSpend > 0 && has(state.extraSpendStart) ? ', plus <strong>' + fmtMoney(state.extraSpend) + '</strong> a year from ' + state.extraSpendStart + ' to ' + state.extraSpendEnd : ''}${isPaid() ? '' : ' (late-life spending defaults to 85% and is part of the full version)'}. Guardrails are <select class="asm-select" style="width:${gr ? '2.3ch' : '2.7ch'}" onchange="update('guardrailsEnabled', this.value === 'on')" aria-label="Guardrails on or off"><option value="on" ${gr ? 'selected' : ''}>on</option><option value="off" ${gr ? '' : 'selected'}>off</option></select>. ${gr
    ? `Starting from the withdrawal rate in your first retired year, spending is cut <strong>${pct(state.guardrailCutPct, 0)}</strong> in any year the rate runs more than ${pct(state.guardrailBandPct, 0)} above it, and boosted <strong>${pct(state.guardrailBoostPct, 0)}</strong> when more than ${pct(state.guardrailBandPct, 0)} below. Cuts do not compound. The median path shown cut spending in <strong>${result.medianRunFlexCuts || 0}</strong> year${(result.medianRunFlexCuts || 0) === 1 ? '' : 's'}.${isPaid() ? ' Cut and boost sizes are under Spending flexibility below.' : ''}`
    : 'The same amount is withdrawn every year no matter what markets do.'}`));
  if (state.housing > 0 || hasSale(state) || hasBuy(state)) {
    const h = [];
    if (housingKind(state) === 'rent') h.push('Rent is <strong>' + fmtMoney(state.housing) + '</strong> a year, held level in today’s dollars' + (hasBuy(state)
      ? ', until you buy at ' + state.homeBuyAge + '. That year <strong>' + fmtMoney(state.homeBuyDownPayment) + '</strong> comes out of the portfolio for the down payment and closing costs. ' + (state.homeBuyPayment > 0 ? 'The new mortgage is <strong>' + fmtMoney(state.homeBuyPayment) + '</strong> a year until ' + state.homeBuyPayoffAge + ', fixed from the purchase year. ' : '') + (state.homeBuyUpkeep > 0 ? 'Property tax, insurance, and upkeep add <strong>' + fmtMoney(state.homeBuyUpkeep) + '</strong> a year for as long as you own it.' : '')
      : ', for the whole plan.'));
    else if (state.housing > 0) h.push('The mortgage payment is <strong>' + fmtMoney(state.housing) + '</strong> a year until it is paid off at ' + state.mortgagePayoffAge + (state.postPayoffSpend > 0 ? (state.postPayoffSpend > state.housing ? ', after which that money is spent along with ' + fmtMoney(state.postPayoffSpend - state.housing) + ' more a year' : state.postPayoffSpend === state.housing ? ', after which that money is spent' : ', after which ' + fmtMoney(state.postPayoffSpend) + ' of it is spent and the rest stays in the portfolio') : ', after which it stays in the portfolio') + '. Property tax and insurance are part of your spending and continue.');
    if (hasSale(state)) h.push('At ' + state.homeSaleAge + ' the house is sold: <strong>' + fmtMoney(state.homeSaleProceeds) + '</strong> goes into the portfolio and housing costs ' + fmtMoney(state.postSaleHousing || 0) + ' a year from then on.');
    if (hasMortgage(state) || hasBuy(state)) h.push('A mortgage payment is fixed in nominal dollars, so in today’s dollars it shrinks a little every year with inflation.');
    if (hasSale(state)) h.push('Rent after a sale is held in today’s dollars.');
    rows.push(asmRow('Housing', h.join(' ')));
  }
  if (state.yourIncome > 0 || (state.hasPartner && state.partnerIncome > 0)) {
    const bits = [];
    if (state.yourIncome > 0) bits.push('You earn <strong>' + fmtMoney(state.yourIncome) + '</strong> a year until age ' + state.yourStopWorkAge + (state.yourPartTimeAmount > 0 ? ', with ' + fmtMoney(state.yourPartTimeAmount) + ' part-time from ' + state.yourPartTimeStart + ' to ' + state.yourPartTimeEnd + (state.yourPartTimeEnd < state.yourStopWorkAge ? ' and full-time wages after' : '') : '') + (has(state.yourBreakStart) ? ', with no wages from ' + state.yourBreakStart + ' to ' + state.yourBreakEnd : '') + '.');
    if (state.hasPartner && state.partnerIncome > 0) bits.push('Your partner earns ' + fmtMoney(state.partnerIncome) + ' until ' + state.partnerStopWorkAge + (has(state.partnerBreakStart) ? ', off from ' + state.partnerBreakStart + ' to ' + state.partnerBreakEnd : '') + '.');
    bits.push('Whatever is left after tax, spending, and housing goes into the portfolio each year.');
    rows.push(asmRow('Work', bits.join(' ')));
  }
  rows.push(asmRow('Taxes', `Wages are taxed at ${asmInput('taxRate', Math.round(state.taxRate * 100), { min: 0, max: 60, step: 1, label: 'Wage tax rate percent' })}, estimated from your income, filing status, and state, including payroll tax. In retirement, traditional-IRA withdrawals and half of Social Security are taxed at ${asmInput('retirementTaxRate', Math.round(retRate * 100), { min: 0, max: 60, step: 1, label: 'Retirement tax rate percent' })}. ${state.accountsEnabled
    ? 'Account types are on. Roth withdrawals are tax-free, taxable-account withdrawals assume half is gain taxed at ' + asmInput('capGainsTax', Math.round(state.capGainsTax * 100), { min: 0, max: 50, step: 1, label: 'Capital gains rate percent' }) + ', and anything drawn before 59½ pays a 10% penalty.'
    : 'Every portfolio withdrawal is grossed up by ' + asmInput('capGainsTax', Math.round(state.capGainsTax * 100), { min: 0, max: 50, step: 1, label: 'Withdrawal tax rate percent' }) + ' for tax. Set it to 0 if your savings are mostly Roth' + (isPaid() ? ', or turn on account types under More options for per-account treatment.' : '.')} Brackets, RMDs, and Medicare surcharges are not modelled.`));
  rows.push(asmRow('Horizon', `The plan runs from age ${state.age} through age <strong>${state.targetAge}</strong> (${state.targetAge - state.age + 1} years), set in the sidebar under Your plan. A stretch counts as failed if the balance hits $0 before age ${state.targetAge}, even if that happens in the last year, and a stretch that ends with $1 still counts as a success. Once the balance is gone, the model does not let it come back.`));
  if (state.yourSSAmount > 0 || state.partnerSSAmount > 0) rows.push(asmRow('Social Security', `Starts at age <strong>${state.ssStartAge}</strong> at ${fmtMoney(state.yourSSAmount)}${state.hasPartner && state.partnerSSAmount ? ' for you and ' + fmtMoney(state.partnerSSAmount) + ' for your partner' : ''} a year in today’s dollars, ${state.ssEstimated ? 'estimated from your income because you left it blank. Change it in the sidebar or from your ssa.gov statement' : 'from your inputs'}. Claiming at 62 pays 70% of the full-age amount and at 70 pays 124%. Survivor and spousal benefits are not worked out for you.`));
  if (state.otherIncome > 0 || state.otherIncome2 > 0) {
    const oi = (amt, start, end, fixed) => `<strong>${fmtMoney(amt)}</strong> a year from age <strong>${start}</strong>${has(end) ? ' to ' + end : ' for the rest of the plan'}, ${fixed ? 'in fixed dollars, so it buys a little less each year as prices rise' : 'rising with prices'}`;
    rows.push(asmRow('Pension or other income', `${state.otherIncome > 0 ? oi(state.otherIncome, state.otherIncomeStart, state.otherIncomeEnd, state.otherIncomeFixed) : ''}${state.otherIncome > 0 && state.otherIncome2 > 0 ? ', plus ' : ''}${state.otherIncome2 > 0 ? oi(state.otherIncome2, state.otherIncome2Start, state.otherIncome2End, state.otherIncome2Fixed) : ''}. Taxed at the retirement rate, not as wages, and it does not count as working.`));
  }
  if (isMC) rows.push(asmRow('Randomness', `The ${result.mcSims} random futures are the same set every time you look, so the result does not jump around as you change things. <button class="link-btn" onclick="rerollSeed()">Try a different random set</button>. If the count barely moves, ${result.mcSims} futures is plenty; if it jumps a few points, that is how much luck is in the number. Average ${asmInput('mcMean', (result.mcMean * 100).toFixed(1), { min: -5, max: 15, step: 0.1, label: 'Simulated average real return percent' })} &middot; volatility ${asmInput('mcSd', (result.mcSd * 100).toFixed(1), { min: 1, max: 40, step: 0.5, label: 'Simulated volatility percent' })}${mcParams(state).fromHistory ? '' : ' &middot; <button class="link-btn" onclick="resetMcToHistory()">match history for this mix</button>'} &middot; futures <input type="number" class="asm-input" style="width:${String(result.mcSims).length + 0.15}ch" min="100" max="5000" step="100" value="${result.mcSims}" oninput="this.style.width=(this.value.length+0.15)+'ch'" onchange="update('mcSims', Math.max(100, Math.min(5000, +this.value)))" aria-label="Number of simulated futures"/>`));
  return `<details class="assumptions" ${assumptionsOpen ? 'open' : ''} ontoggle="assumptionsOpen=this.open">
    <summary><span class="sum-title">Assumptions behind this result</span><span class="asm-hint">every default, and where to change it</span></summary>
    <div class="asm-body">${rows.join('')}
      <div class="asm-sources">Sources: <a href="${DATA_SOURCE.url}" target="_blank" rel="noopener">Robert Shiller’s U.S. stock market dataset</a> (Yale) for S&amp;P composite prices, dividends, CPI, and 10-year Treasury yields, 1926–${HISTORICAL_END_YEAR}, rebuilt by a script in the code (${HISTORICAL_END_YEAR} is a partial year); 2026 IRS brackets and standard deduction; 2026 SSA bend points and wage base; state rates from the Tax Foundation. This is not the Ibbotson data the original 4% rule studies used.</div>
    </div></details>`;
}

// ===== WHAT WOULD IT TAKE =====
let wwitCache = null, wwitStale = true;
function renderWhatItTakes(result) {
  if (!isPaid() || result.mode !== 'historical') return '';
  if (wwitStale || !wwitCache) {
    const th = state.successThreshold || 0.85;
    const need = Math.ceil(th * result.totalPeriods);
    const c = { th, need, total: result.totalPeriods, clears: result.successRate >= th };
    const ratio = state.spending > 0 ? state.lateSpending / state.spending : 0.85;
    const ms = findMaxSpendAtSuccess({ ...state, spending: state.spending || 100000, lateSpending: (state.spending || 100000) * ratio }, th);
    c.maxSpend = Math.round((ms.spend + state.housing) / 1000) * 1000;
    if (!c.clears) {
      c.age = findRetireAgeAtSuccess(state, th);
      c.portfolio = findPortfolioAtSuccess(state, th);
    }
    if (state.guardrailsEnabled) c.noCuts = runForState({ ...state, guardrailsEnabled: false, simMode: 'historical' });
    wwitCache = c; wwitStale = false;
  }
  const c = wwitCache;
  const pctTh = Math.round(c.th * 100);
  const nowSpend = state.spending + state.housing;
  if (c.clears) {
    const room = c.maxSpend - nowSpend;
    if (c.noCuts && c.noCuts.successRate < c.th) return `<div class="wwit"><div class="wwit-title">Where the room comes from</div>This plan lasts in at least ${c.need} of ${c.total} stretches (${pctTh}% of history) because the guardrails cut spending in bad stretches. With steady spending and no cuts it lasts in ${c.noCuts.successCount} of ${c.total}, and the line would be <strong>${fmtMoney(c.maxSpend)}</strong> a year in total, ${fmtMoneyShort(nowSpend - c.maxSpend)} less than now.</div>`;
    return `<div class="wwit"><div class="wwit-title">Room to spend</div>This plan lasts in at least ${c.need} of ${c.total} stretches (${pctTh}% of history) with steady spending and no guardrail cuts. ${room >= 1000 ? 'Spending could go up to <strong>' + fmtMoney(c.maxSpend) + '</strong> a year in total, ' + fmtMoneyShort(room) + ' more than now, and still clear that line.' : 'At ' + fmtMoney(nowSpend) + ' a year it is right at that line.'}</div>`;
  }
  const items = [];
  if (c.maxSpend < nowSpend) items.push('Spend <strong>' + fmtMoney(c.maxSpend) + '</strong> a year in total, ' + fmtMoneyShort(nowSpend - c.maxSpend) + ' less than now.');
  if (c.age && c.age.age > state.yourStopWorkAge) items.push('Work until <strong>' + c.age.age + '</strong> instead of ' + state.yourStopWorkAge + ', ' + (c.age.age - state.yourStopWorkAge) + ' more year' + (c.age.age - state.yourStopWorkAge > 1 ? 's' : '') + '.');
  if (c.portfolio && !c.portfolio.alreadyThere) items.push('Have <strong>' + fmtMoney(c.portfolio.portfolio) + '</strong> saved today, ' + fmtMoneyShort(c.portfolio.portfolio - state.portfolio) + ' more than now.');
  if (!items.length) return '';
  return `<div class="wwit"><div class="wwit-title">What would it take</div>To last in at least ${c.need} of ${c.total} stretches (${pctTh}% of history), any one of these would do it on its own:<ul>${items.map(i => '<li>' + i + '</li>').join('')}</ul></div>`;
}

// ===== YEAR BY YEAR =====
function yearRows(result) {
  const run = result.medianRun || [];
  return run.map((y, i) => {
    const p = result.percentiles[i] || {};
    return { age: y.age, year: y.year, wages: y.yourIncome + y.partnerIncome, ss: y.ssIncome, other: y.otherIncome || 0, spending: y.spending, fromPortfolio: y.withdrawal > 0 ? y.withdrawal : 0, added: y.withdrawal < 0 ? -y.withdrawal : 0, tax: y.tax, ret: y.marketReturn, balance: y.portfolio, p10: p.p10, p90: p.p90, ranOut: y.ranOut };
  });
}
function renderYearTable(result) {
  const all = yearRows(result);
  if (!all.length) return '';
  // A handful of milestone ages: now, the ages where something changes, then the end.
  const marks = [state.age, state.yourIncome > 0 ? state.yourStopWorkAge : null, (state.yourSSAmount > 0 || state.partnerSSAmount > 0) ? state.ssStartAge : null, state.otherIncome > 0 ? state.otherIncomeStart : null, hasMortgage(state) ? state.mortgagePayoffAge : null, hasBuy(state) ? state.homeBuyAge : null, state.lateSpending !== state.spending ? state.slowDownAge : null, state.yourBreakStart, hasSale(state) ? state.homeSaleAge : null, state.shockAge, state.extraSpendStart, state.yourPartTimeAmount > 0 ? state.yourPartTimeStart : null, state.targetAge]
    .filter(v => has(v) && v >= state.age && v <= state.targetAge);
  const ages = [...new Set(marks)].sort((a, b) => a - b).slice(0, 7);
  const printing = document.body.classList.contains('printing');
  const rows = printing ? all : ages.map(a => all.find(r => r.age === a)).filter(Boolean);
  const notFixed = result.mode !== 'fixed';
  const flow = (r) => r.fromPortfolio > 0 ? '\u2212' + fmtMoneyShort(r.fromPortfolio) : r.added > 0 ? '+' + fmtMoneyShort(r.added) : '';
  const label = (a) => a === state.age ? 'Now' : a === state.targetAge ? 'Plan ends' : (a === state.yourStopWorkAge && state.yourIncome > 0) ? 'Retire' : a === state.ssStartAge ? 'Social Security' : (state.otherIncome > 0 && a === state.otherIncomeStart) ? 'Pension' : (a === state.mortgagePayoffAge && hasMortgage(state)) ? 'Mortgage paid' : a === state.slowDownAge ? 'Spending eases' : hasBuy(state) && a === state.homeBuyAge ? 'Home bought' : hasSale(state) && a === state.homeSaleAge ? 'House sold' : has(state.yourBreakStart) && a === state.yourBreakStart ? 'Career break' : has(state.shockAge) && a === state.shockAge ? 'Bad decade' : has(state.extraSpendStart) && a === state.extraSpendStart ? 'Extra spending' : state.yourPartTimeAmount > 0 && a === state.yourPartTimeStart ? 'Part-time' : '';
  if (printing) return `<h2 class="section-heading">Year by year</h2>
    <div class="section-sub">The median path, in today’s dollars. In / out is money taken from the portfolio (\u2212) or added to it (+).${notFixed ? ' Range is where the worst 10% and the best 10% of ' + (result.mode === 'historical' ? 'stretches' : 'futures') + ' stood at that age.' : ''}</div>
    <div class="data-table-wrapper"><table class="data-table year-preview year-full"><thead><tr><th scope="col">Age</th><th scope="col">Income</th><th scope="col">Spending</th><th scope="col">In / out</th><th scope="col">Balance</th>${notFixed ? '<th scope="col">Range</th>' : ''}</tr></thead><tbody>
    ${rows.map(r => `<tr class="${r.ranOut ? 'out' : ''}"><td class="agecell">${r.age}${label(r.age) ? '<span class="ms">' + label(r.age) + '</span>' : ''}</td><td>${r.wages + r.ss > 0 ? fmtMoneyShort(r.wages + r.ss) : ''}</td><td>${fmtMoneyShort(r.spending)}</td><td>${flow(r)}</td><td>${r.ranOut ? 'ran out' : fmtMoneyShort(r.balance)}</td>${notFixed ? '<td>' + (r.p10 <= 0 ? 'ran out' : fmtMoneyShort(r.p10)) + '\u2013' + fmtMoneyShort(r.p90) + '</td>' : ''}</tr>`).join('')}
    </tbody></table></div>`;
  return `<h2 class="section-heading">Year by year</h2>
    <div class="section-sub">A few milestones along the median path, in today’s dollars. To see every year as a readable table, <button class="link-btn" onclick="printReport()">print the report</button>. To get all the raw numbers, <button class="link-btn" onclick="downloadCsv()">download the spreadsheet</button>.</div>
    <div class="data-table-wrapper"><table class="data-table year-preview"><thead><tr><th scope="col"></th><th scope="col">Age</th><th scope="col">Income</th><th scope="col">Spending</th><th scope="col">Balance</th></tr></thead><tbody>
    ${rows.map(r => `<tr class="${r.ranOut ? 'out' : ''}"><td class="milestone">${label(r.age)}</td><td>${r.age}</td><td>${r.wages + r.ss > 0 ? fmtMoneyShort(r.wages + r.ss) : '\u2014'}</td><td>${fmtMoneyShort(r.spending)}</td><td>${r.ranOut ? 'ran out' : fmtMoneyShort(r.balance)}</td></tr>`).join('')}
    </tbody></table></div>`;
}
window.downloadCsv = function() {
  if (!isPaid()) { showUnlockModal(); return; }
  const r = lastSimResult; if (!r) return;
  const rows = yearRows(r);
  const head = ['Age', 'Year', 'Wages', 'Social Security', 'Total spending', 'From portfolio', 'Added to portfolio', 'Tax on withdrawals', 'Real return', 'Balance (median path)', 'Balance worst 10%', 'Balance best 10%', 'Ran out'];
  const lines = [head.join(',')].concat(rows.map(x => [x.age, x.year, Math.round(x.wages), Math.round(x.ss), Math.round(x.spending), Math.round(x.fromPortfolio), Math.round(x.added), Math.round(x.tax), (x.ret * 100).toFixed(2) + '%', Math.round(x.balance), Math.round(x.p10 || 0), Math.round(x.p90 || 0), x.ranOut ? 'yes' : 'no'].join(',')));
  lines.push('');
  lines.push('Exported,' + new Date().toISOString().slice(0, 10));
  lines.push('Source,Spend Enough');
  lines.push('Mode,' + modeName(r.mode));
  lines.push('Stocks / bonds,' + mixLabel());
  lines.push('Fees,' + pct(state.feeRate || 0, 2));
  lines.push('Dollars,today\'s');
  lines.push('Note,Educational model');
  lines.push(',not advice');
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'spend-enough-' + (currentName !== 'Current' ? currentName : 'scenario').toLowerCase().replace(/[^a-z0-9]+/g, '-') + '.csv';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  track('downloaded_csv');
};

// ===== PRINT =====
window.printReport = function() {
  if (!isPaid()) { showUnlockModal(); return; }
  const prevA = assumptionsOpen, prevD = deepOpen, prevR = readFirstOpen;
  assumptionsOpen = true; deepOpen = true; readFirstOpen = false;
  document.body.classList.add('printing');
  render();
  const done = () => { document.body.classList.remove('printing'); assumptionsOpen = prevA; deepOpen = prevD; readFirstOpen = prevR; window.removeEventListener('afterprint', done); render(); };
  window.addEventListener('afterprint', done);
  setTimeout(() => { if (lastSimResult) drawCashflowChart(lastSimResult); setTimeout(() => window.print(), 250); }, 200);
  track('printed_report');
};

// ===== SIDE BY SIDE =====
function renderCompareSummary(a, b) {
  const last = r => r.percentiles[r.percentiles.length - 1];
  const range = r => r.mode === 'fixed' ? fmtMoneyShort(last(r).p50) + ' (steady return)' : (last(r).p10 <= 0 ? 'ran out' : fmtMoneyShort(last(r).p10)) + ' to ' + fmtMoneyShort(last(r).p90);
  const im = computeImpact();
  const diffs = im ? im.changes.map(c => c.label + ' ' + c.from + ' → ' + c.to).join('; ') : '';
  const basis = b.mode === 'historical' ? 'Both are tested against the same market history since 1926.' : b.mode === 'montecarlo' ? 'Both are tested against the same simulated markets.' : 'Both use the same steady return.';
  return `<h2 class="section-heading">Side by side</h2>
    <div class="section-sub"><strong>${baselineName}</strong> compared with <strong>${currentName}</strong>. ${basis} ${diffs ? 'What changed: ' + diffs + '.' : 'Nothing differs yet.'} <button class="link-btn" onclick="toggleCompare()">Stop comparing</button></div>
    <div class="data-table-wrapper"><table class="data-table compare-table"><thead><tr><th scope="col"></th><th scope="col">${baselineName}</th><th scope="col">${currentName}</th></tr></thead><tbody>
      <tr><td>Lasted to age ${state.targetAge}</td><td>${periodsLabel(a)}</td><td style="font-weight:600;color:var(--ink)">${periodsLabel(b)}</td></tr>
      <tr><td>Ending balance, worst 10% to best 10%</td><td>${range(a)}</td><td>${range(b)}</td></tr>
      <tr><td>Median ending balance</td><td>${fmtMoneyShort(a.medianFinal)}</td><td>${fmtMoneyShort(b.medianFinal)}</td></tr>
      <tr><td>Total yearly spending</td><td>${fmtMoney(baselineState.spending + baselineState.housing)}</td><td>${fmtMoney(state.spending + state.housing)}</td></tr>
      <tr><td>Portfolio today</td><td>${fmtMoneyShort(baselineState.portfolio)}</td><td>${fmtMoneyShort(state.portfolio)}</td></tr>
    </tbody></table></div>`;
}

// ===== CONFIDENCE BANDS =====
function renderBands(result) {
  const last = result.percentiles[result.percentiles.length - 1];
  if (result.mode === 'fixed') {
    return `<div class="bands"><div class="band neutral" style="grid-column:1/-1"><div class="band-label">Projected ending balance</div><div class="band-sub">At a steady ${(state.returnRate*100).toFixed(1)}% real return</div><div class="band-value">${last.p50 <= 0 ? 'Depleted at age '+result.medianRunOutAge : fmtMoneyShort(last.p50)}</div></div></div>`;
  }
  const unit = result.mode === 'historical' ? 'stretches' : 'futures';
  // p10 <= 0 means at least 10% of runs were depleted by the end; say that, not a single age.
  const consTxt = last.p10 <= 0 ? 'Ran out' : fmtMoneyShort(last.p10);
  const consSub = last.p10 <= 0 ? `${result.failureCount} of ${result.totalPeriods} ${unit} ran out; among those, half by age ${result.medianRunOutAge}` : `10% of ${unit} ended below this`;
  return `<h2 class="section-heading">Ending balance at age ${state.targetAge}</h2>
  <div class="section-sub">Where the ${result.totalPeriods} ${unit} finished. Every figure is in today's dollars.</div>
  <div class="bands">
    <div class="band warn"><div class="band-label">Worst 10%</div><div class="band-sub">${consSub}</div><div class="band-value">${consTxt}</div></div>
    <div class="band ok"><div class="band-label">Middle 50%</div><div class="band-sub">Half of ${unit} ended in this range</div><div class="band-value">${fmtMoneyShort(last.p25)}\u2013${fmtMoneyShort(last.p75)}</div></div>
    <div class="band neutral"><div class="band-label">Best 10%</div><div class="band-sub">10% of ${unit} ended above this</div><div class="band-value">${fmtMoneyShort(last.p90)}</div></div>
  </div>`;
}

// ===== EVENT TIMELINE =====
function renderEventTimeline() {
  const events = [];
  if (state.yourPartTimeAmount > 0) {
    const glide = state.yourPartTimeEnd >= state.yourStopWorkAge;
    events.push({ age: state.yourPartTimeStart, label: 'Part-time', detail: 'Income drops from ' + fmtMoneyShort(state.yourIncome) + ' to ' + fmtMoneyShort(state.yourPartTimeAmount) });
    events.push({ age: state.yourPartTimeEnd, label: glide ? 'You stop working' : 'Back to full time', detail: glide ? 'Part-time income ends' : 'Income returns to ' + fmtMoneyShort(state.yourIncome) });
    if (!glide && state.yourStopWorkAge > state.yourPartTimeEnd) events.push({ age: state.yourStopWorkAge, label: 'You retire', detail: 'Income drops to $0' });
  }
  else if (state.yourStopWorkAge > state.age && state.yourIncome > 0) events.push({ age: state.yourStopWorkAge, label: 'You retire', detail: 'Income drops from ' + fmtMoneyShort(state.yourIncome) + ' to $0' });
  if (state.hasPartner && state.partnerStopWorkAge > state.partnerAge && state.partnerIncome > 0) events.push({ age: state.partnerStopWorkAge, label: 'Partner retires', detail: 'Partner income drops to $0' });
  if (hasBuy(state)) {
    events.push({ age: state.homeBuyAge, label: 'Home bought', detail: fmtMoneyShort(state.homeBuyDownPayment) + ' from the portfolio; rent ends' });
    if (state.homeBuyPayment > 0 && has(state.homeBuyPayoffAge) && state.homeBuyPayoffAge < state.targetAge && (!hasSale(state) || state.homeBuyPayoffAge < state.homeSaleAge)) events.push({ age: state.homeBuyPayoffAge, label: 'Mortgage paid off', detail: fmtMoneyShort(state.homeBuyPayment) + '/yr payment ends' });
  }
  if (hasMortgage(state) && state.mortgagePayoffAge > state.age && (!hasSale(state) || state.mortgagePayoffAge < state.homeSaleAge)) events.push({ age: state.mortgagePayoffAge, label: 'Mortgage paid off', detail: fmtMoneyShort(state.housing) + '/yr payment ends' + (state.postPayoffSpend > 0 ? (state.postPayoffSpend < state.housing ? '; ' + fmtMoneyShort(state.postPayoffSpend) + '/yr of it goes to spending' : state.postPayoffSpend === state.housing ? '; all of it goes to spending' : '; spending rises by ' + fmtMoneyShort(state.postPayoffSpend) + '/yr') : '') });
  if (hasSale(state)) events.push({ age: state.homeSaleAge, label: 'House sold', detail: fmtMoneyShort(state.homeSaleProceeds) + ' into the portfolio; housing ' + fmtMoneyShort(state.postSaleHousing || 0) + '/yr after' });
  if (has(state.yourBreakStart) && state.yourBreakStart >= state.age) { events.push({ age: state.yourBreakStart, label: 'Career break', detail: 'No wages from ' + state.yourBreakStart + ' to ' + state.yourBreakEnd }); events.push({ age: state.yourBreakEnd, label: 'Back to work', detail: 'Wages resume' }); }
  if (state.hasPartner && has(state.partnerBreakStart)) { events.push({ age: state.age + (state.partnerBreakStart - state.partnerAge), label: 'Partner’s break', detail: 'Partner has no wages for ' + (state.partnerBreakEnd - state.partnerBreakStart) + ' years' }); }
  if (state.shockEra && has(state.shockAge)) events.push({ age: state.shockAge, label: 'Bad decade starts', detail: shockLabel(state.shockEra) + ' returns for ten years' });
  if (state.extraSpend > 0 && has(state.extraSpendStart)) { events.push({ age: state.extraSpendStart, label: 'Extra spending', detail: '+' + fmtMoneyShort(state.extraSpend) + '/yr until ' + state.extraSpendEnd }); events.push({ age: state.extraSpendEnd, label: 'Extra spending ends', detail: '' }); }
  if (state.ssStartAge > state.age && (state.yourSSAmount > 0 || state.partnerSSAmount > 0)) events.push({ age: state.ssStartAge, label: 'Social Security begins', detail: fmtMoneyShort(state.yourSSAmount + state.partnerSSAmount) + '/yr starts' });
  if (state.otherIncome > 0 && state.otherIncomeStart > state.age) events.push({ age: state.otherIncomeStart, label: 'Other income begins', detail: fmtMoneyShort(state.otherIncome) + '/yr' + (has(state.otherIncomeEnd) ? ' until ' + state.otherIncomeEnd : '') });
  if (state.otherIncome2 > 0 && state.otherIncome2Start > state.age) events.push({ age: state.otherIncome2Start, label: 'Second source begins', detail: fmtMoneyShort(state.otherIncome2) + '/yr' + (has(state.otherIncome2End) ? ' until ' + state.otherIncome2End : '') });
  if (state.slowDownAge > state.age && state.lateSpending !== state.spending) events.push({ age: state.slowDownAge, label: 'Spending changes', detail: fmtMoneyShort(state.spending) + ' \u2192 ' + fmtMoneyShort(state.lateSpending) + '/yr' });
  if (state.oneTimeEvents) state.oneTimeEvents.forEach(ev => events.push({ age: ev.age, label: ev.label, detail: fmtMoneyShort(ev.amount) }));
  events.sort((a, b) => a.age - b.age);
  if (!events.length) return '';
  // One sentence per age, so the chart's notes read as prose under it.
  const byAge = new Map();
  events.sort((a, b) => a.age - b.age).forEach(ev => { if (!byAge.has(ev.age)) byAge.set(ev.age, []); byAge.get(ev.age).push(ev); });
  const clause = {
    'You retire': 'you retire', 'Partner retires': 'your partner retires', 'Mortgage paid off': 'the mortgage is paid off', 'Home bought': 'you buy a home',
    'Social Security begins': 'Social Security begins', 'Other income begins': 'your pension or other income begins', 'Second source begins': 'your second income source begins', 'Spending changes': 'spending changes', 'Career break': 'your career break starts',
    'Back to work': 'you go back to work', 'Partner\u2019s break': 'your partner\u2019s break starts', 'Part-time': 'you go part-time',
    'You stop working': 'you stop working', 'Back to full time': 'you go back to full time', 'House sold': 'the house is sold',
    'Bad decade starts': 'the bad decade starts', 'Extra spending': 'the extra spending starts', 'Extra spending ends': 'the extra spending ends'
  };
  const lower = (t) => clause[t] || t.replace(/^(?!Social Security)([A-Z])/, m => m.toLowerCase());
  const sentences = [...byAge.entries()].map(([age, evs]) => {
    const parts = evs.map(e => lower(e.label));
    const list = parts.length === 1 ? parts[0] : parts.length === 2 ? parts.join(' and ') : parts.slice(0, -1).join(', ') + ', and ' + parts[parts.length - 1];
    return 'At ' + age + ', ' + list + '.';
  });
  return `<p class="event-line" title="${events.map(e => e.age + ': ' + e.detail).join(' \u00b7 ')}">${sentences.join(' ')}</p>`;
}

// ===== SPENDING EXPLORER =====
// The mortgage payment is still part of spending after the change age if it is not paid off yet.
// The same goes for rent, which never stops, and for a home bought before that age.
function lateHousingPart() {
  if (housingKind(state) === 'rent') {
    if (!hasBuy(state) || state.homeBuyAge > state.slowDownAge) return state.housing;
    return ((!has(state.homeBuyPayoffAge) || state.homeBuyPayoffAge > state.slowDownAge) ? state.homeBuyPayment : 0) + (state.homeBuyUpkeep || 0);
  }
  return hasMortgage(state) && state.mortgagePayoffAge > state.slowDownAge ? state.housing : 0;
}
function computeSpendingLevels() {
  if (!spendingLevelsStale && spendingLevelsCache) return spendingLevelsCache;
  const base = state.spending || 50000;
  const mults = [0.8, 0.9, 1.0, 1.1, 1.2];
  const rows = mults.map(m => {
    const spend = Math.round(base * m / 1000) * 1000;
    // Only the amount until the change age varies; late-life spending is the person's own number.
    const ts = { ...state, spending: spend };
    const r = runForState(ts);
    const last = r.percentiles[r.percentiles.length - 1];
    return { spending: spend, successRate: r.successRate, successCount: r.successCount, totalPeriods: r.totalPeriods, medianFinal: r.medianFinal, p10: last.p10, isCurrent: spend === (Math.round(base/1000)*1000) && m === 1.0 };
  });
  spendingLevelsCache = rows; spendingLevelsStale = false;
  return rows;
}
function renderSpendingExplorer() {
  const rows = computeSpendingLevels();
  const isHist = state.simMode === 'historical';
  return `<div class="data-table-wrapper"><table class="data-table"><thead><tr><th scope="col">Spending</th><th scope="col">Lasted in</th><th scope="col">Median ending</th><th scope="col">Worst 10%</th><th scope="col"><span class="sr-only">Use this level</span></th></tr></thead><tbody>
    ${rows.map(r => `<tr class="${r.isCurrent?'current-row':''} clickable" onclick="applySpending(${r.spending})"><td>${fmtMoney(r.spending + state.housing)}/yr ${r.isCurrent?'<span class="tag-current">current</span>':''}</td><td>${isHist ? r.successCount+' of '+r.totalPeriods : Math.round(r.successRate*100)+'%'}</td><td>${fmtMoneyShort(r.medianFinal)}</td><td>${r.p10<=0?'<span class="fail">Ran out</span>':fmtMoneyShort(r.p10)}</td><td><button type="button" class="link-btn" onclick="event.stopPropagation(); applySpending(${r.spending})" aria-label="Set spending to ${fmtMoney(r.spending + state.housing)} a year">Use</button></td></tr>`).join('')}
  </tbody></table></div>`;
}

// ===== STRESS TESTS =====
function renderStressTests() {
  const cards = HISTORICAL_SCENARIOS.map(s => {
    const run = runNamedScenario(state, s);
    const final = run.years[run.years.length - 1];
    const survived = !run.years.some(y => y.ranOut);
    const ranOut = run.years.find(y => y.ranOut);
    return `<div class="scenario-card ${survived?'survived':'failed'}" onclick="showScenarioDetail('${s.id}')">
      <div class="scenario-name">${s.name}</div>
      <div class="scenario-years">${s.startYear}\u2013${s.startYear + (state.targetAge - state.age)}${run.padded?'*':''}</div>
      <div class="scenario-result ${survived?'ok':'fail'}">${survived ? 'Ended with '+fmtMoneyShort(final.portfolio) : 'Ran out at age '+ranOut.age}</div>
      <div class="scenario-desc">${s.description}</div>
    </div>`;
  }).join('');
  return `<h2 class="section-heading">Historical stress tests</h2>
    <div class="section-sub">How this scenario would have played out starting in specific market environments.</div>
    <div class="scenario-cards">${cards}</div>
    ${HISTORICAL_SCENARIOS.some(s => runNamedScenario(state, s).padded) ? '<div class="section-sub" style="margin-top:-8px">* Your horizon runs past the end of the data; padded years use the mix’s long-run compound return.</div>' : ''}`;
}

// ===== SS COMPARISON =====
function renderSSComparison() {
  const ages = [62, 67, 70];
  const factors = { 62: 0.70, 67: 1.00, 70: 1.24 };
  const baseYour = state.ssStartAge === 67 ? state.yourSSAmount : state.yourSSAmount / (factors[state.ssStartAge] || 1);
  const basePartner = state.ssStartAge === 67 ? state.partnerSSAmount : state.partnerSSAmount / (factors[state.ssStartAge] || 1);
  const isHist = state.simMode === 'historical';
  const cards = ages.map(a => {
    const ts = { ...state, ssStartAge: a, yourSSAmount: Math.round(baseYour * factors[a]), partnerSSAmount: Math.round(basePartner * factors[a]) };
    const r = runForState(ts);
    const benefit = ts.yourSSAmount + ts.partnerSSAmount;
    const label = a === 62 ? 'Early' : a === 67 ? 'Full retirement' : 'Delayed';
    const highlight = a === state.ssStartAge ? 'highlight' : '';
    return `<div class="ss-card ${highlight}" onclick="applySSAge(${a})" style="cursor:pointer" title="Click to use age ${a}"><div class="ss-age">${a}</div><div class="ss-label">${label}</div><div class="ss-benefit">${fmtMoney(benefit)}/yr</div><div class="ss-success" style="color:${r.successRate>=0.85?'var(--moss)':r.successRate>=0.6?'var(--gold)':'var(--danger)'}">${isHist ? 'Survived ' + r.successCount+' of '+r.totalPeriods : Math.round(r.successRate*100)+'%'}</div></div>`;
  }).join('');
  return `<h2 class="section-heading">Social Security claiming</h2>
    <div class="section-sub">Claiming earlier means smaller payments for more years; later means larger payments for fewer. Click a card to see what happens if you claim at that age.</div>
    <div class="ss-grid">${cards}</div>`;
}

// ===== TAX COMPARISON =====
function renderTaxComparison() {
  // Use fixed mode for clean apples-to-apples comparison regardless of current mode
  const propState = { ...state, withdrawalStrategy: 'proportional' };
  const smartState = { ...state, withdrawalStrategy: 'taxSmart' };
  const prop = runFixed(propState);
  const smart = runFixed(smartState);
  const taxTotal = (r) => r.medianRun ? Math.round(r.medianRun.reduce((s, y) => s + (y.tax || 0), 0)) : 0;
  const propTax = taxTotal(prop), smartTax = taxTotal(smart);
  // After-tax ending wealth: Roth is worth 100%, traditional worth (1-taxRate), taxable worth (1-capGainsTax*0.5)
  const afterTaxWealth = (r) => {
    const fa = r.medianRun && r.medianRun.finalAccounts;
    if (!fa) return r.medianFinal;
    return fa.roth + fa.traditional * (1 - state.taxRate) + fa.taxable * (1 - state.capGainsTax * 0.5);
  };
  const propATW = afterTaxWealth(prop), smartATW = afterTaxWealth(smart);
  const smartBetter = smartATW > propATW;
  return `<h2 class="section-heading">Withdrawal strategy</h2>
    <div class="section-sub">How you draw from different account types affects after-tax wealth. Preserving Roth (tax-free) growth typically leaves more usable money. These are simplified estimates at a steady ${(state.returnRate*100).toFixed(1)}% return.</div>
    <div class="data-table-wrapper"><table class="data-table"><thead><tr><th scope="col"></th><th scope="col">Proportional</th><th scope="col">Tax-aware order</th></tr></thead><tbody>
      <tr><td>After-tax ending wealth</td><td>${fmtMoneyShort(propATW)}</td><td style="color:${smartBetter?'var(--moss)':'var(--ink-soft)'};font-weight:600">${fmtMoneyShort(smartATW)}</td></tr>
      <tr><td>Estimated total tax paid</td><td>${fmtMoneyShort(propTax)}</td><td>${fmtMoneyShort(smartTax)}</td></tr>
      <tr><td>Pre-tax ending balance</td><td>${fmtMoneyShort(prop.medianFinal)}</td><td>${fmtMoneyShort(smart.medianFinal)}</td></tr>
    </tbody></table></div>
    <div class="flex-note">Tax-aware ordering (taxable \u2192 traditional \u2192 Roth) preserves tax-free Roth growth. It may show higher nominal tax, but the leftover money is worth more after tax. Estimated difference in after-tax wealth: ${fmtMoneyShort(Math.abs(smartATW - propATW))}. A tax professional can model your specific situation.</div>`;
}

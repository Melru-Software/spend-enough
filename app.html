<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spend Enough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600;8..60,700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bone: #f4efe6;
    --bone-2: #ebe4d6;
    --ink: #1a1814;
    --ink-soft: #3d3830;
    --ink-mute: #6b6356;
    --ink-faint: #75695a;
    --rust: #a04a28;
    --rust-deep: #8a4226;
    --moss: #5b6e3a;
    --moss-deep: #3e4d28;
    --gold: #7d6420;
    --paper: #fbf8f1;
    --line: #d4cab8;
    --line-soft: #e2dac8;
    --danger: #a8331f;
    --danger-soft: #d8856f;
    --shadow-sm: 0 1px 0 rgba(26,24,20,0.04), 0 1px 2px rgba(26,24,20,0.06);
    --shadow-md: 0 2px 4px rgba(26,24,20,0.06), 0 8px 24px rgba(26,24,20,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter Tight', system-ui, sans-serif;
    background: var(--bone);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 20% 0%, rgba(184,92,56,0.04) 0%, transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(91,110,58,0.04) 0%, transparent 50%);
  }

  /* Data tables - horizontal scroll on mobile */
  .data-table { width: 100%; border-collapse: collapse; }
  @media (max-width: 768px) {
    .data-table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -20px; padding: 0 20px; }
  }
  
  /* Improve touch targets */
  button, input[type="button"], input[type="submit"], .clickable {
    min-height: 44px;
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
  }
  
  input[type="range"] { cursor: pointer; }
  
  /* Better modal behavior on mobile */
  .modal-overlay { padding: 16px; }
  @media (max-width: 480px) {
    .modal-overlay { align-items: flex-start; padding-top: 20px; }
    .modal { max-width: calc(100vw - 32px); max-height: calc(100vh - 40px); }
  }
  
  /* Prevent zoom on input focus (iOS) */
  input[type="text"], input[type="number"], input[type="email"], input[type="tel"], select, textarea {
    font-size: 16px !important;
  }

  /* ========== HEADER ========== */
  header {
    padding: 18px 32px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--paper);
  }
  .logo {
    font-family: 'Source Serif 4', serif;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.02em;
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .logo-dot {
    width: 8px; height: 8px;
    background: var(--rust);
    border-radius: 50%;
    display: inline-block;
    margin-right: 2px;
    transform: translateY(-2px);
  }
  .tagline { color: var(--ink-mute); font-size: 14px; font-style: italic; font-family: 'Source Serif 4', serif; }
  .scenarios-bar { display: flex; gap: 8px; align-items: center; }
  .scenario-pill {
    padding: 6px 14px; border: 1px solid var(--line); background: var(--paper);
    color: var(--ink-soft); font-size: 14px; border-radius: 100px; cursor: pointer;
    transition: all 0.15s ease; font-weight: 500; font-family: inherit;
  }
  .scenario-pill:hover { border-color: var(--ink); background: var(--bone-2); }

  /* ========== ONBOARDING ========== */
  .onboarding { max-width: 960px; margin: 0 auto; padding: 64px 40px; }
  .onboard-hero { margin-bottom: 48px; text-align: center; }
  .onboard-eyebrow { text-transform: uppercase; letter-spacing: 0.18em; font-size: 14px; color: var(--rust); font-weight: 600; margin-bottom: 18px; }
  .onboard-title { font-family: 'Source Serif 4', serif; font-size: clamp(38px, 6vw, 60px); font-weight: 400; line-height: 1.05; letter-spacing: -0.025em; margin-bottom: 22px; white-space: nowrap; }
  .onboard-title em { font-style: italic; color: var(--rust); font-weight: 500; }
  .onboard-sub { font-size: 17px; color: var(--ink-mute); max-width: 520px; margin: 0 auto; line-height: 1.6; }
  .onboard-fine { font-size: 14px; color: var(--ink-faint); margin-top: 18px; }
  .onboard-fine a { color: var(--rust); }
  .onboard-step { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 32px; margin-bottom: 14px; box-shadow: var(--shadow-sm); max-width: 680px; margin-left: auto; margin-right: auto; }
  .step-number { font-family: 'Source Serif 4', serif; font-size: 14px; color: var(--rust); font-style: italic; margin-bottom: 8px; }
  .step-title { font-family: 'Source Serif 4', serif; font-size: 24px; font-weight: 500; margin-bottom: 6px; letter-spacing: -0.01em; }
  .step-hint { color: var(--ink-mute); font-size: 14px; margin-bottom: 22px; }
  .field-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
  .field-grid.cols-1 { grid-template-columns: 1fr; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-mute); font-weight: 600; }
  .field input, .field select { background: var(--bone); border: 1px solid var(--line); padding: 11px 14px; font-family: 'Inter Tight', system-ui, sans-serif; font-variant-numeric: tabular-nums; font-size: 15px; color: var(--ink); border-radius: 2px; transition: border-color 0.15s ease; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--ink); }
  .field-hint { font-size: 14px; color: var(--ink-faint); }
  .field-hint .helper-trigger { background: none; border: none; color: var(--rust); cursor: pointer; font-size: 14px; text-decoration: underline; padding: 0; font-family: inherit; }
  .step-actions { display: flex; justify-content: center; gap: 12px; margin-top: 28px; }
  .btn-primary { background: var(--ink); color: var(--paper); border: none; padding: 14px 28px; font-size: 15px; font-weight: 600; border-radius: 3px; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 8px; transition: background 0.15s ease; }
  .btn-primary:hover { background: var(--rust); }
  .btn-secondary { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); padding: 14px 22px; font-size: 14px; border-radius: 3px; cursor: pointer; font-family: inherit; }
  .btn-secondary:hover { border-color: var(--ink); }
  .validation-msg { color: var(--danger); font-size: 14px; text-align: center; margin-top: 14px; min-height: 18px; }
</style>
</head>
<style>
  /* ========== DASHBOARD LAYOUT ========== */
  .dashboard { display: grid; grid-template-columns: 360px 1fr; grid-template-areas: "sidebar main" "resources resources"; min-height: calc(100vh - 73px); }
  .resources-row { grid-area: resources; border-top: 1px solid var(--line); padding: 22px 32px 30px; text-align: center; }
  .sidebar { grid-area: sidebar; background: var(--paper); border-right: 1px solid var(--line); padding: 22px 20px; overflow-y: auto; }
  .sidebar-section { margin-bottom: 22px; padding-bottom: 22px; border-bottom: 1px solid var(--line-soft); }
  .sidebar-section:last-child { border-bottom: none; }
  
  .sidebar-heading { text-transform: uppercase; letter-spacing: 0.12em; font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
  .sidebar-sub { font-size: 14px; color: var(--ink-mute); margin-bottom: 12px; }
  .preset-btn { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bone); padding: 9px 11px; font-size: 14px; color: var(--ink-soft); margin-bottom: 5px; border-radius: 3px; font-family: inherit; cursor: pointer; transition: border-color 0.15s ease; }
  .preset-btn:hover { border-color: var(--rust); color: var(--ink); }
  .preset-icon { color: var(--rust); font-style: italic; font-family: 'Source Serif 4', serif; margin-right: 5px; }
  .toggle-group { display: flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .toggle-btn { flex: 1; padding: 7px 4px; font-size: 14px; text-align: center; border: none; cursor: pointer; font-family: inherit; background: var(--bone); color: var(--ink-mute); transition: all 0.12s ease; }
  .toggle-btn:hover { background: var(--bone-2); }
  .toggle-btn.active { background: var(--ink); color: var(--paper); }
  .control { margin-bottom: 14px; }
  .control-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
  .control-label { color: var(--ink-soft); flex: 1; font-size: inherit; }
  .control-value { font-size: 14px; font-weight: 500; color: var(--ink); font-family: 'Inter Tight', system-ui, sans-serif; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .control input[type=range] { width: 100%; height: 4px; -webkit-appearance: none; appearance: none; background: var(--line); border-radius: 2px; outline: none; }
  .control input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--ink); border-radius: 50%; cursor: pointer; transition: background 0.12s; }
  .control input[type=range]::-webkit-slider-thumb:hover { background: var(--rust); }
  .control input[type=range]::-moz-range-thumb { width: 16px; height: 16px; background: var(--ink); border-radius: 50%; cursor: pointer; border: none; }
  .control input[type=number] { width: 100%; background: var(--bone); border: 1px solid var(--line); padding: 7px 9px; font-family: 'Inter Tight', system-ui, sans-serif; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--ink); border-radius: 2px; }
  .control input[type=number]:focus { outline: none; border-color: var(--ink); }
  .help-mark { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; min-width: 15px; border-radius: 50%; border: 1px solid var(--line); color: var(--ink-mute); font-size: 10px; font-style: italic; margin-left: 4px; cursor: help; font-family: 'Source Serif 4', serif; vertical-align: middle; overflow: hidden; box-sizing: border-box; }
  #tip-popup { position: fixed; z-index: 9999; background: var(--ink); color: var(--paper); font-size: 13px; padding: 6px 10px; border-radius: 4px; max-width: 260px; line-height: 1.4; pointer-events: none; display: none; font-family: inherit; }
  .more-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 3px; background: var(--bone); padding: 7px 10px; font-size: 14px; color: var(--ink-soft); font-family: inherit; cursor: pointer; font-weight: 600; }
  .more-toggle:hover { border-color: var(--ink-mute); color: var(--ink); }
  .more-toggle-chevron { font-size: 14px; color: var(--ink-mute); transition: transform 0.15s; }
  .more-hint { font-size: 14px; color: var(--ink-mute); margin-top: 5px; padding: 0 2px; letter-spacing: 0.01em; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .checkbox-row input { width: 14px; height: 14px; accent-color: var(--ink); }
  .checkbox-row label { font-size: 14px; color: var(--ink-soft); cursor: pointer; }
  .acct-grid { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; }
  .acct-grid label { font-size: 14px; color: var(--ink-soft); }
  .acct-grid input { width: 110px; background: var(--bone); border: 1px solid var(--line); padding: 6px 8px; font-family: 'Inter Tight', system-ui, sans-serif; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--ink); border-radius: 2px; text-align: right; }

  /* ========== MAIN ========== */
  .main { grid-area: main; padding: 24px 32px; overflow-y: auto; max-width: 1100px; }
  .disclaimer-bar { background: var(--bone-2); border: 1px solid var(--line); border-radius: 4px; padding: 10px 16px; font-size: 14px; line-height: 1.5; color: var(--ink-mute); margin-bottom: 18px; }
  .disclaimer-bar strong { color: var(--ink-soft); font-weight: 600; }
  .disclaimer-bar a { color: var(--rust); cursor: pointer; }
  .impact-banner { background: var(--bone-2); border-radius: 4px; padding: 11px 16px; font-size: 14px; color: var(--ink-soft); line-height: 1.6; margin-bottom: 16px; }
  .impact-banner strong { color: var(--ink); }
  .impact-banner button { background: none; border: none; color: var(--rust); cursor: pointer; font-family: inherit; font-size: 14px; text-decoration: underline; padding: 0; }

  /* Verdict */
  .verdict { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 20px 24px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
  .verdict-notes { margin: 0 4px 22px; font-size: 14px; color: var(--ink-soft); line-height: 1.6; }
  .verdict-notes p { margin-bottom: 8px; }
  .verdict-notes .verdict-caveat { margin-top: 0; }
  .verdict-head { font-family: 'Source Serif 4', serif; font-size: 26px; font-weight: 400; color: var(--ink); line-height: 1.25; margin-bottom: 10px; letter-spacing: -0.01em; }
  .verdict-body { font-size: 15px; color: var(--ink-soft); line-height: 1.6; }
  .verdict-caveat { font-size: 14px; color: var(--ink-faint); margin-top: 10px; font-style: italic; }
  .verdict-wedge { margin-top: 10px; padding: 12px 16px; background: rgba(184,92,56,0.06); border-left: 3px solid var(--rust); border-radius: 0 4px 4px 0; font-size: 15px; color: var(--ink); line-height: 1.5; }
  .verdict-wedge .wedge-amount { font-family: 'Inter Tight', system-ui, sans-serif; font-variant-numeric: tabular-nums; font-weight: 500; color: var(--rust); font-size: 16px; }
  .verdict-wedge .wedge-sub { font-size: 14px; color: var(--ink-mute); margin-top: 4px; }

  .toggle-btn.locked { opacity: 0.7; }
  .toggle-btn.locked .lock-icon { font-size: 14px; margin-left: 3px; }
  /* Free-tier preview of paid settings: visible but non-interactive */
  .locked-note { margin: 8px 0; padding: 8px 10px; background: var(--bone-2); border-left: 2px solid var(--rust); border-radius: 3px; font-size: 14px; color: var(--ink-soft); line-height: 1.5; }
  .link-btn { background: none; border: none; color: var(--rust); cursor: pointer; font-family: inherit; font-size: 14px; text-decoration: underline; padding: 0; }
  .locked-preview { border: none; padding: 0; margin: 0; min-width: 0; opacity: 0.5; pointer-events: none; }
  .unlock-input-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .unlock-input-row input { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 3px; font-family: 'Inter Tight', system-ui, sans-serif; font-variant-numeric: tabular-nums; font-size: 14px; background: var(--paper); }
  .unlock-input-row button { padding: 10px 16px; background: var(--rust); color: var(--paper); border: none; border-radius: 3px; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer; }
  .unlock-input-row button:hover { background: var(--rust-deep); }
  /* Free vs Pro comparison (unlock modal) */
  .compare-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .compare-col { border: 1px solid var(--line); border-radius: 5px; padding: 14px 16px; background: var(--bone); min-width: 0; }
  .compare-col.pro { border-color: var(--rust); background: rgba(184,92,56,0.05); }
  .compare-head { font-family: 'Source Serif 4', serif; font-size: 17px; font-weight: 600; color: var(--ink); }
  .compare-col.pro .compare-head { color: var(--rust-deep); }
  .compare-sub { font-size: 14px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
  .compare-plus { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  .compare-list { list-style: none; margin: 0; padding: 0; }
  .compare-list li { font-size: 14px; color: var(--ink-soft); line-height: 1.4; padding: 6px 0 6px 18px; position: relative; border-top: 1px solid var(--line-soft); }
  .compare-list li:first-child { border-top: none; }
  .compare-list li::before { content: '\2713'; position: absolute; left: 0; top: 6px; color: var(--moss); font-weight: 700; }
  .compare-col.pro .compare-list li::before { color: var(--rust); }

  /* Unlock modal improvements */
  .modal h2 { color: var(--ink); }
  .modal ul { list-style: none; padding: 0; }
  .modal ul li { position: relative; padding-left: 20px; }
  .modal ul li:before { content: "✓"; position: absolute; left: 0; color: var(--moss); font-weight: 600; }

  /* Sections */
  .section-heading { font-family: 'Source Serif 4', serif; font-size: 18px; font-weight: 500; color: var(--ink); margin: 26px 0 4px; }
  .section-sub { font-size: 14px; color: var(--ink-mute); line-height: 1.5; margin-bottom: 14px; }

  /* Confidence bands */
  .bands { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .band { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; }
  .band-label { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 2px; }
  .band-sub { font-size: 14px; color: var(--ink-mute); margin-bottom: 8px; }
  .band-value { font-size: 17px; font-weight: 600; font-family: 'Inter Tight', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .band.warn .band-value { color: var(--danger); }
  .band.ok .band-value { color: var(--moss); }
  .band.neutral .band-value { color: var(--ink-soft); }

  /* Chart */
  .chart-card { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 18px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
  .chart-wrap { position: relative; height: 360px; }
  .chart-wrap.short { height: 200px; }

  /* Tables */
  .data-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 18px; }
  .data-table th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); color: var(--ink-mute); font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em; }
  .data-table td { padding: 8px 10px; border-bottom: 1px solid var(--line-soft); color: var(--ink-soft); }
  .data-table tr.current-row { background: var(--bone-2); }
  .data-table .tag-current { display: inline-block; background: var(--rust); color: var(--paper); font-size: 14px; padding: 1px 6px; border-radius: 2px; margin-left: 6px; vertical-align: 1px; font-weight: 600; }
  .data-table .fail { color: var(--danger); font-weight: 600; }
  .data-table .clickable { cursor: pointer; }
  .data-table .clickable:hover { background: var(--bone-2); }

  /* Stress cards */
  .scenario-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .scenario-card { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; cursor: pointer; transition: border-color 0.15s ease; }
  .scenario-card:hover { border-color: var(--rust); }
  .scenario-card.failed { border-left: 3px solid var(--danger-soft); }
  .scenario-card.survived { border-left: 3px solid var(--moss); }
  .scenario-name { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 2px; }
  .scenario-years { font-size: 14px; color: var(--ink-mute); margin-bottom: 5px; font-family: 'Inter Tight', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .scenario-result { font-size: 14px; font-weight: 600; }
  .scenario-result.ok { color: var(--moss); }
  .scenario-result.fail { color: var(--danger); }
  .scenario-desc { font-size: 14px; color: var(--ink-mute); margin-top: 5px; line-height: 1.4; }
  .scenario-card.add { border-style: dashed; display: flex; align-items: center; justify-content: center; color: var(--ink-faint); font-size: 14px; }

  /* Flexibility */
  .flex-box { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 16px 20px; margin-bottom: 10px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; text-align: center; }
  .flex-label { font-size: 14px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .flex-value { font-size: 18px; font-weight: 600; font-family: 'Inter Tight', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .flex-arrow { font-size: 20px; color: var(--rust); }
  .flex-note { font-size: 14px; color: var(--ink-mute); line-height: 1.5; margin-bottom: 18px; }

  /* SS comparison */
  .ss-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
  .ss-card { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 14px; text-align: center; cursor: pointer; transition: border-color 0.15s ease; }
  .ss-card:hover { border-color: var(--rust); }
  .ss-card.highlight { border: 2px solid var(--moss); }
  .ss-age { font-family: 'Source Serif 4', serif; font-size: 26px; font-weight: 500; color: var(--ink); }
  .ss-label { font-size: 14px; color: var(--ink-mute); margin: 2px 0 8px; text-transform: uppercase; letter-spacing: 0.08em; }
  .ss-benefit { font-size: 14px; color: var(--ink-soft); margin-bottom: 4px; font-family: 'Inter Tight', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .ss-success { font-size: 14px; font-weight: 600; }

  /* Assumptions + resources */
  .resources-row { padding: 0 !important; }
  .faq-toggle { width: 100%; background: none; border: none; padding: 18px 32px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; font-family: inherit; }
  .faq-toggle:hover .faq-toggle-label { color: var(--ink); }
  .faq-toggle-label { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-mute); }
  .faq-toggle-chevron { font-size: 14px; color: var(--ink-mute); }
  .faq-inner { padding: 8px 32px 32px; }

function calcAnnualMortgagePayment(balance, annualRate, years) {
  const r = annualRate / 12;
  const n = years * 12;
  if (r === 0) return balance / years;
  return balance * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1) * 12;
}

// DYNAMIC PRESETS
// ============================================================================
function generatePresets(s) {
  const presets = [];
  const yearsToRetire = s.yourStopWorkAge - s.age;

  // ---- Time off and saving (the decisions this tool was built for) ----
  if (s.yourIncome > 0 && yearsToRetire > 2) {
    presets.push({ id: 'careerBreak', label: has(s.yourBreakStart) ? 'Change my time off' : 'Take time off, then go back' });
  }
  if (s.hasPartner && s.partnerIncome > 0 && s.partnerStopWorkAge - s.partnerAge > 2) {
    presets.push({ id: 'partnerBreak', label: has(s.partnerBreakStart) ? 'Change my partner’s time off' : 'Partner takes time off' });
  }
  presets.push({ id: 'spendMore', label: has(s.extraSpendStart) ? 'Change the extra spending' : 'Spend more for a while' });
  if (s.housing > 0 || has(s.homeSaleAge)) presets.push({ id: 'sellHouse', label: has(s.homeSaleAge) ? 'Change the house sale' : 'Sell the house later' });
  if (s.housing > 0 && s.mortgagePayoffAge > s.age + 2 && !(s.mortgageBalance > 0)) {
    presets.push({ id: 'payoffHouse', label: 'Pay off the house early' });
  }
  presets.push({ id: 'shockAtRetirement', label: s.shockEra ? 'Change the bad decade' : ((s.yourIncome > 0 && s.yourStopWorkAge > s.age) ? 'A bad decade starts when I stop working' : 'A bad decade starts now') });

  // ---- User's own work situation ----
  if (s.yourIncome > 0 && s.age < 60 && yearsToRetire > 0) {
    presets.push({ id: 'stopNow', label: 'I stop working now' });
  }
  // "Retire early" only makes sense with enough runway; close to retirement, "work longer" is the useful contrast
  if (s.yourIncome > 0 && s.age < 58 && yearsToRetire > 5) {
    presets.push({ id: 'retire5early', label: 'Retire 5 years early' });
  }
  if (s.yourIncome > 0 && (yearsToRetire > 2 || s.yourPartTimeAmount > 0)) {
    presets.push({ id: 'partTime', label: s.yourPartTimeAmount > 0 ? 'Change part-time' : 'Go part-time for a while' });
  }
  if (s.yourIncome > 0 && yearsToRetire <= 5 && s.yourStopWorkAge < 70) {
    presets.push({ id: 'work2more', label: 'Work 2 more years' });
  }

  // ---- Partner work situation ----
  // Both working — offer retiring together
  if (s.yourIncome > 0 && s.hasPartner && s.partnerIncome > 0) {
    presets.push({ id: 'bothRetire', label: 'We both retire now' });
  }
  // Partner is working-age but never had income or SS — could start
  if (s.hasPartner && s.partnerIncome === 0 && s.partnerSSAmount === 0 && s.partnerAge < 58) {
    presets.push({ id: 'partnerStarts', label: 'Partner starts working' });
  }
  // Partner is currently working — offer retiring them
  if (s.hasPartner && s.partnerIncome > 0 && s.partnerStopWorkAge > s.partnerAge) {
    presets.push({ id: 'partnerRetires', label: 'Partner retires now' });
  }
  // Partner had a career and has since retired — offer returning
  if (s.hasPartner && s.partnerIncome === 0 && s.partnerSSAmount > 0 && s.partnerStopWorkAge <= s.partnerAge) {
    presets.push({ id: 'partnerReturns', label: 'Partner returns to work' });
  }

  // ---- Always ----
  presets.push({ id: 'maxSpend', label: 'What can I spend?' });

  // ---- Social Security ----
  if (s.ssStartAge !== 70 && (s.yourSSAmount > 0 || s.partnerSSAmount > 0)) {
    presets.push({ id: 'delaySS', label: 'Delay Social Security to 70' });
  }
  if (s.ssStartAge > 62 && s.age >= 55 && (s.yourSSAmount > 0 || s.partnerSSAmount > 0)) {
    presets.push({ id: 'earlySS', label: 'Claim Social Security at 62' });
  }

  // ---- Presets with invented dollar amounts (flag-gated, see FLAGS) ----
  if (FLAGS.hardcodedPresets) {
    if (s.housing > 0 && s.age < 72) presets.push({ id: 'sellHome', label: 'Sell the home at 70' });
    if (s.age > 45) presets.push({ id: 'ltc', label: 'Add long-term care at 85' });
  }

  return presets.slice(0, 7);
}
function presetLabel(id) { const p = generatePresets(state).find(x => x.id === id); return p ? p.label : id; }

// FORMATTING
// ============================================================================
function fmtMoney(n) {
  if (n === null || n === undefined || isNaN(n)) return '\u2014';
  const r = Math.round(n);
  return '$' + r.toLocaleString('en-US');
}
function fmtMoneyShort(n) {
  if (n === null || n === undefined || isNaN(n)) return '\u2014';
  const a = Math.abs(n);
  if (a >= 1e6) return (n < 0 ? '-' : '') + '$' + (a / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M';
  if (a >= 1e3) return (n < 0 ? '-' : '') + '$' + Math.round(a / 1e3) + 'k';
  return fmtMoney(n);
}
function periodsLabel(result) {
  if (result.mode === 'historical') return result.successCount + ' of ' + result.totalPeriods + ' historical periods';
  if (result.mode === 'montecarlo') return Math.round(result.successRate * 100) + '% of ' + result.mcSims + ' simulated futures';
  return result.successRate >= 1 ? 'lasts to age ' + state.targetAge : 'runs out at age ' + result.medianRunOutAge;
}
function succLabel(r) {
  if (!r) return '';
  return r.mode === 'historical' ? r.successCount + '/' + r.totalPeriods : r.mode === 'montecarlo' ? Math.round(r.successRate * 100) + '%' : (r.successRate >= 1 ? 'lasts' : 'runs out');
}
function modeName(m) { return m === 'historical' ? 'Historical' : m === 'montecarlo' ? 'Simulated' : 'Fixed'; }
const SHOCK_ERAS = [['dotcom', '2000 to 2009'], ['depression', '1929 to 1938'], ['stagflation', '1969 to 1978']];
function shockLabel(id) { const e = SHOCK_ERAS.find(x => x[0] === id); return e ? e[1] : (id || 'none'); }
function shockSentence(unit) { return state.shockEra && has(state.shockAge) ? ' From age ' + state.shockAge + ', every ' + unit + ' gets the real ' + shockLabel(state.shockEra) + ' returns for ten years, so the count answers what happens if that decade hits right then.' : ''; }
function mixLabel() { return Math.round(state.stockPct * 100) + '/' + Math.round((1 - state.stockPct) * 100); }

const tipEl = document.getElementById('tip-popup');
function wireTooltips() {
  document.querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('mouseenter', e => {
      tipEl.textContent = el.dataset.tip;
      tipEl.style.display = 'block';
      positionTip(e);
    });
    el.addEventListener('mousemove', positionTip);
    el.addEventListener('mouseleave', () => { tipEl.style.display = 'none'; });
  });
}
function positionTip(e) {
  const pad = 12, tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  let x = e.clientX + pad, y = e.clientY - th - pad;
  if (x + tw > window.innerWidth - pad) x = e.clientX - tw - pad;
  if (y < pad) y = e.clientY + pad;
  tipEl.style.left = x + 'px';
  tipEl.style.top = y + 'px';
}

function num(id) { const el = document.getElementById(id); const v = parseFloat(el && el.value); return isNaN(v) ? 0 : v; }

window.finishOnboarding = function() {
  const age = num('ob_age');
  const portfolio = num('ob_portfolio');
  const mortgage = num('ob_housing');
  const spending = num('ob_spending') > 0 ? Math.max(0, num('ob_spending') - mortgage) : 0; // spending excludes the mortgage payment internally
  if (age < 18) { document.getElementById('ob_validation').textContent = 'Please enter your age to continue.'; return; }
  if (portfolio <= 0) { document.getElementById('ob_validation').textContent = 'Enter your portfolio value to get started.'; return; }

  state.age = age;
  const pAge = num('ob_partnerAge');
  state.partnerAge = pAge;
  state.hasPartner = pAge >= 18;
  state.portfolio = portfolio;
  state.spending = spending;
  state.lateSpending = spending > 0 ? Math.round(spending * 0.85) : 0;
  state.slowDownAge = 75;
  state.yourIncome = num('ob_yourIncome');
  state.partnerIncome = num('ob_partnerIncome');
  state.housing = mortgage;
  state.mortgagePayoffAge = num('ob_mortgagePayoff') || 60;
  state.yourSSAmount = num('ob_yourSS');
  state.partnerSSAmount = num('ob_partnerSS');
  state.yourBreakStart = state.yourBreakEnd = state.partnerBreakStart = state.partnerBreakEnd = null;
  state.contribPauseStart = state.contribPauseEnd = null;
  state.extraSpend = 0; state.extraSpendStart = state.extraSpendEnd = null;
  state.shockEra = null; state.shockAge = null;
  state.yourPartTimeAmount = 0; state.partnerPartTimeAmount = 0;
  // Reset any preset-derived state (home sale, life events) so nothing carries over
  state.homeSaleAge = null;
  state.homeSaleProceeds = 0; state.postSaleHousing = 0; state.postPayoffSpend = 0;
  state.oneTimeEvents = [];
  // Auto-estimate tax rates from income: the wage rate includes payroll tax, the
  // retirement rate (traditional withdrawals, half of SS) is federal + state only.
  applyEstimatedTaxRates();
  if (state.yourStopWorkAge < state.age) state.yourStopWorkAge = Math.max(state.age + 1, 65);
  if (state.partnerStopWorkAge < state.partnerAge) state.partnerStopWorkAge = Math.max(state.partnerAge + 1, 65);

  // The first thing a stranger sees is the range, not a single line.
  state.simMode = 'historical';

  // If spending was left blank, find the most they could spend and still make it through
  // at least 85% of history (steady spending, guardrails off), with the 85% late-life ratio.
  if (spending <= 0) {
    const ms = findMaxSpendAtSuccess({ ...state, spending: 100000, lateSpending: 85000 });
    state.spending = Math.round(ms.spend / 1000) * 1000;
    state.lateSpending = Math.round(state.spending * 0.85);
    maxSpendView = true;
  }

  activeView = 'dashboard';
  maxSpendStale = true; spendingLevelsStale = true;
  baselineState = JSON.parse(JSON.stringify(state));
  baselineResult = null; baselineName = 'Starting point'; currentName = 'Current'; compareOn = false;
  track('ran_model');
  render();
  runPendingScenario();
};

function renderDashboard() {
  // Free users see Historical only; Fixed and Simulated live under More options (Pro).
  if (!isPaid() && state.simMode !== 'historical') { state.simMode = 'historical'; }
  const result = runForState(state);
  lastSimResult = result;
  // The baseline is always re-run in the CURRENT mode so deltas and the side-by-side
  // compare like with like, even if the saved baseline used another mode.
  baselineResult = baselineState ? runForState({ ...baselineState, simMode: state.simMode }) : result;
  const canCompare = compareOn && isPaid() && !!baselineState;
  const verdict = getVerdict(result);
  const presets = generatePresets(state);

  const sidebar = `
    <aside class="sidebar" role="complementary" aria-label="Planning controls">
      <div class="sidebar-section">
        <div class="sidebar-heading">Try a scenario</div>
        ${presets.map(p => `<button class="preset-btn" onclick="applyPreset('${p.id}')">${p.label}</button>`).join('')}
        ${renderSidebarImpact()}
      </div>

      <div class="sidebar-section">
        <div class="sidebar-heading">Your plan</div>
        ${state.simMode==='fixed' ? `<div class="control">
          <div class="control-row"><span class="control-label">Real return<span class="help-mark" data-tip="Return after inflation. 5% real ≈ 7-8% nominal.">i</span></span><span class="control-value">${(state.returnRate*100).toFixed(1)}%</span></div>
          <input type="range" min="0" max="10" step="0.25" value="${state.returnRate*100}" oninput="slideLive(this,'returnRate',this.value/100)" onchange="sliderCommit('returnRate',this.value/100)" class="slider-input"/>
          <input type="number" min="0" max="10" step="0.25" value="${(state.returnRate*100).toFixed(2)}" oninput="slideLive(this,'returnRate',this.value/100)" onchange="sliderCommit('returnRate',this.value/100)" placeholder="%" class="mobile-input"/>
        </div>` : ''}
        <div class="control">
          <div class="control-row"><span class="control-label">Portfolio</span><span class="control-value">${fmtMoney(state.portfolio)}</span></div>
          <input type="range" min="0" max="5000000" step="10000" value="${state.portfolio}" oninput="slideLive(this,'portfolio',this.value)" onchange="sliderCommit('portfolio',this.value)" class="slider-input"/>
          <input type="number" min="0" max="5000000" step="10000" value="${state.portfolio}" oninput="slideLive(this,'portfolio',this.value)" onchange="sliderCommit('portfolio',this.value)" placeholder="Amount" class="mobile-input"/>
        </div>
        <div class="control">
          <div class="control-row"><span class="control-label">Spending, all in${state.housing > 0 ? '<span class="help-mark" data-tip="Includes your ' + fmtMoney(state.housing) + ' a year mortgage payment until it is paid off at ' + state.mortgagePayoffAge + '.">i</span>' : ''}</span><span class="control-value">${fmtMoney(state.spending + state.housing)}</span></div>
          <input type="range" min="${10000 + state.housing}" max="${400000 + state.housing}" step="1000" value="${state.spending + state.housing}" oninput="slideLive(this,'totalSpending',this.value)" onchange="sliderCommit('totalSpending',this.value)" class="slider-input"/>
          <input type="number" min="${10000 + state.housing}" max="${400000 + state.housing}" step="1000" value="${state.spending + state.housing}" oninput="slideLive(this,'totalSpending',this.value)" onchange="sliderCommit('totalSpending',this.value)" placeholder="Annual amount" class="mobile-input"/>
        </div>
        <div class="control">
          <div class="control-row"><span class="control-label">Your income</span><span class="control-value">${fmtMoney(state.yourIncome)}</span></div>
          <input type="range" min="0" max="500000" step="5000" value="${state.yourIncome}" oninput="slideLive(this,'yourIncome',this.value)" onchange="sliderCommit('yourIncome',this.value)" class="slider-input"/>
          <input type="number" min="0" max="500000" step="5000" value="${state.yourIncome}" oninput="slideLive(this,'yourIncome',this.value)" onchange="sliderCommit('yourIncome',this.value)" placeholder="Annual income" class="mobile-input"/>
        </div>
        ${state.hasPartner ? `<div class="control">
          <div class="control-row"><span class="control-label">Partner's income</span><span class="control-value">${fmtMoney(state.partnerIncome)}</span></div>
          <input type="range" min="0" max="500000" step="5000" value="${state.partnerIncome}" oninput="slideLive(this,'partnerIncome',this.value)" onchange="sliderCommit('partnerIncome',this.value)" class="slider-input"/>
          <input type="number" min="0" max="500000" step="5000" value="${state.partnerIncome}" oninput="slideLive(this,'partnerIncome',this.value)" onchange="sliderCommit('partnerIncome',this.value)" placeholder="Annual income" class="mobile-input"/>
        </div>` : ''}
        ${state.yourIncome > 0 ? `<div class="control">
          <div class="control-row"><span class="control-label">${state.yourPartTimeAmount > 0 && state.yourStopWorkAge === state.yourPartTimeStart ? 'Full-time ends at' : 'Your retirement age'}</span><span class="control-value">${state.yourStopWorkAge}</span></div>
          <input type="range" min="${Math.max(state.age,40)}" max="80" step="1" value="${state.yourStopWorkAge}" oninput="slideLive(this,'yourStopWorkAge',this.value)" onchange="sliderCommit('yourStopWorkAge',this.value)" class="slider-input"/>
          <input type="number" min="${Math.max(state.age,40)}" max="80" step="1" value="${state.yourStopWorkAge}" oninput="slideLive(this,'yourStopWorkAge',this.value)" onchange="sliderCommit('yourStopWorkAge',this.value)" placeholder="Age" class="mobile-input"/>
        </div>` : ''}
        ${(state.hasPartner && state.partnerIncome > 0) ? `<div class="control">
          <div class="control-row"><span class="control-label">Partner's retirement age</span><span class="control-value">${state.partnerStopWorkAge}</span></div>
          <input type="range" min="${Math.max(state.partnerAge,40)}" max="80" step="1" value="${state.partnerStopWorkAge}" oninput="slideLive(this,'partnerStopWorkAge',this.value)" onchange="sliderCommit('partnerStopWorkAge',this.value)" class="slider-input"/>
          <input type="number" min="${Math.max(state.partnerAge,40)}" max="80" step="1" value="${state.partnerStopWorkAge}" oninput="slideLive(this,'partnerStopWorkAge',this.value)" onchange="sliderCommit('partnerStopWorkAge',this.value)" placeholder="Age" class="mobile-input"/>
        </div>` : ''}
      </div>

      <div class="sidebar-section">
        <div class="sidebar-heading">Test against</div>
        <div class="toggle-group">
          <button class="toggle-btn ${state.simMode==='historical'?'active':''}" onclick="setMode('historical')">Historical</button>
          <button class="toggle-btn ${state.simMode==='montecarlo'?'active':''} ${!isPaid()?'locked':''}" onclick="setMode('montecarlo')">Simulated${!isPaid()?'<span class="lock-icon"> &#x1f512;</span>':''}</button>
          <button class="toggle-btn ${state.simMode==='fixed'?'active':''} ${!isPaid()?'locked':''}" onclick="setMode('fixed')">Fixed${!isPaid()?'<span class="lock-icon"> &#x1f512;</span>':''}</button>
        </div>
        <div style="font-size:14px;color:var(--ink-faint);margin-top:6px;line-height:1.5">${state.simMode==='historical'?'Every rolling period of real U.S. market returns since 1926, for your '+mixLabel()+' stock/bond mix.':state.simMode==='montecarlo'?state.mcSims+' randomized futures drawn from a bell curve matched to your mix’s history. Change it under Assumptions.':'One steady real return every year. No range.'}</div>
      </div>

      <div class="sidebar-section">
        <button class="more-toggle" onclick="toggleMore()">
          <span>${showMoreOptions ? 'Fewer options' : 'More options'}${!isPaid()?' <span class="lock-icon">&#x1f512;</span>':''}</span>
          <span class="more-toggle-chevron">${showMoreOptions ? '▾' : '▸'}</span>
        </button>
        ${!showMoreOptions ? `<div class="more-hint">${state.taxRate ? Math.round(state.taxRate*100) : 18}% tax &middot; ${(state.returnRate*100).toFixed(1)}% return &middot; plan to age ${state.targetAge}</div>` : ''}
        ${showMoreOptions ? (isPaid()
          ? moreOptionsHTML()
          : `<div class="locked-note">These settings are part of the paid plan. <button class="link-btn" onclick="showUnlockModal()">Get Pro to adjust \u2192</button></div>
        <fieldset class="locked-preview" disabled>${moreOptionsHTML()}</fieldset>`) : ''}
      </div>


      <div class="sidebar-section">
        <div class="sidebar-heading">Saved scenarios</div>
        ${isPaid()
          ? `<div class="scenario-save-row"><input type="text" id="scenarioName" placeholder="Name this scenario"/><button class="scenario-pill" onclick="saveScenario()">Save</button></div>
        <input type="text" id="scenarioNote" placeholder="A note to yourself (optional)" style="width:100%;margin:-6px 0 10px;background:var(--bone);border:1px solid var(--line);padding:6px 10px;font-size:13px;border-radius:2px;font-family:inherit"/>
        ${savedScenarios.map((sc, i) => `<div class="saved-item"><span>${sc.name}</span><span><button onclick="loadScenario(${i})">load</button> \u00b7 <button onclick="compareWith(${i})" title="Show this scenario next to your current settings">compare</button> \u00b7 <button onclick="deleteScenario(${i})" aria-label="Delete ${sc.name}">\u00d7</button></span></div>${sc.note ? `<div class="saved-note">${sc.note}</div>` : ''}`).join('') || '<div style="font-size:13px;color:var(--ink-faint)">Save a scenario, then use \u201ccompare\u201d to put it next to your current settings.</div>'}`
          : `<button class="more-toggle locked-row" onclick="showUnlockModal()">Save &amp; compare scenarios <span class="lock-icon">&#x1f512;</span></button>`}
      </div>
    </aside>`;

  const notFixed = state.simMode !== 'fixed';
  const main = `
    <div class="main" id="main-content" role="main">
      <div class="print-only print-head"><div class="logo"><span class="logo-dot"></span>Spend Enough</div><div>Scenario report &middot; ${new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}${currentName !== 'Current' ? ' &middot; ' + currentName + ' versus ' + baselineName : ''} &middot; ${modeName(state.simMode)} mode</div></div>
      <div class="verdict" aria-live="polite">
        <div class="verdict-head">${verdict.headline}</div>
        <div class="verdict-body">${verdict.lead}</div>
        ${verdict.wedge ? `<div class="verdict-wedge">In the median outcome you leave <span class="wedge-amount">${verdict.wedge}</span> unspent.<div class="wedge-sub">${verdict.wedgeSub}</div></div>` : ''}
      </div>

      <div class="section-heading">Portfolio projection</div>
      <div class="section-sub">${state.simMode==='historical' ? 'Shaded: where the portfolio stood across all '+result.totalPeriods+' periods, worst 10% to best 10%. Line: the median.' : state.simMode==='montecarlo' ? 'Shaded: the range across '+result.mcSims+' simulated futures, worst 10% to best 10%. Line: the median.' : 'One steady-return path, so no range.'}${canCompare ? ' Dashed line and faint band: ' + baselineName + '.' : ''}</div>
      <div class="chart-card"><div class="chart-wrap"><canvas id="mainChart"></canvas></div></div>
      ${renderEventTimeline()}
      <div class="verdict-notes">
        <p>${verdict.detail}</p>
        ${verdict.caveat ? `<p class="verdict-caveat">${verdict.caveat}</p>` : ''}
      </div>

      ${renderWhatItTakes(result)}

      ${canCompare ? renderCompareSummary(baselineResult, result) : (!isPaid() && computeImpact() ? `<button class="more-toggle locked-row teaser-row" onclick="showUnlockModal()">See “${baselineName}” and “${currentName}” on one chart, with the counts side by side <span class="lock-icon">&#x1f512;</span></button>` : '')}

      <div class="section-heading">Explore spending levels</div>
      <div class="section-sub">Click a row to apply that spending level and see how it changes the projection.${state.housing > 0 ? ' Figures include the ' + fmtMoneyShort(state.housing) + ' a year mortgage payment while it lasts.' : ''}</div>
      ${renderSpendingExplorer()}

      ${renderReadFirst(result)}

      ${renderAssumptions(result)}

      ${isPaid() ? `<details class="deep" ${deepOpen ? 'open' : ''} ontoggle="deepOpen=this.open; if (this.open) setTimeout(() => drawCashflowChart(lastSimResult), 0)">
        <summary>More analysis <span class="asm-hint">best and worst outcomes, stress tests, cashflow, spending flexibility, Social Security timing</span></summary>
        <div class="deep-body">
          ${notFixed ? renderBands(result) : ''}
          ${state.simMode==='historical' ? renderStressTests() : ''}
          <div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:26px">
            <div class="section-heading" style="margin:0">Cashflow</div>
            <div class="toggle-group" style="width:auto">
              <button class="toggle-btn cf-toggle ${cashflowMode==='net'?'active':''}" data-mode="net" onclick="setCashflowMode('net')" style="padding:5px 12px;font-size:14px">Net flow</button>
              <button class="toggle-btn cf-toggle ${cashflowMode==='breakdown'?'active':''}" data-mode="breakdown" onclick="setCashflowMode('breakdown')" style="padding:5px 12px;font-size:14px">Breakdown</button>
            </div>
          </div>
          <div class="section-sub" id="cf-desc">${cashflowMode==='net' ? 'Green bars mean you\'re adding to the portfolio. Red means you\'re drawing from it. Shown for the median path.' : 'Income sources stacked against spending, for the median path. The gap is what comes from or goes to the portfolio.'}</div>
          <div class="chart-card"><div class="chart-wrap short"><canvas id="cashflowChart"></canvas></div></div>
          ${notFixed ? renderFlexibilityImpact() : ''}
          ${notFixed && state.yourSSAmount > 0 ? renderSSComparison() : ''}
          ${notFixed && state.accountsEnabled ? renderTaxComparison() : ''}
          ${renderYearTable(result)}
        </div>
      </details>` : `<button class="more-toggle locked-row teaser-row" onclick="showUnlockModal()"><span>More analysis <span class="asm-hint">best and worst outcomes, stress tests, cashflow, Social Security timing</span></span><span class="lock-icon">&#x1f512;</span></button>`}

      <div class="disclaimer-bar" style="margin-top:22px">These results are an educational model. They are not advice. The tool does not know your full situation, and it treats taxes, Social Security, and healthcare in simplified ways. What you see is a range of outcomes under the assumptions shown, built from past market returns and randomized simulations. Past performance does not predict future results. Before you make a decision based on these numbers, talk to a qualified financial, tax, or legal professional who can look at the whole picture. <a onclick="showFullDisclaimer()">Full disclaimer</a> &middot; <a href="privacy.html">Privacy</a> &middot; <a href="terms.html">Terms</a></div>
    </div>`;

  app.innerHTML = `
    <header role="banner">
      <a href="#main-content" style="position:absolute;left:-9999px;top:auto;padding:8px 16px;background:var(--ink);color:var(--paper);z-index:200;font-size:14px" onfocus="this.style.left='0';this.style.top='0'" onblur="this.style.left='-9999px'">Skip to content</a>
      <a class="logo" href="index.html" style="text-decoration:none;color:inherit"><span class="logo-dot"></span>Spend Enough</a>
      <div class="scenarios-bar">
        <button class="scenario-pill" onclick="resetToDefaults()">\u21ba Reset</button>
        <button class="scenario-pill" onclick="goToOnboarding()">Edit basics</button>
        <button class="scenario-pill" onclick="printReport()">Print report${!isPaid() ? ' <span class="lock-icon">&#x1f512;</span>' : ''}</button>
      </div>
    </header>
    <div class="dashboard">${main}${sidebar}<div class="resources-row">${renderResources()}</div></div>`;

  // Scroll to top only on first dashboard load
  if (isFirstDashboard) { window.scrollTo(0, 0); isFirstDashboard = false; }

  drawMainChart(result, canCompare ? baselineResult : null);
  if (isPaid() && deepOpen) drawCashflowChart(result);

  // Accessibility: auto-label range inputs from nearby control-label
  document.querySelectorAll('.control').forEach(c => {
    const label = c.querySelector('.control-label');
    const input = c.querySelector('input[type=range], input[type=number]');
    if (label && input && !input.getAttribute('aria-label')) {
      input.setAttribute('aria-label', label.textContent.trim());
    }
  });
  // Label clickable table rows
  document.querySelectorAll('.data-table .clickable').forEach(row => {
    row.setAttribute('role', 'button');
    row.setAttribute('tabindex', '0');
    row.addEventListener('keydown', function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.click(); } });
  });
  // Label SS cards
  document.querySelectorAll('.ss-card[onclick]').forEach(card => {
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.addEventListener('keydown', function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.click(); } });
  });
  // Label scenario cards
  document.querySelectorAll('.scenario-card[onclick]').forEach(card => {
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.addEventListener('keydown', function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); this.click(); } });
  });
}

function moreOptionsHTML() {
  const effRate = state.taxRate ? (state.taxRate * 100).toFixed(0) : '18';
  return `
    <div style="margin-top:12px">
      <div class="sidebar-heading" style="margin-top:0">Plan to age</div>
      <div class="control">
        <div class="control-row"><span class="control-label">Target age</span><span class="control-value">${state.targetAge}</span></div>
        <input type="range" min="70" max="110" step="1" value="${state.targetAge}" oninput="slideLive(this,'targetAge',this.value)" onchange="sliderCommit('targetAge',this.value)"/>
      </div>

      <div class="sidebar-heading" style="margin-top:14px">Late-life spending</div>
      <div class="control">
        <div class="control-row"><span class="control-label">After age ${state.slowDownAge}</span><span class="control-value">${fmtMoney(state.lateSpending)}</span></div>
        <input type="range" min="10000" max="400000" step="1000" value="${state.lateSpending}" oninput="slideLive(this,'lateSpending',this.value)" onchange="sliderCommit('lateSpending',this.value)"/>
      </div>
      <div class="control">
        <div class="control-row"><span class="control-label">Changes at age</span><span class="control-value">${state.slowDownAge}</span></div>
        <input type="range" min="55" max="95" step="1" value="${state.slowDownAge}" oninput="slideLive(this,'slowDownAge',this.value)" onchange="sliderCommit('slowDownAge',this.value)"/>
      </div>


      <div class="sidebar-heading" style="margin-top:14px">Income growth</div>
      <div class="control">
        <div class="control-row"><span class="control-label">Real income growth</span><span class="control-value">${(state.yourIncomeGrowth*100).toFixed(1)}%</span></div>
        <input type="range" min="0" max="5" step="0.25" value="${state.yourIncomeGrowth*100}" oninput="updateLive2(this,'yourIncomeGrowth','partnerIncomeGrowth',this.value/100)" onchange="state.partnerIncomeGrowth=this.value/100;sliderCommit('yourIncomeGrowth',this.value/100)"/>
      </div>

      <div class="sidebar-heading" style="margin-top:14px">Mortgage</div>
      <div class="control">
        <div class="control-row"><span class="control-label">Mortgage payment per year</span><span class="control-value">${fmtMoney(state.housing)}</span></div>
        <input type="range" min="0" max="120000" step="1000" value="${state.housing}" oninput="slideLive(this,'housing',this.value)" onchange="sliderCommit('housing',this.value)"/>
      </div>
      <div class="control">
        <div class="control-row"><span class="control-label">Mortgage paid off at age</span><span class="control-value">${state.mortgagePayoffAge}</span></div>
        <input type="range" min="${state.age}" max="90" step="1" value="${state.mortgagePayoffAge}" oninput="slideLive(this,'mortgagePayoffAge',this.value)" onchange="sliderCommit('mortgagePayoffAge',this.value)"/>
      </div>
      ${state.housing > 0 && state.mortgagePayoffAge > state.age + 2 ? `<button onclick="showPayoffModal()" style="margin-top:6px;font-size:14px;color:var(--rust);background:none;border:none;cursor:pointer;padding:2px 0;font-family:inherit">+ Model accelerated payoff \u2192</button>` : ''}

      <div class="sidebar-heading" style="margin-top:14px">Taxes</div>
      <div style="font-size:14px;color:var(--ink-faint);margin-bottom:8px">Used to estimate the tax rates shown under Assumptions, where you can also edit them directly.</div>
      <div class="control">
        <div class="control-row"><span class="control-label">Filing status</span></div>
        <select onchange="updateTax('filingStatus',this.value)" style="width:100%;background:var(--bone);border:1px solid var(--line);padding:6px 8px;font-size:14px;font-family:inherit;border-radius:2px;color:var(--ink)">
          <option value="mfj" ${state.filingStatus==='mfj'?'selected':''}>Married filing jointly</option>
          <option value="single" ${state.filingStatus==='single'?'selected':''}>Single</option>
        </select>
      </div>
      <div class="control" style="margin-top:8px">
        <div class="control-row"><span class="control-label">State</span></div>
        <select onchange="updateTax('stateCode',this.value)" style="width:100%;background:var(--bone);border:1px solid var(--line);padding:6px 8px;font-size:14px;font-family:inherit;border-radius:2px;color:var(--ink)">
          ${Object.keys(STATE_CONFIG).map(k => `<option value="${k}" ${state.stateCode===k?'selected':''}>${STATE_CONFIG[k].name}</option>`).join('')}
        </select>
      </div>
      <div style="font-size:14px;color:var(--ink-mute);margin-top:8px">Estimated rate on wages: <strong style="font-family:'Inter Tight',system-ui,sans-serif;font-variant-numeric:tabular-nums">${effRate}%</strong> &middot; in retirement: <strong style="font-family:'Inter Tight',system-ui,sans-serif;font-variant-numeric:tabular-nums">${Math.round(retirementTaxRate(state)*100)}%</strong></div>

      <div class="sidebar-heading" style="margin-top:14px">Account types</div>
      <div class="checkbox-row"><input type="checkbox" id="cb_accts" ${state.accountsEnabled?'checked':''} onchange="toggleAccounts(this.checked)"/><label for="cb_accts">Separate account types</label></div>
      ${state.accountsEnabled ? (() => {
        const acctTotal = state.accounts.traditional + state.accounts.roth + state.accounts.taxable;
        const mismatch = Math.abs(acctTotal - state.portfolio) > 100;
        return `
        <div class="acct-grid" style="margin-bottom:6px">
          <label>Traditional</label><input type="number" value="${state.accounts.traditional}" min="0" onchange="updateAccount('traditional', +this.value)"/>
          <label>Roth</label><input type="number" value="${state.accounts.roth}" onchange="updateAccount('roth', +this.value)"/>
          <label>Taxable</label><input type="number" value="${state.accounts.taxable}" onchange="updateAccount('taxable', +this.value)"/>
        </div>
        <div style="font-size:13px;margin-bottom:10px;${mismatch?'color:var(--danger)':'color:var(--ink-mute)'}">
          Total: ${fmtMoneyShort(acctTotal)}${mismatch?' (portfolio updated to match)':''}
        </div>
        <div class="control">
          <div class="control-row"><span class="control-label">Withdrawal order</span></div>
          <div class="toggle-group">
            <button class="toggle-btn ${state.withdrawalStrategy==='proportional'?'active':''}" onclick="update('withdrawalStrategy','proportional')">Proportional</button>
            <button class="toggle-btn ${state.withdrawalStrategy==='taxSmart'?'active':''}" onclick="update('withdrawalStrategy','taxSmart')">Tax-aware</button>
          </div>
        </div>`;
      })() : ''}

      <div class="sidebar-heading" style="margin-top:14px">Life events</div>
      <div style="font-size:14px;color:var(--ink-faint);margin-bottom:8px">One-time income or expenses at a specific age. Use negative for costs.</div>
      ${(state.oneTimeEvents || []).map((ev, i) => `<div style="display:flex;gap:6px;align-items:center;margin-bottom:4px;font-size:14px">
        <span style="color:var(--ink-soft);flex:1">${ev.label || 'Event'} at ${ev.age}</span>
        <span style="font-family:'Inter Tight',system-ui,sans-serif;font-variant-numeric:tabular-nums;color:${ev.amount>=0?'var(--moss)':'var(--danger)'}">${fmtMoneyShort(ev.amount)}</span>
        <button onclick="removeEvent(${i})" style="background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:14px;padding:0 2px">\u00d7</button>
      </div>`).join('')}
      <div style="display:grid;grid-template-columns:1fr 52px 96px;gap:4px;margin-top:6px">
        <input type="text" id="ev_label" placeholder="e.g. Inheritance" onkeydown="if(event.key==='Enter')addEvent()" style="min-width:0;font-size:14px;padding:5px 6px;background:var(--bone);border:1px solid var(--line);border-radius:2px;font-family:inherit"/>
        <input type="number" id="ev_age" placeholder="Age" onkeydown="if(event.key==='Enter')addEvent()" style="min-width:0;font-size:14px;padding:5px 4px;background:var(--bone);border:1px solid var(--line);border-radius:2px;text-align:center;font-family:'Inter Tight',system-ui,sans-serif;font-variant-numeric:tabular-nums"/>
        <input type="number" id="ev_amount" placeholder="$" step="10000" onkeydown="if(event.key==='Enter')addEvent()" style="min-width:0;font-size:14px;padding:5px 4px;background:var(--bone);border:1px solid var(--line);border-radius:2px;text-align:right;font-family:'Inter Tight',system-ui,sans-serif;font-variant-numeric:tabular-nums"/>

}

// ===== VERDICT =====
function getVerdict(result) {
  // headline + lead show in the verdict card; detail, caveat and wedge show under the chart.
  const v = { headline: '', lead: '', detail: '', caveat: '' };
  const yc = state.targetAge - state.age + 1;
  const cuts = result.medianRunFlexCuts || 0;
  const flexNote = state.guardrailsEnabled && cuts > 0 ? ' The median path includes spending cuts in ' + cuts + ' year' + (cuts > 1 ? 's' : '') + ' (guardrails are on; see Assumptions).' : '';
  const threshold = Math.round((state.successThreshold || 0.85) * 100);
  if (result.mode === 'historical') {
    const { successCount, totalPeriods, failures, windows } = result;
    const rate = successCount / totalPeriods;
    const tested = 'We ran your plan through every rolling ' + yc + '-year stretch of real U.S. market returns since 1926 for a ' + mixLabel() + ' stock/bond mix: ' + totalPeriods + ' periods, starting ' + windows.firstStart + ' through ' + windows.lastStart + '.' + shockSentence('period');
    if (maxSpendView) {
      v.headline = 'You could spend about ' + fmtMoney(state.spending + state.housing) + ' a year and still make it through ' + successCount + ' of ' + totalPeriods + ' historical periods';
      v.lead = 'This is the highest spending level that lasted to age ' + state.targetAge + ' in at least ' + threshold + '% of history, with steady spending and no cuts' + (state.housing > 0 ? ', including the mortgage payment while it lasts' : '') + '.';
      v.detail = tested + ' The spending explorer below shows how the count moves if you spend a little more or less.';
    } else if (successCount === totalPeriods) {
      v.headline = 'This plan lasted through every historical period since 1926';
      v.lead = 'That includes periods starting in the Great Depression, the 1970s, and 2000.';
      v.detail = tested + flexNote + ' Surviving every period, including 1929, usually means there is room to spend more.';
    } else {
      v.headline = 'This plan lasted in ' + successCount + ' of ' + totalPeriods + ' historical periods';
      const failCount = totalPeriods - successCount;
      const worst = failures[0];
      v.lead = 'In ' + failCount + ' period' + (failCount > 1 ? 's' : '') + ' the portfolio ran out before age ' + state.targetAge + (worst ? '. The hardest started in ' + worst.label.split('–')[0] + ' and ran out around age ' + worst.ranOutAge + '.' : '.');
      v.detail = tested + (failCount > 1 ? ' Among the periods that failed, half had run out by age ' + result.medianRunOutAge + '.' : '') + flexNote;
      if (rate >= 0.85) v.detail += ' Failures cluster around retiring into a long downturn.';
      else if (rate >= 0.6) v.detail += ' At this spending level the outcome depends heavily on which market you retire into.';
      else v.detail += ' This spending level is risky by historical standards. Try a lower level in the spending explorer.';
    }
    v.caveat = 'Past performance does not predict future results. These ' + totalPeriods + ' periods overlap heavily, and all of them come from one country’s history.';
  } else if (result.mode === 'montecarlo') {
    const rate = result.successRate;
    const src = mcParams(state).fromHistory ? 'the historical figures for your ' + mixLabel() + ' mix' : 'figures you set';
    v.headline = 'The portfolio lasted to age ' + state.targetAge + ' in ' + Math.round(rate * 100) + '% of ' + result.mcSims + ' simulated futures';
    v.lead = 'The median ending balance was ' + fmtMoneyShort(result.medianFinal) + '.';
    v.detail = (maxSpendView ? fmtMoney(state.spending + state.housing) + ' a year is the most that made it through ' + threshold + '% of history. ' : '') + 'Each of the ' + result.mcSims + ' futures draws every year’s return from a bell curve with ' + pct(result.mcSd, 1) + ' volatility around a ' + pct(result.mcMean, 1) + ' average real return (' + src + ').' + flexNote;
    v.caveat = 'Each year’s return is picked at random from a bell curve around the average. Bad years come in runs only as often as chance would put them there, and the worst years are milder than the worst real ones. The two counts usually land close together. When they are far apart, the plan is close enough to the edge that a small change in how the market behaves changes the answer.';
  } else {
    const lasts = result.successRate >= 1;
    const r = pct(state.returnRate, 1);
    if (maxSpendView) {
      v.headline = 'At a steady ' + r + ' return, the most you could spend is about ' + fmtMoney(state.spending + state.housing) + ' a year';
      v.lead = lasts ? 'This is the highest annual spending that keeps the portfolio going to age ' + state.targetAge + ' if returns were the same every year.' : 'At a steady ' + r + ' return the portfolio would run out around age ' + result.medianRunOutAge + '.';
      v.detail = 'Real markets are not steady, and bad years early on can sink a plan whose average is fine. Switch to Historical mode to see how this level held up in real sequences.';
    } else {
      v.headline = lasts ? 'At a steady ' + r + ' return, the portfolio lasts past age ' + state.targetAge : 'At a steady ' + r + ' return, the portfolio runs out around age ' + result.medianRunOutAge;
      v.lead = lasts ? 'Ending balance at age ' + state.targetAge + ' would be about ' + fmtMoneyShort(result.medianFinal) + '.' : 'The same return every year is assumed.';
      v.detail = 'This assumes the same return every year, so it hides sequence-of-returns risk. Historical mode runs the same plan through every real market stretch since 1926.' + flexNote;
    }
    v.caveat = 'A steady return hides the good and bad years. Historical mode shows them.';
  }
  if (!maxSpendView && result.medianFinal > 10000) {
    v.wedge = fmtMoneyShort(result.medianFinal);
    if (result.mode === 'historical') v.wedgeSub = 'Half of the ' + result.totalPeriods + ' historical periods ended with more than this at age ' + state.targetAge + ', half with less. The spending explorer below shows what happens to the count if you spend some of it now.';
    else if (result.mode === 'montecarlo') v.wedgeSub = 'Half of the simulated futures ended with more than this at age ' + state.targetAge + ', half with less.';
    else v.wedgeSub = 'At a steady ' + pct(state.returnRate, 1) + ' return, this is what you would have left at age ' + state.targetAge + '.';
  }
  return v;
}

const IMPACT_FIELDS = () => ({ spending: 'Spending (besides the mortgage)', lateSpending: 'Late-life spending', yourStopWorkAge: state.yourIncome > 0 ? 'Your retirement age' : null, partnerStopWorkAge: "Partner's retirement age", yourIncome: 'Your income', partnerIncome: "Partner's income", portfolio: 'Portfolio', ssStartAge: 'SS start age', mortgagePayoffAge: 'Mortgage payoff age', housing: 'Mortgage payment', targetAge: 'Plan to age', returnRate: 'Steady return', stockPct: 'Stocks', feeRate: 'Fees', guardrailsEnabled: 'Guardrails', taxRate: 'Wage tax', capGainsTax: 'Withdrawal tax', yourBreakStart: 'Break starts', yourBreakEnd: 'Back to work', partnerBreakStart: 'Partner break starts', partnerBreakEnd: 'Partner back to work', extraSpend: 'Extra spending', extraSpendStart: 'Extra spending from', extraSpendEnd: 'Extra spending until', postPayoffSpend: 'Freed payment spent', homeSaleAge: 'House sold at', homeSaleProceeds: 'Sale proceeds', postSaleHousing: 'Housing after sale', shockEra: 'Bad decade', shockAge: 'Bad decade starts', yourPartTimeAmount: 'Part-time income', yourPartTimeStart: 'Part-time from', yourPartTimeEnd: 'Part-time until' });
function fmtField(k, v) {
  if (v === null || v === undefined) return 'none';
  if (k === 'shockEra') return shockLabel(v);
  if (['spending','lateSpending','portfolio','yourIncome','partnerIncome','housing','extraSpend','yourPartTimeAmount','postPayoffSpend','homeSaleProceeds','postSaleHousing'].includes(k)) return v > 0 ? fmtMoneyShort(v) : (k === 'postSaleHousing' ? '$0' : 'none');
  if (['returnRate','stockPct'].includes(k)) return pct(v, k === 'stockPct' ? 0 : 1);
  if (k === 'feeRate') return pct(v, 2);
  if (['taxRate','capGainsTax'].includes(k)) return pct(v, 0);
  if (k === 'guardrailsEnabled') return v ? 'on' : 'off';
  return String(v);
}
function computeImpact() {
  if (!baselineState || !baselineResult) return null;
  const fields = IMPACT_FIELDS();
  const changes = [];
  for (const k in fields) {
    if (!fields[k]) continue;
    if (JSON.stringify(baselineState[k]) !== JSON.stringify(state[k])) changes.push({ key: k, label: fields[k], from: fmtField(k, baselineState[k]), to: fmtField(k, state[k]) });
  }
  if (!changes.length) return null;
  return { changes, successDelta: lastSimResult.successRate - baselineResult.successRate, finalDelta: lastSimResult.medianFinal - baselineResult.medianFinal };
}
function renderSidebarImpact() {
  const im = computeImpact();
  const compareBtn = `<button style="font-size:13px;color:var(--rust);background:none;border:none;cursor:pointer;padding:2px 0;font-family:inherit;margin-top:2px" onclick="toggleCompare()">${compareOn && isPaid() ? 'Stop comparing' : 'Compare side by side'}${!isPaid() ? ' &#x1f512;' : ''}</button>`;
  if (!im) {
    if (compareOn && isPaid()) return `<div style="background:var(--bone-2);margin:10px -20px 0;padding:10px 20px;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);font-size:13px;color:var(--ink-mute)">Comparing against <strong style="color:var(--ink)">${baselineName}</strong>. Change something to see the two futures diverge. ${compareBtn}</div>`;
    return '';
  }
  const fdTxt = (im.finalDelta >= 0 ? '+' : '') + fmtMoneyShort(im.finalDelta);
  const changeRows = im.changes.map(c =>
    `<div style="display:flex;align-items:baseline;gap:6px;line-height:1;margin-bottom:3px">
      <span style="flex:1;min-width:0;font-size:13px;color:var(--ink-soft)"><strong style="color:var(--ink)">${c.label}:</strong> ${c.from} \u2192 ${c.to}</span>
      <button onclick="revertChange('${c.key}')" title="Undo this change" style="flex-shrink:0;background:none;border:none;cursor:pointer;font-size:11px;color:var(--ink-mute);padding:0;font-family:inherit;text-decoration:underline;text-decoration-style:dotted">undo</button>
    </div>`
  ).join('');
  return `<div style="background:var(--bone-2);margin:10px -20px 0;padding:10px 20px;border-top:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft)">
    <div style="font-size:12px;color:var(--ink-mute);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.06em">${currentName !== 'Current' ? currentName + ' versus ' + baselineName : 'Versus ' + baselineName}</div>
    ${changeRows}
    <div style="font-size:13px;color:var(--ink-mute);margin-top:6px;padding-top:6px;border-top:1px solid var(--line-soft)">Success ${succLabel(baselineResult)} \u2192 <strong style="color:var(--ink)">${succLabel(lastSimResult)}</strong> &middot; ${fdTxt} median ending</div>
    <div style="display:flex;gap:12px;flex-wrap:wrap">
      <button style="font-size:13px;color:var(--rust);background:none;border:none;cursor:pointer;padding:2px 0;font-family:inherit;margin-top:2px" onclick="resetBaseline()">Set current as new baseline</button>
      ${compareBtn}
    </div>
  </div>`;
}

// ===== HOW TO READ THIS =====
function renderReadFirst(result) {
  const n = result.totalPeriods;
  const unit = result.mode === 'historical' ? 'periods' : result.mode === 'montecarlo' ? 'simulated futures' : 'path';
  const yrs = state.targetAge - state.age + 1;
  const bandLine = result.mode === 'fixed'
    ? `Everything here is in today’s dollars. Fixed mode draws one line at a steady ${pct(state.returnRate)} return, so there is no band. Historical mode shows the spread.`
    : `Everything here is in today’s dollars. The shaded band shows where the portfolio ended up across all ${n} ${unit}, and the line is the middle one. If the band mostly stays above zero, the plan lasted in most of them. If the bottom edge touches zero, it ran out in at least some, and the spending explorer below shows how much less you would need to spend to change that.`;
  return `<details class="read-first" ${readFirstOpen ? 'open' : ''} ontoggle="readFirstOpen=this.open">
    <summary>How to read the results, and how the model works</summary>
    <div class="read-first-body">
      <p>${bandLine}</p>
      <p>Running out here means the balance hits zero before age ${state.targetAge} in that ${result.mode === 'historical' ? 'period' : 'run'}. It usually happens in the last few years, after decades of the plan working. We’re assuming most people would notice a bad run and adjust long before then. The guardrails setting under Assumptions is a rough version of that adjustment.</p>
      <p>The model covers your portfolio, wages until the age you stop, Social Security from the age you set, housing until the payoff age, one-time events you add, and taxes as one flat rate on wages and one on withdrawals, both of which you can change under Assumptions. Healthcare is not a separate line, so it belongs in your spending number. It does not model tax brackets, required minimum distributions, or Medicare surcharges. The portfolio is your stock/bond mix rebalanced once a year, minus the fee you set. The market history is U.S. returns since 1926, and ${yrs}-year periods overlap, so ${result.mode === 'historical' ? n + ' periods are not ' + n + ' separate tests' : 'the historical count is not a count of separate tests'}.</p>
      <p>If you are about to make a decision based on this, take the scenario to a planner or tax professional first.</p>
    </div></details>`;
}

// ===== ASSUMPTIONS =====
function chWidth(v) { const s = String(v); const dots = (s.match(/[.,-]/g) || []).length; return (s.length - dots + dots * 0.35 + 0.15).toFixed(2) + 'ch'; }

}
function asmRow(label, html) { return `<div class="asm-row"><div class="asm-label">${label}</div><div class="asm-text">${html}</div></div>`; }
function renderAssumptions(result) {

    : isMC

    : `One path at a steady <strong>${pct(state.returnRate)}</strong> real return every year, so no good or bad years and no sequence-of-returns risk. For comparison, the ${mixWords} mix compounded at ${pct(h.geo)} a year over 1926–${HISTORICAL_END_YEAR}.`));

    <div class="asm-slider"><span>All bonds</span><input type="range" class="asm-range" min="0" max="100" step="5" value="${Math.round(mix * 100)}" oninput="this.parentElement.querySelector('output').textContent=this.value+'% stocks / '+(100-this.value)+'% bonds'" onchange="update('stockPct', +this.value/100)" aria-label="Percent in stocks"/><span>All stocks</span><output>${Math.round(mix * 100)}% stocks / ${Math.round((1 - mix) * 100)}% bonds</output></div>`));

    : 'Every portfolio withdrawal is grossed up by ' + asmInput('capGainsTax', Math.round(state.capGainsTax * 100), { min: 0, max: 50, step: 1, label: 'Withdrawal tax rate percent' }) + ' for tax. Set it to 0 if your savings are mostly Roth' + (isPaid() ? ', or turn on account types under More options for per-account treatment.' : '.')} Brackets, RMDs, and Medicare surcharges are not modelled.`));
  rows.push(asmRow('Horizon', `The plan runs from age ${state.age} through age <strong>${state.targetAge}</strong> (${state.targetAge - state.age + 1} years)${isPaid() ? ', set under More options' : ''}. A period counts as failed if the balance hits $0 before age ${state.targetAge}, even if that happens in the last year, and a period that ends with $1 still counts as a success. Once the balance is gone, the model does not let it come back.`));
  if (state.yourSSAmount > 0 || state.partnerSSAmount > 0) rows.push(asmRow('Social Security', `Starts at age <strong>${state.ssStartAge}</strong> at ${fmtMoney(state.yourSSAmount)}${state.hasPartner && state.partnerSSAmount ? ' for you and ' + fmtMoney(state.partnerSSAmount) + ' for your partner' : ''} a year in today’s dollars, from your inputs. Claiming at 62 pays 70% of the full-age amount and at 70 pays 124%. Survivor and spousal benefits are not worked out for you.`));
  if (isMC) rows.push(asmRow('Randomness', `The ${result.mcSims} random futures are the same set every time you look, so the result does not jump around as you change things. <button class="link-btn" onclick="rerollSeed()">Try a different random set</button>. If the count barely moves, ${result.mcSims} futures is plenty; if it jumps a few points, that is how much luck is in the number. Average ${asmInput('mcMean', (result.mcMean * 100).toFixed(1), { min: -5, max: 15, step: 0.1, label: 'Simulated average real return percent' })} &middot; volatility ${asmInput('mcSd', (result.mcSd * 100).toFixed(1), { min: 1, max: 40, step: 0.5, label: 'Simulated volatility percent' })}${mcParams(state).fromHistory ? '' : ' &middot; <button class="link-btn" onclick="resetMcToHistory()">match history for this mix</button>'} &middot; futures <input type="number" class="asm-input" style="width:${String(result.mcSims).length + 0.15}ch" min="100" max="5000" step="100" value="${result.mcSims}" oninput="this.style.width=(this.value.length+0.15)+'ch'" onchange="update('mcSims', Math.max(100, Math.min(5000, +this.value)))" aria-label="Number of simulated futures"/>`));

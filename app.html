          <li><strong>State tax:</strong> California uses full 2025 CA FTB brackets (<a href="https://www.ftb.ca.gov/forms/2025/2025-540-booklet.html" target="_blank">CA FTB</a>). Nine states have no income tax (Alaska, Florida, Nevada, New Hampshire, South Dakota, Tennessee, Texas, Washington, Wyoming). All other states use a flat approximation based on their statutory or typical effective rate, sourced from the <a href="https://taxfoundation.org/data/all/state/state-income-tax-rates/" target="_blank">Tax Foundation</a> and each state's revenue department. Set your state in More options.</li>
        </ul>
        <p>All projections use real (inflation-adjusted) dollars, so the spending amounts shown are in today's purchasing power.</p>
      </div>
    </details>

    <details class="faq-item">
      <summary>Are the numbers in today's dollars or future dollars?</summary>
      <div class="faq-body">
        <p>Today's dollars, everywhere. Spending, Social Security, rent, and the market returns are all inflation-adjusted, so $80,000 a year means $80,000 of today's purchasing power in every year of the plan, and a $3M balance at 100 is $3M of what money buys now.</p>
        <p>The one exception is a mortgage payment, which is fixed in nominal dollars. In today's dollars it shrinks a little each year until it is paid off, and the tool models that. Wages grow by the real income growth you set, which is growth above inflation.</p>
        <p>If you are used to future-dollar projections, the balances here will look smaller than you expect. That is the inflation already taken out, not a worse result.</p>
      </div>
    </details>

    <details class="faq-item">
      <summary>How does the historical simulation work?</summary>
      <div class="faq-body">
        <p>In Historical mode, the tool tests your plan against every rolling period of real U.S. market returns since 1926 for the stock/bond mix you chose. If your horizon is 30 years, it runs your numbers starting in 1926, then 1927, then 1928, and so on through every period in the dataset (71 of them for 30 years), each using the actual sequence of returns from that era. The stretches overlap, so they are not independent trials, and the Assumptions panel shows exactly how many were run and where they start.</p>
        <p>This matters because of sequence of returns risk. A market crash in year two of retirement is far more damaging than the same crash in year twenty, even if the long-run average return is identical. In year two you sell at the bottom to cover expenses, and the shares you sold are not there for the recovery. Historical mode shows how many real sequences your plan survives, including the ones that started right before 1929, 1966, 2000, and 2008.</p>
        <p>Fixed mode uses one steady return and Simulated mode draws random ones, so neither carries the timing of a real crash.</p>
      </div>
    </details>

    <details class="faq-item">
      <summary>How do I read the success rate?</summary>
      <div class="faq-body">
        <p>The success rate tells you how often your plan lasted to your target age. In Historical mode it is a count ("lasted through 66 of 71 stretches"), and the stretches overlap, so it describes how the plan would have done in every past you could have started in. It is not a probability, and the future is not obliged to look like any of those pasts. In Simulated mode it is a percentage across ${state.mcSims} randomized futures, which is a probability only inside that model's assumptions.</p>
        <ul>
          <li><strong>100% is not the goal.</strong> A plan that survives every stretch of the market, including the one that starts in 1929, could have spent more in the other 70.</li>
          <li><strong>85 to 90% is a reasonable target.</strong> For a 30-year plan that is 60 to 64 of 71 stretches. The ones it misses are the handful that started right before a long slump, such as 1966 through 1969.</li>
          <li><strong>What a failure means.</strong> When a plan fails here, the portfolio usually runs low in the last few years of a plan that runs to age ${state.targetAge}. Social Security keeps paying through it, and late-life spending is usually lower, so the model's failure is milder than the word suggests.</li>
        </ul>
        <p>The spending explorer below the chart shows how the count moves as you set spending higher or lower.</p>
      </div>
    </details>

    <details class="faq-item">
      <summary>Why do small changes make such a big difference?</summary>
      <div class="faq-body">
        <p>Retirement portfolios are sensitive to small changes because the effects compound over decades and the math is nonlinear. A few forces drive this:</p>
        <ul>
          <li><strong>Compounding cuts both ways.</strong> An extra $5,000 a year in spending costs $5,000 plus the growth that money would have earned over the next 20 or 30 years. At 5% real returns, $5,000 today becomes roughly $13,000 in 20 years.</li>
          <li><strong>Withdrawal rate.</strong> ${(() => { const c = (w) => runForState({ ...DEFAULT_STATE, age: 65, targetAge: 94, hasPartner: false, partnerAge: 0, portfolio: 1000000, spending: w, lateSpending: w, slowDownAge: 200, yourIncome: 0, yourStopWorkAge: 65, yourSSAmount: 0, housing: 0, taxRate: 0, capGainsTax: 0, feeRate: 0, guardrailsEnabled: false, simMode: 'historical', stockPct: state.stockPct }); const a = c(35000), b = c(40000), d = c(45000), e = c(50000); return 'On $1 million over 30 years with your ' + mixLabel() + ' mix and no taxes or fees, spending $35,000 a year lasted in ' + a.successCount + ' of ' + a.totalPeriods + ' periods, $40,000 in ' + b.successCount + ', $45,000 in ' + d.successCount + ', and $50,000 in ' + e.successCount + '. Each extra $5,000 costs more stretches than the last, because each step runs into more of the bad sequences.'; })()}</li>
          <li><strong>Early retirement is especially sensitive.</strong> Retiring 10 years earlier adds 10 years of withdrawals and removes 10 years of contributions and growth. The two effects stack.</li>
          <li><strong>Sequence risk.</strong> In a bad market sequence, a slightly higher withdrawal rate means selling more shares at the bottom, leaving fewer shares to recover when the market rebounds. Small differences in withdrawal rate become large differences in survival.</li>
        </ul>
        <p>This is why the tool uses historical sequences rather than averages.</p>
      </div>
    </details>

    <details class="faq-item">
      <summary>What is sequence of returns risk?</summary>
      <div class="faq-body">
        <p>Two retirees can experience the exact same average market return over 30 years and end up in completely different places, depending on whether the good years came first or the bad years did.</p>
        <p>If your portfolio drops 40% in year two of retirement, you sell investments at the bottom to cover expenses, and the shares you sold are not there for the recovery. A crash in year twenty, with fewer years of withdrawals left, does far less damage.</p>
        <p>A steady 6% assumption says nothing about a 2008-style crash in your first year, even if 6% turns out to be the long-run average.</p>
        <p>Historical mode runs your plan through every real sequence since 1926 rather than a smoothed average of them.</p>
      </div>
    </details>

    <details class="faq-item">
      <summary>What is the 4% rule, and does this tool use it?</summary>
      <div class="faq-body">
        <p>The 4% rule comes from William Bengen's 1994 research, later expanded by the Trinity Study. The finding: a retiree withdrawing 4% of a portfolio that was 50 to 75% stocks and the rest intermediate-term government bonds in year one, then adjusting for inflation each year, had not run out of money over any 30-year period in the data those studies used. ${(() => { const t = runForState({ ...DEFAULT_STATE, age: 65, targetAge: 94, hasPartner: false, partnerAge: 0, portfolio: 1000000, spending: 40000, lateSpending: 40000, slowDownAge: 200, yourIncome: 0, yourStopWorkAge: 65, yourSSAmount: 0, housing: 0, taxRate: 0, capGainsTax: 0, feeRate: 0, guardrailsEnabled: false, simMode: 'historical', stockPct: state.stockPct }); return 'On this tool’s own data, with your current ' + mixLabel() + ' mix, no fees and no taxes, 4% for 30 years lasted in ' + t.successCount + ' of ' + t.totalPeriods + ' periods.'; })()}</p>
        <p>It became the dominant rule of thumb in financial planning, and it works for what it was designed to do. It has limits:</p>
        <ul>
          <li>It assumes a fixed withdrawal regardless of what the market does, with no adjustments in bad years.</li>
          <li>It was calibrated for a 30-year horizon. Retire at 55 planning to 95 and you need something more conservative.</li>
          <li>It ignores income. A household spending $80,000 with $30,000 of Social Security only needs the portfolio to cover $50,000.</li>
          <li>It does not account for spending that changes in late life. Healthcare costs may rise even as travel and discretionary spending fall.</li>
        </ul>
        <p>This tool does not apply the 4% rule. It runs your own numbers through historical and simulated market sequences, with your income, Social Security, housing costs, and the spending changes you set.</p>
      </div>
    </details>

    <details class="faq-item">
      <summary>How does the flexible spending (guardrails) system work?</summary>
      <div class="faq-body">
        <p>The idea comes from financial planner Jonathan Guyton: rather than withdrawing a fixed amount every year, you set a target and let it flex based on how hard the portfolio is being drawn.</p>
        <p>In the first year you draw from the portfolio with no wages coming in, the tool records your withdrawal rate as the baseline. Each year after that:</p>
        <ul>
          <li>If your withdrawal rate climbs more than ${pct(state.guardrailBandPct, 0)} above that baseline, your portfolio is under stress and that year's spending is cut by ${pct(state.guardrailCutPct, 0)}.</li>
          <li>If it falls more than ${pct(state.guardrailBandPct, 0)} below, your portfolio is running ahead and that year's spending is boosted by ${pct(state.guardrailBoostPct, 0)}.</li>
        </ul>
        <p>Cuts apply to one year at a time and do not compound. A plan with guardrails on will tighten in bad market stretches and loosen in good ones, which raises the survival count versus rigid spending. The verdict tells you how many years the median path cut spending, so you can judge whether you would live that way. There is one known quirk. If Social Security starts years after you retire, the baseline is set in a bridge year with a high withdrawal rate, which makes boosts more likely once benefits begin.</p>
        <p>Toggle guardrails on or off under Assumptions. The cut and boost percentages are in the Spending flexibility section, part of the full version.</p>
      </div>
    </details>

    <details class="faq-item">
      <summary>What are account types and which withdrawal strategy should I use?</summary>
      <div class="faq-body">
        <p>Most people have savings spread across different kinds of accounts, and they are not all taxed the same way. The account types feature lets you model this.</p>
        <ul>
          <li><strong>Traditional (IRA, 401k).</strong> Contributions went in pre-tax, so withdrawals are taxed as ordinary income. The model gross-ups each withdrawal to cover the tax owed, meaning you need to pull out more than you actually spend.</li>
          <li><strong>Roth (IRA, 401k).</strong> Contributions went in after-tax, so qualified withdrawals are tax-free. This makes Roth dollars worth more than traditional dollars of the same nominal amount.</li>
          <li><strong>Taxable brokerage.</strong> No special tax treatment going in or out, but gains are taxed at the lower capital gains rate rather than ordinary income rates. The model approximates this by assuming about half of each withdrawal is gain.</li>
        </ul>
        <p>The withdrawal strategy controls the order you draw from these accounts:</p>
        <ul>
          <li><strong>Proportional</strong> draws from all three in proportion to their current balances. Simple and predictable.</li>
          <li><strong>Tax-aware</strong> draws from taxable first, then traditional, then Roth last. Because Roth grows tax-free, leaving it untouched longer lets it compound tax-free longer. This usually leaves more usable after-tax wealth at the end, though it may show higher taxes in the early years. The withdrawal strategy comparison table (visible in Historical and Simulated modes) shows the estimated difference for your specific numbers.</li>
        </ul>
        <p>The right answer depends on your tax bracket now versus in retirement, and on whether RMDs will force traditional withdrawals anyway after age 73. A tax professional can model your specific situation.</p>
      </div>
    </details>

    <details class="faq-item">
      <summary>What are the model's limitations?</summary>
      <div class="faq-body">
        <p>A few things the model does not capture or simplifies:</p>
        <ul>
          <li><strong>Asset classes.</strong> The portfolio is U.S. large-cap stocks and 10-year Treasuries only. No international stocks, cash, TIPS, or real estate, and the bond series is a constant-maturity approximation rather than a fund's actual record.</li>
          <li><strong>History is one sample.</strong> Overlapping U.S. stretches since 1926 share most of their years, and the best-performing major market of the century is not a neutral sample. Simulated mode picks each year from a bell curve, so bad years cluster only by chance and the worst years are milder than the worst real ones. Because it also ignores the way markets tend to recover, over long horizons it usually lands close to the historical count, or a little below it.</li>
          <li><strong>Fees default to 0.10%,</strong> a typical index fund. Set your own under Assumptions. On a $1M portfolio spending $40,000 a year at 60/40, a 0.5% fee turns 66 of 71 surviving stretches into 63.</li>
          <li><strong>Healthcare costs</strong> are not broken out separately. Include them in your annual spending, or add pre-Medicare premiums as a life event if they will differ significantly from your regular retirement spending.</li>
          <li><strong>Required Minimum Distributions</strong> (RMDs) starting at age 73 are not modeled. For most people the impact is limited, but a large traditional IRA can push forced withdrawals into a higher tax bracket.</li>
          <li><strong>Medicare premium surcharges</strong> (IRMAA) for higher-income retirees are not included.</li>
          <li><strong>Roth conversions and tax-loss harvesting</strong> are not modeled. An accountant may find savings here that no simple model will.</li>
          <li><strong>Spousal and survivor Social Security benefits</strong> are entered manually but not calculated automatically from each other's records.</li>
          <li><strong>State income tax</strong> is approximated for most states. Set your state under More about you for a closer number, or edit the rates directly under Assumptions.</li>
          <li><strong>Property tax, insurance, and upkeep</strong> for a home you already own are part of your spending number, not a separate line. Only a home bought later in the plan adds them as their own cost.</li>
        </ul>
        <p>Take the numbers to a professional before making a major decision.</p>
      </div>
    </details>

    <details class="faq-item">
      <summary>Should I talk to a financial advisor?</summary>
      <div class="faq-body">
        <p>This tool is a starting point. A good advisor can account for your full picture: estate planning, insurance, tax optimization, account structure, and the things a model cannot capture about your situation.</p>
        <p>Find one: <a href="https://www.napfa.org/find-an-advisor" target="_blank">fee-only advisors (NAPFA)</a> &middot; <a href="https://www.letsmakeaplan.org/" target="_blank">certified planners (CFP Board)</a> &middot; <a href="https://www.aicpa.org" target="_blank">tax professionals (AICPA)</a></p>
      </div>
    </details>

  </div></div></div>` : ''}
  `;
}

function drawMainChart(result, compare) {
  const ctx = document.getElementById('mainChart'); if (!ctx) return;
  if (chart) chart.destroy();
  const p = result.percentiles;
  const labels = p.map(x => x.age);
  const fill = (data, color, alpha) => ({ data, borderColor: color, backgroundColor: alpha, borderWidth: 1.5, pointRadius: 0, fill: false, tension: 0.1 });
  const datasets = [];
  if (result.mode !== 'fixed') {
    datasets.push({ label: 'p90', data: p.map(x => x.p90), borderColor: 'transparent', backgroundColor: 'rgba(91,110,58,0.10)', pointRadius: 0, fill: '+1', tension: 0.1 });
    datasets.push({ label: 'p10', data: p.map(x => x.p10), borderColor: 'transparent', backgroundColor: 'transparent', pointRadius: 0, fill: false, tension: 0.1 });
    datasets.push({ label: 'p75', data: p.map(x => x.p75), borderColor: 'transparent', backgroundColor: 'rgba(91,110,58,0.16)', pointRadius: 0, fill: '+1', tension: 0.1 });
    datasets.push({ label: 'p25', data: p.map(x => x.p25), borderColor: 'transparent', backgroundColor: 'transparent', pointRadius: 0, fill: false, tension: 0.1 });
  }
  datasets.push(Object.assign(fill(p.map(x => x.p50), '#a04a28', 'transparent'), { label: 'Median', borderWidth: 2 }));
  // Side-by-side: the baseline's range as a faint rust band and its median as a dashed line.
  if (compare && compare.percentiles && compare.percentiles.length === p.length) {
    const cp = compare.percentiles;
    if (compare.mode !== 'fixed') {
      datasets.push({ label: 'Baseline p90', data: cp.map(x => x.p90), borderColor: 'transparent', backgroundColor: 'rgba(160,74,40,0.09)', pointRadius: 0, fill: '+1', tension: 0.1 });
      datasets.push({ label: 'Baseline p10', data: cp.map(x => x.p10), borderColor: 'transparent', backgroundColor: 'transparent', pointRadius: 0, fill: false, tension: 0.1 });
    }
    datasets.push({ label: 'Baseline median', data: cp.map(x => x.p50), borderColor: '#6b6356', borderDash: [5, 4], borderWidth: 1.5, pointRadius: 0, fill: false, tension: 0.1 });
  }

  // Key event ages for annotations
  const events = [];
  if (state.yourPartTimeAmount > 0) { const glide = state.yourPartTimeEnd >= state.yourStopWorkAge; events.push({ age: state.yourPartTimeStart, label: 'Part-time' }); events.push({ age: state.yourPartTimeEnd, label: glide ? 'Stop working' : 'Full time' }); if (!glide && state.yourStopWorkAge < state.targetAge) events.push({ age: state.yourStopWorkAge, label: 'Retire' }); }
  else if (state.yourStopWorkAge > state.age && state.yourStopWorkAge < state.targetAge) events.push({ age: state.yourStopWorkAge, label: 'Retire' });
  if (state.ssStartAge > state.age) events.push({ age: state.ssStartAge, label: 'SS starts' });
  if (state.otherIncome > 0 && state.otherIncomeStart > state.age) events.push({ age: state.otherIncomeStart, label: 'Pension starts' });
  if (state.mortgagePayoffAge > state.age && hasMortgage(state) && (!hasSale(state) || state.mortgagePayoffAge < state.homeSaleAge)) events.push({ age: state.mortgagePayoffAge, label: 'Mortgage done' });
  if (hasBuy(state)) events.push({ age: state.homeBuyAge, label: 'Home bought' });
  if (hasSale(state)) events.push({ age: state.homeSaleAge, label: 'House sold' });
  if (has(state.yourBreakStart) && state.yourBreakStart >= state.age) { events.push({ age: state.yourBreakStart, label: 'Break' }); events.push({ age: state.yourBreakEnd, label: 'Back to work' }); }
  if (state.extraSpend > 0 && has(state.extraSpendStart)) events.push({ age: state.extraSpendStart, label: 'Extra spending' });
  if (state.shockEra && has(state.shockAge)) events.push({ age: state.shockAge, label: 'Bad decade' });
  (state.oneTimeEvents || []).forEach(ev => { if (ev.age >= state.age && ev.age <= state.targetAge) events.push({ age: ev.age, label: ev.label || 'Event' }); });
  if (state.slowDownAge > state.age && state.lateSpending !== state.spending) events.push({ age: state.slowDownAge, label: state.lateSpending < state.spending ? 'Spending drops' : 'Spending rises' });

  // Chart.js plugin for vertical annotation lines
  const EV_FONT = "italic 13px 'Source Serif 4', Georgia, serif";
  const EV_ROW_H = 15;
  // Stagger labels into rows so labels that share an age (or sit close together) stack
  // vertically instead of overlapping, and keep every label inside the canvas.
  // `xFor(idx)` gives the pixel x for a label index; returns the positioned list.
  function layoutEventLabels(chart, xFor) {
    const ctx2 = chart.ctx;
    ctx2.save();
    ctx2.font = EV_FONT;
    const positioned = events.map(ev => {
      const idx = labels.indexOf(ev.age);
      if (idx < 0) return null;
      const half = ctx2.measureText(ev.label).width / 2;
      const x = xFor(idx);
      return { ...ev, idx, x, half, tx: Math.min(Math.max(x, (chart.chartArea ? chart.chartArea.left : 60) + half + 2), chart.width - half - 2) };
    }).filter(Boolean).sort((a, b) => a.x - b.x);
    ctx2.restore();
    const rowLast = [];
    positioned.forEach(ev => {
      let row = 0;
      while (rowLast[row] && (ev.tx - ev.half) < (rowLast[row].tx + rowLast[row].half + 6)) row++;
      ev.row = row;
      rowLast[row] = ev;
    });
    return { positioned, rows: rowLast.length };
  }
  const annotationPlugin = {
    id: 'eventAnnotations',
    // Before layout the scales don't exist yet, so estimate label spacing from the canvas
    // width (conservatively narrow) and reserve enough top padding for the stacked rows.
    // Doing it here means no second render pass; the real positions are used in afterDraw.
    beforeLayout(chart) {
      const plotW = Math.max(40, chart.width - 70);
      const n = Math.max(1, labels.length - 1);
      const { rows } = layoutEventLabels(chart, idx => 60 + idx / n * plotW);
      const want = Math.max(34, 4 + rows * EV_ROW_H + 6);
      if (chart.options.layout.padding.top !== want) chart.options.layout.padding.top = want;
    },
    afterDatasetsDraw(chart) { // before the tooltip, so the hover box sits on top
      const xScale = chart.scales.x;
      const yScale = chart.scales.y;
      const ctx2 = chart.ctx;
      const { positioned } = layoutEventLabels(chart, idx => xScale.getPixelForValue(idx));
      positioned.forEach(ev => {
        ctx2.save();
        ctx2.strokeStyle = '#d4cab8';
        ctx2.lineWidth = 1;
        ctx2.setLineDash([4, 3]);
        ctx2.beginPath();
        ctx2.moveTo(ev.x, yScale.top);
        ctx2.lineTo(ev.x, yScale.bottom);
        ctx2.stroke();
        ctx2.setLineDash([]);
        ctx2.font = EV_FONT;
        ctx2.textAlign = 'center';
        // a halo in the card color keeps the note legible where it sits over the band
        ctx2.lineJoin = 'round'; ctx2.lineWidth = 4; ctx2.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue('--paper').trim() || '#fbf8f1';
        ctx2.strokeText(ev.label, ev.tx, yScale.top - 4 - ev.row * EV_ROW_H);
        ctx2.fillStyle = '#a04a28';
        ctx2.fillText(ev.label, ev.tx, yScale.top - 4 - ev.row * EV_ROW_H);
        ctx2.restore();
      });
    }
  };

  // Crosshair plugin: draws a vertical line at hover position
  const crosshairPlugin = {
    id: 'crosshair',
    afterDatasetsDraw(chart) { // before the tooltip, so the hover box sits on top
      if (chart.tooltip && chart.tooltip._active && chart.tooltip._active.length) {
        const x = chart.tooltip._active[0].element.x;
        const yScale = chart.scales.y;
        const ctx2 = chart.ctx;
        ctx2.save();
        ctx2.strokeStyle = 'rgba(26,24,20,0.15)';
        ctx2.lineWidth = 1;
        ctx2.beginPath();
        ctx2.moveTo(x, yScale.top);
        ctx2.lineTo(x, yScale.bottom);
        ctx2.stroke();
        ctx2.restore();
      }
    }
  };

  // Enhanced tooltip showing breakdown
  const medianRun = result.medianRun;
  chart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    plugins: [annotationPlugin, crosshairPlugin],
    options: {
      responsive: true, maintainAspectRatio: false, resizeDelay: 200,
      // On a touch screen Chart.js redraws on every touchmove, which fights the page for
      // the scroll. A tap still shows the numbers.
      events: TOUCH ? ['click'] : ['mousemove', 'mouseout', 'click', 'touchstart'],
      layout: { padding: { top: 34 } },
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: {
        mode: 'index', intersect: false, displayColors: false,
        itemSort: (a, b) => ({ p90: 0, Median: 1, 'Baseline median': 2, p10: 3 }[a.dataset.label] || 0) - ({ p90: 0, Median: 1, 'Baseline median': 2, p10: 3 }[b.dataset.label] || 0),
        callbacks: {
          title: (t) => 'Age ' + t[0].label,
          label: (c) => {
            if (!['Median','p10','p90','Baseline median'].includes(c.dataset.label)) return null;
            const nice = { Median: 'Middle outcome', p10: 'Worst tenth', p90: 'Best tenth', 'Baseline median': baselineName + ', middle outcome' };
            const lines = [nice[c.dataset.label] + ': ' + fmtMoneyShort(c.parsed.y)];
            if (c.dataset.label === 'Median' && medianRun && medianRun[c.dataIndex]) {
              const yr = medianRun[c.dataIndex];
              if (yr.yourIncome > 0) lines.push('Income: ' + fmtMoneyShort(yr.yourIncome + yr.partnerIncome));
              if (yr.ssIncome > 0) lines.push('Social Security: ' + fmtMoneyShort(yr.ssIncome));
              if (yr.otherIncome > 0) lines.push('Pension or other: ' + fmtMoneyShort(yr.otherIncome));
              lines.push('Spending: ' + fmtMoneyShort(yr.spending));
              if (yr.withdrawal > 0) lines.push('Withdrawal: ' + fmtMoneyShort(yr.withdrawal));
            }
            return lines;
          },
          afterBody: (t) => {
            const idx = t[0].dataIndex;
            const age = labels[idx];
            const ev = events.find(e => e.age === age);
            return ev ? ['\u2192 ' + ev.label] : [];
          }
        },
        filter: (t) => ['Median','p10','p90','Baseline median'].includes(t.dataset.label)
      } },
      scales: {
        x: { title: { display: true, text: 'Age', color: '#6b6356', font: { size: 11 } }, ticks: { color: '#75695a', maxTicksLimit: 10 }, grid: { color: 'rgba(212,202,184,0.4)' } },
        y: { ticks: { color: '#75695a', callback: (v) => fmtMoneyShort(v) }, grid: { color: 'rgba(212,202,184,0.4)' } }
      }
    }
  });
}

function drawCashflowChart(result) {

  }

  if (cashflowChart) {

        tooltip: { mode: 'index', intersect: false, callbacks: {

            const net = yr ? Math.round((yr.yourIncome + yr.partnerIncome + yr.ssIncome + (yr.otherIncome || 0)) - ((yr.yourIncome + yr.partnerIncome) * state.taxRate + yr.ssIncome * state.taxRate * 0.5 + (yr.otherIncome || 0) * state.taxRate) - yr.spending) : c.parsed.y;

// Called on every oninput (during drag) — updates label + debounced chart

window.sliderCommit = function(key, rawVal) {

  if (key === 'totalLateSpending') { key = 'lateSpending'; rawVal = Math.max(0, +rawVal - lateHousingPart()); }

      + dlgField('Mortgage payment per year', 'sc_b', on ? state.homeBuyPayment : '', 'min="0" step="1000" placeholder="e.g. 30000"', 'Principal and interest, in today’s dollars. It is fixed from then on, so it shrinks with inflation. 0 if you pay cash.')

      + dlgField('Property tax, insurance, and upkeep per year', 'sc_e', on ? state.homeBuyUpkeep : '', 'min="0" step="1000" placeholder="e.g. 10000"', 'Renters usually do not pay these, so they are added on top of your spending for as long as you own the home.');
  } else if (id === 'partTime') {
    const pt = state.yourPartTimeAmount > 0;
    const glide = pt && state.yourStopWorkAge === state.yourPartTimeStart;
    intro = 'Part-time income replaces your full-time wages between these ages. Then either your full-time wages come back, or you stop working for good.';
    body = dlgField('Part-time income per year', 'sc_c', pt ? state.yourPartTimeAmount : Math.round(state.yourIncome / 2 / 1000) * 1000, 'min="0" step="1000"', 'Before tax, in today’s dollars. Prefilled with half your current income; change it.') + dlgField('Part-time from age', 'sc_a', pt ? state.yourPartTimeStart : state.age, `min="${state.age}" max="${state.targetAge - 1}" step="1"`) + dlgField('Until age', 'sc_b', pt ? state.yourPartTimeEnd : Math.min(state.age + 3, state.yourStopWorkAge), `min="${state.age + 1}" max="${state.targetAge}" step="1"`)
      + `<div class="field" style="margin-top:12px"><label>Then</label><div class="toggle-group"><button type="button" class="toggle-btn ${glide ? '' : 'active'}" data-then="resume" onclick="pickThen(this)">Back to full time</button><button type="button" class="toggle-btn ${glide ? 'active' : ''}" data-then="stop" onclick="pickThen(this)">Stop working</button></div><span class="field-hint" id="sc_then_hint">${glide ? 'Wages end for good at the second age.' : 'Full-time wages come back until your retirement age of ' + state.yourStopWorkAge + '.'}</span></div>`;
  } else if (id === 'shockAtRetirement') {
    intro = 'From the age you pick, the market does what it did in that decade. Every period in the history test gets the same ten bad years there, so the count answers what happens if it hits right then.';
    const defAge = has(state.shockAge) ? state.shockAge : ((state.yourIncome > 0 && state.yourStopWorkAge > state.age) ? state.yourStopWorkAge : state.age);
    body = `<div class="field" style="margin-top:10px"><label>Which decade</label><select id="sc_era">${SHOCK_ERAS.map(([v, l]) => `<option value="${v}" ${(state.shockEra || 'dotcom') === v ? 'selected' : ''}>${l}</option>`).join('')}</select></div>` + dlgField('Starting at age', 'sc_a', defAge, `min="${state.age}" max="${state.targetAge}" step="1"`);
  }
  openModal(`<h2>${SCENARIO_TITLES[id]}</h2><p>${intro}</p>${body}
    <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn-primary" onclick="applyScenarioModal('${id}')">Run it</button>${isSet ? `<button class="btn-secondary" onclick="removeScenario('${id}')">Remove</button>` : ''}<button class="btn-secondary" onclick="closeModal()">Cancel</button></div>`);
  const first = document.getElementById('sc_c') || document.getElementById('sc_a'); if (first) first.focus();
};
window.pickThen = function(btn) {
  document.querySelectorAll('.modal .toggle-btn[data-then]').forEach(b => b.classList.toggle('active', b === btn));
  const hint = document.getElementById('sc_then_hint');
  if (hint) hint.textContent = btn.dataset.then === 'stop' ? 'Wages end for good at the second age.' : 'Full-time wages come back until your retirement age of ' + state.yourStopWorkAge + '.';
};
// Marks a dialog field as wrong and says why under it.
function dlgError(id, msg) {
  const el = document.getElementById(id); if (!el) return;
  el.style.borderColor = 'var(--danger)';
  let hint = el.parentElement.querySelector('.field-hint');
  if (!hint) { hint = document.createElement('span'); hint.className = 'field-hint'; el.parentElement.appendChild(hint); }
  hint.textContent = msg; hint.style.color = 'var(--danger)';
  el.focus();
}
function dlgNum(id) { const el = document.getElementById(id); const v = el ? parseFloat(el.value) : NaN; return isNaN(v) ? null : Math.round(v); }
window.applyScenarioModal = function(id) {
  const a = dlgNum('sc_a'), b = dlgNum('sc_b');
  const bad = (el) => { if (el) el.style.borderColor = 'var(--danger)'; };
  if (id === 'careerBreak' || id === 'partnerBreak' || id === 'spendMore' || id === 'partTime') {
    if (a === null || b === null || b <= a) { bad(document.getElementById('sc_b')); return; }
  }
  if (id === 'spendMore') { const c = dlgNum('sc_c'); if (!(c > 0)) { bad(document.getElementById('sc_c')); return; } }
  if (id === 'sellHouse') { const c = dlgNum('sc_c'); if (a === null) { bad(document.getElementById('sc_a')); return; } if (c === null || c < 0) { bad(document.getElementById('sc_c')); return; }
    if (hasBuy(state) && a <= state.homeBuyAge) { dlgError('sc_a', 'You buy this home at ' + state.homeBuyAge + ', so the sale has to come after that.'); return; } }
  if (id === 'buyHome') {
    if (a === null || a < state.age) { bad(document.getElementById('sc_a')); return; }
    if (has(state.homeSaleAge) && a >= state.homeSaleAge) { dlgError('sc_a', 'You sell this home at ' + state.homeSaleAge + '. Buy before then, or change the sale first.'); return; }
    const c = dlgNum('sc_c'); if (c === null || c < 0) { bad(document.getElementById('sc_c')); return; }
    if (b !== null && b < 0) { bad(document.getElementById('sc_b')); return; }
    const d = dlgNum('sc_d'); if (b > 0 && (d === null || d <= a)) { dlgError('sc_d', 'The payoff age has to come after the purchase.'); return; }
    const e = dlgNum('sc_e'); if (e !== null && e < 0) { bad(document.getElementById('sc_e')); return; }
  }
  if (id === 'partTime') { const c = dlgNum('sc_c'); if (c === null || c < 0) { bad(document.getElementById('sc_c')); return; } }
  startComparison(presetLabel(id));
  if (id === 'careerBreak') { state.yourBreakStart = a; state.yourBreakEnd = b; }
  else if (id === 'partnerBreak') { state.partnerBreakStart = a; state.partnerBreakEnd = b; }
  else if (id === 'spendMore') { state.extraSpend = dlgNum('sc_c'); state.extraSpendStart = a; state.extraSpendEnd = b; }
  else if (id === 'sellHouse') { state.homeSaleAge = a; state.homeSaleProceeds = dlgNum('sc_c'); state.postSaleHousing = Math.max(0, b || 0); }
  else if (id === 'buyHome') { state.homeBuyAge = a; state.homeBuyDownPayment = dlgNum('sc_c'); state.homeBuyPayment = b || 0; state.homeBuyPayoffAge = b > 0 ? dlgNum('sc_d') : null; state.homeBuyUpkeep = dlgNum('sc_e') || 0; }
  else if (id === 'shockAtRetirement') { state.shockEra = document.getElementById('sc_era').value; state.shockAge = a; }
  else if (id === 'partTime') {
    const stopAfter = !!document.querySelector('.modal .toggle-btn[data-then="stop"].active');
    state.yourPartTimeAmount = dlgNum('sc_c'); state.yourPartTimeStart = a; state.yourPartTimeEnd = b;
    if (stopAfter) state.yourStopWorkAge = a; else if (state.yourStopWorkAge < b) state.yourStopWorkAge = b;
  }
  closeModal(); invalidateCaches(); render();
};
window.removeScenario = function(id) {
  if (id === 'careerBreak') state.yourBreakStart = state.yourBreakEnd = null;
  else if (id === 'partnerBreak') state.partnerBreakStart = state.partnerBreakEnd = null;
  else if (id === 'spendMore') { state.extraSpend = 0; state.extraSpendStart = state.extraSpendEnd = null; }
  else if (id === 'sellHouse') clearHomeSale(state);
  else if (id === 'buyHome') { clearHomeBuy(state); normalizeHousing(state); } // a sale of that home goes too
  else if (id === 'shockAtRetirement') { state.shockEra = null; state.shockAge = null; }
  else if (id === 'partTime') { if (state.yourStopWorkAge === state.yourPartTimeStart) state.yourStopWorkAge = state.yourPartTimeEnd; state.yourPartTimeAmount = 0; }
  currentName = 'Current'; // the what-if is gone, so the box stops naming it
  closeModal(); maxSpendView = false; invalidateCaches(); render();
};
window.applyPreset = function(id) {
  if (SCENARIO_TITLES[id]) { showScenarioModal(id); return; }
  if (id === 'payoffHouse') { showPayoffModal(true); return; }
  startComparison(presetLabel(id));
  switch (id) {
    case 'stopNow': state.yourStopWorkAge = state.age; break;
    case 'retire5early': state.yourStopWorkAge = Math.max(state.age, state.yourStopWorkAge - 5); break;
    case 'work2more': state.yourStopWorkAge = state.yourStopWorkAge + 2; if (state.hasPartner && state.partnerIncome > 0) state.partnerStopWorkAge = state.partnerStopWorkAge + 2; break;
    case 'bothRetire': state.yourStopWorkAge = state.age; state.partnerStopWorkAge = state.partnerAge; break;
    case 'partnerStarts': state.partnerIncome = 50000; state.partnerStopWorkAge = Math.max(state.partnerAge + 5, 62); break;
    case 'partnerRetires': state.partnerStopWorkAge = state.partnerAge; break;
    case 'partnerReturns': state.partnerIncome = state.partnerIncome > 0 ? state.partnerIncome : 60000; state.partnerStopWorkAge = Math.max(state.partnerAge + 5, 60); break;
    case 'maxSpend': {
      // In Fixed mode: the steady-return ceiling. Otherwise: the most that survived >= 85% of history.
      const ratio = state.spending > 0 ? state.lateSpending / state.spending : 0.85;
      const ms = state.simMode === 'fixed' ? findMaxSpend(state) : findMaxSpendAtSuccess({ ...state, spending: 100000, lateSpending: 100000 * ratio });
      state.spending = Math.round(ms.spend / 1000) * 1000; state.lateSpending = Math.round(state.spending * ratio); maxSpendView = true; break;
    }
    case 'delaySS': { const f = 1.24; state.ssStartAge = 70; state.yourSSAmount = Math.round(state.yourSSAmount * f); state.partnerSSAmount = Math.round(state.partnerSSAmount * f); break; }
    case 'earlySS': { const ssFactors = { 62: 0.70, 67: 1.00, 70: 1.24 }; const base = ssFactors[state.ssStartAge] || 1; state.ssStartAge = 62; state.yourSSAmount = Math.round(state.yourSSAmount / base * 0.70); state.partnerSSAmount = Math.round(state.partnerSSAmount / base * 0.70); break; }
    case 'sellHome': if (!state.oneTimeEvents) state.oneTimeEvents = []; state.oneTimeEvents.push({ label: 'Home sale', age: 70, amount: 400000 }); break;
    case 'ltc': if (!state.oneTimeEvents) state.oneTimeEvents = []; for (let a = 85; a < 90; a++) state.oneTimeEvents.push({ label: 'Long-term care', age: a, amount: -90000 }); break;
  }
  invalidateCaches(); render();
};

// ===== SAVE / LOAD SCENARIOS =====
window.saveScenario = function() {
  const el = document.getElementById('scenarioName'); const name = (el.value || '').trim();
  if (!name) { el.focus(); return; }
  if (savedScenarios.length >= 8) { alert('Max 8 saved scenarios. Delete one first.'); return; }
  const noteEl = document.getElementById('scenarioNote'); const note = noteEl ? (noteEl.value || '').trim().slice(0, 200) : '';
  savedScenarios.push({ name, note, state: JSON.parse(JSON.stringify(state)) });
  persistScenarios();
  render();
};
window.loadScenario = function(i) { state = withDefaults(savedScenarios[i].state); invalidateCaches(); render(); };
window.deleteScenario = function(i) { savedScenarios.splice(i, 1); persistScenarios(); render(); };

let modalOpener = null;
function openModal(html, cls) {
  modalOpener = document.activeElement;
  modalRoot.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal ${cls || ''}" role="dialog" aria-modal="true"><button class="modal-close" onclick="closeModal()" aria-label="Close">\u00d7</button>${html}</div></div>`;
  const dlg = modalRoot.querySelector('.modal');
  const h = dlg.querySelector('h2, h3');
  if (h) { if (!h.id) h.id = 'modal-title'; dlg.setAttribute('aria-labelledby', h.id); }
  // Focus goes to the first field if there is one, else the heading, so the dialog is announced.
  const first = dlg.querySelector('input:not([type=hidden]), select, textarea');
  if (first) first.focus(); else if (h) { h.setAttribute('tabindex', '-1'); h.focus(); } else dlg.querySelector('.modal-close').focus();
}
window.closeModal = function() {
  modalRoot.innerHTML = '';
  if (modalOpener && document.contains(modalOpener)) { try { modalOpener.focus(); } catch (e) {} }
  modalOpener = null;
};
document.addEventListener('keydown', function(e) {
  if (!modalRoot.innerHTML) return;
  if (e.key === 'Escape') { closeModal(); return; }
  if (e.key !== 'Tab') return;
  // Keep Tab inside the dialog.
  const items = Array.from(modalRoot.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]):not([type=hidden]), select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])'));
  if (!items.length) return;
  const firstEl = items[0], lastEl = items[items.length - 1];
  if (e.shiftKey && (document.activeElement === firstEl || !modalRoot.contains(document.activeElement))) { e.preventDefault(); lastEl.focus(); }
  else if (!e.shiftKey && document.activeElement === lastEl) { e.preventDefault(); firstEl.focus(); }
});

window.showScenarioDetail = function(id) {
  const s = HISTORICAL_SCENARIOS.find(x => x.id === id); if (!s) return;
  const run = runNamedScenario(state, s);
  const years = run.years;
  const survived = !years.some(y => y.ranOut);
  const final = years[years.length - 1];
  // worst drawdown
  let peak = years[0].portfolio, maxDD = 0, ddAge = years[0].age;
  years.forEach(y => { if (y.portfolio > peak) peak = y.portfolio; const dd = peak > 0 ? (peak - y.portfolio) / peak : 0; if (dd > maxDD) { maxDD = dd; ddAge = y.age; } });
  const crashYears = years.filter(y => y.marketReturn <= -0.15).length;
  let narrative = 'Starting in ' + s.startYear + ', ';
  if (maxDD > 0.25) narrative += 'the portfolio saw a drawdown of about ' + Math.round(maxDD * 100) + '% (around age ' + ddAge + '). ';
  if (crashYears > 0) narrative += 'There were ' + crashYears + ' year' + (crashYears > 1 ? 's' : '') + ' with a real market drop over 15%. ';
  narrative += survived ? 'The portfolio still lasted to age ' + state.targetAge + ', ending near ' + fmtMoneyShort(final.portfolio) + '.' : 'The portfolio was depleted around age ' + years.find(y => y.ranOut).age + '.';

  const sampleRows = years.filter((y, i) => i % 5 === 0 || y.ranOut).slice(0, 16);
  const table = `<div class="data-table-wrapper"><table class="data-table"><thead><tr><th scope="col">Age</th><th scope="col">Market</th><th scope="col">Portfolio</th><th scope="col">Spending</th></tr></thead><tbody>${sampleRows.map(y => `<tr><td>${y.age}</td><td style="color:${y.marketReturn<0?'var(--danger)':'var(--moss)'}">${(y.marketReturn*100).toFixed(0)}%</td><td>${fmtMoneyShort(y.portfolio)}</td><td>${fmtMoneyShort(y.spending)}</td></tr>`).join('')}</tbody></table></div>`;
  openModal(`<h2>${s.name} \u00b7 ${s.startYear}\u2013${s.startYear + (state.targetAge - state.age)}${run.padded?'*':''}</h2>
    <div class="detail-narrative">${narrative}</div>
    ${table}
    ${run.padded ? '<p style="font-size:14px;color:var(--ink-faint)">*This horizon extends beyond available history; the last ' + run.paddedYears + ' year' + (run.paddedYears === 1 ? '' : 's') + ' use the mix’s long-run compound return (' + pct(historicalStats(state.stockPct).geo) + ').</p>' : ''}
    <p style="font-size:14px;color:var(--ink-faint)">Past performance does not predict future results.</p>`);
};

// ===== SS HELPER (onboarding) =====
// targetId: the Social Security field to fill; incomeId: the income field to start from.
let ssHelperTarget = null;
// Works the payoff age out from what is left, the rate, and what is paid each year.
// targetId is the onboarding field to fill; with no target it sets the plan directly.
let payoffTarget = null;
// Social Security is filled in from income as you type, so nobody has to go and find
// the number. Typing in the box takes it over and the estimate stops.
window.ssHint = function(ssId) {
  const el = document.getElementById(ssId);
  const hint = document.getElementById(ssId + '_hint');
  if (!el || !hint) return;
  hint.textContent = el.dataset.auto === '1'
    ? 'Estimated from the income above. Type over it if you know the real figure.'
    : 'Annual, in today\u2019s dollars';
  hint.classList.toggle('is-auto', el.dataset.auto === '1');
};
window.autoEstimateSS = function(incomeId, ssId) {
  const ssEl = document.getElementById(ssId);
  if (!ssEl || ssEl.dataset.auto === '0') return;      // they typed their own figure
  const income = num(incomeId);
  ssEl.value = income > 0 ? moneyText(Math.round(estimateSSBenefit(income))) : '';
  ssEl.dataset.auto = income > 0 ? '1' : '';
  ssHint(ssId);
  stepProgress();
};

window.openPayoffHelper = function(targetId) {
  payoffTarget = targetId || null;
  const pay = targetId ? num('ob_housing') : state.housing;
  const knownAge = (targetId ? num('ob_age') : 0) || state.age || 0;
  openModal(`<h2>When is the mortgage paid off?</h2>
    <p>From what is left on it today, the rate, and what you pay in a year.</p>
    <div class="field-grid">
      ${knownAge >= 18 ? '' : `<div class="field"><label for="mp_age">Your age</label><input type="number" id="mp_age" min="18" max="90" placeholder="e.g. 45" oninput="runPayoffHelper()"/></div>`}
      <div class="field"><label for="mp_balance">Balance left</label><input type="text" id="mp_balance" class="money" inputmode="numeric" value="${state.mortgageBalance ? moneyText(state.mortgageBalance) : ''}" placeholder="e.g. $250,000" oninput="moneyType(this); runPayoffHelper()"/></div>
      <div class="field"><label for="mp_rate">Interest rate</label><input type="number" id="mp_rate" step="0.05" min="0" max="20" value="${state.mortgageRate ? (state.mortgageRate * 100).toFixed(2) : ''}" placeholder="e.g. 6.5" oninput="runPayoffHelper()"/><span class="field-hint">Percent a year</span></div>
      <div class="field"><label for="mp_payment">You pay per year</label><input type="text" id="mp_payment" class="money" inputmode="numeric" value="${pay ? moneyText(pay) : ''}" placeholder="e.g. $24,000" oninput="moneyType(this); runPayoffHelper()"/><span class="field-hint">Principal and interest only</span></div>
    </div>
    <div id="mp_result" class="mp-result"></div>`);
  runPayoffHelper();
};
window.runPayoffHelper = function() {
  const out = document.getElementById('mp_result');
  if (!out) return;
  const bal = moneyValue(document.getElementById('mp_balance'));
  const rate = parseFloat(document.getElementById('mp_rate').value);
  const pay = moneyValue(document.getElementById('mp_payment'));
  if (!bal || !pay || isNaN(rate)) { out.innerHTML = '<p class="mp-hint">Fill in the three boxes and the answer appears here.</p>'; return; }
  const baseAge = (payoffTarget ? num('ob_age') : 0) || state.age || num('mp_age') || 0;
  const years = mortgageYearsLeft(bal, rate, pay);
  if (years === null) {
    const yearlyInterest = Math.round(bal * rate / 100);
    out.innerHTML = `<p class="mp-warn">At ${fmtMoney(pay)} a year the balance never comes down: the interest alone is about ${fmtMoney(yearlyInterest)} in the first year. Check the rate, and that the payment is the yearly figure rather than the monthly one.</p>
      <p class="mp-hint">${fmtMoney(pay)} a month would be ${fmtMoney(pay * 12)} a year.</p>`;
    return;
  }
  const yearsText = years < 1 ? 'less than a year' : Math.round(years) + ' more year' + (Math.round(years) === 1 ? '' : 's');
  const age = baseAge >= 18 ? Math.round(baseAge + years) : null;
  out.innerHTML = `<p class="mp-answer">About <strong>${yearsText}</strong>${age ? `, so it is paid off around age <strong>${age}</strong>` : ''}.</p>
    ${age
      ? `<div style="margin-top:12px"><button class="btn-primary" onclick="usePayoffAge(${age}, ${bal}, ${rate})">Use age ${age}</button></div>`
      : '<p class="mp-hint">Add your age and this will give the payoff age too.</p>'}
    <p class="mp-hint">Rounded to the nearest year.</p>`;
};
window.usePayoffAge = function(age, balance, ratePercent) {
  state.mortgageBalance = balance;
  state.mortgageRate = ratePercent / 100;
  if (payoffTarget) {
    const el = document.getElementById(payoffTarget);
    if (el) { el.value = age; el.dispatchEvent(new Event('input')); }
    closeModal();
    if (el) el.focus();
    return;
  }
  state.mortgagePayoffAge = age;
  invalidateCaches();
  closeModal();
  render();
  showResultChanged();
};

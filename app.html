<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spend Enough</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400;8..60,500;8..60,600;8..60,700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js" integrity="sha384-e6nUZLBkQ86NJ6TVVKAeSaK8jWa3NhkYWZFomE39AvDbQWeie9PlQqM3pmYW5d1g" crossorigin="anonymous"></script>
<style>
  :root {
    --bone: #f4efe6;
    --bone-2: #ebe4d6;
    --ink: #1a1814;
    --ink-soft: #3d3830;
    --ink-mute: #6b6356;
    --ink-faint: #75695a;
    --rust: #a04a28;
    --rust-deep: #8a4226;
    --moss: #5b6e3a;
    --moss-deep: #3e4d28;
    --gold: #7d6420;
    --paper: #fbf8f1;
    --line: #d4cab8;
    --line-soft: #e2dac8;
    --danger: #a8331f;
    --danger-soft: #d8856f;
    --shadow-sm: 0 1px 0 rgba(26,24,20,0.04), 0 1px 2px rgba(26,24,20,0.06);
    --shadow-md: 0 2px 4px rgba(26,24,20,0.06), 0 8px 24px rgba(26,24,20,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter Tight', system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    background-image: none;
  }

  /* Data tables - horizontal scroll on mobile */
  .data-table { width: 100%; border-collapse: collapse; }
  /* Tables sit inside containers with different padding (main, deep-body, modal), so no bleed trick. */
  .data-table-wrapper { overflow-x: auto; max-width: 100%; touch-action: pan-y; overscroll-behavior-x: contain; }
  @media print { .data-table-wrapper { overflow: visible; } }
  
  /* Improve touch targets */
  button, input[type="button"], input[type="submit"], .clickable {
    min-height: 44px;
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
  }
  
  input[type="range"] { cursor: pointer; }
  
  /* Better modal behavior on mobile */
  .modal-overlay { padding: 16px; }
  @media (max-width: 480px) {
    .modal-overlay { align-items: flex-start; padding-top: 20px; }
    .modal { max-width: calc(100vw - 32px); max-height: calc(100vh - 40px); }
  }
  
  /* Prevent zoom on input focus (iOS) */
  input[type="text"], input[type="number"], input[type="email"], input[type="tel"], select, textarea {
    font-size: 16px !important;
  }

  /* ========== HEADER ========== */
  header {
    padding: 18px 32px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--paper);
  }
  .logo {
    font-family: 'Source Serif 4', serif;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.02em;
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .logo-dot {
    width: 8px; height: 8px;
    background: var(--rust);
    border-radius: 50%;
    display: inline-block;
    margin-right: 2px;
    transform: translateY(-2px);
  }
  .scenarios-bar { display: flex; gap: 8px; align-items: center; }
  .pro-pill { border-color: var(--ink) !important; color: var(--ink) !important; font-weight: 600; }
  .pro-pill:hover { background: var(--ink) !important; color: var(--paper) !important; }
  /* Paid: a filled badge in the header, so it is obvious the full version is on. */
  .paid-pill { background: var(--moss) !important; border-color: var(--moss) !important; color: var(--paper) !important; font-weight: 600; }
  .paid-pill:hover { background: var(--moss-deep) !important; border-color: var(--moss-deep) !important; }
  .unlock-more { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
  .unlock-more > summary { cursor: pointer; color: var(--rust); font-size: 14px; font-weight: 600; }
  .unlock-more[open] > summary { margin-bottom: 12px; }
  .scenario-pill {
    padding: 6px 14px; border: 1px solid var(--line); background: var(--paper);
    color: var(--ink-soft); font-size: 14px; border-radius: 100px; cursor: pointer;
    transition: all 0.15s ease; font-weight: 500; font-family: inherit;
  }
  .scenario-pill:hover { border-color: var(--ink); background: var(--bone-2); }

  /* ========== ONBOARDING ========== */
  .onboarding { max-width: 960px; margin: 0 auto; padding: 64px 40px; }
  .onboard-hero { margin-bottom: 48px; text-align: center; }
  .onboard-title { font-family: 'Source Serif 4', serif; font-size: clamp(34px, 5vw, 52px); font-weight: 400; line-height: 1.1; letter-spacing: -0.025em; margin: 0 auto 22px; max-width: 14em; text-wrap: balance; }
  .onboard-title em { font-style: italic; color: var(--rust); font-weight: 500; }
  .onboard-sub { font-family: 'Source Serif 4', serif; font-size: 20px; color: var(--ink-soft); max-width: 30em; margin: 0 auto; line-height: 1.5; }
  .onboard-fine { font-size: 13px; color: var(--ink-faint); margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line-soft); }
  .onboard-fine a { color: var(--rust); }
  .onboard-step { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 32px; margin-bottom: 14px; box-shadow: var(--shadow-sm); max-width: 680px; margin-left: auto; margin-right: auto; }
  .step-title { font-family: 'Source Serif 4', serif; font-size: 24px; font-weight: 500; margin-bottom: 6px; letter-spacing: -0.01em; }
  .step-hint { color: var(--ink-mute); font-size: 14px; margin-bottom: 22px; }
  .field-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
  .field-grid.cols-1 { grid-template-columns: 1fr; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-mute); font-weight: 600; }
  .field input, .field select { background: var(--bone); border: 1px solid var(--line); padding: 11px 14px; font-family: 'Inter Tight', system-ui, sans-serif; font-variant-numeric: tabular-nums; font-size: 15px; color: var(--ink); border-radius: 2px; transition: border-color 0.15s ease; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--ink); }
  .field-hint { font-size: 14px; color: var(--ink-faint); }
  .field-hint .helper-trigger { background: none; border: none; color: var(--rust); cursor: pointer; font-size: 14px; text-decoration: underline; padding: 0; font-family: inherit; }
  .step-actions { display: flex; justify-content: center; gap: 12px; margin-top: 28px; }
  .btn-primary { background: var(--ink); color: var(--paper); border: none; padding: 14px 28px; font-size: 15px; font-weight: 600; border-radius: 3px; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 8px; transition: background 0.15s ease; }
  .btn-primary:hover { background: var(--rust); }
  .btn-secondary { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); padding: 14px 22px; font-size: 14px; border-radius: 3px; cursor: pointer; font-family: inherit; }
  .btn-secondary:hover { border-color: var(--ink); }
  .validation-msg { color: var(--danger); font-size: 14px; text-align: center; margin-top: 14px; min-height: 18px; }

</style>
</head>
<style>
  /* ========== DASHBOARD LAYOUT ========== */
  .dashboard { display: grid; grid-template-columns: 400px 1fr; grid-template-areas: "sidebar main" "resources resources"; min-height: calc(100vh - 73px); }
  @media (min-width: 1500px) { .dashboard { grid-template-columns: 440px 1fr; } }
  .resources-row { grid-area: resources; border-top: 1px solid var(--line); padding: 22px 32px 30px; text-align: center; }
  .sidebar { grid-area: sidebar; background: var(--paper); border-right: 1px solid var(--line); padding: 22px 20px; overflow-y: auto; }
  .sidebar-section { margin-bottom: 22px; padding-bottom: 22px; border-bottom: 1px solid var(--line-soft); }
  .sidebar-section:last-child { border-bottom: none; }
  
  .sidebar-heading { text-transform: uppercase; letter-spacing: 0.12em; font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
  .sidebar-sub { font-size: 14px; color: var(--ink-mute); margin-bottom: 12px; }
  .preset-btn { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bone); padding: 9px 11px; font-size: 14px; color: var(--ink-soft); margin-bottom: 5px; border-radius: 3px; font-family: inherit; cursor: pointer; transition: border-color 0.15s ease; }
  .preset-btn:hover { border-color: var(--rust); color: var(--ink); }
  .preset-icon { color: var(--rust); font-style: italic; font-family: 'Source Serif 4', serif; margin-right: 5px; }
  .toggle-group { display: flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .toggle-btn { flex: 1; padding: 7px 4px; font-size: 14px; text-align: center; border: none; cursor: pointer; font-family: inherit; background: var(--bone); color: var(--ink-mute); transition: all 0.12s ease; }
  .toggle-btn:hover { background: var(--bone-2); }
  .toggle-btn.active { background: var(--ink); color: var(--paper); }
  .control { margin-bottom: 14px; }
  .control-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
  .control-label { color: var(--ink-soft); flex: 1; font-size: inherit; }
  .control-value { font-size: 14px; font-weight: 500; color: var(--ink); font-family: 'Inter Tight', system-ui, sans-serif; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .control input[type=range] { width: 100%; height: 4px; -webkit-appearance: none; appearance: none; background: var(--line); border-radius: 2px; outline: none; }
  .control input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 20px; height: 20px; background: var(--ink); border-radius: 50%; cursor: pointer; transition: background 0.12s; }
  .control input[type=range]::-webkit-slider-thumb:hover { background: var(--rust); }
  .control input[type=range]::-moz-range-thumb { width: 20px; height: 20px; background: var(--ink); border-radius: 50%; cursor: pointer; border: none; }
  .control input[type=number] { width: 100%; background: var(--bone); border: 1px solid var(--line); padding: 7px 9px; font-family: 'Inter Tight', system-ui, sans-serif; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--ink); border-radius: 2px; }
  .control input[type=number]:focus { outline: none; border-color: var(--ink); }
  .help-mark { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; min-width: 15px; border-radius: 50%; border: 1px solid var(--line); color: var(--ink-mute); font-size: 10px; font-style: italic; margin-left: 4px; cursor: help; font-family: 'Source Serif 4', serif; vertical-align: middle; overflow: hidden; box-sizing: border-box; }
  #tip-popup { position: fixed; z-index: 9999; background: var(--ink); color: var(--paper); font-size: 13px; padding: 6px 10px; border-radius: 4px; max-width: 260px; line-height: 1.4; pointer-events: none; display: none; font-family: inherit; }
  .more-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 3px; background: var(--bone); padding: 7px 10px; font-size: 14px; color: var(--ink-soft); font-family: inherit; cursor: pointer; font-weight: 600; }
  .more-toggle:hover { border-color: var(--ink-mute); color: var(--ink); }
  .more-toggle-chevron { font-size: 14px; color: var(--ink-mute); transition: transform 0.15s; }
  .more-hint { font-size: 14px; color: var(--ink-mute); margin-top: 5px; padding: 0 2px; letter-spacing: 0.01em; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .checkbox-row input { width: 14px; height: 14px; accent-color: var(--ink); }
  .checkbox-row label { font-size: 14px; color: var(--ink-soft); cursor: pointer; }
  .acct-grid { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; }
  .acct-grid label { font-size: 14px; color: var(--ink-soft); }
  .acct-grid input { width: 110px; background: var(--bone); border: 1px solid var(--line); padding: 6px 8px; font-family: 'Inter Tight', system-ui, sans-serif; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--ink); border-radius: 2px; text-align: right; }

  /* ========== MAIN ========== */
  .main { grid-area: main; padding: 24px 32px; overflow-y: auto; max-width: 1100px; }
  .disclaimer-bar { background: var(--bone-2); border: 1px solid var(--line); border-radius: 4px; padding: 10px 16px; font-size: 14px; line-height: 1.5; color: var(--ink-mute); margin-bottom: 18px; }
  .disclaimer-bar strong { color: var(--ink-soft); font-weight: 600; }
  .disclaimer-bar a { color: var(--rust); cursor: pointer; }
  .impact-banner { background: var(--bone-2); border-radius: 4px; padding: 11px 16px; font-size: 14px; color: var(--ink-soft); line-height: 1.6; margin-bottom: 16px; }
  .impact-banner strong { color: var(--ink); }
  .impact-banner button { background: none; border: none; color: var(--rust); cursor: pointer; font-family: inherit; font-size: 14px; text-decoration: underline; padding: 0; }

  /* Verdict */
  .verdict { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 20px 24px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
  .verdict-notes { margin: 0 4px 22px; font-size: 14px; color: var(--ink-soft); line-height: 1.6; }
  .verdict-notes p { margin-bottom: 8px; }
  .verdict-notes .verdict-caveat { margin-top: 0; }
  .verdict-head { font-family: 'Source Serif 4', serif; font-size: 26px; font-weight: 400; color: var(--ink); line-height: 1.25; margin-bottom: 10px; letter-spacing: -0.01em; }
  .verdict-body { font-size: 15px; color: var(--ink-soft); line-height: 1.6; }
  .verdict-caveat { font-size: 14px; color: var(--ink-faint); margin-top: 10px; font-style: italic; }
  .verdict-wedge { margin-top: 10px; padding: 12px 16px; background: rgba(184,92,56,0.06); border-left: 3px solid var(--rust); border-radius: 0 4px 4px 0; font-size: 15px; color: var(--ink); line-height: 1.5; }
  .verdict-wedge .wedge-amount { font-family: 'Inter Tight', system-ui, sans-serif; font-variant-numeric: tabular-nums; font-weight: 500; color: var(--rust); font-size: 16px; }
  .verdict-wedge .wedge-sub { font-size: 14px; color: var(--ink-mute); margin-top: 4px; }

  .toggle-btn.locked { opacity: 0.7; }
  .toggle-btn.locked .lock-icon { font-size: 14px; margin-left: 3px; }
  /* Free-tier preview of paid settings: visible but non-interactive */
  .locked-note { margin: 8px 0; padding: 8px 10px; background: var(--bone-2); border-left: 2px solid var(--rust); border-radius: 3px; font-size: 14px; color: var(--ink-soft); line-height: 1.5; }
  .link-btn { background: none; border: none; color: var(--rust); cursor: pointer; font-family: inherit; font-size: inherit; text-decoration: underline; padding: 0; min-height: 0; line-height: inherit; vertical-align: baseline; }
  .locked-preview { border: none; padding: 0; margin: 0; min-width: 0; opacity: 0.5; pointer-events: none; }
  .unlock-input-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .unlock-input-row input { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 3px; font-family: 'Inter Tight', system-ui, sans-serif; font-variant-numeric: tabular-nums; font-size: 14px; background: var(--paper); }
  .unlock-input-row button { padding: 10px 16px; background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 3px; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer; transition: border-color .15s ease, background .15s ease; }
  .unlock-input-row button:hover { border-color: var(--ink); background: var(--bone); }
  .unlock-input-row button:disabled { opacity: 0.55; cursor: default; }
  .unlock-input-row button:hover { background: var(--rust-deep); }
  /* Free and full comparison (unlock modal) */
  .compare-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .compare-col { border: 1px solid var(--line); border-radius: 5px; padding: 14px 16px; background: var(--bone); min-width: 0; }
  .compare-col.pro { border-color: var(--rust); background: rgba(184,92,56,0.05); }
  .compare-head { font-family: 'Source Serif 4', serif; font-size: 17px; font-weight: 600; color: var(--ink); }
  .compare-col.pro .compare-head { color: var(--rust-deep); }
  .compare-sub { font-size: 14px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
  .compare-plus { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  .compare-list { list-style: none; margin: 0; padding: 0; }
  .compare-list li { font-size: 14px; color: var(--ink-soft); line-height: 1.4; padding: 6px 0 6px 18px; position: relative; border-top: 1px solid var(--line-soft); }
  .compare-list li:first-child { border-top: none; }
  .compare-list li::before { content: '\2713'; position: absolute; left: 0; top: 6px; color: var(--moss); font-weight: 700; }
  .compare-col.pro .compare-list li::before { color: var(--rust); }

  /* Unlock modal improvements */
  .modal h2 { color: var(--ink); }
  .modal ul { list-style: none; padding: 0; }
  .modal ul li { position: relative; padding-left: 20px; }
  .modal ul li:before { content: "✓"; position: absolute; left: 0; color: var(--moss); font-weight: 600; }

  /* Sections */
  .section-heading { font-family: 'Source Serif 4', serif; font-size: 18px; font-weight: 500; color: var(--ink); margin: 26px 0 4px; }
  .section-sub { font-size: 14px; color: var(--ink-mute); line-height: 1.5; margin-bottom: 14px; }

  /* Confidence bands */
  .bands { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .band { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; }
  .band-label { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 2px; }
  .band-sub { font-size: 14px; color: var(--ink-mute); margin-bottom: 8px; }
  .band-value { font-size: 17px; font-weight: 600; font-family: 'Inter Tight', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .band.warn .band-value { color: var(--danger); }
  .band.ok .band-value { color: var(--moss); }
  .band.neutral .band-value { color: var(--ink-soft); }

  /* Chart */
  .chart-card { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 18px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
  .chart-wrap { position: relative; height: 360px; }
  .chart-wrap.short { height: 200px; }

  /* Tables */
  .data-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 18px; }
  .data-table th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); color: var(--ink-mute); font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em; }
  .data-table td { padding: 8px 10px; border-bottom: 1px solid var(--line-soft); color: var(--ink-soft); }
  .data-table tr.current-row { background: var(--bone-2); }
  .data-table .tag-current { display: inline; background: none; color: var(--rust); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; margin-left: 8px; padding: 0; vertical-align: baseline; white-space: nowrap; }
  .data-table tr.current-row { background: rgba(160,74,40,0.05); }
  .data-table tr.current-row td { border-bottom-color: var(--line); }
  .data-table .fail { color: var(--danger); font-weight: 600; }
  .data-table .clickable { cursor: pointer; }
  .data-table .clickable:hover { background: var(--bone-2); }

  /* Stress cards */
  .scenario-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .scenario-card { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; cursor: pointer; transition: border-color 0.15s ease; }
  .scenario-card:hover { border-color: var(--rust); }
  .scenario-card.failed { border-left: 3px solid var(--danger); }
  .scenario-card.survived { border-left: 3px solid var(--moss); }
  .scenario-name { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 2px; }
  .scenario-years { font-size: 14px; color: var(--ink-mute); margin-bottom: 5px; font-family: 'Inter Tight', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .scenario-result { font-size: 14px; font-weight: 600; }
  .scenario-result.ok { color: var(--moss); }
  .scenario-result.fail { color: var(--danger); }
  .scenario-desc { font-size: 14px; color: var(--ink-mute); margin-top: 5px; line-height: 1.4; }
  .scenario-card.add { border-style: dashed; display: flex; align-items: center; justify-content: center; color: var(--ink-faint); font-size: 14px; }

  /* Flexibility */
  .flex-box { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 16px 20px; margin-bottom: 10px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; text-align: center; }
  .flex-label { font-size: 14px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .flex-value { font-size: 18px; font-weight: 600; font-family: 'Inter Tight', system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .flex-arrow { font-size: 20px; color: var(--rust); }
  .flex-note { font-size: 14px; color: var(--ink-mute); line-height: 1.5; margin-bottom: 18px; }

  /* SS comparison */
  .ss-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }

  .faq-item summary::-webkit-details-marker { display: none; }

  .faq-body ul { padding-left: 18px; margin: 6px 0; }

  /* Assumptions panel + "Read this first" */
  .assumptions, .read-first { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
  .assumptions summary, .read-first summary { cursor: pointer; padding: 14px 18px; font-weight: 600; font-size: 15px; color: var(--ink-soft); list-style: none; display: flex; align-items: center; gap: 10px; }
  .assumptions summary::-webkit-details-marker, .read-first summary::-webkit-details-marker { display: none; }
  .assumptions summary::after, .read-first summary::after { content: '+'; color: var(--ink-mute); font-size: 18px; position: absolute; right: 0; top: 14px; }
  .assumptions[open] summary::after, .read-first[open] summary::after { content: '\2212'; }
  .asm-hint { font-weight: 400; color: var(--ink-mute); font-size: 14px; }
  .asm-body, .read-first-body { padding: 0 18px 16px; }
  .read-first-body p { font-size: 14px; color: var(--ink-soft); line-height: 1.65; margin-bottom: 10px; }
  .read-first-body p:last-child { margin-bottom: 0; }
  .asm-row { display: grid; grid-template-columns: 120px 1fr; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line-soft); font-size: 14px; line-height: 1.6; color: var(--ink-soft); }
  .asm-label { font-weight: 700; color: var(--ink); text-transform: uppercase; letter-spacing: 0.06em; font-size: 12px; padding-top: 3px; }
  .asm-text strong { color: var(--ink); font-family: 'Inter Tight', system-ui, sans-serif; font-variant-numeric: tabular-nums; font-weight: 500; }
  /* Editable numbers inside sentences: look like the other numbers, with a dashed underline. */
  input.asm-input[type="number"], select.asm-select { font: inherit; font-size: 14px !important; font-weight: 600; color: var(--ink); background: transparent; border: none; border-bottom: 1px dashed var(--rust); border-radius: 0; padding: 0; margin: 0; height: auto; min-height: 0; line-height: inherit; font-variant-numeric: tabular-nums; -moz-appearance: textfield; appearance: none; -webkit-appearance: none; }
  input.asm-input[type="number"] { width: 4.5ch; text-align: left; }
  input.asm-input[type="number"].wide { width: 7.5ch; }
  input.asm-input::-webkit-outer-spin-button, input.asm-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input.asm-input[type="number"]:hover, input.asm-input[type="number"]:focus, select.asm-select:hover, select.asm-select:focus { background: var(--bone); outline: none; border-bottom-color: var(--ink); }
  select.asm-select { cursor: pointer; padding-right: 0; }
  @media (max-width: 768px) { input.asm-input[type="number"], select.asm-select { font-size: 16px !important; } }
  .asm-slider { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; margin-top: 10px; max-width: 440px; font-size: 12px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.06em; }
  .asm-slider output { grid-column: 1 / -1; font-family: 'Inter Tight', system-ui, sans-serif; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink); text-transform: none; letter-spacing: 0; }
  input[type="range"].asm-range { width: 100%; height: 6px; margin: 0; background: var(--line); border-radius: 3px; -webkit-appearance: none; appearance: none; }
  input[type="range"].asm-range::-webkit-slider-runnable-track { height: 6px; background: var(--line); border-radius: 3px; }
  input[type="range"].asm-range::-moz-range-track { height: 6px; background: var(--line); border-radius: 3px; }
  input[type="range"].asm-range::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -6px; background: var(--ink); border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--line); border-radius: 50%; cursor: pointer; }
  input[type="range"].asm-range::-moz-range-thumb { width: 18px; height: 18px; background: var(--ink); border: 2px solid var(--paper); box-shadow: 0 0 0 1px var(--line); border-radius: 50%; cursor: pointer; }
  .asm-sources { font-size: 13px; color: var(--ink-faint); margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line-soft); line-height: 1.5; }
  .asm-sources a { color: var(--rust); }
  .teaser-row { margin: 4px 0 18px; }
  .wwit { background: var(--paper); border: 1px solid var(--line); border-left: 3px solid var(--moss); border-radius: 4px; padding: 14px 18px; margin: 0 0 18px; font-size: 14px; color: var(--ink-soft); line-height: 1.6; }
  .wwit .wwit-title { font-family: 'Source Serif 4', serif; font-size: 18px; color: var(--ink); margin-bottom: 4px; }
  .wwit ul { margin: 6px 0 0 18px; }
  .wwit li { margin-bottom: 3px; }
  .wwit strong { color: var(--ink); font-weight: 600; }
  .year-preview td, .year-preview th { text-align: right; white-space: nowrap; }
  .year-preview td.milestone, .year-preview th:first-child { text-align: left; color: var(--ink-mute); font-size: 13px; }
  .year-preview tr.out td { color: var(--danger); }
  .year-preview { max-width: 520px; }
  .year-preview.year-full { max-width: none; font-size: 11px; width: auto; margin-left: auto; margin-right: auto; }
  .year-preview.year-full td, .year-preview.year-full th { padding: 2px 10px; text-align: right; }
  .year-preview.year-full td.agecell, .year-preview.year-full th:first-child { text-align: left; }
  .year-preview.year-full .ms { color: var(--ink-mute); font-size: 9px; margin-left: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
  .saved-note { font-size: 12px; color: var(--ink-faint); margin-top: -4px; margin-bottom: 6px; line-height: 1.4; }
  .print-only { display: none; }
  @media print {
    .print-only { display: block; }
    body { background: #fff; font-size: 12px; }
    header, .sidebar, .resources-row, .teaser-row, .more-toggle, .link-btn, .modal-overlay, #tip-popup, .cf-toggle, .toggle-group, .year-actions { display: none !important; }
    .dashboard { display: block; min-height: 0; }
    .main { max-width: none; padding: 0; overflow: visible; }
    .print-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 14px; font-size: 12px; color: var(--ink-mute); }
    .print-head .logo { font-size: 18px; }
    .chart-wrap { height: 280px; } .chart-wrap.short { height: 160px; }
    .assumptions summary::after, .deep summary::after, .read-first summary::after { content: ''; }
    details:not([open]) { display: none; }
    .assumptions, .deep, .wwit, .verdict, .chart-card, .bands, .scenario-cards { break-inside: avoid; box-shadow: none; }
    .section-heading { break-after: avoid; }
    input.asm-input[type="number"], select.asm-select { border-bottom: none; }
    .data-table { font-size: 11px; }
    a { text-decoration: none; color: inherit; }
  }
  .deep { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; margin: 4px 0 18px; box-shadow: var(--shadow-sm); }
  .deep summary { cursor: pointer; padding: 14px 18px; font-weight: 600; font-size: 15px; color: var(--ink-soft); list-style: none; display: flex; align-items: center; gap: 10px; }
  .deep summary::-webkit-details-marker { display: none; }
  .deep summary::after { content: '+'; color: var(--ink-mute); font-size: 18px; position: absolute; right: 0; top: 14px; }
  .deep[open] summary::after { content: '\2212'; }
  .deep-body { padding: 0 18px 18px; }
  .deep-body .section-heading:first-child { margin-top: 8px; }
  .more-toggle .asm-hint { font-weight: 400; margin-left: 6px; }
  .field-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
  .compare-table td:first-child { color: var(--ink-mute); }
  .terms-line { font-size: 12.5px; color: var(--ink-faint); text-align: center; margin: 0 0 10px; }
  .terms-line a { color: var(--ink-mute); }
  .unlock-note { font-size: 13px; color: var(--ink-faint); margin: 6px 0 0; text-align: center; }
  .unlock-msg { font-size: 14px; color: var(--danger); margin: 8px 0 0; text-align: center; min-height: 0; }
  .unlock-msg:empty { display: none; }
  .unlock-hint { font-size: 14px; color: var(--ink-soft); margin: 0 0 10px; text-align: center; }
  .pro-status { font-size: 13px; color: var(--ink-faint); margin: 0 0 10px; }
  .unlock-already { font-size: 14px; color: var(--ink-mute); margin: 0 0 10px; text-align: center; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 4px; font-size: 14px; box-shadow: var(--shadow-md); z-index: 150; max-width: calc(100vw - 32px); text-align: center; }
  @media print { .toast { display: none; } }
  @media (max-width: 600px) { .asm-row { grid-template-columns: 1fr; gap: 4px; } }

  /* Saved scenarios */
  .scenario-save-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .scenario-save-row input { flex: 1; background: var(--bone); border: 1px solid var(--line); padding: 8px 10px; font-size: 14px; border-radius: 2px; font-family: inherit; }
  .saved-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 14px; }
  .saved-item button { background: none; border: none; color: var(--rust); cursor: pointer; font-size: 14px; font-family: inherit; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(26,24,20,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
  .modal { background: var(--paper); border-radius: 6px; max-width: 600px; max-height: 80vh; overflow-y: auto; padding: 32px; box-shadow: var(--shadow-md); }
  .modal.modal-wide { max-width: 840px; width: 100%; max-height: 94vh; padding: 28px 32px; }
  .modal.modal-wide .compare-list li { padding: 5px 0 5px 18px; }
  .modal h2 { font-family: 'Source Serif 4', serif; font-size: 22px; font-weight: 500; margin-bottom: 16px; }
  .modal p { font-size: 14px; color: var(--ink-soft); line-height: 1.7; margin-bottom: 12px; }
  .modal .modal-close { float: right; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--ink-mute); min-width: 44px; min-height: 44px; margin: -10px -12px 0 0; }
  /* Keyboard focus is visible on everything, whatever an older rule says. */
  :is(a, button, input, select, textarea, summary, [tabindex]):focus-visible { outline: 2px solid var(--rust) !important; outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* The help mark is a button now; keep it the small round "i" it always was, with a 24px tap area around it. */
  button.help-mark { width: 16px; height: 16px; min-width: 16px; min-height: 16px; padding: 0; line-height: 1; box-shadow: none; position: relative; cursor: help; }
  button.help-mark::before { content: ""; position: absolute; inset: -5px; }

  .detail-narrative { background: var(--bone-2); border-radius: 4px; padding: 14px 18px; font-size: 14px; color: var(--ink-soft); line-height: 1.6; margin-bottom: 14px; }

  @media (max-width: 860px) {
    .dashboard { grid-template-columns: 1fr; grid-template-areas: "main" "sidebar" "resources"; }
    .preset-btn { text-align: center; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--line); }
    .bands, .scenario-cards, .ss-grid { grid-template-columns: 1fr 1fr; }
  }

  /* Tablet & Small Screens (768px and below) */
  @media (max-width: 768px) {
    .dashboard { display: flex; flex-direction: column; }
    .main { order: 1; }
    .sidebar {
      order: 2;
    }
    
    body { font-size: 14px; }
    header { padding: 14px 20px; }
    .logo { font-size: 20px; }
    .scenarios-bar { gap: 6px; flex-wrap: wrap; }
    
    .sidebar { max-height: none; border-bottom: 1px solid var(--line); }
    .main { padding: 16px 20px; max-width: 100%; }

    .sidebar-section:last-child { border-bottom: none; }

    .control-row { font-size: 14px; }
    
    .toggle-group { gap: 4px; }
    .toggle-btn { padding: 8px 12px; font-size: 14px; }
    
  }

  /* Desktop default: sliders visible, number inputs hidden */
  .slider-input { display: block; }
  .mobile-input { display: none; }

  /* Range input base reset (its selector was dropped by an earlier edit) */
  input[type="range"] {
    width: 100%;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    background: transparent;
  }

  /* Narrow/mobile: swap sliders for compact inline inputs at the same point the layout
     collapses to a single column (860px), so we never show wide sliders in a narrow column. */
  @media (max-width: 860px) {
    .slider-input { display: none; }
    .control {
      display: grid;
      grid-template-columns: 1fr 100px;
      align-items: center;
      column-gap: 12px;
      margin-bottom: 12px;
    }
    .control-row { margin-bottom: 0; min-width: 0; }
    .control:has(.mobile-input) .control-row .control-value { display: none; }     /* value lives in the input now */
    /* Sliders without a number field keep their value and span full width below the label */
    .control:not(:has(.mobile-input)) { display: block; }
    .control:not(:has(.mobile-input)) .control-row { margin-bottom: 6px; }
    .control:not(:has(.mobile-input)) input[type="range"] { display: block; margin: 6px 0 4px; }
    .control input[type="range"] { grid-column: 1 / -1; }
    .mobile-input {
      display: block;
      grid-column: 2;
      width: 100%;
      text-align: right;
      min-height: 36px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 3px;
      font-size: 14px;
      font-family: 'Inter Tight', system-ui, sans-serif; font-variant-numeric: tabular-nums;
      background: var(--paper);
      color: var(--ink);
      margin-top: 0;
    }

      border-color: var(--rust);
      box-shadow: 0 0 0 2px rgba(184,92,56,0.1);
    }
    .resources-row { padding: 22px 20px 24px; order: 3; }
  }
  
  /* Desktop slider styling lives in the .control input[type=range] rules above
     (thin track + small thumb). The oversized touch-scale styling was removed. */

  .assumptions, .read-first, .deep { background: transparent; border: none; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); border-radius: 0; box-shadow: none; margin: 18px 0; }

  /* results: smaller pieces */
  .event-line { font-family: 'Source Serif 4', serif; font-size: 15.5px; color: var(--ink-mute); line-height: 1.5; margin: 0 0 18px; max-width: none; }

  .impact { margin: 0; padding: 0; font-size: 13px; color: var(--ink-mute); }

  @keyframes verdict-changed { from { background: rgba(91,110,58,0.14); } to { background: transparent; } }

  /* sidebar forms: life events, save and compare */
  .ev-hint { font-size: 13px; color: var(--ink-faint); margin-bottom: 8px; line-height: 1.45; }
  .ev-list { border-top: 1px solid var(--line-soft); margin-bottom: 10px; }

  .ev-age { color: var(--ink-faint); }
  .ev-amt { font-variant-numeric: tabular-nums; font-weight: 600; }

  .ev-form input:focus, .save-form input:focus { outline: none; border-color: var(--ink); }
  .ev-form .compare-btn { grid-column: 1 / -1; margin-top: 2px; justify-content: center; }
  .save-form .compare-btn { margin-top: 2px; justify-content: center; }
  .ev-msg { font-size: 13px; color: var(--danger); min-height: 0; margin-top: 6px; }
  .ev-msg:empty { display: none; }
  .saved-list { margin-top: 12px; border-top: 1px solid var(--line-soft); }

  .saved-actions button:hover { text-decoration: underline; }

  /* expandable sections: title on its own line, the hint under it */

  .sum-title { font-family: 'Source Serif 4', serif; font-weight: 500; font-size: 18px; color: var(--ink); flex: 1 1 auto; min-width: 0; }
  .asm-hint { flex: 1 1 100%; margin-left: 0; font-family: 'Inter Tight', system-ui, sans-serif; font-size: 13.5px; color: var(--ink-mute); font-weight: 400; line-height: 1.4; }
  @media (min-width: 900px) { .sum-title { flex: 0 0 auto; } .asm-hint { flex: 1 1 auto; } }
  .more-toggle .sum-stack { display: flex; flex-direction: column; gap: 2px; text-align: left; min-width: 0; }
  .more-toggle .sum-stack .asm-hint { margin-left: 0; }
  /* one rule between the table above and the first section */

  /* the help mark and its tip */

  .help-mark:hover { background: var(--ink); color: var(--paper); }

  .acct-grid label { font-size: 13px; color: var(--ink-mute); }

  .acct-grid input:focus { outline: none; border-color: var(--ink); }
  .more-toggle .sum-stack { width: 100%; }
  .sum-line { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; width: 100%; }
  .more-toggle.deep-teaser { position: relative; }

  /* ---- inputs: recessed into the page, not drawn on top of it ---- */
  .field input, .field select,
  .acct-grid input, .ev-form input, .save-form input,
  .control input[type=number], .scenario-save-row input,
  #unlockKeyInput, #scenarioName, #scenarioNote {
    background: var(--bone);
    border: 1px solid var(--line);
    border-radius: 3px;
    box-shadow: inset 0 1px 2px rgba(26,24,20,0.07), inset 0 0 0 1px rgba(255,255,255,0.4);
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }

  .acct-grid input:focus, .ev-form input:focus, .save-form input:focus,
  .control input[type=number]:focus, .scenario-save-row input:focus,
  #unlockKeyInput:focus, #scenarioName:focus, #scenarioNote:focus {
    outline: none;
    background: var(--paper);
    border-color: var(--ink);
    box-shadow: inset 0 1px 2px rgba(26,24,20,0.05), 0 0 0 3px rgba(160,74,40,0.13);
  }
  .field select, .ev-form select, .save-form select { box-shadow: none; }
  /* money reads as money: tabular figures, right aligned, a touch heavier */
  input.money { font-family: 'Inter Tight', system-ui, sans-serif; font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; text-align: right; font-weight: 500; letter-spacing: 0.01em; }
  .acct-grid input { text-align: right; }
  /* the sidebar's own select boxes match the fields */
  .sidebar select { background: var(--bone); border: 1px solid var(--line); border-radius: 3px; padding: 8px 10px; font: inherit; font-size: 14px; color: var(--ink); width: 100%; }
  .sidebar select:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(160,74,40,0.13); }

  /* ---- sidebar hierarchy ----
     Top-level groups (Your plan, Mode, Save and compare) keep the tracked label.
     Everything inside "More about you" is nested behind a rule with its own
     quieter heading, so it is obvious which settings belong to it. */
  .more-body { margin: 10px 0 0 0; padding: 2px 0 2px 14px; border-left: 2px solid var(--line); }
  .sub-heading { font-family: 'Source Serif 4', serif; font-size: 16px; font-weight: 500; color: var(--ink); letter-spacing: -0.01em; margin: 20px 0 8px; text-transform: none; }

  .ev-form label, .save-form label { gap: 5px; }
  .sidebar select { font-size: 14px; }
  .more-body .ev-hint, .more-body .acct-total { font-size: 12.5px; color: var(--ink-faint); }

  /* ---- onboarding: the landing page's margin-column grid, so a form reads as a sequence ---- */
  .onboarding { max-width: 1060px; }
  .onboard-step { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 40px; align-items: start; max-width: none; }
  .step-side { display: flex; gap: 10px; align-items: baseline; }
  .step-num { font-family: 'Source Serif 4', serif; font-size: 15px; font-weight: 400; color: var(--rust); font-variant-numeric: tabular-nums; line-height: 1.5; flex-shrink: 0; }
  .step-title { font-size: 21px; line-height: 1.25; margin-bottom: 4px; }
  .step-hint { font-size: 15px; margin-bottom: 0; line-height: 1.45; }
  .onboard-step .field-grid { gap: 20px 18px; }
  .field.span-2 { grid-column: 1 / -1; }
  .partner-field[hidden], .housing-field[hidden], .mortgage-field[hidden] { display: none !important; }   /* .field is display:flex, which would otherwise win */
  /* Your plan: Money and Timeline groups, filled slider tracks, age steppers */
  .plan-sub { font-family: 'Source Serif 4', serif; font-size: 16px; font-weight: 500; color: var(--ink); margin: 4px 0 10px; }
  .control + .plan-sub { margin-top: 20px; }
  .control input[type=range] { height: 5px; border-radius: 3px; background: linear-gradient(to right, var(--ink) 0, var(--ink) var(--pct, 0%), var(--line-soft) var(--pct, 0%), var(--line-soft) 100%); }
  .control input[type=range]::-webkit-slider-thumb { width: 13px; height: 13px; border: 2px solid var(--bone); box-sizing: border-box; }
  .control input[type=range]::-moz-range-thumb { width: 13px; height: 13px; border: 2px solid var(--bone); box-sizing: border-box; }
  .control-step { margin-bottom: 9px; }
  .control-step .control-row { margin-bottom: 0; }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 3px; background: var(--paper); overflow: hidden; flex: none; }
  .stepper .step-btn { width: 26px; height: 26px; border: none; background: none; color: var(--ink-mute); font: inherit; font-size: 15px; line-height: 1; cursor: pointer; padding: 0; }

  @media (max-width: 860px) {
    .control-step { display: block; }
    .stepper .step-btn { width: 32px; height: 36px; font-size: 17px; }
    .stepper input[type=number] { width: 36px; height: 36px; font-size: 15px; }
  }
  .plan-for { display: inline-flex; align-self: flex-start; margin-top: 6px; }   /* .field stretches children; keep the frame on the buttons */
  .plan-for .toggle-btn { flex: 0 0 auto; padding: 8px 18px; }
  .step-actions { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 0; margin-top: 36px; }
  .step-actions .btn-primary { justify-self: center; }
  .step-actions .blank-note { max-width: 84ch; margin-top: 22px; }
  .step-actions .onboard-fine { width: 100%; }
  @media (max-width: 720px) {
    .onboard-step, .step-actions { grid-template-columns: 1fr; gap: 14px; }

  }

  /* a step ticks off as you fill it, so the page shows progress without extra screens */
  .step-num { position: relative; display: inline-block; min-width: 1.1em; transition: color .2s ease; }
  .onboard-step.done .step-num { color: transparent; }
  .onboard-step.done .step-num::after {
    content: ''; position: absolute; left: 0; top: 0.45em;
    width: 0.62em; height: 0.34em; border-left: 2px solid var(--moss); border-bottom: 2px solid var(--moss);
    transform: rotate(-45deg) scale(0.6); transform-origin: center; opacity: 0;
    animation: tick .28s cubic-bezier(.2,.9,.3,1.3) forwards;
  }
  @keyframes tick { to { transform: rotate(-45deg) scale(1); opacity: 1; } }
  .onboard-step.done .step-title { color: var(--ink-mute); transition: color .2s ease; }
  .blank-note { font-size: 14px; color: var(--ink-faint); margin-top: 14px; max-width: 70ch; line-height: 1.5; }
  /* Onboarding reads as questions a person is asking, not fields on a system. */
  .onboarding .step-title { font-size: 27px; }
  .onboarding .step-hint { font-family: 'Source Serif 4', serif; font-size: 16px; line-height: 1.5; color: var(--ink-mute); }
  .onboarding .field label { font-size: 15px; font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--ink); }
  .onboarding .field input, .onboarding .field select { background: var(--bone); border: 1px solid #a89f90; border-radius: 4px; padding: 13px 14px; font-size: 16px; }
  .onboarding .field input::placeholder { color: var(--ink-faint); }
  .onboarding .field-hint { font-family: 'Source Serif 4', serif; font-size: 15px; line-height: 1.45; color: var(--ink-mute); }
  .onboarding .toggle-group { border-color: #a89f90; background: var(--bone); }
  .onboarding .toggle-btn { font-size: 15px; padding: 10px 8px; background: var(--bone); }
  .onboarding .toggle-btn.active { background: var(--ink); }
  @media (prefers-reduced-motion: reduce) { .onboard-step.done .step-num::after { animation: none; opacity: 1; transform: rotate(-45deg) scale(1); } }
  input.money::placeholder { font-weight: 400; color: var(--ink-faint); letter-spacing: 0; }

  /* ============================================================
     Phones: answer, chart, then the controls. The deep reading
     moves below them, so changing something is never a long scroll.
     ============================================================ */
  .mini-verdict { display: none; }
  @media (max-width: 768px) {
    .dashboard { display: flex; flex-direction: column; padding: 0 20px; }
    .main { display: contents; }              /* its children become the page's blocks */
    .main > * { order: 1; }                    /* results first */
    .sidebar { order: 2; background: transparent; border: none; padding: 26px 0 8px; margin: 0; }
    .main > .read-first, .main > .assumptions, .main > .deep,
    .main > .deep-teaser, .main > .disclaimer-bar { order: 3; }
    .resources-row { order: 4; padding: 18px 0 40px !important; }
    /* the sidebar's own order: adjust what is there, then try a scenario */
    .sidebar { display: flex; flex-direction: column; }

<script>
"use strict";

/* ----------------------------------------------------------------------------
   Simulation engine, estimators, DEFAULT_STATE and SAMPLE_STATE now live in
   engine.js (loaded above) and are available here as globals; the pure license
   decisions live in paywall.js. This file holds only UI: state wiring, rendering,
   charts, handlers, modals, and the license-server calls.
   ---------------------------------------------------------------------------- */

let state = withDefaults(null);
let activeView = 'onboarding';

// The plan lives in local storage so a refresh, or a phone reloading the tab, brings
// people back to where they were. Only "Start over" clears it. The onboarding form
// keeps a draft of what has been typed so far, for the same reason.
const PLAN_STORE = 'spendenough_plan';
const DRAFT_STORE = 'spendenough_draft';
function savePlan() {
  try { localStorage.setItem(PLAN_STORE, JSON.stringify({ v: 1, savedAt: Date.now(), activeView, state, baselineState, baselineName, currentName })); }
  catch (e) { /* private mode or storage full */ }
}
function loadPlan() {
  try {
    const raw = localStorage.getItem(PLAN_STORE); if (!raw) return false;
    const p = JSON.parse(raw); if (!p || p.v !== 1 || !p.state || typeof p.state !== 'object') return false;
    state = withDefaults(p.state);
    baselineState = p.baselineState ? withDefaults(p.baselineState) : JSON.parse(JSON.stringify(state));
    baselineName = p.baselineName || 'Starting point'; currentName = p.currentName || 'Current';
    activeView = p.activeView === 'dashboard' ? 'dashboard' : 'onboarding';
    return true;
  } catch (e) { return false; }
}
function clearPlan() { try { localStorage.removeItem(PLAN_STORE); } catch (e) { /* private mode */ } clearDraft(); }
function saveDraft() {
  try {
    const d = {};
    document.querySelectorAll('.onboarding input[id^="ob_"], .onboarding select[id^="ob_"]').forEach(el => { d[el.id] = el.value; });
    localStorage.setItem(DRAFT_STORE, JSON.stringify(d));
  } catch (e) { /* private mode or storage full */ }
}
function restoreDraft() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(DRAFT_STORE) || 'null'); } catch (e) { d = null; }
  if (!d || typeof d !== 'object') return;
  // Only fill boxes that are still blank: values that come from the plan itself win.
  Object.keys(d).forEach(id => { const el = document.getElementById(id); if (el && String(el.value).trim() === '' && String(d[id]).trim() !== '') el.value = d[id]; });
}
function clearDraft() { try { localStorage.removeItem(DRAFT_STORE); } catch (e) { /* private mode */ } }
let savedScenarios = (() => { try { const v = JSON.parse(localStorage.getItem('zeroline_scenarios') || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } })();
function persistScenarios() { try { localStorage.setItem('zeroline_scenarios', JSON.stringify(savedScenarios)); } catch (e) { /* private mode or storage full */ } }
const escHtml = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let chart = null, cashflowChart = null;
let lastSimResult = null;
let lastVerdict = null; // so the expandable section can carry the method note and caveat
let baselineState = null, baselineResult = null, baselineName = 'Starting point';
let compareOn = false;
let maxSpendStale = true;
let spendingLevelsCache = null, spendingLevelsStale = true;
// Paying users see their details open unless they closed them; free users see the locked preview on request.
const narrowNow = () => !!(window.matchMedia && window.matchMedia('(max-width: 768px)').matches);
const MORE_KEY = () => narrowNow() ? 'spendenough_more_phone' : 'spendenough_more';
const morePref = () => { try { return localStorage.getItem(MORE_KEY()); } catch (e) { return null; } };
let showMoreOptions = morePref() === 'open';
let moreDefaultApplied = false;
let isFirstDashboard = true;
let maxSpendView = false;
let cashflowMode = 'net';
let assumptionsOpen = false;
let readFirstOpen = false;
let deepOpen = false;
let currentName = 'Current';
let pendingScenario = (() => { try { return new URLSearchParams(location.search).get('scenario'); } catch (e) { return null; } })();

// Deployment config (config.js, public values only) and feature flags.
const CONFIG = Object.assign({ checkoutUrl: '', price: '$39', emailEndpoint: '' }, window.SPENDENOUGH_CONFIG || {});
// Presets that invent a dollar figure (home sale $400k at 70, long-term care $90k x 5)
// stay off until the owner decides on defaults. Rule: never invent financial assumptions.
const FLAGS = { hardcodedPresets: false };
const has = (v) => v !== null && v !== undefined;
// Fill any field a saved or older state lacks, so 'not set' is always null rather than undefined.
function withDefaults(s) { return Object.assign(JSON.parse(JSON.stringify(DEFAULT_STATE)), s || {}); }
// Housing is 'mortgage' (a payment until the payoff age), 'rent' (for the whole plan, unless
// a home is bought later), or 'none' (owned outright). Plans saved before the choice existed
// have no housingType and are mortgages. engine.js applies the same rules.
const housingKind = (s) => s.housingType === 'rent' ? 'rent' : s.housingType === 'none' ? 'none' : 'mortgage';
const hasMortgage = (s) => housingKind(s) === 'mortgage' && s.housing > 0;
const hasBuy = (s) => housingKind(s) === 'rent' && has(s.homeBuyAge);
// A renter can only sell a home bought earlier in the plan.
const hasSale = (s) => has(s.homeSaleAge) && (housingKind(s) !== 'rent' || (hasBuy(s) && s.homeSaleAge > s.homeBuyAge));
function clearHomeBuy(s) { s.homeBuyAge = null; s.homeBuyDownPayment = 0; s.homeBuyPayment = 0; s.homeBuyPayoffAge = null; s.homeBuyUpkeep = 0; }
function clearHomeSale(s) { s.homeSaleAge = null; s.homeSaleProceeds = 0; s.postSaleHousing = 0; }
// Keeps the housing fields consistent with the housing type after any change: a switch, a
// removed what-if, or an undo. Owned outright has no payment, only renters buy later, and a
// sale needs a home to sell.
function normalizeHousing(s) {
  const k = housingKind(s);
  if (k !== 'mortgage') { s.mortgageBalance = 0; s.mortgageRate = 0; s.postPayoffSpend = 0; }
  if (k !== 'rent') clearHomeBuy(s);
  if (k === 'none') s.housing = 0;
  if (has(s.homeSaleAge) && !hasSale(s)) clearHomeSale(s);
}
// The housing part of the spending total, for sentences like "Figures include ...".
function housingPhrase(s) {
  if (hasMortgage(s)) return 'the ' + fmtMoneyShort(s.housing) + ' a year mortgage payment while it lasts';
  if (housingKind(s) === 'rent' && s.housing > 0) return 'your ' + fmtMoneyShort(s.housing) + ' a year rent' + (hasBuy(s) ? ' until you buy' : '');
  return '';
}
function spendingTip(s) {
  const h = hasMortgage(s) ? ' It includes your ' + fmtMoney(s.housing) + ' a year mortgage payment until it is paid off at ' + s.mortgagePayoffAge + '.'
    : (housingKind(s) === 'rent' && s.housing > 0) ? ' It includes your ' + fmtMoney(s.housing) + ' a year rent.' : '';
  return 'Everything you spend in a year.' + h;
}
const pct = (x, d) => ((+x || 0) * 100).toFixed(d === undefined ? 1 : d) + '%';

// ============================================================================
// PAID UNLOCK
// ============================================================================
// The decision logic (licenseDecision and friends) is in paywall.js. This section does
// storage and the three Lemon Squeezy License API calls. Only the license key ever leaves
// the browser.
const LS_LICENSE_API = 'https://api.lemonsqueezy.com/v1/licenses';
const LICENSE_STORE = 'spendenough_license';
const LEGACY_KEY_STORE = 'spendenough_key';
let licenseSessionGrace = false; // an old un-checked key could not be verified (offline): unlocked for this session only

// Small non-blocking status line at the bottom of the screen. ms = 0 keeps it until replaced.
let toastTimer = null;
// On a phone the results sit above the settings, so a change made further down the page
// happens out of sight and looks like nothing happened. Say so, and offer the way back up.
// On desktop the chart is beside the controls, so this stays quiet.
function noteChanged() {
  if (!narrowNow()) return;
  const v = document.querySelector('.verdict'); if (!v) return;
  const r = v.getBoundingClientRect();
  if (r.top >= 0 && r.bottom <= innerHeight) return;   // already looking at it
  showToast('Updated \u00b7 See results \u2191', 2600);
  const el = document.getElementById('toast');
  if (el) {
    el.style.cursor = 'pointer';
    el.onclick = () => { hideToast(); v.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); };
  }
}
function showToast(text, ms) {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status'); el.setAttribute('aria-live', 'polite'); document.body.appendChild(el); }
  el.textContent = text;
  el.hidden = false;
  clearTimeout(toastTimer);
  if (ms) toastTimer = setTimeout(hideToast, ms);
}
function hideToast() { const el = document.getElementById('toast'); if (el) el.hidden = true; }

function readLicense() { try { const raw = localStorage.getItem(LICENSE_STORE); return raw ? JSON.parse(raw) : null; } catch (e) { return null; } }
function writeLicense(obj) { try { localStorage.setItem(LICENSE_STORE, JSON.stringify(obj)); return true; } catch (e) { return false; /* private mode */ } }
function clearLicense() { try { localStorage.removeItem(LICENSE_STORE); localStorage.removeItem(LEGACY_KEY_STORE); } catch (e) { /* private mode */ } }

// Synchronous on purpose (29 call sites). A stale or failed check never locks anyone out.
function isPaid() { return licenseSessionGrace || licenseDecision(readLicense(), Date.now()).paid; }

// POST to the License API. Resolves with the parsed JSON (Lemon Squeezy answers 4xx with a
// JSON body too); rejects with {network:true} on timeout, offline, or a non-JSON reply.
async function lsLicenseCall(path, params) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 10000);
  let res;
  try {
    res = await fetch(LS_LICENSE_API + '/' + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'application/json' },
      body: new URLSearchParams(params).toString(),
      signal: ctrl.signal
    });
  } catch (e) {
    throw { network: true, cause: e };
  } finally {
    clearTimeout(timer);
  }
  // A rate limit or an outage is the server's problem, not a verdict on the key.
  if (isRetryableStatus(res.status)) throw { network: true, status: res.status };
  try { return await res.json(); }
  catch (e) { throw { network: true, cause: e }; }
}

function licenseInstanceName() {
  let hex = '';
  try { hex = Array.from(crypto.getRandomValues(new Uint8Array(3))).map(b => b.toString(16).padStart(2, '0')).join(''); }
  catch (e) { hex = Math.floor(Math.random() * 0xffffff).toString(16).padStart(6, '0'); }
  return instanceLabel(navigator.userAgent, navigator.platform, hex);
}

// Activate a key in this browser. opts.onError(message) receives the user-facing text;
// opts.onSuccess(res) runs after the modal is closed and the app re-rendered.
// Resolves true when the full version was unlocked.
async function activateLicense(key, opts) {
  opts = opts || {};
  const onError = opts.onError || (() => {});
  key = (key || '').trim();
  if (!KEY_RE.test(key)) { onError(LICENSE_MSG.shape); return false; }
  let res;
  try { res = await lsLicenseCall('activate', { license_key: key, instance_name: licenseInstanceName() }); }
  catch (e) { onError(LICENSE_MSG.network); return false; }
  const blob = licenseFromActivation(key, res, Date.now());
  if (!blob) { onError(activationOutcome(res) === 'limit' ? LICENSE_MSG.limit : LICENSE_MSG.inactive); return false; }
  // The key is good but this browser cannot keep it (private mode): say so instead of
  // closing the key screen on a page that is still locked.
  if (!writeLicense(blob)) { onError(LICENSE_MSG.storage); return false; }
  try { localStorage.removeItem(LEGACY_KEY_STORE); } catch (e) { /* private mode */ }
  licenseSessionGrace = false;
  track('purchased');
  closeModal();
  render();
  if (opts.onSuccess) opts.onSuccess(res);
  return true;
}

// About once a day, confirm the key is still good (refunds, disabled keys, a freed slot).
// Runs after render, never blocks, and only an explicit "not valid" answer locks it.
async function revalidateLicense() {
  const L = readLicense();
  if (!licenseDecision(L, Date.now()).needsCheck) return;
  let res = null;
  try { res = await lsLicenseCall('validate', { license_key: L.key, instance_id: L.instanceId }); }
  catch (e) { writeLicense(applyValidation(L, null, Date.now())); return; }
  const next = applyValidation(L, res, Date.now());
  writeLicense(next);
  if (!licenseDecision(next, Date.now()).paid) {
    render();
    showUnlockModal({ silent: true, message: LICENSE_MSG.inactive });
  }
}

// Free this browser's activation slot so the key can be used on another machine.
window.deactivateLicense = async function() {
  const L = readLicense();
  if (!L) return;
  if (!confirm('Switch the full version off in this browser? The key will then work in another browser, and you can paste it here again any time.')) return;
  try { await lsLicenseCall('deactivate', { license_key: L.key, instance_id: L.instanceId }); }
  catch (e) { /* offline: the slot can also be freed from the order page */ }
  clearLicense();
  closeModal();
  render();
};

// After checkout the buyer lands on app.html?key=<license key> (or app.html?purchased=1
// when the provider can't put the key in the redirect). Both are stripped from the URL at
// once so a reload doesn't re-activate; the work happens in startLicense() after render.
let urlLicenseKey = '', urlPurchased = false;
(function acceptKeyFromUrl() {
  try {
    const u = new URL(location.href);
    urlLicenseKey = (u.searchParams.get('key') || '').trim();
    urlPurchased = u.searchParams.get('purchased') === '1';
    if (urlLicenseKey || urlPurchased) {
      u.searchParams.delete('key');
      u.searchParams.delete('purchased');
      history.replaceState(null, '', u.pathname + (u.searchParams.toString() ? '?' + u.searchParams.toString() : '') + u.hash);
    }
  } catch (e) { /* ignore malformed URLs */ }
})();

// Called once after the first render(). In order: a key in the URL -> activate it;
// ?purchased=1 -> ask for the key; an old un-checked key -> activate it once; else the
// daily re-check.
function startLicense() {
  if (urlLicenseKey) {
    const k = urlLicenseKey; urlLicenseKey = '';
    showToast(LICENSE_MSG.unlocking, 0);
    activateLicense(k, {

    });
    return;
  }
  if (urlPurchased) {
    urlPurchased = false;
    showUnlockModal({ silent: true, hint: LICENSE_MSG.purchased });
    return;
  }
  let legacy = null;
  try { legacy = localStorage.getItem(LEGACY_KEY_STORE); } catch (e) { /* private mode */ }

  if (mig.needsActivate) {

    } });

  }

}

function calcAnnualMortgagePayment(balance, annualRate, years) {
  const r = annualRate / 12;
  const n = years * 12;
  if (r === 0) return balance / years;
  return balance * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1) * 12;
}

// ============================================================================
function generatePresets(s, all) {
  const presets = [];
  const yearsToRetire = s.yourStopWorkAge - s.age;

  // ---- Time off and saving (the decisions this tool was built for) ----
  if (s.yourIncome > 0 && yearsToRetire > 2) {
    presets.push({ id: 'careerBreak', label: has(s.yourBreakStart) ? 'Change my time off' : 'Take time off, then go back' });
  }
  if (s.hasPartner && s.partnerIncome > 0 && s.partnerStopWorkAge - s.partnerAge > 2) {
    presets.push({ id: 'partnerBreak', label: has(s.partnerBreakStart) ? 'Change my partner’s time off' : 'Partner takes time off' });
  }
  presets.push({ id: 'spendMore', label: has(s.extraSpendStart) ? 'Change the extra spending' : 'Spend more for a while' });
  if (housingKind(s) === 'rent') presets.push({ id: 'buyHome', label: hasBuy(s) ? 'Change the home purchase' : 'Buy a home later' });
  if (hasMortgage(s) || housingKind(s) === 'none' || hasBuy(s) || hasSale(s)) presets.push({ id: 'sellHouse', label: hasSale(s) ? 'Change the house sale' : 'Sell the house later' });
  if (hasMortgage(s) && s.mortgagePayoffAge > s.age + 2 && !(s.mortgageBalance > 0)) {
    presets.push({ id: 'payoffHouse', label: 'Pay off the house early' });
  }
  presets.push({ id: 'shockAtRetirement', label: s.shockEra ? 'Change the bad decade' : ((s.yourIncome > 0 && s.yourStopWorkAge > s.age) ? 'A bad decade starts when I stop working' : 'A bad decade starts now') });

  // ---- User's own work situation ----
  if (s.yourIncome > 0 && s.age < 60 && yearsToRetire > 0) {
    presets.push({ id: 'stopNow', label: 'I stop working now' });
  }
  // "Retire early" only makes sense with enough runway; close to retirement, "work longer" is the useful contrast
  if (s.yourIncome > 0 && s.age < 58 && yearsToRetire > 5) {
    presets.push({ id: 'retire5early', label: 'Retire 5 years early' });
  }
  if (s.yourIncome > 0 && (yearsToRetire > 2 || s.yourPartTimeAmount > 0)) {
    presets.push({ id: 'partTime', label: s.yourPartTimeAmount > 0 ? 'Change part-time' : 'Go part-time for a while' });
  }
  if (s.yourIncome > 0 && yearsToRetire <= 5 && s.yourStopWorkAge < 70) {
    presets.push({ id: 'work2more', label: 'Work 2 more years' });
  }

  // ---- Partner work situation ----
  // Both working — offer retiring together
  if (s.yourIncome > 0 && s.hasPartner && s.partnerIncome > 0) {
    presets.push({ id: 'bothRetire', label: 'We both retire now' });
  }
  // Partner is working-age but never had income or SS — could start
  if (s.hasPartner && s.partnerIncome === 0 && s.partnerSSAmount === 0 && s.partnerAge < 58) {
    presets.push({ id: 'partnerStarts', label: 'Partner starts working' });
  }
  // Partner is currently working — offer retiring them
  if (s.hasPartner && s.partnerIncome > 0 && s.partnerStopWorkAge > s.partnerAge) {
    presets.push({ id: 'partnerRetires', label: 'Partner retires now' });
  }
  // Partner had a career and has since retired — offer returning
  if (s.hasPartner && s.partnerIncome === 0 && s.partnerSSAmount > 0 && s.partnerStopWorkAge <= s.partnerAge) {
    presets.push({ id: 'partnerReturns', label: 'Partner returns to work' });
  }

  // ---- Always ----
  presets.push({ id: 'maxSpend', label: 'What can I spend?' });

  // ---- Social Security ----
  if (s.ssStartAge !== 70 && (s.yourSSAmount > 0 || s.partnerSSAmount > 0)) {
    presets.push({ id: 'delaySS', label: 'Delay Social Security to 70' });
  }
  if (s.ssStartAge > 62 && s.age >= 55 && (s.yourSSAmount > 0 || s.partnerSSAmount > 0)) {
    presets.push({ id: 'earlySS', label: 'Claim Social Security at 62' });
  }

  // ---- Presets with invented dollar amounts (flag-gated, see FLAGS) ----
  if (FLAGS.hardcodedPresets) {
    if (hasMortgage(s) && s.age < 72) presets.push({ id: 'sellHome', label: 'Sell the home at 70' });
    if (s.age > 45) presets.push({ id: 'ltc', label: 'Add long-term care at 85' });
  }

  // Seven fit the sidebar. "What can I spend?" always stays, so a long list drops a
  // contextual one instead. `all` returns the full list, for labels and ?scenario= links.
  if (all || presets.length <= 7) return presets;
  return presets.filter(p => p.id !== 'maxSpend').slice(0, 6).concat(presets.filter(p => p.id === 'maxSpend'));
}

// FORMATTING
// ============================================================================
// Money fields are text inputs so they can show "$1,250". Digits and a leading
// minus are all that survives; the caret keeps its place by counting digits.
function moneyParse(v) {
  const s = String(v == null ? '' : v).replace(/[^\d-]/g, '');
  const neg = s.indexOf('-') === 0;
  const digits = s.replace(/-/g, '');
  if (digits === '') return NaN;
  const n = parseInt(digits, 10);
  return neg ? -n : n;
}
window.moneyValue = function(el) { const n = moneyParse(el.value); return isNaN(n) ? 0 : n; };
function moneyText(n) {
  if (n === null || n === undefined || isNaN(n) || n === '') return '';
  return (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US');
}
// While you are typing, the digits you typed are grouped as they stand, rather than
// being run back through a number. Reparsing mid-edit collapsed "$300,000" to "$0" the
// moment you deleted the leading 3, because "00,000" is zero. Leading zeros are tidied
// up on blur instead.
function groupDigits(d) { return d.replace(/\B(?=(\d{3})+$)/g, ','); }
window.moneyType = function(el) {
  const caret = el.selectionStart === null ? el.value.length : el.selectionStart;
  const digitsBefore = (el.value.slice(0, caret).match(/\d/g) || []).length;
  const raw = el.value.replace(/[^\d-]/g, '');
  const neg = raw.indexOf('-') === 0;
  const digits = raw.replace(/-/g, '');
  el.value = digits === '' ? (neg ? '-' : '') : (neg ? '-$' : '$') + groupDigits(digits);
  // Put the caret back after the same count of digits, not the same character index.
  let pos = 0, seen = 0;
  if (digitsBefore === 0) {
    const first = el.value.search(/\d/);
    pos = first === -1 ? el.value.length : first;      // just after the $, ready to type
  } else {
    while (pos < el.value.length && seen < digitsBefore) { if (/\d/.test(el.value[pos])) seen++; pos++; }
  }
  try { el.setSelectionRange(pos, pos); } catch (e) { /* not a text input */ }
};

// Backspace over a comma or the $ should take the digit next to it, not the separator
// that the formatter will immediately put back.
window.moneyKey = function(el, e) {
  if (e.key !== 'Backspace' && e.key !== 'Delete') return;
  if (el.selectionStart !== el.selectionEnd) return;   // a selection: let the browser do it
  const v = el.value;
  let i;
  if (e.key === 'Backspace') {
    i = el.selectionStart - 1;
    while (i >= 0 && !/\d/.test(v[i])) i--;
    if (i < 0) return;
  } else {
    i = el.selectionStart;
    while (i < v.length && !/\d/.test(v[i])) i++;
    if (i >= v.length) return;
  }
  e.preventDefault();
  el.value = v.slice(0, i) + v.slice(i + 1);
  el.setSelectionRange(i, i);
  el.dispatchEvent(new Event('input', { bubbles: true }));   // runs the field's own handlers
};

// On the way out, settle on the canonical figure: no leading zeros, no lone minus.
window.moneyBlur = function(el) {
  const n = moneyParse(el.value);
  el.value = isNaN(n) ? '' : moneyText(n);
};

document.addEventListener('keydown', function (e) {
  const el = e.target;
  if (el && el.classList && el.classList.contains('money')) moneyKey(el, e);
}, true);
document.addEventListener('blur', function (e) {
  const el = e.target;
  if (el && el.classList && el.classList.contains('money')) moneyBlur(el);
}, true);

function fmtMoney(n) {
  if (n === null || n === undefined || isNaN(n)) return '\u2014';
  const r = Math.round(n);
  return '$' + r.toLocaleString('en-US');
}
function fmtMoneyShort(n) {
  if (n === null || n === undefined || isNaN(n)) return '\u2014';
  const a = Math.abs(n);
  if (a >= 1e6) return (n < 0 ? '-' : '') + '$' + (a / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M';
  if (a >= 1e3) return (n < 0 ? '-' : '') + '$' + Math.round(a / 1e3) + 'k';
  return fmtMoney(n);
}
function periodsLabel(result) {
  if (result.mode === 'historical') return result.successCount + ' of ' + result.totalPeriods + ' stretches';
  if (result.mode === 'montecarlo') return Math.round(result.successRate * 100) + '% of ' + result.mcSims + ' simulated futures';
  return result.successRate >= 1 ? 'lasts to age ' + state.targetAge : 'runs out at age ' + result.medianRunOutAge;
}
function succLabel(r) {
  if (!r) return '';
  return r.mode === 'historical' ? r.successCount + '/' + r.totalPeriods : r.mode === 'montecarlo' ? Math.round(r.successRate * 100) + '%' : (r.successRate >= 1 ? 'lasts' : 'runs out');
}
function modeName(m) { return m === 'historical' ? 'Historical' : m === 'montecarlo' ? 'Simulated' : 'Fixed'; }
const SHOCK_ERAS = [['dotcom', '2000 to 2009'], ['depression', '1929 to 1938'], ['stagflation', '1969 to 1978']];
function shockLabel(id) { const e = SHOCK_ERAS.find(x => x[0] === id); return e ? e[1] : (id || 'none'); }
function shockSentence(unit) { return state.shockEra && has(state.shockAge) ? ' From age ' + state.shockAge + ', every ' + unit + ' gets the real ' + shockLabel(state.shockEra) + ' returns for ten years, so the count answers what happens if that decade hits right then.' : ''; }
function mixLabel() { return Math.round(state.stockPct * 100) + '/' + Math.round((1 - state.stockPct) * 100); }

const app = document.getElementById('app');
// Coarse pointer means a finger: used to keep the chart from redrawing mid-scroll.
const TOUCH = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;

// Every render rebuilds the page, and sections above whatever was just touched (the verdict,
// the "versus" box, the side-by-side table) change height. So render() notes the element in
// use and where it sat on screen, then puts it back in the same spot and gives focus back.
// Switching views starts at the top instead.
let lastRenderedView = null;
let lastPointer = null;
document.addEventListener('pointerdown', e => { lastPointer = { el: e.target.closest ? e.target.closest('button, input, select, tr, a, [onclick]') : null, t: Date.now() }; }, true);
function elKey(el) { return [el.tagName, el.type || '', el.id || '', el.getAttribute('onchange') || '', el.getAttribute('onclick') || '', el.getAttribute('aria-label') || ''].join('|'); }
function captureAnchor() {
  let el = document.activeElement, focused = true;
  if (!el || el === document.body || !app.contains(el)) {

    focused = false;
    el = lastPointer && lastPointer.el && Date.now() - lastPointer.t < 3000 && app.contains(lastPointer.el) ? lastPointer.el : null;
  }
  const a = { y: window.scrollY };
  if (el) Object.assign(a, { key: elKey(el), tag: el.tagName, top: el.getBoundingClientRect().top, focused });
  return a;
}
function restoreAnchor(a) {
  window.scrollTo(0, a.y);
  if (!a.key) return;
  const again = [...app.querySelectorAll(a.tag)].find(el => el.offsetParent !== null && elKey(el) === a.key);
  if (!again) return;
  const drift = again.getBoundingClientRect().top - a.top;
  if (Math.abs(drift) > 1) window.scrollBy(0, drift);
  if (a.focused) again.focus({ preventScroll: true });
}
// Every slider's track is filled up to its thumb (the --pct the CSS reads). Set here for all
// of them after each render and on every drag, so sliders that are drawn without it (More
// about you, income growth, spending flexibility) match the ones under Your plan.
function fillRange(el) { el.style.setProperty('--pct', trackPct(+el.value, +el.min, +el.max)); }
document.addEventListener('input', e => { if (e.target && e.target.type === 'range') fillRange(e.target); }, true);
let lastAnnounced = '';
function announce(text) {

  lastAnnounced = text;

  el.textContent = ''; setTimeout(() => { el.textContent = text; }, 50);
}
function markInvalid(id) {

// Typed-value handlers render one tick later. When Tab or a tap on another field caused the
// change, focus has moved by then, so the page keeps the user on the field they went to.
let renderTimer = null, renderAfter = [];
function renderSoon(after) {
  if (after) renderAfter.push(after);
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => { renderTimer = null; const fns = renderAfter; renderAfter = []; render(); fns.forEach(f => f()); }, 0);
}
// Typed numbers are held to the control's own min and max, so a slip like 6663 for a
// retirement age never reaches the model.
function clampIn(el) {
  const raw = parseFloat(el.value);
  const lo = el.min !== '' ? +el.min : -Infinity, hi = el.max !== '' ? +el.max : Infinity;
  const v = Math.min(hi, Math.max(lo, isNaN(raw) ? (lo > -Infinity ? lo : 0) : raw));
  if (v !== raw) el.value = v;
  return v;
}
function outOfRange(el) {
  if (el.type !== 'number') return false;
  const v = parseFloat(el.value);

const tipEl = document.getElementById('tip-popup');
function showTip(el, e) {
  tipEl.textContent = el.dataset.tip;
  tipEl.style.display = 'block';
  el.setAttribute('aria-describedby', 'tip-popup');
  if (e && e.clientX !== undefined) positionTip(e);
  else { const r = el.getBoundingClientRect(); positionTip({ clientX: r.left + r.width / 2, clientY: r.bottom }); }
}
function hideTip(el) { tipEl.style.display = 'none'; if (el) el.removeAttribute('aria-describedby'); }
function wireTooltips() {
  tipEl.setAttribute('role', 'tooltip');
  document.querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('mouseenter', e => showTip(el, e));
    el.addEventListener('mousemove', positionTip);
    el.addEventListener('mouseleave', () => hideTip(el));
    el.addEventListener('focus', () => showTip(el));
    el.addEventListener('blur', () => hideTip(el));
    el.addEventListener('keydown', e => { if (e.key === 'Escape') { hideTip(el); e.stopPropagation(); } });
    el.addEventListener('click', e => { e.preventDefault(); tipEl.style.display === 'block' ? hideTip(el) : showTip(el); });
  });
}
function positionTip(e) {
  const pad = 12, tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  let x = e.clientX + pad, y = e.clientY - th - pad;
  if (x + tw > window.innerWidth - pad) x = e.clientX - tw - pad;
  if (y < pad) y = e.clientY + pad;
  tipEl.style.left = x + 'px';
  tipEl.style.top = y + 'px';
}

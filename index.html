<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spend Enough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bone: #f4efe6;
    --bone-2: #ebe4d6;
    --ink: #1a1814;
    --ink-soft: #3d3830;
    --ink-mute: #6b6356;
    --ink-faint: #75695a;
    --rust: #a04a28;
    --rust-deep: #8a4226;
    --moss: #5b6e3a;
    --moss-deep: #3e4d28;
    --gold: #7d6420;
    --paper: #fbf8f1;
    --line: #d4cab8;
    --line-soft: #e2dac8;
    --danger: #a8331f;
    --danger-soft: #d8856f;
    --shadow-sm: 0 1px 0 rgba(26,24,20,0.04), 0 1px 2px rgba(26,24,20,0.06);
    --shadow-md: 0 2px 4px rgba(26,24,20,0.06), 0 8px 24px rgba(26,24,20,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter Tight', system-ui, sans-serif;
    background: var(--bone);
    color: var(--ink);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 20% 0%, rgba(184,92,56,0.04) 0%, transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(91,110,58,0.04) 0%, transparent 50%);
  }

  /* Data tables - horizontal scroll on mobile */
  .data-table { width: 100%; border-collapse: collapse; }
  @media (max-width: 768px) {
    .data-table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -20px; padding: 0 20px; }
  }
  
  /* Improve touch targets */
  button, input[type="button"], input[type="submit"], .clickable {
    min-height: 44px;
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
  }
  
  input[type="range"] { cursor: pointer; }
  
  /* Better modal behavior on mobile */
  .modal-overlay { padding: 16px; }
  @media (max-width: 480px) {
    .modal-overlay { align-items: flex-start; padding-top: 20px; }
    .modal { max-width: calc(100vw - 32px); max-height: calc(100vh - 40px); }
  }
  
  /* Prevent zoom on input focus (iOS) */
  input[type="text"], input[type="number"], input[type="email"], input[type="tel"], select, textarea {
    font-size: 16px !important;
  }

  /* ========== HEADER ========== */
  header {
    padding: 18px 32px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--paper);
  }
  .logo {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.02em;
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .logo-dot {
    width: 8px; height: 8px;
    background: var(--rust);
    border-radius: 50%;
    display: inline-block;
    margin-right: 2px;
    transform: translateY(-2px);
  }
  .tagline { color: var(--ink-mute); font-size: 14px; font-style: italic; font-family: 'Fraunces', serif; }
  .scenarios-bar { display: flex; gap: 8px; align-items: center; }
  .scenario-pill {
    padding: 6px 14px; border: 1px solid var(--line); background: var(--paper);
    color: var(--ink-soft); font-size: 14px; border-radius: 100px; cursor: pointer;
    transition: all 0.15s ease; font-weight: 500; font-family: inherit;
  }
  .scenario-pill:hover { border-color: var(--ink); background: var(--bone-2); }

  /* ========== ONBOARDING ========== */
  .onboarding { max-width: 960px; margin: 0 auto; padding: 64px 40px; }
  .onboard-hero { margin-bottom: 48px; text-align: center; }
  .onboard-eyebrow { text-transform: uppercase; letter-spacing: 0.18em; font-size: 14px; color: var(--rust); font-weight: 600; margin-bottom: 18px; }
  .onboard-title { font-family: 'Fraunces', serif; font-size: clamp(38px, 6vw, 60px); font-weight: 400; line-height: 1.05; letter-spacing: -0.025em; margin-bottom: 22px; white-space: nowrap; }
  .onboard-title em { font-style: italic; color: var(--rust); font-weight: 500; }
  .onboard-sub { font-size: 17px; color: var(--ink-mute); max-width: 520px; margin: 0 auto; line-height: 1.6; }
  .onboard-fine { font-size: 14px; color: var(--ink-faint); margin-top: 18px; }
  .onboard-fine a { color: var(--rust); }
  .onboard-step { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 32px; margin-bottom: 14px; box-shadow: var(--shadow-sm); max-width: 680px; margin-left: auto; margin-right: auto; }
  .step-number { font-family: 'Fraunces', serif; font-size: 14px; color: var(--rust); font-style: italic; margin-bottom: 8px; }
  .step-title { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 500; margin-bottom: 6px; letter-spacing: -0.01em; }
  .step-hint { color: var(--ink-mute); font-size: 14px; margin-bottom: 22px; }
  .field-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
  .field-grid.cols-1 { grid-template-columns: 1fr; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-mute); font-weight: 600; }
  .field input, .field select { background: var(--bone); border: 1px solid var(--line); padding: 11px 14px; font-family: 'JetBrains Mono', monospace; font-size: 15px; color: var(--ink); border-radius: 2px; transition: border-color 0.15s ease; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--ink); }
  .field-hint { font-size: 14px; color: var(--ink-faint); }
  .field-hint .helper-trigger { background: none; border: none; color: var(--rust); cursor: pointer; font-size: 14px; text-decoration: underline; padding: 0; font-family: inherit; }
  .step-actions { display: flex; justify-content: center; gap: 12px; margin-top: 28px; }
  .btn-primary { background: var(--ink); color: var(--paper); border: none; padding: 14px 28px; font-size: 15px; font-weight: 600; border-radius: 3px; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 8px; transition: background 0.15s ease; }
  .btn-primary:hover { background: var(--rust); }
  .btn-secondary { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); padding: 14px 22px; font-size: 14px; border-radius: 3px; cursor: pointer; font-family: inherit; }
  .btn-secondary:hover { border-color: var(--ink); }
  .validation-msg { color: var(--danger); font-size: 14px; text-align: center; margin-top: 14px; min-height: 18px; }
</style>
</head>
<style>
  /* ========== DASHBOARD LAYOUT ========== */
  .dashboard { display: grid; grid-template-columns: 360px 1fr; grid-template-areas: "sidebar main" "resources resources"; min-height: calc(100vh - 73px); }
  .resources-row { grid-area: resources; border-top: 1px solid var(--line); padding: 22px 32px 30px; text-align: center; }
  .sidebar { grid-area: sidebar; background: var(--paper); border-right: 1px solid var(--line); padding: 22px 20px; overflow-y: auto; }
  .sidebar-section { margin-bottom: 22px; padding-bottom: 22px; border-bottom: 1px solid var(--line-soft); }
  .sidebar-section:last-child { border-bottom: none; }
  
  .sidebar-heading { text-transform: uppercase; letter-spacing: 0.12em; font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
  .sidebar-sub { font-size: 14px; color: var(--ink-mute); margin-bottom: 12px; }
  .preset-btn { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bone); padding: 9px 11px; font-size: 14px; color: var(--ink-soft); margin-bottom: 5px; border-radius: 3px; font-family: inherit; cursor: pointer; transition: border-color 0.15s ease; }
  .preset-btn:hover { border-color: var(--rust); color: var(--ink); }
  .preset-icon { color: var(--rust); font-style: italic; font-family: 'Fraunces', serif; margin-right: 5px; }
  .toggle-group { display: flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .toggle-btn { flex: 1; padding: 7px 4px; font-size: 14px; text-align: center; border: none; cursor: pointer; font-family: inherit; background: var(--bone); color: var(--ink-mute); transition: all 0.12s ease; }
  .toggle-btn:hover { background: var(--bone-2); }
  .toggle-btn.active { background: var(--ink); color: var(--paper); }
  .control { margin-bottom: 14px; }
  .control-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; }
  .control-label { color: var(--ink-soft); flex: 1; font-size: inherit; }
  .control-value { font-size: 14px; font-weight: 500; color: var(--ink); font-family: 'JetBrains Mono', monospace; white-space: nowrap; }
  .control input[type=range] { width: 100%; height: 4px; -webkit-appearance: none; appearance: none; background: var(--line); border-radius: 2px; outline: none; }
  .control input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--ink); border-radius: 50%; cursor: pointer; transition: background 0.12s; }
  .control input[type=range]::-webkit-slider-thumb:hover { background: var(--rust); }
  .control input[type=range]::-moz-range-thumb { width: 16px; height: 16px; background: var(--ink); border-radius: 50%; cursor: pointer; border: none; }
  .control input[type=number] { width: 100%; background: var(--bone); border: 1px solid var(--line); padding: 7px 9px; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--ink); border-radius: 2px; }
  .control input[type=number]:focus { outline: none; border-color: var(--ink); }
  .help-mark { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; min-width: 15px; border-radius: 50%; border: 1px solid var(--line); color: var(--ink-mute); font-size: 10px; font-style: italic; margin-left: 4px; cursor: help; font-family: 'Fraunces', serif; vertical-align: middle; overflow: hidden; box-sizing: border-box; }
  #tip-popup { position: fixed; z-index: 9999; background: var(--ink); color: var(--paper); font-size: 13px; padding: 6px 10px; border-radius: 4px; max-width: 260px; line-height: 1.4; pointer-events: none; display: none; font-family: inherit; }
  .more-toggle { display: flex; align-items: center; justify-content: space-between; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 3px; background: var(--bone); padding: 7px 10px; font-size: 14px; color: var(--ink-soft); font-family: inherit; cursor: pointer; font-weight: 600; }
  .more-toggle:hover { border-color: var(--ink-mute); color: var(--ink); }
  .more-toggle-chevron { font-size: 14px; color: var(--ink-mute); transition: transform 0.15s; }
  .more-hint { font-size: 14px; color: var(--ink-mute); margin-top: 5px; padding: 0 2px; letter-spacing: 0.01em; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .checkbox-row input { width: 14px; height: 14px; accent-color: var(--ink); }
  .checkbox-row label { font-size: 14px; color: var(--ink-soft); cursor: pointer; }
  .acct-grid { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; }
  .acct-grid label { font-size: 14px; color: var(--ink-soft); }
  .acct-grid input { width: 110px; background: var(--bone); border: 1px solid var(--line); padding: 6px 8px; font-family: 'JetBrains Mono', monospace; font-size: 14px; color: var(--ink); border-radius: 2px; text-align: right; }

  /* ========== MAIN ========== */
  .main { grid-area: main; padding: 24px 32px; overflow-y: auto; max-width: 1100px; }
  .disclaimer-bar { background: var(--bone-2); border: 1px solid var(--line); border-radius: 4px; padding: 10px 16px; font-size: 14px; line-height: 1.5; color: var(--ink-mute); margin-bottom: 18px; }
  .disclaimer-bar strong { color: var(--ink-soft); font-weight: 600; }
  .disclaimer-bar a { color: var(--rust); cursor: pointer; }
  .impact-banner { background: var(--bone-2); border-radius: 4px; padding: 11px 16px; font-size: 14px; color: var(--ink-soft); line-height: 1.6; margin-bottom: 16px; }
  .impact-banner strong { color: var(--ink); }
  .impact-banner button { background: none; border: none; color: var(--rust); cursor: pointer; font-family: inherit; font-size: 14px; text-decoration: underline; padding: 0; }

  /* Verdict */
  .verdict { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 24px 28px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
  .verdict-eye { text-transform: uppercase; letter-spacing: 0.15em; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
  .verdict-eye.good { color: var(--moss); }
  .verdict-eye.mid { color: var(--gold); }
  .verdict-eye.bad { color: var(--danger); }
  .verdict-head { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 400; color: var(--ink); line-height: 1.25; margin-bottom: 10px; letter-spacing: -0.01em; }
  .verdict-body { font-size: 14px; color: var(--ink-soft); line-height: 1.6; }
  .verdict-caveat { font-size: 14px; color: var(--ink-faint); margin-top: 10px; font-style: italic; }
  .verdict-wedge { margin-top: 14px; padding: 12px 16px; background: rgba(184,92,56,0.06); border-left: 3px solid var(--rust); border-radius: 0 4px 4px 0; font-size: 15px; color: var(--ink); line-height: 1.5; }
  .verdict-wedge .wedge-amount { font-family: 'JetBrains Mono', monospace; font-weight: 500; color: var(--rust); font-size: 16px; }
  .verdict-wedge .wedge-sub { font-size: 14px; color: var(--ink-mute); margin-top: 4px; }

  .toggle-btn.locked { opacity: 0.7; }
  .toggle-btn.locked .lock-icon { font-size: 14px; margin-left: 3px; }
  .unlock-prompt { margin-top: 8px; padding: 10px 14px; background: rgba(184,92,56,0.06); border-radius: 4px; font-size: 14px; color: var(--ink-soft); line-height: 1.6; }
  /* Free-tier preview of paid settings: visible but non-interactive */
  .locked-note { margin: 8px 0; padding: 8px 10px; background: var(--bone-2); border-left: 2px solid var(--rust); border-radius: 3px; font-size: 14px; color: var(--ink-soft); line-height: 1.5; }
  .link-btn { background: none; border: none; color: var(--rust); cursor: pointer; font-family: inherit; font-size: 14px; text-decoration: underline; padding: 0; }
  .locked-preview { border: none; padding: 0; margin: 0; min-width: 0; opacity: 0.5; pointer-events: none; }
  .unlock-prompt a { color: var(--rust); cursor: pointer; text-decoration: underline; }
  .unlock-input-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .unlock-input-row input { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 3px; font-family: 'JetBrains Mono', monospace; font-size: 14px; background: var(--paper); }
  .unlock-input-row button { padding: 10px 16px; background: var(--rust); color: var(--paper); border: none; border-radius: 3px; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer; }
  .unlock-input-row button:hover { background: var(--rust-deep); }
  /* Free vs Pro comparison (unlock modal) */
  .compare-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .compare-col { border: 1px solid var(--line); border-radius: 5px; padding: 14px 16px; background: var(--bone); min-width: 0; }
  .compare-col.pro { border-color: var(--rust); background: rgba(184,92,56,0.05); }
  .compare-head { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; color: var(--ink); }
  .compare-col.pro .compare-head { color: var(--rust-deep); }
  .compare-sub { font-size: 14px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 10px; }
  .compare-plus { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 4px; }
  .compare-list { list-style: none; margin: 0; padding: 0; }
  .compare-list li { font-size: 14px; color: var(--ink-soft); line-height: 1.4; padding: 6px 0 6px 18px; position: relative; border-top: 1px solid var(--line-soft); }
  .compare-list li:first-child { border-top: none; }
  .compare-list li::before { content: '\2713'; position: absolute; left: 0; top: 6px; color: var(--moss); font-weight: 700; }
  .compare-col.pro .compare-list li::before { color: var(--rust); }

  /* Unlock modal improvements */
  .modal h2 { color: var(--ink); }
  .modal ul { list-style: none; padding: 0; }
  .modal ul li { position: relative; padding-left: 20px; }
  .modal ul li:before { content: "✓"; position: absolute; left: 0; color: var(--moss); font-weight: 600; }

  /* Sections */
  .section-heading { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 500; color: var(--ink); margin: 26px 0 4px; }
  .section-sub { font-size: 14px; color: var(--ink-mute); line-height: 1.5; margin-bottom: 14px; }

  /* Confidence bands */
  .bands { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .band { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; }
  .band-label { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 2px; }
  .band-sub { font-size: 14px; color: var(--ink-mute); margin-bottom: 8px; }
  .band-value { font-size: 17px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
  .band.warn .band-value { color: var(--danger); }
  .band.ok .band-value { color: var(--moss); }
  .band.neutral .band-value { color: var(--ink-soft); }

  /* Chart */
  .chart-card { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 18px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
  .chart-wrap { position: relative; height: 280px; }
  .chart-wrap.short { height: 200px; }

  /* Tables */
  .data-table { width: 100%; border-collapse: collapse; font-size: 14px; margin-bottom: 18px; }
  .data-table th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); color: var(--ink-mute); font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 0.06em; }
  .data-table td { padding: 8px 10px; border-bottom: 1px solid var(--line-soft); color: var(--ink-soft); }
  .data-table tr.current-row { background: var(--bone-2); }
  .data-table .tag-current { display: inline-block; background: var(--rust); color: var(--paper); font-size: 14px; padding: 1px 6px; border-radius: 2px; margin-left: 6px; vertical-align: 1px; font-weight: 600; }
  .data-table .fail { color: var(--danger); font-weight: 600; }
  .data-table .clickable { cursor: pointer; }
  .data-table .clickable:hover { background: var(--bone-2); }

  /* Stress cards */
  .scenario-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .scenario-card { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; cursor: pointer; transition: border-color 0.15s ease; }
  .scenario-card:hover { border-color: var(--rust); }
  .scenario-card.failed { border-left: 3px solid var(--danger-soft); }
  .scenario-card.survived { border-left: 3px solid var(--moss); }
  .scenario-name { font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 2px; }
  .scenario-years { font-size: 14px; color: var(--ink-mute); margin-bottom: 5px; font-family: 'JetBrains Mono', monospace; }
  .scenario-result { font-size: 14px; font-weight: 600; }
  .scenario-result.ok { color: var(--moss); }
  .scenario-result.fail { color: var(--danger); }
  .scenario-desc { font-size: 14px; color: var(--ink-mute); margin-top: 5px; line-height: 1.4; }
  .scenario-card.add { border-style: dashed; display: flex; align-items: center; justify-content: center; color: var(--ink-faint); font-size: 14px; }

  /* Flexibility */
  .flex-box { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 16px 20px; margin-bottom: 10px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; text-align: center; }
  .flex-label { font-size: 14px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .flex-value { font-size: 18px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
  .flex-arrow { font-size: 20px; color: var(--rust); }
  .flex-note { font-size: 14px; color: var(--ink-mute); line-height: 1.5; margin-bottom: 18px; }

  /* SS comparison */
  .ss-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
  .ss-card { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 14px; text-align: center; cursor: pointer; transition: border-color 0.15s ease; }
  .ss-card:hover { border-color: var(--rust); }
  .ss-card.highlight { border: 2px solid var(--moss); }
  .ss-age { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 500; color: var(--ink); }
  .ss-label { font-size: 14px; color: var(--ink-mute); margin: 2px 0 8px; text-transform: uppercase; letter-spacing: 0.08em; }
  .ss-benefit { font-size: 14px; color: var(--ink-soft); margin-bottom: 4px; font-family: 'JetBrains Mono', monospace; }
  .ss-success { font-size: 14px; font-weight: 600; }

  /* Assumptions + resources */
  .resources-row { padding: 0 !important; }
  .faq-toggle { width: 100%; background: none; border: none; padding: 18px 32px; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; font-family: inherit; }
  .faq-toggle:hover .faq-toggle-label { color: var(--ink); }
  .faq-toggle-label { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; color: var(--ink-mute); }
  .faq-toggle-chevron { font-size: 14px; color: var(--ink-mute); }
  .faq-inner { padding: 8px 32px 32px; }
  .faq { max-width: 800px; margin: 0 auto; }

<script>
"use strict";

/* ----------------------------------------------------------------------------
   Simulation engine, estimators, DEFAULT_STATE and SAMPLE_STATE now live in
   engine.js (loaded above) and are available here as globals. This file holds
   only UI: state wiring, rendering, charts, handlers, and modals.
   ---------------------------------------------------------------------------- */

let state = JSON.parse(JSON.stringify(DEFAULT_STATE));
let activeView = 'onboarding';
let savedScenarios = JSON.parse(localStorage.getItem('zeroline_scenarios') || '[]');
let chart = null, cashflowChart = null;
let lastSimResult = null;
let baselineState = null, baselineResult = null;
let maxSpendCache = null, maxSpendStale = true;
let spendingLevelsCache = null, spendingLevelsStale = true;
let showMoreOptions = false;
let isFirstDashboard = true;
let maxSpendView = false;
let cashflowMode = 'net';

// ============================================================================
// PAID UNLOCK
// ============================================================================
function isPaid() { return !!localStorage.getItem('spendenough_key'); }

window.showUnlockModal = function() {

    </div>
    <p style="margin-top:14px;font-size:14px;text-align:center"><a href="#" onclick="closeModal();return false" style="color:var(--rust);text-decoration:none;cursor:pointer">Continue with the free version</a></p>`);

window.submitUnlockKey = function() {
  const input = document.getElementById('unlockKeyInput');
  const key = input ? input.value.trim() : '';
  if (key.length >= 8) {
    localStorage.setItem('spendenough_key', key);

    input.setAttribute('placeholder', 'Key must be at least 8 characters');

// ============================================================================
// ACCELERATED MORTGAGE PAYOFF
// ============================================================================
function calcAnnualMortgagePayment(balance, annualRate, years) {
  const r = annualRate / 12;
  const n = years * 12;
  if (r === 0) return balance / years;
  return balance * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1) * 12;
}

window.showPayoffModal = function() {
  if (!isPaid()) { showUnlockModal(); return; }
  const currentYearsLeft = Math.max(1, state.mortgagePayoffAge - state.age);
  openModal(`
    <div style="max-width:380px">
      <div style="font-size:16px;font-weight:700;margin-bottom:4px;font-family:'Fraunces',serif">Accelerated mortgage payoff</div>
      <p style="font-size:14px;color:var(--ink-mute);margin-bottom:16px">We'll calculate your new required payment and update your housing costs accordingly. After payoff, housing costs drop to zero in the model.</p>
      <div style="display:grid;gap:10px">
        <label style="font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft)">Remaining mortgage balance
          <input type="number" id="po_balance" placeholder="e.g. 280000" step="10000" min="0"
            style="display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:3px;font-size:14px;font-family:'JetBrains Mono',monospace;background:var(--bone)"/>
        </label>
        <label style="font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft)">Interest rate (%)
          <input type="number" id="po_rate" placeholder="e.g. 6.5" step="0.1" min="0" max="20" value="6.5"
            style="display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:3px;font-size:14px;font-family:'JetBrains Mono',monospace;background:var(--bone)"/>
        </label>
        <label style="font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-soft)">Pay off in how many years?
          <input type="number" id="po_years" placeholder="e.g. 5" step="1" min="1" max="${currentYearsLeft - 1}" value="5"
            style="display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:3px;font-size:14px;font-family:'JetBrains Mono',monospace;background:var(--bone)"/>
        </label>
      </div>
      <div id="po_preview" style="margin-top:12px;font-size:14px;color:var(--ink-mute);min-height:18px"></div>
      <div style="display:flex;gap:8px;margin-top:16px">
        <button onclick="applyPayoffModal()" style="flex:1;padding:10px;background:var(--rust);color:var(--paper);border:none;border-radius:3px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit">Apply to plan</button>
        <button onclick="closeModal()" style="padding:10px 16px;background:none;border:1px solid var(--line);border-radius:3px;font-size:14px;cursor:pointer;font-family:inherit;color:var(--ink-soft)">Cancel</button>
      </div>
    </div>
  `);
  // Live preview as user types
  ['po_balance','po_rate','po_years'].forEach(id => {
    document.getElementById(id).addEventListener('input', updatePayoffPreview);
  });
  updatePayoffPreview();
};

function updatePayoffPreview() {
  const balance = parseFloat(document.getElementById('po_balance').value) || 0;
  const rate = (parseFloat(document.getElementById('po_rate').value) || 6.5) / 100;
  const years = parseInt(document.getElementById('po_years').value) || 5;
  const el = document.getElementById('po_preview');
  if (!el) return;
  if (balance <= 0) { el.textContent = ''; return; }
  const annual = calcAnnualMortgagePayment(balance, rate, years);
  const diff = annual - state.housing;
  el.innerHTML = `New annual payment: <strong style="font-family:'JetBrains Mono',monospace">${fmtMoney(Math.round(annual/100)*100)}</strong>`
    + (diff > 0 ? ` <span style="color:var(--danger)">(+${fmtMoney(Math.round(diff/100)*100)}/yr for ${years} yrs)</span>` : '');
}

window.applyPayoffModal = function() {
  const balance = parseFloat(document.getElementById('po_balance').value) || 0;
  const rate = (parseFloat(document.getElementById('po_rate').value) || 6.5) / 100;
  const years = parseInt(document.getElementById('po_years').value) || 5;
  if (balance <= 0) {
    document.getElementById('po_balance').style.outline = '2px solid var(--danger)';
    return;
  }
  const annual = calcAnnualMortgagePayment(balance, rate, years);
  state.housing = Math.round(annual / 100) * 100;
  state.mortgagePayoffAge = state.age + years;
  state.mortgageBalance = balance;
  state.mortgageRate = rate;
  closeModal();
  invalidateCaches();
  render();
};

// ============================================================================
// DYNAMIC PRESETS
// ============================================================================
function generatePresets(s) {
  const presets = [];
  const yearsToRetire = s.yourStopWorkAge - s.age;

  // ---- User's own work situation ----
  if (s.yourIncome > 0 && s.age < 60 && yearsToRetire > 0) {
    presets.push({ id: 'stopNow', label: 'I stop working now' });
  }
  // "Retire early" only makes sense with enough runway; close to retirement, "work longer" is the useful contrast
  if (s.yourIncome > 0 && s.age < 58 && yearsToRetire > 5) {
    presets.push({ id: 'retire5early', label: 'Retire 5 years early' });
  }
  if (s.yourIncome > 0 && yearsToRetire > 2) {
    presets.push({ id: 'partTime', label: 'Go part-time first' });
  }
  if (s.yourIncome > 0 && yearsToRetire <= 5 && s.yourStopWorkAge < 70) {
    presets.push({ id: 'work2more', label: 'Work 2 more years' });
  }

  // ---- Partner work situation ----
  // Both working — offer retiring together
  if (s.yourIncome > 0 && s.hasPartner && s.partnerIncome > 0) {
    presets.push({ id: 'bothRetire', label: 'We both retire now' });
  }
  // Partner is working-age but never had income or SS — could start
  if (s.hasPartner && s.partnerIncome === 0 && s.partnerSSAmount === 0 && s.partnerAge < 58) {
    presets.push({ id: 'partnerStarts', label: 'Partner starts working' });
  }
  // Partner is currently working — offer retiring them
  if (s.hasPartner && s.partnerIncome > 0 && s.partnerStopWorkAge > s.partnerAge) {
    presets.push({ id: 'partnerRetires', label: 'Partner retires now' });
  }
  // Partner had a career and has since retired — offer returning
  if (s.hasPartner && s.partnerIncome === 0 && s.partnerSSAmount > 0 && s.partnerStopWorkAge <= s.partnerAge) {
    presets.push({ id: 'partnerReturns', label: 'Partner returns to work' });
  }

  // ---- Always ----
  presets.push({ id: 'maxSpend', label: 'What can I spend?' });

  // ---- Social Security ----
  if (s.ssStartAge !== 70 && (s.yourSSAmount > 0 || s.partnerSSAmount > 0)) {
    presets.push({ id: 'delaySS', label: 'Delay Social Security to 70' });
  }
  if (s.ssStartAge > 62 && s.age >= 55 && (s.yourSSAmount > 0 || s.partnerSSAmount > 0)) {
    presets.push({ id: 'earlySS', label: 'Claim Social Security at 62' });
  }

  // ---- Housing ----
  // payoffFast removed from free presets — requires balance/rate inputs to model correctly
  if (s.housing > 0 && !s.homeSaleAge && s.age < 72) {
    presets.push({ id: 'sellHome', label: 'Sell the home at 70' });
  }

  // ---- Long-term care ----
  if (s.age > 45) presets.push({ id: 'ltc', label: 'Add long-term care at 85' });

  return presets.slice(0, 6);
}

// ============================================================================
// FORMATTING
// ============================================================================
function fmtMoney(n) {
  if (n === null || n === undefined || isNaN(n)) return '\u2014';
  const r = Math.round(n);
  return '$' + r.toLocaleString('en-US');
}
function fmtMoneyShort(n) {
  if (n === null || n === undefined || isNaN(n)) return '\u2014';
  const a = Math.abs(n);
  if (a >= 1e6) return (n < 0 ? '-' : '') + '$' + (a / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M';
  if (a >= 1e3) return (n < 0 ? '-' : '') + '$' + Math.round(a / 1e3) + 'k';
  return fmtMoney(n);
}
function periodsLabel(result) {
  if (result.mode === 'historical') return result.successCount + ' of ' + result.totalPeriods + ' historical periods';
  if (result.mode === 'montecarlo') return Math.round(result.successRate * 100) + '% of simulations';
  return result.successRate >= 1 ? 'lasts to age 100' : 'runs out early';
}

const app = document.getElementById('app');
const modalRoot = document.getElementById('modal-root');

function render() { if (activeView === 'onboarding') renderOnboarding(); else renderDashboard(); wireTooltips(); }

const tipEl = document.getElementById('tip-popup');
function wireTooltips() {
  document.querySelectorAll('[data-tip]').forEach(el => {
    el.addEventListener('mouseenter', e => {
      tipEl.textContent = el.dataset.tip;
      tipEl.style.display = 'block';
      positionTip(e);
    });
    el.addEventListener('mousemove', positionTip);
    el.addEventListener('mouseleave', () => { tipEl.style.display = 'none'; });
  });
}
function positionTip(e) {
  const pad = 12, tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
  let x = e.clientX + pad, y = e.clientY - th - pad;
  if (x + tw > window.innerWidth - pad) x = e.clientX - tw - pad;
  if (y < pad) y = e.clientY + pad;
  tipEl.style.left = x + 'px';
  tipEl.style.top = y + 'px';
}

function num(id) { const el = document.getElementById(id); const v = parseFloat(el && el.value); return isNaN(v) ? 0 : v; }

window.finishOnboarding = function() {
  const age = num('ob_age');
  const portfolio = num('ob_portfolio');
  const spending = num('ob_spending');
  if (age < 18) { document.getElementById('ob_validation').textContent = 'Please enter your age to continue.'; return; }
  if (portfolio <= 0) { document.getElementById('ob_validation').textContent = 'Enter your portfolio value to get started.'; return; }

  state.age = age;
  const pAge = num('ob_partnerAge');
  state.partnerAge = pAge;
  state.hasPartner = pAge >= 18;
  state.portfolio = portfolio;
  state.spending = spending;
  state.lateSpending = spending > 0 ? Math.round(spending * 0.85) : 0;
  state.slowDownAge = 75;
  state.yourIncome = num('ob_yourIncome');
  state.partnerIncome = num('ob_partnerIncome');
  state.housing = num('ob_housing');
  state.mortgagePayoffAge = num('ob_mortgagePayoff') || 60;
  state.yourSSAmount = num('ob_yourSS');
  state.partnerSSAmount = num('ob_partnerSS');
  // Reset any preset-derived state (home sale, life events) so nothing carries over
  state.homeSaleAge = null;
  state.homeSaleProceeds = 0;
  state.oneTimeEvents = [];
  // Auto-compute effective tax rate from income
  const totalGross = state.yourIncome + state.partnerIncome;
  if (totalGross > 0) {
    const taxEst = estimateNetIncome({ gross: totalGross, filingStatus: state.filingStatus, stateCode: state.stateCode });
    state.taxRate = Math.round(taxEst.effectiveRate * 100) / 100;
  }
  if (state.yourStopWorkAge < state.age) state.yourStopWorkAge = Math.max(state.age + 1, 65);
  if (state.partnerStopWorkAge < state.partnerAge) state.partnerStopWorkAge = Math.max(state.partnerAge + 1, 65);

  // If spending was left blank, auto-find max spend
  if (spending <= 0) {
    state.simMode = 'fixed';
    const ms = findMaxSpend(state);
    state.spending = Math.round(ms.spend / 1000) * 1000;
    state.lateSpending = Math.round(state.spending * 0.85);
    maxSpendView = true;
  }

  activeView = 'dashboard';
  maxSpendStale = true; spendingLevelsStale = true;
  baselineState = JSON.parse(JSON.stringify(state));
  baselineResult = null;
  render();
};

window.loadSample = function() {
  state = JSON.parse(JSON.stringify(SAMPLE_STATE));
  activeView = 'dashboard';
  maxSpendStale = true; spendingLevelsStale = true;
  baselineState = JSON.parse(JSON.stringify(state));
  baselineResult = null;
  render();
};

window.resetToDefaults = function() {

};

// ===== VERDICT =====
function getVerdict(result) {
  const v = { tier: 'good', eyebrow: '', headline: '', body: '', caveat: '' };
  const yc = state.targetAge - state.age + 1;
  if (result.mode === 'historical') {
    const { successCount, totalPeriods, failures } = result;
    const rate = successCount / totalPeriods;
    v.tier = rate >= 0.9 ? 'good' : rate >= 0.7 ? 'mid' : 'bad';
    if (successCount === totalPeriods) {
      v.headline = 'This scenario lasted through every historical period since 1926';
      v.body = 'We tested your plan against every rolling ' + yc + '-year period of real U.S. stock market returns since 1926, ' + totalPeriods + ' periods in total. Each includes actual sequences of booms, crashes, and everything between. This spending level survived them all, including the Great Depression, 1970s stagflation, and 2008.';
    } else {
      v.headline = 'This scenario lasted in ' + successCount + ' of ' + totalPeriods + ' historical periods';
      const failCount = totalPeriods - successCount;
      const worst = failures[0];
      if (maxSpendView) {
        v.body = fmtMoney(state.spending) + '/yr is the theoretical maximum at a steady ' + (state.returnRate*100).toFixed(1) + '% return. But real markets don\u2019t deliver steady returns. Bad years early in retirement can deplete a portfolio even if the long-run average is fine. Against actual market history, this spending level only survived ' + successCount + ' of ' + totalPeriods + ' periods. Use the spending explorer below to find a level that holds up in more historical environments.';
      } else {
        v.body = 'We tested your plan against every rolling ' + yc + '-year period of real U.S. stock market returns since 1926, ' + totalPeriods + ' periods in total.';
        if (rate >= 0.85) {
          v.body += ' In ' + failCount + ' period' + (failCount > 1 ? 's' : '') + ', the portfolio was depleted before age ' + state.targetAge + '.' + (worst ? ' The hardest started in ' + worst.label.split('\u2013')[0] + ' (depleted around age ' + worst.ranOutAge + ').' : '') + ' These failures tended to cluster around prolonged downturns.';
        } else if (rate >= 0.6) {
          v.body += ' In ' + failCount + ' of those periods, the portfolio ran out before age ' + state.targetAge + '.' + (worst ? ' The worst sequence started in ' + worst.label.split('\u2013')[0] + '.' : '') + ' At this spending level, the outcome depends heavily on which market environment you retire into.';
        } else {
          v.body += ' In ' + failCount + ' of ' + totalPeriods + ' periods, the portfolio was depleted. This spending level is risky by historical standards. Consider reducing spending or exploring other adjustments.';
        }
      }
    }
    v.caveat = 'Past performance does not predict future results.';
  } else if (result.mode === 'montecarlo') {
    const rate = result.successRate;
    v.tier = rate >= 0.9 ? 'good' : rate >= 0.7 ? 'mid' : 'bad';
    v.headline = 'The portfolio lasted to age ' + state.targetAge + ' in ' + Math.round(rate * 100) + '% of simulations';
    if (maxSpendView) {
      v.body = fmtMoney(state.spending) + '/yr is the theoretical maximum at a steady return, but with realistic market volatility, this level only holds up ' + Math.round(rate * 100) + '% of the time. The spending explorer below shows what level of spending succeeds in more simulations.';
    } else {
      v.body = 'Across 500 simulations with ' + (state.returnStdDev*100).toFixed(0) + '% annual volatility around a ' + (state.returnRate*100).toFixed(1) + '% real return, the median ending balance was ' + fmtMoneyShort(result.medianFinal) + '.';
    }
  } else {
    const lasts = result.successRate >= 1;
    v.tier = lasts ? 'good' : 'bad';
    if (maxSpendView) {
      v.headline = 'The most you could spend is about ' + fmtMoney(state.spending) + ' per year';
      v.body = lasts ? 'At a steady ' + (state.returnRate*100).toFixed(1) + '% real return, this is the highest annual spending that keeps your portfolio lasting to age ' + state.targetAge + '. Your ending balance would be near zero, meaning you used almost everything. Adjust the return rate or switch to Historical mode to see how this holds up against real market environments.' : 'At a steady ' + (state.returnRate*100).toFixed(1) + '% return, the portfolio would be depleted around age ' + result.medianRunOutAge + '. Try reducing the rate of return to see a more conservative estimate.';
    } else {
      v.headline = lasts ? 'At a steady ' + (state.returnRate*100).toFixed(1) + '% return, the portfolio lasts past age ' + state.targetAge : 'At a steady ' + (state.returnRate*100).toFixed(1) + '% return, the portfolio is depleted around age ' + result.medianRunOutAge;
      v.body = lasts ? 'Ending balance at age ' + state.targetAge + ' would be about ' + fmtMoneyShort(result.medianFinal) + '. Real markets are bumpier than this, try Historical or Simulated mode to see the range of outcomes.' : 'This assumes the same return every year. Real sequences vary, try Historical mode to stress-test it.';
    }
  }
  // "Money left on the table" wedge
  if (!maxSpendView && result.medianFinal > 10000 && !result.medianRunOutAge) {
    v.wedge = fmtMoneyShort(result.medianFinal);
    if (result.mode === 'historical') {
      v.wedgeSub = 'In the median historical outcome, this is what would be left at age ' + state.targetAge + '. That\'s money you could be using.';
    } else if (result.mode === 'montecarlo') {
      v.wedgeSub = 'In the median simulation, this is what would remain at age ' + state.targetAge + '.';
    } else {
      v.wedgeSub = 'At a steady ' + (state.returnRate*100).toFixed(1) + '% return, this is what you\'d have left at age ' + state.targetAge + '. That\'s money you could be enjoying now.';
    }
  }
  return v;
}

// ===== IMPACT BANNER =====
function computeImpact() {
  if (!baselineState || !baselineResult) return null;
  const fields = { spending: 'Annual spending', lateSpending: 'Late-life spending', yourStopWorkAge: state.yourIncome > 0 ? 'Your retirement age' : null, partnerStopWorkAge: "Partner's retirement age", portfolio: 'Portfolio', ssStartAge: 'SS start age', mortgagePayoffAge: 'Mortgage payoff age', homeSaleAge: 'Home sale age', returnRate: 'Return' };
  const changes = [];
  for (const k in fields) {
    if (!fields[k]) continue;
    if (JSON.stringify(baselineState[k]) !== JSON.stringify(state[k])) {
      let from = baselineState[k], to = state[k];
      if (k === 'spending' || k === 'lateSpending' || k === 'portfolio') { from = fmtMoneyShort(from); to = fmtMoneyShort(to); }
      else if (k === 'returnRate') { from = (from*100).toFixed(1)+'%'; to = (to*100).toFixed(1)+'%'; }
      changes.push({ key: k, label: fields[k], from, to });
    }
  }
  if (!changes.length) return null;
  const successDelta = result_rate(lastSimResult) - result_rate(baselineResult);
  const finalDelta = lastSimResult.medianFinal - baselineResult.medianFinal;
  return { changes, successDelta, finalDelta };
}
function result_rate(r) { return r.successRate; }
function renderSidebarImpact() {
  const im = computeImpact();
  if (!im) return '';
  const fdTxt = (im.finalDelta >= 0 ? '+' : '') + fmtMoneyShort(im.finalDelta);
  const changeRows = im.changes.map(c =>
    `<div style="display:flex;align-items:baseline;gap:6px;line-height:1;margin-bottom:3px">
      <span style="flex:1;min-width:0;font-size:13px;color:var(--ink-soft)"><strong style="color:var(--ink)">${c.label}:</strong> ${c.from} \u2192 ${c.to}</span>
      <button onclick="revertChange('${c.key}')" title="Undo this change" style="flex-shrink:0;background:none;border:none;cursor:pointer;font-size:11px;color:var(--ink-mute);padding:0;font-family:inherit;text-decoration:underline;text-decoration-style:dotted">undo</button>
    </div>`
  ).join('');
  return `<div style="background:var(--bone-2);margin:-4px -20px 10px;padding:8px 20px;border-bottom:1px solid var(--line-soft)">
    ${changeRows}
    <div style="font-size:13px;color:var(--ink-mute);margin-top:6px;padding-top:6px;border-top:1px solid var(--line-soft)">${fdTxt} median ending balance</div>
    <button style="font-size:13px;color:var(--rust);background:none;border:none;cursor:pointer;padding:2px 0;font-family:inherit;margin-top:2px" onclick="resetBaseline()">Set current as new baseline</button>
  </div>`;
}

// ===== STAT CARDS =====
function renderStatCards(result) {
  const ms = maxSpendCache ? maxSpendCache.spend : null;
  const peak = Math.max(...result.percentiles.map(p => p.p50));
  return `<div class="stat-row">
    <div class="stat-card"><div class="stat-label">Median ending balance<span class="help-mark" data-tip="The middle outcome across all ${result.mode==='historical'?'historical periods':'simulations'}. Half did better, half did worse.">i</span></div><div class="stat-value">${fmtMoneyShort(result.medianFinal)}</div></div>
    <div class="stat-card"><div class="stat-label">Peak balance<span class="help-mark" data-tip="The highest portfolio value reached in the median path. Shows when you have the most financial flexibility.">i</span></div><div class="stat-value">${fmtMoneyShort(peak)}</div></div>
    <div class="stat-card"><div class="stat-label">Most you could spend<span class="help-mark" data-tip="The highest annual spending where the portfolio lasts to age ${state.targetAge} at a steady ${(state.returnRate*100).toFixed(1)}% return — the same number the 'What can I spend?' preset uses. Real markets are bumpier, so historical mode may show a lower safe level.">i</span></div><div class="stat-value">${ms ? fmtMoneyShort(ms) : '\u2014'}</div></div>
    <div class="stat-card"><div class="stat-label">Runs out<span class="help-mark" data-tip="The age at which the portfolio hits zero in the median outcome. If blank, you don't run out before age ${state.targetAge}.">i</span></div><div class="stat-value">${result.medianRunOutAge ? 'age '+result.medianRunOutAge : 'never'}</div></div>
  </div>`;
}

// ===== CONFIDENCE BANDS =====
function renderBands(result) {
  const last = result.percentiles[result.percentiles.length - 1];
  if (result.mode === 'fixed') {
    return `<div class="bands"><div class="band neutral" style="grid-column:1/-1"><div class="band-label">Projected ending balance</div><div class="band-sub">At a steady ${(state.returnRate*100).toFixed(1)}% real return</div><div class="band-value">${last.p50 <= 0 ? 'Depleted at age '+result.medianRunOutAge : fmtMoneyShort(last.p50)}</div></div></div>`;
  }
  const consTxt = last.p10 <= 0 ? 'Ran out by ' + (result.failures[0] ? 'age '+result.failures[0].ranOutAge : 'age '+state.targetAge) : fmtMoneyShort(last.p10);
  return `<div class="bands">
    <div class="band warn"><div class="band-label">Conservative</div><div class="band-sub">Worst 10%</div><div class="band-value">${consTxt}</div></div>
    <div class="band ok"><div class="band-label">Likely outcome</div><div class="band-sub">Middle 50%</div><div class="band-value">${fmtMoneyShort(last.p25)}\u2013${fmtMoneyShort(last.p75)}</div></div>
    <div class="band neutral"><div class="band-label">Optimistic</div><div class="band-sub">Best 10%</div><div class="band-value">${fmtMoneyShort(last.p90)}</div></div>
  </div>`;
}

// ===== EVENT TIMELINE =====
function renderEventTimeline() {
  const events = [];
  if (state.yourStopWorkAge > state.age && state.yourIncome > 0) events.push({ age: state.yourStopWorkAge, label: 'You retire', detail: 'Income drops from ' + fmtMoneyShort(state.yourIncome) + ' to $0' });
  if (state.hasPartner && state.partnerStopWorkAge > state.partnerAge && state.partnerIncome > 0) events.push({ age: state.partnerStopWorkAge, label: 'Partner retires', detail: 'Partner income drops to $0' });
  if (state.housing > 0 && state.mortgagePayoffAge > state.age) events.push({ age: state.mortgagePayoffAge, label: 'Mortgage paid off', detail: fmtMoneyShort(state.housing) + '/yr housing cost drops' });
  if (state.ssStartAge > state.age && (state.yourSSAmount > 0 || state.partnerSSAmount > 0)) events.push({ age: state.ssStartAge, label: 'Social Security begins', detail: fmtMoneyShort(state.yourSSAmount + state.partnerSSAmount) + '/yr starts' });
  if (state.slowDownAge > state.age && state.lateSpending !== state.spending) events.push({ age: state.slowDownAge, label: 'Spending changes', detail: fmtMoneyShort(state.spending) + ' \u2192 ' + fmtMoneyShort(state.lateSpending) + '/yr' });
  if (state.homeSaleAge) events.push({ age: state.homeSaleAge, label: 'Home sale', detail: fmtMoneyShort(state.homeSaleProceeds) + ' added to portfolio' });
  if (state.oneTimeEvents) state.oneTimeEvents.forEach(ev => events.push({ age: ev.age, label: ev.label, detail: fmtMoneyShort(ev.amount) }));
  events.sort((a, b) => a.age - b.age);
  if (!events.length) return '';
  return `<div style="display:flex;flex-wrap:wrap;gap:6px 10px;margin-bottom:18px;padding:0 4px">${events.map(ev =>
    `<div style="font-size:14px;color:var(--ink-mute);background:var(--paper);border:1px solid var(--line-soft);border-radius:3px;padding:4px 8px" title="${ev.detail}"><span style="font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--ink-soft);margin-right:4px">${ev.age}</span>${ev.label}</div>`
  ).join('')}</div>`;
}

// ===== SPENDING EXPLORER =====
function computeSpendingLevels() {
  if (!spendingLevelsStale && spendingLevelsCache) return spendingLevelsCache;
  const base = state.spending || 50000;
  const ratio = state.spending > 0 ? state.lateSpending / state.spending : 0.85;
  const mults = [0.8, 0.9, 1.0, 1.1, 1.2];
  const rows = mults.map(m => {
    const spend = Math.round(base * m / 1000) * 1000;
    const ts = { ...state, spending: spend, lateSpending: Math.round(spend * ratio) };
    const r = runForState(ts);
    const last = r.percentiles[r.percentiles.length - 1];
    return { spending: spend, successRate: r.successRate, successCount: r.successCount, totalPeriods: r.totalPeriods, medianFinal: r.medianFinal, p10: last.p10, isCurrent: spend === (Math.round(base/1000)*1000) && m === 1.0 };
  });
  spendingLevelsCache = rows; spendingLevelsStale = false;
  return rows;
}
function renderSpendingExplorer() {
  const rows = computeSpendingLevels();
  const isHist = state.simMode === 'historical';
  return `<table class="data-table"><thead><tr><th>Annual spending</th><th>${isHist?'Historical success':'Success'}</th><th>Median ending</th><th>Worst case</th></tr></thead><tbody>
    ${rows.map(r => `<tr class="${r.isCurrent?'current-row':''} clickable" onclick="applySpending(${r.spending})" title="Click to set spending to ${fmtMoney(r.spending)}/yr"><td>${fmtMoney(r.spending)}/yr ${r.isCurrent?'<span class="tag-current">current</span>':''}</td><td>${isHist ? r.successCount+' of '+r.totalPeriods : Math.round(r.successRate*100)+'%'}</td><td>${fmtMoneyShort(r.medianFinal)}</td><td>${r.p10<=0?'<span class="fail">Ran out</span>':fmtMoneyShort(r.p10)}</td></tr>`).join('')}
  </tbody></table>`;
}

        <div style="font-size:28px;font-weight:600;font-family:'JetBrains Mono',monospace;color:${improved?'var(--moss)':'var(--ink)'}">${fmtShort(withFlex)}</div>

            </div>
          </div>
          <div>
            <div style="font-size:14px;color:var(--ink-mute);margin-bottom:3px">Boost</div>
            <div style="display:inline-flex;align-items:baseline;gap:1px">
              <input type="number" min="0" max="50" step="5" value="${Math.round(state.guardrailBoostPct*100)}" onclick="event.stopPropagation()" onchange="update('guardrailBoostPct',+this.value/100)" style="width:42px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;background:var(--bone);border:1px solid var(--line);border-radius:3px;padding:4px 2px;color:var(--ink)"/><span style="font-size:14px;color:var(--ink-mute)">%</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="flex-note">${state.guardrailsEnabled && improved ? 'Cutting spending by '+Math.round(state.guardrailCutPct*100)+'% when your portfolio is stressed improves outcomes. The trade-off: in some years you\u2019d live on less, but the portfolio recovers faster.' : state.guardrailsEnabled ? 'At these settings, flexibility has minimal impact on outcomes.' : 'With fixed spending, the same amount is withdrawn every year regardless of market conditions.'}</div>`;
}

// ===== STRESS TESTS =====
function renderStressTests() {
  const cards = HISTORICAL_SCENARIOS.map(s => {
    const run = runNamedScenario(state, s);
    const final = run.years[run.years.length - 1];
    const survived = !run.years.some(y => y.ranOut);
    const ranOut = run.years.find(y => y.ranOut);
    return `<div class="scenario-card ${survived?'survived':'failed'}" onclick="showScenarioDetail('${s.id}')">
      <div class="scenario-name">${s.name}</div>
      <div class="scenario-years">${s.startYear}\u2013${s.startYear + (state.targetAge - state.age)}${run.padded?'*':''}</div>
      <div class="scenario-result ${survived?'ok':'fail'}">${survived ? 'Ended with '+fmtMoneyShort(final.portfolio) : 'Ran out at age '+ranOut.age}</div>
      <div class="scenario-desc">${s.description}</div>
    </div>`;
  }).join('');
  return `<div class="section-heading">Historical stress tests</div>
    <div class="section-sub">How this scenario would have played out starting in specific market environments.</div>
    <div class="scenario-cards">${cards}</div>`;
}

// ===== SS COMPARISON =====
function renderSSComparison() {
  const ages = [62, 67, 70];
  const factors = { 62: 0.70, 67: 1.00, 70: 1.24 };
  const baseYour = state.ssStartAge === 67 ? state.yourSSAmount : state.yourSSAmount / (factors[state.ssStartAge] || 1);
  const basePartner = state.ssStartAge === 67 ? state.partnerSSAmount : state.partnerSSAmount / (factors[state.ssStartAge] || 1);
  const isHist = state.simMode === 'historical';
  const cards = ages.map(a => {
    const ts = { ...state, ssStartAge: a, yourSSAmount: Math.round(baseYour * factors[a]), partnerSSAmount: Math.round(basePartner * factors[a]) };
    const r = runForState(ts);
    const benefit = ts.yourSSAmount + ts.partnerSSAmount;
    const label = a === 62 ? 'Early' : a === 67 ? 'Full retirement' : 'Delayed';
    const highlight = a === state.ssStartAge ? 'highlight' : '';
    return `<div class="ss-card ${highlight}" onclick="applySSAge(${a})" style="cursor:pointer" title="Click to use age ${a}"><div class="ss-age">${a}</div><div class="ss-label">${label}</div><div class="ss-benefit">${fmtMoney(benefit)}/yr</div><div class="ss-success" style="color:${r.successRate>=0.85?'var(--moss)':r.successRate>=0.6?'var(--gold)':'var(--danger)'}">${isHist ? 'Survived ' + r.successCount+' of '+r.totalPeriods : Math.round(r.successRate*100)+'%'}</div></div>`;
  }).join('');
  return `<div class="section-heading">Social Security claiming</div>
    <div class="section-sub">Claiming earlier means smaller payments for more years; later means larger payments for fewer. Click a card to see what happens if you claim at that age.</div>
    <div class="ss-grid">${cards}</div>`;
}

// ===== TAX COMPARISON =====
function renderTaxComparison() {
  // Use fixed mode for clean apples-to-apples comparison regardless of current mode
  const propState = { ...state, withdrawalStrategy: 'proportional' };
  const smartState = { ...state, withdrawalStrategy: 'taxSmart' };
  const prop = runFixed(propState);
  const smart = runFixed(smartState);
  const taxTotal = (r) => r.medianRun ? Math.round(r.medianRun.reduce((s, y) => s + (y.tax || 0), 0)) : 0;
  const propTax = taxTotal(prop), smartTax = taxTotal(smart);
  // After-tax ending wealth: Roth is worth 100%, traditional worth (1-taxRate), taxable worth (1-capGainsTax*0.5)
  const afterTaxWealth = (r) => {
    const fa = r.medianRun && r.medianRun.finalAccounts;
    if (!fa) return r.medianFinal;
    return fa.roth + fa.traditional * (1 - state.taxRate) + fa.taxable * (1 - state.capGainsTax * 0.5);
  };
  const propATW = afterTaxWealth(prop), smartATW = afterTaxWealth(smart);
  const smartBetter = smartATW > propATW;
  return `<div class="section-heading">Withdrawal strategy</div>
    <div class="section-sub">How you draw from different account types affects after-tax wealth. Preserving Roth (tax-free) growth typically leaves more usable money. These are simplified estimates at a steady ${(state.returnRate*100).toFixed(1)}% return.</div>
    <table class="data-table"><thead><tr><th></th><th>Proportional</th><th>Tax-aware order</th></tr></thead><tbody>
      <tr><td>After-tax ending wealth</td><td>${fmtMoneyShort(propATW)}</td><td style="color:${smartBetter?'var(--moss)':'var(--ink-soft)'};font-weight:600">${fmtMoneyShort(smartATW)}</td></tr>
      <tr><td>Estimated total tax paid</td><td>${fmtMoneyShort(propTax)}</td><td>${fmtMoneyShort(smartTax)}</td></tr>
      <tr><td>Pre-tax ending balance</td><td>${fmtMoneyShort(prop.medianFinal)}</td><td>${fmtMoneyShort(smart.medianFinal)}</td></tr>
    </tbody></table>
    <div class="flex-note">Tax-aware ordering (taxable \u2192 traditional \u2192 Roth) preserves tax-free Roth growth. It may show higher nominal tax, but the leftover money is worth more after tax. Estimated difference in after-tax wealth: ${fmtMoneyShort(Math.abs(smartATW - propATW))}. A tax professional can model your specific situation.</div>`;
}

        <p>This matters because of sequence of returns risk. A market crash in year two of retirement is far more damaging than the same crash in year twenty, even if the long-run average return is identical. In year two you are forced to sell at the bottom to cover expenses, and those sold shares never recover. Historical mode shows how many real sequences your plan survives, including the ones that started right before 1929, 1966, 2000, and 2008.</p>

          <li><strong>100% is not the goal.</strong> A plan that survives every historical period including the Great Depression is almost certainly too conservative. You are leaving real years of good spending on the table.</li>

          <li><strong>Failures are not cliff edges.</strong> When a plan "fails," it usually means the portfolio ran low in the final years, not that you would be broke at 70. Social Security and adjusted late-life spending can absorb a lot of what looks alarming in the model.</li>

          <li><strong>The withdrawal rate cliff.</strong> Portfolios under stress behave differently at different withdrawal rates. Going from 3.5% to 4% might drop your success rate a little. Going from 4% to 4.5% might drop it a lot, because you start hitting the same bad market sequences that caused most historical failures. The relationship is not linear.</li>
          <li><strong>Early retirement is especially sensitive.</strong> A 10-year difference in retirement age does not just add 10 more years of withdrawals — it also removes 10 years of contributions and growth while adding 10 years of portfolio depletion risk. The two effects stack.</li>

        <p>If your portfolio drops 40% in year two of retirement, you have to sell investments at the bottom just to cover expenses. Those shares cannot recover because they are gone. A crash in year twenty, when your portfolio is smaller and your drawing period is shorter, does far less damage.</p>
        <p>This is why plugging in an average return and projecting forward is misleading for retirement planning. A steady 6% real return assumption says nothing about what happens if a 2008-style crash hits in your first year, even if 6% turns out to be the actual long-run average.</p>

          <li>It assumes a fixed withdrawal regardless of what the market does, with no adjustments in bad years.</li>
          <li>It was calibrated for a 30-year horizon. Retire at 55 planning to 95 and you need something more conservative.</li>
          <li>It ignores income. Social Security alone can dramatically change how hard your portfolio has to work.</li>
          <li>It does not account for spending that changes in late life — healthcare costs may rise even as travel and discretionary spending fall.</li>
        </ul>
        <p>This tool does not apply the 4% rule. It runs your actual numbers through historical and simulated market sequences, accounting for your income, Social Security, housing costs, and spending trajectory.</p>
      </div>
    </details>

      <summary>How does the flexible spending (guardrails) system work?</summary>
      <div class="faq-body">
        <p>The idea comes from financial planner Jonathan Guyton: rather than withdrawing a fixed amount every year regardless of conditions, you set a target and let it flex within a band based on how hard your portfolio is actually working.</p>
        <p>In the first year you draw from the portfolio, the tool records your withdrawal rate as the baseline. Each year after that:</p>
        <ul>
          <li>If your withdrawal rate climbs more than 20% above that baseline, your portfolio is under stress and spending is cut by 25%.</li>
          <li>If it falls more than 20% below, your portfolio is running ahead and spending is boosted by 20%.</li>
        </ul>
        <p>A plan with guardrails on will tighten in bad market stretches and loosen in good ones. In practice this substantially improves survival rates versus rigid fixed spending, while keeping the variability realistic enough to plan around.</p>
        <p>Toggle guardrails on or off and adjust the cut and boost percentages in More options.</p>
      </div>
    </details>

    <details class="faq-item">
      <summary>What are account types and which withdrawal strategy should I use?</summary>
      <div class="faq-body">
        <p>Most people have savings spread across different kinds of accounts, and they are not all taxed the same way. The account types feature lets you model this.</p>
        <ul>
          <li><strong>Traditional (IRA, 401k).</strong> Contributions went in pre-tax, so withdrawals are taxed as ordinary income. The model gross-ups each withdrawal to cover the tax owed, meaning you need to pull out more than you actually spend.</li>
          <li><strong>Roth (IRA, 401k).</strong> Contributions went in after-tax, so qualified withdrawals are tax-free. This makes Roth dollars worth more than traditional dollars of the same nominal amount.</li>
          <li><strong>Taxable brokerage.</strong> No special tax treatment going in or out, but gains are taxed at the lower capital gains rate rather than ordinary income rates. The model approximates this by assuming about half of each withdrawal is gain.</li>
        </ul>
        <p>The withdrawal strategy controls the order you draw from these accounts:</p>
        <ul>
          <li><strong>Proportional</strong> draws from all three in proportion to their current balances. Simple and predictable.</li>
          <li><strong>Tax-aware</strong> draws from taxable first, then traditional, then Roth last. Because Roth grows tax-free, leaving it untouched as long as possible lets it compound without tax drag. This typically leaves more usable after-tax wealth at the end, though it may show higher nominal taxes in the early years. The withdrawal strategy comparison table (visible in Historical and Simulated modes) shows the estimated difference for your specific numbers.</li>
        </ul>
        <p>The right answer depends on your tax bracket now versus in retirement, and on whether RMDs will force traditional withdrawals anyway after age 73. A tax professional can model your specific situation.</p>
      </div>
    </details>

    <details class="faq-item">
      <summary>What are the model's limitations?</summary>
      <div class="faq-body">
        <p>A few things the model does not capture:</p>
        <ul>
          <li><strong>Healthcare costs</strong> are not broken out separately. Include them in your annual spending, or add pre-Medicare premiums as a life event if they will differ significantly from your regular retirement spending.</li>
          <li><strong>Required Minimum Distributions</strong> (RMDs) starting at age 73 are not modeled. For most people the impact is limited, but a large traditional IRA can push forced withdrawals into a higher tax bracket.</li>
          <li><strong>Medicare premium surcharges</strong> (IRMAA) for higher-income retirees are not included.</li>
          <li><strong>Roth conversions and tax-loss harvesting</strong> are not modeled. A good accountant can meaningfully improve your tax picture beyond what any simple model captures.</li>
          <li><strong>Spousal and survivor Social Security benefits</strong> are entered manually but not calculated automatically from each other's records.</li>
          <li><strong>State income tax</strong> is approximated for most states. Set your state in More options for a closer number.</li>
        </ul>
        <p>Use this tool to understand the range of possibilities and the levers available to you, then take the numbers to a professional before making major decisions.</p>
      </div>
    </details>

    <details class="faq-item">
      <summary>Should I talk to a financial advisor?</summary>
      <div class="faq-body">
        <p>This tool is a starting point, not a substitute for professional advice. A good advisor can account for your full picture: estate planning, insurance, tax optimization, account structure, and the things a model cannot capture about your situation.</p>

      </div>
    </details>

  </div></div>` : ''}

function drawMainChart(result) {
  const ctx = document.getElementById('mainChart'); if (!ctx) return;
  if (chart) chart.destroy();
  const p = result.percentiles;
  const labels = p.map(x => x.age);
  const fill = (data, color, alpha) => ({ data, borderColor: color, backgroundColor: alpha, borderWidth: 1.5, pointRadius: 0, fill: false, tension: 0.1 });
  const datasets = [];
  if (result.mode !== 'fixed') {
    datasets.push({ label: 'p90', data: p.map(x => x.p90), borderColor: 'transparent', backgroundColor: 'rgba(91,110,58,0.10)', pointRadius: 0, fill: '+1', tension: 0.1 });
    datasets.push({ label: 'p10', data: p.map(x => x.p10), borderColor: 'transparent', backgroundColor: 'transparent', pointRadius: 0, fill: false, tension: 0.1 });
    datasets.push({ label: 'p75', data: p.map(x => x.p75), borderColor: 'transparent', backgroundColor: 'rgba(91,110,58,0.16)', pointRadius: 0, fill: '+1', tension: 0.1 });
    datasets.push({ label: 'p25', data: p.map(x => x.p25), borderColor: 'transparent', backgroundColor: 'transparent', pointRadius: 0, fill: false, tension: 0.1 });
  }
  datasets.push(Object.assign(fill(p.map(x => x.p50), '#a04a28', 'transparent'), { label: 'Median', borderWidth: 2 }));

  // Key event ages for annotations
  const events = [];
  if (state.yourStopWorkAge > state.age && state.yourStopWorkAge < state.targetAge) events.push({ age: state.yourStopWorkAge, label: 'Retire' });
  if (state.ssStartAge > state.age) events.push({ age: state.ssStartAge, label: 'SS starts' });
  if (state.mortgagePayoffAge > state.age && state.housing > 0) events.push({ age: state.mortgagePayoffAge, label: 'Mortgage done' });
  if (state.homeSaleAge) events.push({ age: state.homeSaleAge, label: 'Home sale' });
  if (state.slowDownAge > state.age && state.lateSpending !== state.spending) events.push({ age: state.slowDownAge, label: state.lateSpending < state.spending ? 'Spending drops' : 'Spending rises' });

  // Chart.js plugin for vertical annotation lines
  const annotationPlugin = {
    id: 'eventAnnotations',
    afterDraw(chart) {
      const xScale = chart.scales.x;
      const yScale = chart.scales.y;
      const ctx2 = chart.ctx;
      // Sort events and calculate pixel positions to detect collisions
      const positioned = events.map(ev => {
        const idx = labels.indexOf(ev.age);
        if (idx < 0) return null;
        return { ...ev, idx, x: xScale.getPixelForValue(idx) };
      }).filter(Boolean);
      // Assign each label to the lowest stagger row with no nearby label, so labels that
      // share an age (or sit close together) stack vertically instead of overlapping.
      positioned.sort((a, b) => a.x - b.x);
      const rowLastX = [];
      positioned.forEach(ev => {
        let row = 0;
        while (rowLastX[row] !== undefined && Math.abs(rowLastX[row] - ev.x) < 64) row++;
        ev.row = row;
        rowLastX[row] = ev.x;
      });
      positioned.forEach(ev => {
        ctx2.save();
        ctx2.strokeStyle = '#d4cab8';
        ctx2.lineWidth = 1;
        ctx2.setLineDash([4, 3]);
        ctx2.beginPath();
        ctx2.moveTo(ev.x, yScale.top);
        ctx2.lineTo(ev.x, yScale.bottom);
        ctx2.stroke();
        ctx2.setLineDash([]);
        ctx2.fillStyle = '#75695a';
        ctx2.font = '10px Inter Tight, sans-serif';
        ctx2.textAlign = 'center';
        ctx2.fillText(ev.label, ev.x, yScale.top - 4 - ev.row * 12);
        ctx2.restore();
      });
    }
  };

  // Crosshair plugin: draws a vertical line at hover position
  const crosshairPlugin = {
    id: 'crosshair',
    afterDraw(chart) {
      if (chart.tooltip && chart.tooltip._active && chart.tooltip._active.length) {
        const x = chart.tooltip._active[0].element.x;
        const yScale = chart.scales.y;
        const ctx2 = chart.ctx;
        ctx2.save();
        ctx2.strokeStyle = 'rgba(26,24,20,0.15)';
        ctx2.lineWidth = 1;
        ctx2.beginPath();
        ctx2.moveTo(x, yScale.top);
        ctx2.lineTo(x, yScale.bottom);
        ctx2.stroke();
        ctx2.restore();
      }
    }
  };

  // Enhanced tooltip showing breakdown
  const medianRun = result.medianRun;
  chart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    plugins: [annotationPlugin, crosshairPlugin],
    options: {
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { top: 34 } },
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: {
        mode: 'index', intersect: false,
        callbacks: {
          title: (t) => 'Age ' + t[0].label,
          label: (c) => {
            if (!['Median','p10','p90'].includes(c.dataset.label)) return null;
            const lines = [c.dataset.label + ': ' + fmtMoneyShort(c.parsed.y)];
            if (c.dataset.label === 'Median' && medianRun && medianRun[c.dataIndex]) {
              const yr = medianRun[c.dataIndex];
              if (yr.yourIncome > 0) lines.push('Income: ' + fmtMoneyShort(yr.yourIncome + yr.partnerIncome));
              if (yr.ssIncome > 0) lines.push('Social Security: ' + fmtMoneyShort(yr.ssIncome));
              lines.push('Spending: ' + fmtMoneyShort(yr.spending));
              if (yr.withdrawal > 0) lines.push('Withdrawal: ' + fmtMoneyShort(yr.withdrawal));
            }
            return lines;
          },
          afterBody: (t) => {
            const idx = t[0].dataIndex;
            const age = labels[idx];
            const ev = events.find(e => e.age === age);
            return ev ? ['\u2192 ' + ev.label] : [];
          }
        },
        filter: (t) => ['Median','p10','p90'].includes(t.dataset.label)
      } },
      scales: {
        x: { title: { display: true, text: 'Age', color: '#6b6356', font: { size: 11 } }, ticks: { color: '#75695a', maxTicksLimit: 10 }, grid: { color: 'rgba(212,202,184,0.4)' } },
        y: { ticks: { color: '#75695a', callback: (v) => fmtMoneyShort(v) }, grid: { color: 'rgba(212,202,184,0.4)' } }
      }
    }
  });
}

      d0: { data: rows.map(y => y.yourIncome + y.partnerIncome), bg: 'rgba(91,110,58,0.6)', label: 'Work income' },
      d1: { data: rows.map(y => y.ssIncome), bg: 'rgba(201,164,73,0.7)', label: 'Social Security' },
      d2: { data: rows.map(y => -(y.spending)), bg: 'rgba(184,92,56,0.5)', label: 'Spending' },
    };
  }
  const netData = rows.map(y => {
    const gross = y.yourIncome + y.partnerIncome + y.ssIncome;
    const tax = y.tax || ((y.yourIncome + y.partnerIncome) * state.taxRate + y.ssIncome * state.taxRate * 0.5);
    return Math.round(gross - tax - y.spending);
  });
  return {
    d0: { data: netData.map(v => Math.max(0, v)), bg: 'rgba(91,110,58,0.7)', label: 'Surplus' },
    d1: { data: netData.map(() => 0), bg: 'transparent', label: '' },
    d2: { data: netData.map(v => Math.min(0, v)), bg: 'rgba(184,92,56,0.6)', label: 'Deficit' },
  };
}

function drawCashflowChart(result) {
  const ctx = document.getElementById('cashflowChart'); if (!ctx) return;
  const rows = result.medianRun || [];
  if (!rows.length) return;
  cashflowRows = rows;
  const labels = rows.map(y => y.age);
  const d = computeCashflowData(rows, cashflowMode);

  // If chart exists but canvas was replaced by re-render, destroy stale chart
  if (cashflowChart && cashflowChart.canvas !== ctx) {
    cashflowChart.destroy();
    cashflowChart = null;
  }

  if (cashflowChart) {
    // Update existing chart for animation
    cashflowChart.data.labels = labels;
    cashflowChart.data.datasets[0].data = d.d0.data;
    cashflowChart.data.datasets[0].backgroundColor = d.d0.bg;
    cashflowChart.data.datasets[0].label = d.d0.label;
    cashflowChart.data.datasets[1].data = d.d1.data;
    cashflowChart.data.datasets[1].backgroundColor = d.d1.bg;
    cashflowChart.data.datasets[1].label = d.d1.label;
    cashflowChart.data.datasets[2].data = d.d2.data;
    cashflowChart.data.datasets[2].backgroundColor = d.d2.bg;
    cashflowChart.data.datasets[2].label = d.d2.label;
    cashflowChart.options.plugins.legend.display = (cashflowMode === 'breakdown');
    cashflowChart.update();
    return;
  }

  cashflowChart = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [
      { label: d.d0.label, data: d.d0.data, backgroundColor: d.d0.bg, stack: 'in', borderRadius: 1 },
      { label: d.d1.label, data: d.d1.data, backgroundColor: d.d1.bg, stack: 'in', borderRadius: 1 },
      { label: d.d2.label, data: d.d2.data, backgroundColor: d.d2.bg, stack: 'out', borderRadius: 1 },
    ] },
    options: { responsive: true, maintainAspectRatio: false,
      animation: { duration: 700, easing: 'easeInOutQuart' },
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: cashflowMode === 'breakdown', labels: { color: '#6b6356', font: { size: 11 }, boxWidth: 10, padding: 12, filter: (item) => item.text !== '' } },
        tooltip: { mode: 'index', intersect: false, callbacks: {
          title: (t) => 'Age ' + t[0].label,
          label: (c) => {
            if (c.dataset.label === '') return null;
            const yr = cashflowRows && cashflowRows[c.dataIndex];
            if (cashflowMode === 'breakdown') {
              return c.dataset.label + ': ' + fmtMoneyShort(Math.abs(c.parsed.y));
            }
            const net = yr ? Math.round((yr.yourIncome + yr.partnerIncome + yr.ssIncome) - ((yr.yourIncome + yr.partnerIncome) * state.taxRate + yr.ssIncome * state.taxRate * 0.5) - yr.spending) : c.parsed.y;
            if (c.datasetIndex === 1) return null;
            const lines = [(net >= 0 ? 'Surplus: +' : 'Deficit: ') + fmtMoneyShort(net) + '/yr'];
            if (yr) {
              if (yr.yourIncome + yr.partnerIncome > 0) lines.push('Income: ' + fmtMoneyShort(yr.yourIncome + yr.partnerIncome));
              if (yr.ssIncome > 0) lines.push('SS: ' + fmtMoneyShort(yr.ssIncome));
              lines.push('Spending: ' + fmtMoneyShort(yr.spending));
            }
            return lines;
          }
        },
        filter: (t) => t.dataset.label !== ''
        }
      },
      scales: {
        x: { stacked: true, ticks: { color: '#75695a', maxTicksLimit: 10 }, grid: { display: false } },
        y: { stacked: true, ticks: { color: '#75695a', callback: (v) => { const a = Math.abs(v); return (v < 0 ? '-' : '') + (a >= 1e6 ? '$'+(a/1e6).toFixed(0)+'M' : a >= 1e3 ? '$'+Math.round(a/1e3)+'k' : '$'+a); } }, grid: { color: 'rgba(212,202,184,0.4)' } }
      }
    }
  });
}

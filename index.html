<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spend Enough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600;9..144,700&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bone: #f4efe6;
    --bone-2: #ebe4d6;
    --ink: #1a1814;
    --ink-soft: #3d3830;
    --ink-mute: #6b6356;
    --ink-faint: #8a8173;
    --rust: #b85c38;
    --rust-deep: #8a4226;
    --moss: #5b6e3a;
    --moss-deep: #3e4d28;
    --gold: #c9a449;
    --paper: #fbf8f1;
    --line: #d4cab8;
    --line-soft: #e2dac8;
    --danger: #a8331f;
    --danger-soft: #d8856f;
    --shadow-sm: 0 1px 0 rgba(26,24,20,0.04), 0 1px 2px rgba(26,24,20,0.06);
    --shadow-md: 0 2px 4px rgba(26,24,20,0.06), 0 8px 24px rgba(26,24,20,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter Tight', system-ui, sans-serif;
    background: var(--bone);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    background-image:
      radial-gradient(circle at 20% 0%, rgba(184,92,56,0.04) 0%, transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(91,110,58,0.04) 0%, transparent 50%);
  }

  /* Data tables - horizontal scroll on mobile */
  .data-table { width: 100%; border-collapse: collapse; }
  @media (max-width: 768px) {
    .data-table-wrapper { overflow-x: auto; -webkit-overflow-scrolling: touch; margin: 0 -20px; padding: 0 20px; }
  }
  
  /* Improve touch targets */
  button, input[type="button"], input[type="submit"], input[type="range"], .clickable { 
    min-height: 44px;
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
  }
  
  input[type="range"] { cursor: pointer; }
  
  /* Better modal behavior on mobile */
  .modal-overlay { padding: 16px; }
  @media (max-width: 480px) {
    .modal-overlay { align-items: flex-start; padding-top: 20px; }
    .modal { max-width: calc(100vw - 32px); max-height: calc(100vh - 40px); }
  }
  
  /* Prevent zoom on input focus (iOS) */
  input[type="text"], input[type="number"], input[type="email"], input[type="tel"], select, textarea {
    font-size: 16px !important;
  }

  /* ========== HEADER ========== */
  header {
    padding: 18px 32px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--paper);
  }
  .logo {
    font-family: 'Fraunces', serif;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.02em;
    display: flex;
    align-items: baseline;
    gap: 4px;
  }
  .logo-dot {
    width: 8px; height: 8px;
    background: var(--rust);
    border-radius: 50%;
    display: inline-block;
    margin-right: 2px;
    transform: translateY(-2px);
  }
  .tagline { color: var(--ink-mute); font-size: 13px; font-style: italic; font-family: 'Fraunces', serif; }
  .scenarios-bar { display: flex; gap: 8px; align-items: center; }
  .scenario-pill {
    padding: 6px 14px; border: 1px solid var(--line); background: var(--paper);
    color: var(--ink-soft); font-size: 12px; border-radius: 100px; cursor: pointer;
    transition: all 0.15s ease; font-weight: 500; font-family: inherit;
  }
  .scenario-pill:hover { border-color: var(--ink); background: var(--bone-2); }

  /* ========== ONBOARDING ========== */
  .onboarding { max-width: 720px; margin: 0 auto; padding: 64px 40px; }
  .onboard-hero { margin-bottom: 48px; text-align: center; }
  .onboard-eyebrow { text-transform: uppercase; letter-spacing: 0.18em; font-size: 11px; color: var(--rust); font-weight: 600; margin-bottom: 18px; }
  .onboard-title { font-family: 'Fraunces', serif; font-size: clamp(38px, 6vw, 60px); font-weight: 400; line-height: 1.05; letter-spacing: -0.025em; margin-bottom: 22px; }
  .onboard-title em { font-style: italic; color: var(--rust); font-weight: 500; }
  .onboard-sub { font-size: 17px; color: var(--ink-mute); max-width: 520px; margin: 0 auto; line-height: 1.6; }
  .onboard-fine { font-size: 12px; color: var(--ink-faint); margin-top: 18px; }
  .onboard-fine a { color: var(--rust); }
  .onboard-step { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 32px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
  .step-number { font-family: 'Fraunces', serif; font-size: 13px; color: var(--rust); font-style: italic; margin-bottom: 8px; }
  .step-title { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 500; margin-bottom: 6px; letter-spacing: -0.01em; }
  .step-hint { color: var(--ink-mute); font-size: 14px; margin-bottom: 22px; }
  .field-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
  .field-grid.cols-1 { grid-template-columns: 1fr; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-mute); font-weight: 600; }
  .field input, .field select { background: var(--bone); border: 1px solid var(--line); padding: 11px 14px; font-family: 'JetBrains Mono', monospace; font-size: 15px; color: var(--ink); border-radius: 2px; transition: border-color 0.15s ease; }
  .field input:focus, .field select:focus { outline: none; border-color: var(--ink); }
  .field-hint { font-size: 11px; color: var(--ink-faint); }
  .field-hint .helper-trigger { background: none; border: none; color: var(--rust); cursor: pointer; font-size: 11px; text-decoration: underline; padding: 0; font-family: inherit; }
  .step-actions { display: flex; justify-content: center; gap: 12px; margin-top: 28px; }
  .btn-primary { background: var(--ink); color: var(--paper); border: none; padding: 14px 28px; font-size: 15px; font-weight: 600; border-radius: 3px; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 8px; transition: background 0.15s ease; }
  .btn-primary:hover { background: var(--rust); }
  .btn-secondary { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); padding: 14px 22px; font-size: 14px; border-radius: 3px; cursor: pointer; font-family: inherit; }
  .btn-secondary:hover { border-color: var(--ink); }
  .validation-msg { color: var(--danger); font-size: 13px; text-align: center; margin-top: 14px; min-height: 18px; }
</style>
</head>
<style>
  /* ========== DASHBOARD LAYOUT ========== */
  .dashboard { display: grid; grid-template-columns: 280px 1fr; grid-template-areas: "mode mode" "sidebar main" "resources resources"; min-height: calc(100vh - 73px); }
  .resources-row { grid-area: resources; padding: 0 32px 28px; max-width: 1100px; }
  .sidebar { grid-area: sidebar; background: var(--paper); border-right: 1px solid var(--line); padding: 22px 20px; overflow-y: auto; }
  .sidebar-section { margin-bottom: 22px; padding-bottom: 22px; border-bottom: 1px solid var(--line-soft); }
  .sidebar-section:last-child { border-bottom: none; }
  
  /* Mode selector - separate from sidebar */
  .mode-selector {
    grid-area: mode;
    padding: 20px;
    background: var(--paper);
    border: 1px solid var(--line-soft);
    border-radius: 4px;
    margin-bottom: 20px;
  }
  .mode-selector .toggle-group { margin-bottom: 8px; }
  .sidebar-heading { text-transform: uppercase; letter-spacing: 0.12em; font-size: 10px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
  .sidebar-sub { font-size: 11px; color: var(--ink-mute); margin-bottom: 12px; }
  .preset-btn { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: var(--bone); padding: 9px 11px; font-size: 12px; color: var(--ink-soft); margin-bottom: 5px; border-radius: 3px; font-family: inherit; cursor: pointer; transition: border-color 0.15s ease; }
  .preset-btn:hover { border-color: var(--rust); color: var(--ink); }
  .preset-icon { color: var(--rust); font-style: italic; font-family: 'Fraunces', serif; margin-right: 5px; }
  .toggle-group { display: flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; }
  .toggle-btn { flex: 1; padding: 7px 4px; font-size: 11px; text-align: center; border: none; cursor: pointer; font-family: inherit; background: var(--bone); color: var(--ink-mute); transition: all 0.12s ease; }
  .toggle-btn:hover { background: var(--bone-2); }
  .toggle-btn.active { background: var(--ink); color: var(--paper); }
  .control { margin-bottom: 14px; }
  .control-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .control-label { font-size: 12px; color: var(--ink-soft); }
  .control-value { font-size: 12px; font-weight: 600; color: var(--ink); font-family: 'JetBrains Mono', monospace; }
  .control input[type=range] { width: 100%; height: 4px; -webkit-appearance: none; appearance: none; background: var(--line); border-radius: 2px; outline: none; }
  .control input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--ink); border-radius: 50%; cursor: pointer; transition: background 0.12s; }
  .control input[type=range]::-webkit-slider-thumb:hover { background: var(--rust); }
  .control input[type=range]::-moz-range-thumb { width: 16px; height: 16px; background: var(--ink); border-radius: 50%; cursor: pointer; border: none; }
  .control input[type=number] { width: 100%; background: var(--bone); border: 1px solid var(--line); padding: 7px 9px; font-family: 'JetBrains Mono', monospace; font-size: 13px; color: var(--ink); border-radius: 2px; }
  .control input[type=number]:focus { outline: none; border-color: var(--ink); }
  .help-mark { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; border-radius: 50%; border: 1px solid var(--line); color: var(--ink-mute); font-size: 9px; font-style: italic; margin-left: 4px; cursor: help; font-family: 'Fraunces', serif; }
  .more-toggle { display: block; width: 100%; text-align: left; border: none; background: transparent; padding: 8px 0 0; font-size: 12px; color: var(--rust); font-family: inherit; cursor: pointer; }
  .more-toggle:hover { text-decoration: underline; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .checkbox-row input { width: 14px; height: 14px; accent-color: var(--ink); }
  .checkbox-row label { font-size: 12px; color: var(--ink-soft); cursor: pointer; }
  .acct-grid { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; }
  .acct-grid label { font-size: 12px; color: var(--ink-soft); }
  .acct-grid input { width: 110px; background: var(--bone); border: 1px solid var(--line); padding: 6px 8px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink); border-radius: 2px; text-align: right; }

  /* ========== MAIN ========== */
  .main { grid-area: main; padding: 24px 32px; overflow-y: auto; max-width: 1100px; }
  .disclaimer-bar { background: var(--bone-2); border: 1px solid var(--line); border-radius: 4px; padding: 10px 16px; font-size: 12px; line-height: 1.5; color: var(--ink-mute); margin-bottom: 18px; }
  .disclaimer-bar strong { color: var(--ink-soft); font-weight: 600; }
  .disclaimer-bar a { color: var(--rust); cursor: pointer; }
  .impact-banner { background: var(--bone-2); border-radius: 4px; padding: 11px 16px; font-size: 12px; color: var(--ink-soft); line-height: 1.6; margin-bottom: 16px; }
  .impact-banner strong { color: var(--ink); }
  .impact-banner button { background: none; border: none; color: var(--rust); cursor: pointer; font-family: inherit; font-size: 12px; text-decoration: underline; padding: 0; }

  /* Verdict */
  .verdict { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 24px 28px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
  .verdict-eye { text-transform: uppercase; letter-spacing: 0.15em; font-size: 10px; font-weight: 700; margin-bottom: 8px; }
  .verdict-eye.good { color: var(--moss); }
  .verdict-eye.mid { color: var(--gold); }
  .verdict-eye.bad { color: var(--danger); }
  .verdict-head { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 400; color: var(--ink); line-height: 1.25; margin-bottom: 10px; letter-spacing: -0.01em; }
  .verdict-body { font-size: 14px; color: var(--ink-soft); line-height: 1.6; }
  .verdict-caveat { font-size: 12px; color: var(--ink-faint); margin-top: 10px; font-style: italic; }
  .verdict-wedge { margin-top: 14px; padding: 12px 16px; background: rgba(184,92,56,0.06); border-left: 3px solid var(--rust); border-radius: 0 4px 4px 0; font-size: 15px; color: var(--ink); line-height: 1.5; }
  .verdict-wedge .wedge-amount { font-family: 'JetBrains Mono', monospace; font-weight: 500; color: var(--rust); font-size: 16px; }
  .verdict-wedge .wedge-sub { font-size: 12px; color: var(--ink-mute); margin-top: 4px; }

  .toggle-btn.locked { opacity: 0.7; }
  .toggle-btn.locked .lock-icon { font-size: 10px; margin-left: 3px; }
  .unlock-prompt { margin-top: 8px; padding: 10px 14px; background: rgba(184,92,56,0.06); border-radius: 4px; font-size: 12px; color: var(--ink-soft); line-height: 1.6; }
  .unlock-prompt a { color: var(--rust); cursor: pointer; text-decoration: underline; }
  .unlock-input-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .unlock-input-row input { flex: 1; padding: 10px 12px; border: 1px solid var(--line); border-radius: 3px; font-family: 'JetBrains Mono', monospace; font-size: 13px; background: var(--paper); }
  .unlock-input-row button { padding: 10px 16px; background: var(--rust); color: var(--paper); border: none; border-radius: 3px; font-family: inherit; font-weight: 600; font-size: 13px; cursor: pointer; }
  .unlock-input-row button:hover { background: var(--rust-deep); }
  
  /* Unlock modal improvements */
  .modal h2 { color: var(--ink); }
  .modal ul { list-style: none; padding: 0; }
  .modal ul li { position: relative; padding-left: 20px; }
  .modal ul li:before { content: "✓"; position: absolute; left: 0; color: var(--moss); font-weight: 600; }

  /* Sections */
  .section-heading { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 500; color: var(--ink); margin: 26px 0 4px; }
  .section-sub { font-size: 12px; color: var(--ink-mute); line-height: 1.5; margin-bottom: 14px; }

  /* Confidence bands */
  .bands { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .band { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; }
  .band-label { font-size: 12px; font-weight: 600; color: var(--ink); margin-bottom: 2px; }
  .band-sub { font-size: 11px; color: var(--ink-mute); margin-bottom: 8px; }
  .band-value { font-size: 17px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
  .band.warn .band-value { color: var(--danger); }
  .band.ok .band-value { color: var(--moss); }
  .band.neutral .band-value { color: var(--ink-soft); }

  /* Chart */
  .chart-card { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 18px; margin-bottom: 18px; box-shadow: var(--shadow-sm); }
  .chart-wrap { position: relative; height: 280px; }
  .chart-wrap.short { height: 200px; }

  /* Tables */
  .data-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 18px; }
  .data-table th { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); color: var(--ink-mute); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
  .data-table td { padding: 8px 10px; border-bottom: 1px solid var(--line-soft); color: var(--ink-soft); }
  .data-table tr.current-row { background: var(--bone-2); }
  .data-table .tag-current { display: inline-block; background: var(--rust); color: var(--paper); font-size: 9px; padding: 1px 6px; border-radius: 2px; margin-left: 6px; vertical-align: 1px; font-weight: 600; }
  .data-table .fail { color: var(--danger); font-weight: 600; }
  .data-table .clickable { cursor: pointer; }
  .data-table .clickable:hover { background: var(--bone-2); }

  /* Stress cards */
  .scenario-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .scenario-card { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 12px 14px; cursor: pointer; transition: border-color 0.15s ease; }
  .scenario-card:hover { border-color: var(--rust); }
  .scenario-card.failed { border-left: 3px solid var(--danger-soft); }
  .scenario-card.survived { border-left: 3px solid var(--moss); }
  .scenario-name { font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 2px; }
  .scenario-years { font-size: 11px; color: var(--ink-mute); margin-bottom: 5px; font-family: 'JetBrains Mono', monospace; }
  .scenario-result { font-size: 13px; font-weight: 600; }
  .scenario-result.ok { color: var(--moss); }
  .scenario-result.fail { color: var(--danger); }
  .scenario-desc { font-size: 11px; color: var(--ink-mute); margin-top: 5px; line-height: 1.4; }
  .scenario-card.add { border-style: dashed; display: flex; align-items: center; justify-content: center; color: var(--ink-faint); font-size: 13px; }

  /* Flexibility */
  .flex-box { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 16px 20px; margin-bottom: 10px; display: grid; grid-template-columns: 1fr auto 1fr; gap: 14px; align-items: center; text-align: center; }
  .flex-label { font-size: 11px; color: var(--ink-mute); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 4px; }
  .flex-value { font-size: 18px; font-weight: 600; font-family: 'JetBrains Mono', monospace; }
  .flex-arrow { font-size: 20px; color: var(--rust); }
  .flex-note { font-size: 12px; color: var(--ink-mute); line-height: 1.5; margin-bottom: 18px; }

  /* SS comparison */
  .ss-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
  .ss-card { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 14px; text-align: center; cursor: pointer; transition: border-color 0.15s ease; }
  .ss-card:hover { border-color: var(--rust); }
  .ss-card.highlight { border: 2px solid var(--moss); }
  .ss-age { font-family: 'Fraunces', serif; font-size: 26px; font-weight: 500; color: var(--ink); }
  .ss-label { font-size: 10px; color: var(--ink-mute); margin: 2px 0 8px; text-transform: uppercase; letter-spacing: 0.08em; }
  .ss-benefit { font-size: 13px; color: var(--ink-soft); margin-bottom: 4px; font-family: 'JetBrains Mono', monospace; }
  .ss-success { font-size: 13px; font-weight: 600; }

  /* Assumptions + resources */
  .assumptions-section { margin: 8px 0 18px; }
  .assumptions-section summary { font-size: 13px; color: var(--rust); cursor: pointer; font-weight: 500; }
  .assumptions-section .assumptions-body { font-size: 12px; color: var(--ink-mute); line-height: 1.7; margin-top: 10px; padding-left: 4px; }
  .assumptions-section .assumptions-body strong { color: var(--ink-soft); }
  .resources { border-top: 1px solid var(--line); padding-top: 16px; margin-top: 18px; }
  .resources a { color: var(--rust); font-size: 13px; text-decoration: none; margin-right: 16px; }
  .resources a:hover { text-decoration: underline; }
  .resources p { font-size: 12px; color: var(--ink-mute); line-height: 1.6; margin-top: 8px; }

  /* Stat cards */
  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
  .stat-card { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 14px 16px; }
  .stat-label { font-size: 11px; color: var(--ink-mute); margin-bottom: 4px; }
  .stat-value { font-size: 20px; font-weight: 600; font-family: 'JetBrains Mono', monospace; color: var(--ink); }

  /* Saved scenarios */
  .scenario-save-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .scenario-save-row input { flex: 1; background: var(--bone); border: 1px solid var(--line); padding: 8px 10px; font-size: 13px; border-radius: 2px; font-family: inherit; }
  .saved-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 12px; }
  .saved-item button { background: none; border: none; color: var(--rust); cursor: pointer; font-size: 11px; font-family: inherit; }

  /* Modal */
  .modal-overlay { position: fixed; inset: 0; background: rgba(26,24,20,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 24px; }
  .modal { background: var(--paper); border-radius: 6px; max-width: 600px; max-height: 80vh; overflow-y: auto; padding: 32px; box-shadow: var(--shadow-md); }
  .modal h2 { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 500; margin-bottom: 16px; }
  .modal p { font-size: 13px; color: var(--ink-soft); line-height: 1.7; margin-bottom: 12px; }
  .modal .modal-close { float: right; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--ink-mute); }

  .detail-narrative { background: var(--bone-2); border-radius: 4px; padding: 14px 18px; font-size: 13px; color: var(--ink-soft); line-height: 1.6; margin-bottom: 14px; }

  @media (max-width: 860px) {
    .dashboard { grid-template-columns: 1fr; grid-template-areas: "mode" "sidebar" "main" "resources"; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--line); }
    .bands, .scenario-cards, .ss-grid, .stat-row { grid-template-columns: 1fr 1fr; }
  }

  /* Tablet & Small Screens (768px and below) */

function generatePresets(s) {
  const presets = [];
  if (s.age < 60 && s.yourStopWorkAge > s.age) presets.push({ id: 'stopNow', label: 'I stop working now' });
  if (s.age < 58 && s.yourStopWorkAge > s.age + 5) presets.push({ id: 'retire5early', label: 'Retire 5 years early' });
  presets.push({ id: 'maxSpend', label: 'What can I spend?' });
  if (s.hasPartner && s.partnerIncome === 0 && s.partnerAge < s.partnerStopWorkAge) presets.push({ id: 'partnerReturns', label: 'Partner returns to work' });
  if (s.ssStartAge !== 70 && s.yourSSAmount > 0) presets.push({ id: 'delaySS', label: 'Delay Social Security to 70' });
  if (s.housing > 0 && s.mortgagePayoffAge > s.age + 5) presets.push({ id: 'payoffFast', label: 'Pay off the house in 5 years' });
  if (!s.homeSaleAge && s.age < 72) presets.push({ id: 'sellHome', label: 'Sell the home at 70' });
  if (s.age > 45) presets.push({ id: 'ltc', label: 'Add long-term care at 85' });
  return presets.slice(0, 6);
}

// ============================================================================
// FORMATTING
// ============================================================================
function fmtMoney(n) {
  if (n === null || n === undefined || isNaN(n)) return '\u2014';
  const r = Math.round(n);
  return '$' + r.toLocaleString('en-US');
}
function fmtMoneyShort(n) {
  if (n === null || n === undefined || isNaN(n)) return '\u2014';
  const a = Math.abs(n);
  if (a >= 1e6) return (n < 0 ? '-' : '') + '$' + (a / 1e6).toFixed(a >= 1e7 ? 0 : 1) + 'M';
  if (a >= 1e3) return (n < 0 ? '-' : '') + '$' + Math.round(a / 1e3) + 'k';
  return fmtMoney(n);
}
function periodsLabel(result) {
  if (result.mode === 'historical') return result.successCount + ' of ' + result.totalPeriods + ' historical periods';
  if (result.mode === 'montecarlo') return Math.round(result.successRate * 100) + '% of simulations';
  return result.successRate >= 1 ? 'lasts to age 100' : 'runs out early';
}

function num(id) { const el = document.getElementById(id); const v = parseFloat(el && el.value); return isNaN(v) ? 0 : v; }

window.finishOnboarding = function() {
  const age = num('ob_age');
  const portfolio = num('ob_portfolio');
  const spending = num('ob_spending');
  if (age < 18) { document.getElementById('ob_validation').textContent = 'Please enter your age to continue.'; return; }
  if (portfolio <= 0) { document.getElementById('ob_validation').textContent = 'Enter your portfolio value to get started.'; return; }

  state.age = age;
  const pAge = num('ob_partnerAge');
  state.partnerAge = pAge;
  state.hasPartner = pAge >= 18;
  state.portfolio = portfolio;
  state.spending = spending;
  state.lateSpending = spending > 0 ? Math.round(spending * 0.85) : 0;
  state.slowDownAge = 75;
  state.yourIncome = num('ob_yourIncome');
  state.partnerIncome = num('ob_partnerIncome');
  state.housing = num('ob_housing');
  state.mortgagePayoffAge = num('ob_mortgagePayoff') || 60;
  state.yourSSAmount = num('ob_yourSS');
  state.partnerSSAmount = num('ob_partnerSS');
  // Reset any preset-derived state (home sale, life events) so nothing carries over
  state.homeSaleAge = null;
  state.homeSaleProceeds = 0;
  state.oneTimeEvents = [];
  // Auto-compute effective tax rate from income
  const totalGross = state.yourIncome + state.partnerIncome;
  if (totalGross > 0) {
    const taxEst = estimateNetIncome({ gross: totalGross, filingStatus: state.filingStatus, stateCode: state.stateCode });
    state.taxRate = Math.round(taxEst.effectiveRate * 100) / 100;
  }
  if (state.yourStopWorkAge < state.age) state.yourStopWorkAge = Math.max(state.age + 1, 65);
  if (state.partnerStopWorkAge < state.partnerAge) state.partnerStopWorkAge = Math.max(state.partnerAge + 1, 65);

  // If spending was left blank, auto-find max spend
  if (spending <= 0) {
    state.simMode = 'fixed';
    const ms = findMaxSpend(state);
    state.spending = Math.round(ms.spend / 1000) * 1000;
    state.lateSpending = Math.round(state.spending * 0.85);
    maxSpendView = true;
  }

  activeView = 'dashboard';
  maxSpendStale = true; spendingLevelsStale = true;
  baselineState = JSON.parse(JSON.stringify(state));
  baselineResult = null;
  render();
};

// ===== VERDICT =====
function getVerdict(result) {
  const v = { tier: 'good', eyebrow: '', headline: '', body: '', caveat: '' };
  const yc = state.targetAge - state.age + 1;
  if (result.mode === 'historical') {
    const { successCount, totalPeriods, failures } = result;
    const rate = successCount / totalPeriods;
    v.tier = rate >= 0.9 ? 'good' : rate >= 0.7 ? 'mid' : 'bad';
    if (successCount === totalPeriods) {
      v.headline = 'This scenario lasted through every historical period since 1926';
      v.body = 'We tested your plan against every rolling ' + yc + '-year period of real U.S. stock market returns since 1926, ' + totalPeriods + ' periods in total. Each includes actual sequences of booms, crashes, and everything between. This spending level survived them all, including the Great Depression, 1970s stagflation, and 2008.';
    } else {
      v.headline = 'This scenario lasted in ' + successCount + ' of ' + totalPeriods + ' historical periods';
      const failCount = totalPeriods - successCount;
      const worst = failures[0];
      if (maxSpendView) {
        v.body = fmtMoney(state.spending) + '/yr is the theoretical maximum at a steady ' + (state.returnRate*100).toFixed(1) + '% return. But real markets don\u2019t deliver steady returns. Bad years early in retirement can deplete a portfolio even if the long-run average is fine. Against actual market history, this spending level only survived ' + successCount + ' of ' + totalPeriods + ' periods. Use the spending explorer below to find a level that holds up in more historical environments.';
      } else {
        v.body = 'We tested your plan against every rolling ' + yc + '-year period of real U.S. stock market returns since 1926, ' + totalPeriods + ' periods in total.';
        if (rate >= 0.85) {
          v.body += ' In ' + failCount + ' period' + (failCount > 1 ? 's' : '') + ', the portfolio was depleted before age ' + state.targetAge + '.' + (worst ? ' The hardest started in ' + worst.label.split('\u2013')[0] + ' (depleted around age ' + worst.ranOutAge + ').' : '') + ' These failures tended to cluster around prolonged downturns.';
        } else if (rate >= 0.6) {
          v.body += ' In ' + failCount + ' of those periods, the portfolio ran out before age ' + state.targetAge + '.' + (worst ? ' The worst sequence started in ' + worst.label.split('\u2013')[0] + '.' : '') + ' At this spending level, the outcome depends heavily on which market environment you retire into.';
        } else {
          v.body += ' In ' + failCount + ' of ' + totalPeriods + ' periods, the portfolio was depleted. This spending level is risky by historical standards. Consider reducing spending or exploring other adjustments.';
        }
      }
    }
    v.caveat = 'Past performance does not predict future results.';
  } else if (result.mode === 'montecarlo') {
    const rate = result.successRate;
    v.tier = rate >= 0.9 ? 'good' : rate >= 0.7 ? 'mid' : 'bad';
    v.headline = 'The portfolio lasted to age ' + state.targetAge + ' in ' + Math.round(rate * 100) + '% of simulations';
    if (maxSpendView) {
      v.body = fmtMoney(state.spending) + '/yr is the theoretical maximum at a steady return, but with realistic market volatility, this level only holds up ' + Math.round(rate * 100) + '% of the time. The spending explorer below shows what level of spending succeeds in more simulations.';
    } else {
      v.body = 'Across 500 simulations with ' + (state.returnStdDev*100).toFixed(0) + '% annual volatility around a ' + (state.returnRate*100).toFixed(1) + '% real return, the median ending balance was ' + fmtMoneyShort(result.medianFinal) + '.';
    }
  } else {
    const lasts = result.successRate >= 1;
    v.tier = lasts ? 'good' : 'bad';
    if (maxSpendView) {
      v.headline = 'The most you could spend is about ' + fmtMoney(state.spending) + ' per year';
      v.body = lasts ? 'At a steady ' + (state.returnRate*100).toFixed(1) + '% real return, this is the highest annual spending that keeps your portfolio lasting to age ' + state.targetAge + '. Your ending balance would be near zero, meaning you used almost everything. Adjust the return rate or switch to Historical mode to see how this holds up against real market environments.' : 'At a steady ' + (state.returnRate*100).toFixed(1) + '% return, the portfolio would be depleted around age ' + result.medianRunOutAge + '. Try reducing the rate of return to see a more conservative estimate.';
    } else {
      v.headline = lasts ? 'At a steady ' + (state.returnRate*100).toFixed(1) + '% return, the portfolio lasts past age ' + state.targetAge : 'At a steady ' + (state.returnRate*100).toFixed(1) + '% return, the portfolio is depleted around age ' + result.medianRunOutAge;
      v.body = lasts ? 'Ending balance at age ' + state.targetAge + ' would be about ' + fmtMoneyShort(result.medianFinal) + '. Real markets are bumpier than this, try Historical or Simulated mode to see the range of outcomes.' : 'This assumes the same return every year. Real sequences vary, try Historical mode to stress-test it.';
    }
  }
  // "Money left on the table" wedge
  if (!maxSpendView && result.medianFinal > 10000 && !result.medianRunOutAge) {
    v.wedge = fmtMoneyShort(result.medianFinal);
    if (result.mode === 'historical') {
      v.wedgeSub = 'In the median historical outcome, this is what would be left at age ' + state.targetAge + '. That\'s money you could be using.';
    } else if (result.mode === 'montecarlo') {
      v.wedgeSub = 'In the median simulation, this is what would remain at age ' + state.targetAge + '.';
    } else {
      v.wedgeSub = 'At a steady ' + (state.returnRate*100).toFixed(1) + '% return, this is what you\'d have left at age ' + state.targetAge + '. That\'s money you could be enjoying now.';
    }
  }
  return v;
}

// ===== IMPACT BANNER =====
function computeImpact() {
  if (!baselineState || !baselineResult) return null;
  const fields = { spending: 'Annual spending', lateSpending: 'Late-life spending', yourStopWorkAge: 'Your retirement age', partnerStopWorkAge: "Partner's retirement age", portfolio: 'Portfolio', ssStartAge: 'SS start age', mortgagePayoffAge: 'Mortgage payoff age', homeSaleAge: 'Home sale age', returnRate: 'Return' };
  const changes = [];
  for (const k in fields) {
    if (JSON.stringify(baselineState[k]) !== JSON.stringify(state[k])) {
      let from = baselineState[k], to = state[k];
      if (k === 'spending' || k === 'lateSpending' || k === 'portfolio') { from = fmtMoneyShort(from); to = fmtMoneyShort(to); }
      else if (k === 'returnRate') { from = (from*100).toFixed(1)+'%'; to = (to*100).toFixed(1)+'%'; }
      changes.push(fields[k] + ' ' + (from===null?'\u2014':from) + ' \u2192 ' + (to===null?'\u2014':to));
    }
  }
  if (!changes.length) return null;
  const successDelta = result_rate(lastSimResult) - result_rate(baselineResult);
  const finalDelta = lastSimResult.medianFinal - baselineResult.medianFinal;
  return { changes, successDelta, finalDelta };
}
function result_rate(r) { return r.successRate; }
function renderSidebarImpact() {
  const im = computeImpact();
  if (!im) return '';
  const fdTxt = (im.finalDelta >= 0 ? '+' : '') + fmtMoneyShort(im.finalDelta);
  return `<div class="sidebar-section" style="background:var(--bone-2);margin:-4px -20px 14px;padding:12px 20px;border-bottom:1px solid var(--line-soft)">
    <div style="font-size:11px;color:var(--ink-soft);line-height:1.5"><strong style="color:var(--ink)">Changed:</strong> ${im.changes.slice(0,3).join(', ')}${im.changes.length>3?' + '+(im.changes.length-3)+' more':''}</div>

}

// ===== SPENDING EXPLORER =====
function computeSpendingLevels() {
  if (!spendingLevelsStale && spendingLevelsCache) return spendingLevelsCache;
  const base = state.spending || 50000;
  const ratio = state.spending > 0 ? state.lateSpending / state.spending : 0.85;
  const mults = [0.8, 0.9, 1.0, 1.1, 1.2];
  const rows = mults.map(m => {
    const spend = Math.round(base * m / 1000) * 1000;
    const ts = { ...state, spending: spend, lateSpending: Math.round(spend * ratio) };
    const r = runForState(ts);
    const last = r.percentiles[r.percentiles.length - 1];
    return { spending: spend, successRate: r.successRate, successCount: r.successCount, totalPeriods: r.totalPeriods, medianFinal: r.medianFinal, p10: last.p10, isCurrent: spend === (Math.round(base/1000)*1000) && m === 1.0 };
  });
  spendingLevelsCache = rows; spendingLevelsStale = false;
  return rows;
}
function renderSpendingExplorer() {
  const rows = computeSpendingLevels();
  const isHist = state.simMode === 'historical';
  return `<table class="data-table"><thead><tr><th>Annual spending</th><th>${isHist?'Historical success':'Success'}</th><th>Median ending</th><th>Worst case</th></tr></thead><tbody>

  </tbody></table>`;
}

// ===== TAX COMPARISON =====
function renderTaxComparison() {
  // Use fixed mode for clean apples-to-apples comparison regardless of current mode
  const propState = { ...state, withdrawalStrategy: 'proportional' };
  const smartState = { ...state, withdrawalStrategy: 'taxSmart' };
  const prop = runFixed(propState);
  const smart = runFixed(smartState);
  const taxTotal = (r) => r.medianRun ? Math.round(r.medianRun.reduce((s, y) => s + (y.tax || 0), 0)) : 0;
  const propTax = taxTotal(prop), smartTax = taxTotal(smart);
  // After-tax ending wealth: Roth is worth 100%, traditional worth (1-taxRate), taxable worth (1-capGainsTax*0.5)
  const afterTaxWealth = (r) => {
    const fa = r.medianRun && r.medianRun.finalAccounts;
    if (!fa) return r.medianFinal;
    return fa.roth + fa.traditional * (1 - state.taxRate) + fa.taxable * (1 - state.capGainsTax * 0.5);
  };
  const propATW = afterTaxWealth(prop), smartATW = afterTaxWealth(smart);
  const smartBetter = smartATW > propATW;
  return `<div class="section-heading">Withdrawal strategy</div>
    <div class="section-sub">How you draw from different account types affects after-tax wealth. Preserving Roth (tax-free) growth typically leaves more usable money. These are simplified estimates at a steady ${(state.returnRate*100).toFixed(1)}% return.</div>
    <table class="data-table"><thead><tr><th></th><th>Proportional</th><th>Tax-aware order</th></tr></thead><tbody>
      <tr><td>After-tax ending wealth</td><td>${fmtMoneyShort(propATW)}</td><td style="color:${smartBetter?'var(--moss)':'var(--ink-soft)'};font-weight:600">${fmtMoneyShort(smartATW)}</td></tr>
      <tr><td>Estimated total tax paid</td><td>${fmtMoneyShort(propTax)}</td><td>${fmtMoneyShort(smartTax)}</td></tr>
      <tr><td>Pre-tax ending balance</td><td>${fmtMoneyShort(prop.medianFinal)}</td><td>${fmtMoneyShort(smart.medianFinal)}</td></tr>
    </tbody></table>
    <div class="flex-note">Tax-aware ordering (taxable \u2192 traditional \u2192 Roth) preserves tax-free Roth growth. It may show higher nominal tax, but the leftover money is worth more after tax. Estimated difference in after-tax wealth: ${fmtMoneyShort(Math.abs(smartATW - propATW))}. A tax professional can model your specific situation.</div>`;
}

  // Chart.js plugin for vertical annotation lines
  const annotationPlugin = {
    id: 'eventAnnotations',
    afterDraw(chart) {
      const xScale = chart.scales.x;
      const yScale = chart.scales.y;
      const ctx2 = chart.ctx;
      // Sort events and calculate pixel positions to detect collisions
      const positioned = events.map(ev => {
        const idx = labels.indexOf(ev.age);
        if (idx < 0) return null;
        return { ...ev, idx, x: xScale.getPixelForValue(idx) };
      }).filter(Boolean);
      // Stagger labels that are too close (within 60px)
      positioned.forEach((ev, i) => {
        ev.yOffset = 0;
        for (let j = 0; j < i; j++) {
          if (Math.abs(positioned[j].x - ev.x) < 60) {
            ev.yOffset = (positioned[j].yOffset === 0) ? -12 : 0;
          }
        }
      });
      positioned.forEach(ev => {
        ctx2.save();
        ctx2.strokeStyle = '#d4cab8';
        ctx2.lineWidth = 1;
        ctx2.setLineDash([4, 3]);
        ctx2.beginPath();
        ctx2.moveTo(ev.x, yScale.top);
        ctx2.lineTo(ev.x, yScale.bottom);
        ctx2.stroke();
        ctx2.setLineDash([]);
        ctx2.fillStyle = '#8a8173';
        ctx2.font = '10px Inter Tight, sans-serif';
        ctx2.textAlign = 'center';
        ctx2.fillText(ev.label, ev.x, yScale.top - 4 + ev.yOffset);
        ctx2.restore();
      });
    }
  };

  // Crosshair plugin: draws a vertical line at hover position
  const crosshairPlugin = {
    id: 'crosshair',
    afterDraw(chart) {
      if (chart.tooltip && chart.tooltip._active && chart.tooltip._active.length) {
        const x = chart.tooltip._active[0].element.x;
        const yScale = chart.scales.y;
        const ctx2 = chart.ctx;
        ctx2.save();
        ctx2.strokeStyle = 'rgba(26,24,20,0.15)';
        ctx2.lineWidth = 1;
        ctx2.beginPath();
        ctx2.moveTo(x, yScale.top);
        ctx2.lineTo(x, yScale.bottom);
        ctx2.stroke();
        ctx2.restore();
      }
    }
  };

  // Enhanced tooltip showing breakdown
  const medianRun = result.medianRun;
  chart = new Chart(ctx, {
    type: 'line',
    data: { labels, datasets },
    plugins: [annotationPlugin, crosshairPlugin],
    options: {
      responsive: true, maintainAspectRatio: false,
      layout: { padding: { top: 16 } },
      interaction: { mode: 'index', intersect: false },
      plugins: { legend: { display: false }, tooltip: {
        mode: 'index', intersect: false,
        callbacks: {
          title: (t) => 'Age ' + t[0].label,
          label: (c) => {
            if (!['Median','p10','p90'].includes(c.dataset.label)) return null;
            const lines = [c.dataset.label + ': ' + fmtMoneyShort(c.parsed.y)];
            if (c.dataset.label === 'Median' && medianRun && medianRun[c.dataIndex]) {
              const yr = medianRun[c.dataIndex];
              if (yr.yourIncome > 0) lines.push('Income: ' + fmtMoneyShort(yr.yourIncome + yr.partnerIncome));
              if (yr.ssIncome > 0) lines.push('Social Security: ' + fmtMoneyShort(yr.ssIncome));
              lines.push('Spending: ' + fmtMoneyShort(yr.spending));
              if (yr.withdrawal > 0) lines.push('Withdrawal: ' + fmtMoneyShort(yr.withdrawal));
            }
            return lines;
          },
          afterBody: (t) => {
            const idx = t[0].dataIndex;
            const age = labels[idx];
            const ev = events.find(e => e.age === age);
            return ev ? ['\u2192 ' + ev.label] : [];
          }
        },
        filter: (t) => ['Median','p10','p90'].includes(t.dataset.label)
      } },
      scales: {
        x: { title: { display: true, text: 'Age', color: '#6b6356', font: { size: 11 } }, ticks: { color: '#8a8173', maxTicksLimit: 10 }, grid: { color: 'rgba(212,202,184,0.4)' } },
        y: { ticks: { color: '#8a8173', callback: (v) => fmtMoneyShort(v) }, grid: { color: 'rgba(212,202,184,0.4)' } }
      }
    }
  });
}
let cashflowRows = null;

function computeCashflowData(rows, mode) {
  if (mode === 'breakdown') {
    return {
      d0: { data: rows.map(y => y.yourIncome + y.partnerIncome), bg: 'rgba(91,110,58,0.6)', label: 'Work income' },
      d1: { data: rows.map(y => y.ssIncome), bg: 'rgba(201,164,73,0.7)', label: 'Social Security' },
      d2: { data: rows.map(y => -(y.spending)), bg: 'rgba(184,92,56,0.5)', label: 'Spending' },
    };
  }
  const netData = rows.map(y => {
    const gross = y.yourIncome + y.partnerIncome + y.ssIncome;
    const tax = y.tax || ((y.yourIncome + y.partnerIncome) * state.taxRate + y.ssIncome * state.taxRate * 0.5);
    return Math.round(gross - tax - y.spending);
  });
  return {
    d0: { data: netData.map(v => Math.max(0, v)), bg: 'rgba(91,110,58,0.7)', label: 'Surplus' },
    d1: { data: netData.map(() => 0), bg: 'transparent', label: '' },
    d2: { data: netData.map(v => Math.min(0, v)), bg: 'rgba(184,92,56,0.6)', label: 'Deficit' },
  };
}

function drawCashflowChart(result) {
  const ctx = document.getElementById('cashflowChart'); if (!ctx) return;
  const rows = result.medianRun || [];
  if (!rows.length) return;
  cashflowRows = rows;
  const labels = rows.map(y => y.age);
  const d = computeCashflowData(rows, cashflowMode);

  // If chart exists but canvas was replaced by re-render, destroy stale chart
  if (cashflowChart && cashflowChart.canvas !== ctx) {
    cashflowChart.destroy();
    cashflowChart = null;
  }

  if (cashflowChart) {
    // Update existing chart for animation
    cashflowChart.data.labels = labels;
    cashflowChart.data.datasets[0].data = d.d0.data;
    cashflowChart.data.datasets[0].backgroundColor = d.d0.bg;
    cashflowChart.data.datasets[0].label = d.d0.label;
    cashflowChart.data.datasets[1].data = d.d1.data;
    cashflowChart.data.datasets[1].backgroundColor = d.d1.bg;
    cashflowChart.data.datasets[1].label = d.d1.label;
    cashflowChart.data.datasets[2].data = d.d2.data;
    cashflowChart.data.datasets[2].backgroundColor = d.d2.bg;
    cashflowChart.data.datasets[2].label = d.d2.label;
    cashflowChart.options.plugins.legend.display = (cashflowMode === 'breakdown');
    cashflowChart.update();
    return;
  }

  cashflowChart = new Chart(ctx, {
    type: 'bar',
    data: { labels, datasets: [
      { label: d.d0.label, data: d.d0.data, backgroundColor: d.d0.bg, stack: 'in', borderRadius: 1 },
      { label: d.d1.label, data: d.d1.data, backgroundColor: d.d1.bg, stack: 'in', borderRadius: 1 },
      { label: d.d2.label, data: d.d2.data, backgroundColor: d.d2.bg, stack: 'out', borderRadius: 1 },
    ] },
    options: { responsive: true, maintainAspectRatio: false,
      animation: { duration: 700, easing: 'easeInOutQuart' },
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { display: cashflowMode === 'breakdown', labels: { color: '#6b6356', font: { size: 11 }, boxWidth: 10, padding: 12, filter: (item) => item.text !== '' } },
        tooltip: { mode: 'index', intersect: false, callbacks: {
          title: (t) => 'Age ' + t[0].label,
          label: (c) => {
            if (c.dataset.label === '') return null;
            const yr = cashflowRows && cashflowRows[c.dataIndex];
            if (cashflowMode === 'breakdown') {
              return c.dataset.label + ': ' + fmtMoneyShort(Math.abs(c.parsed.y));
            }
            const net = yr ? Math.round((yr.yourIncome + yr.partnerIncome + yr.ssIncome) - ((yr.yourIncome + yr.partnerIncome) * state.taxRate + yr.ssIncome * state.taxRate * 0.5) - yr.spending) : c.parsed.y;
            if (c.datasetIndex === 1) return null;
            const lines = [(net >= 0 ? 'Surplus: +' : 'Deficit: ') + fmtMoneyShort(net) + '/yr'];
            if (yr) {
              if (yr.yourIncome + yr.partnerIncome > 0) lines.push('Income: ' + fmtMoneyShort(yr.yourIncome + yr.partnerIncome));
              if (yr.ssIncome > 0) lines.push('SS: ' + fmtMoneyShort(yr.ssIncome));
              lines.push('Spending: ' + fmtMoneyShort(yr.spending));
            }
            return lines;
          }
        },
        filter: (t) => t.dataset.label !== ''
        }
      },
      scales: {
        x: { stacked: true, ticks: { color: '#8a8173', maxTicksLimit: 10 }, grid: { display: false } },
        y: { stacked: true, ticks: { color: '#8a8173', callback: (v) => { const a = Math.abs(v); return (v < 0 ? '-' : '') + (a >= 1e6 ? '$'+(a/1e6).toFixed(0)+'M' : a >= 1e3 ? '$'+Math.round(a/1e3)+'k' : '$'+a); } }, grid: { color: 'rgba(212,202,184,0.4)' } }
      }
    }
  });
}

function invalidateCaches() { maxSpendStale = true; spendingLevelsStale = true; }
window.update = function(key, val) { state[key] = val; maxSpendView = false; invalidateCaches(); render(); };
window.updateAccount = function(key, val) { state.accounts[key] = val; state.portfolio = state.accounts.traditional + state.accounts.roth + state.accounts.taxable; invalidateCaches(); render(); };

window.addEvent = function() {
  const label = (document.getElementById('ev_label').value || '').trim() || 'Event';

  const amount = parseFloat(document.getElementById('ev_amount').value);
  if (!age || isNaN(amount)) return;
  if (!state.oneTimeEvents) state.oneTimeEvents = [];
  state.oneTimeEvents.push({ label, age, amount });

};
window.removeEvent = function(i) {
  state.oneTimeEvents.splice(i, 1);

};
window.updateTax = function(key, val) {
  state[key] = val;
  // Recompute effective tax rate from income and tax settings
  const gross = state.yourIncome + state.partnerIncome;
  if (gross > 0) {
    const r = estimateNetIncome({ gross, filingStatus: state.filingStatus, stateCode: state.stateCode });
    state.taxRate = Math.round(r.effectiveRate * 100) / 100;
  }
  invalidateCaches(); render();
};
window.setMode = function(m) {
  if ((m === 'historical' || m === 'montecarlo') && !isPaid()) { showUnlockModal(); return; }
  state.simMode = m; invalidateCaches(); render();
};
window.setCashflowMode = function(m) {
  cashflowMode = m;
  if (cashflowChart && cashflowRows) {
    const d = computeCashflowData(cashflowRows, m);
    cashflowChart.data.datasets[0].data = d.d0.data;

  }

  document.querySelectorAll('.cf-toggle').forEach(btn => {

  // Update description
  const desc = document.getElementById('cf-desc');

let liveTimer = null;
let liveChartTimer = null;

function fmtSliderVal(key, val) {
  if (['guardrailCutPct','guardrailBoostPct'].includes(key)) return Math.round(val * 100) + '%';
  if (['returnRate','returnStdDev','yourIncomeGrowth','partnerIncomeGrowth'].includes(key)) return (val * 100).toFixed(1) + '%';
  if (['slowDownAge','yourStopWorkAge','partnerStopWorkAge','ssStartAge','mortgagePayoffAge'].includes(key)) return String(Math.round(val));
  return fmtMoney(val);
}

// Called on every oninput (during drag) — updates label + debounced chart
window.slideLive = function(el, key, rawVal) {
  const val = +rawVal;
  state[key] = val;
  // Immediate label update
  const row = el.parentElement.querySelector('.control-value');
  if (row) row.textContent = fmtSliderVal(key, val);
  // Debounced chart redraw (fast, keeps slider alive)
  clearTimeout(liveChartTimer);
  liveChartTimer = setTimeout(() => {
    invalidateCaches();
    const result = runForState(state); lastSimResult = result;
    drawMainChart(result); drawCashflowChart(result);
  }, 150);
};

// Called on onchange (slider release) — full render with all sections
window.sliderCommit = function(key, rawVal) {
  state[key] = +rawVal;
  maxSpendView = false;
  // Sync accounts proportionally when portfolio changes
  if (key === 'portfolio' && state.accountsEnabled) {
    const total = state.accounts.traditional + state.accounts.roth + state.accounts.taxable;
    if (total > 0) {
      const ratio = state.portfolio / total;
      state.accounts.traditional = Math.round(state.accounts.traditional * ratio);
      state.accounts.roth = Math.round(state.accounts.roth * ratio);
      state.accounts.taxable = Math.round(state.accounts.taxable * ratio);
    }
  }
  invalidateCaches();
  const scrollY = window.scrollY;
  render();
  window.scrollTo(0, scrollY);
};

window.updateLive2 = function(el, k1, k2, rawVal) {
  const val = +rawVal;
  state[k1] = val; state[k2] = val;
  const row = el.parentElement.querySelector('.control-value');
  if (row) row.textContent = fmtSliderVal(k1, val);
  clearTimeout(liveChartTimer);

};

window.resetBaseline = function() { baselineState = JSON.parse(JSON.stringify(state)); baselineResult = lastSimResult; render(); };

window.applySSAge = function(age) {
  const factors = { 62: 0.70, 67: 1.00, 70: 1.24 };
  const curFactor = factors[state.ssStartAge] || 1;
  const newFactor = factors[age] || 1;
  // Convert current amounts back to FRA-basis, then apply new factor
  state.yourSSAmount = Math.round((state.yourSSAmount / curFactor) * newFactor);
  state.partnerSSAmount = Math.round((state.partnerSSAmount / curFactor) * newFactor);
  state.ssStartAge = age;
  invalidateCaches(); render();
};

window.applySpending = function(spend) {
  const ratio = state.spending > 0 ? state.lateSpending / state.spending : 0.85;
  state.spending = spend;
  state.lateSpending = Math.round(spend * ratio);
  invalidateCaches(); render();
};

// ===== PRESETS =====
window.applyPreset = function(id) {
  switch (id) {
    case 'stopNow': state.yourStopWorkAge = state.age; if (state.hasPartner) state.partnerStopWorkAge = state.partnerAge; break;
    case 'retire5early': state.yourStopWorkAge = Math.max(state.age, state.yourStopWorkAge - 5); break;
    case 'maxSpend': { state.simMode = 'fixed'; const ms = findMaxSpend(state); const ratio = state.spending > 0 ? state.lateSpending/state.spending : 0.85; state.spending = Math.round(ms.spend/1000)*1000; state.lateSpending = Math.round(state.spending*ratio); maxSpendView = true; break; }
    case 'partnerReturns': state.partnerIncome = state.partnerIncome > 0 ? state.partnerIncome : 60000; state.partnerStopWorkAge = Math.max(state.partnerAge + 5, 60); break;
    case 'delaySS': state.ssStartAge = 70; { const f = 1.24; state.yourSSAmount = Math.round(state.yourSSAmount * f); state.partnerSSAmount = Math.round(state.partnerSSAmount * f); } break;
    case 'payoffFast': state.mortgagePayoffAge = state.age + 5; break;
    case 'sellHome': if (!state.oneTimeEvents) state.oneTimeEvents = []; state.oneTimeEvents.push({ label: 'Home sale', age: 70, amount: 400000 }); break;
    case 'ltc': if (!state.oneTimeEvents) state.oneTimeEvents = []; for (let a = 85; a < 90; a++) state.oneTimeEvents.push({ label: 'Long-term care', age: a, amount: -90000 }); break;
  }
  invalidateCaches(); render();
};

window.showScenarioDetail = function(id) {
  const s = HISTORICAL_SCENARIOS.find(x => x.id === id); if (!s) return;

  const years = run.years;

  const final = years[years.length - 1];
  // worst drawdown
  let peak = years[0].portfolio, maxDD = 0, ddAge = years[0].age;
  years.forEach(y => { if (y.portfolio > peak) peak = y.portfolio; const dd = peak > 0 ? (peak - y.portfolio) / peak : 0; if (dd > maxDD) { maxDD = dd; ddAge = y.age; } });
  const crashYears = years.filter(y => y.marketReturn <= -0.15).length;
  let narrative = 'Starting in ' + s.startYear + ', ';
  if (maxDD > 0.25) narrative += 'the portfolio saw a drawdown of about ' + Math.round(maxDD * 100) + '% (around age ' + ddAge + '). ';

  narrative += survived ? 'The portfolio still lasted to age ' + state.targetAge + ', ending near ' + fmtMoneyShort(final.portfolio) + '.' : 'The portfolio was depleted around age ' + years.find(y => y.ranOut).age + '.';

  const sampleRows = years.filter((y, i) => i % 5 === 0 || y.ranOut).slice(0, 16);

};

    <p>Enter gross household income to see a rough net (after federal, state, and FICA).</p>
    <div class="field"><label>Gross annual income</label><input type="number" id="th_gross" placeholder="e.g. 150000"/></div>
    <div class="field" style="margin-top:10px"><label>Filing status</label><select id="th_filing"><option value="mfj">Married filing jointly</option><option value="single">Single</option></select></div>
    <div class="field" style="margin-top:10px"><label>State</label><select id="th_state">${Object.keys(STATE_CONFIG).map(k => `<option value="${k}">${STATE_CONFIG[k].name}</option>`).join('')}</select></div>
    <div style="margin-top:14px"><button class="btn-primary" onclick="runTaxHelper()">Estimate</button></div>
    <div id="th_result" style="margin-top:14px;font-size:13px;color:var(--ink-soft)"></div>`);
};
window.runTaxHelper = function() {
  const gross = parseFloat(document.getElementById('th_gross').value) || 0;
  const filing = document.getElementById('th_filing').value;
  const st = document.getElementById('th_state').value;
  const r = estimateNetIncome({ gross, filingStatus: filing, stateCode: st });
  document.getElementById('th_result').innerHTML = `Estimated net: <strong>${fmtMoney(r.net)}</strong> (federal ${fmtMoney(r.federal)}, state ${fmtMoney(r.state)}, FICA ${fmtMoney(r.fica)}). Effective rate ${(r.effectiveRate*100).toFixed(1)}%. <br/><span style="font-size:11px;color:var(--ink-faint)">A rough estimate, not tax advice.</span>`;
};
window.openSSHelper = function() {
  openModal(`<h2>Estimate Social Security</h2>
    <p>A rough estimate from your typical career income. Your ssa.gov statement is the official figure.</p>
    <div class="field"><label>Typical annual income (today's $)</label><input type="number" id="ss_gross" placeholder="e.g. 90000"/></div>
    <div style="margin-top:14px"><button class="btn-primary" onclick="runSSHelper()">Estimate</button></div>
    <div id="ss_result" style="margin-top:14px;font-size:13px;color:var(--ink-soft)"></div>`);
};
window.runSSHelper = function() {
  const g = parseFloat(document.getElementById('ss_gross').value) || 0;
  const b = estimateSSBenefit(g);
  document.getElementById('ss_result').innerHTML = `Estimated benefit at full retirement age: <strong>${fmtMoney(b)}/yr</strong> (${fmtMoney(Math.round(b/12))}/mo).<br/><span style="font-size:11px;color:var(--ink-faint)">Approximate \u2014 your ssa.gov statement is authoritative.</span>`;
};

// ============================================================================
// INIT
// ============================================================================
render();
</script>
</body>
</html>

function invalidateCaches() { maxSpendStale = true; spendingLevelsStale = true; }
window.update = function(key, val) { state[key] = val; maxSpendView = false; presetNote = null; invalidateCaches(); render(); };
window.updateAccount = function(key, val) { state.accounts[key] = val; state.portfolio = state.accounts.traditional + state.accounts.roth + state.accounts.taxable; invalidateCaches(); render(); };

window.addEvent = function() {
  const label = (document.getElementById('ev_label').value || '').trim() || 'Event';
  const age = parseInt(document.getElementById('ev_age').value);
  const amount = parseFloat(document.getElementById('ev_amount').value);
  if (!age || isNaN(amount)) return;
  if (!state.oneTimeEvents) state.oneTimeEvents = [];
  state.oneTimeEvents.push({ label, age, amount });
  invalidateCaches(); render();
};
window.removeEvent = function(i) {
  state.oneTimeEvents.splice(i, 1);
  invalidateCaches(); render();
};
window.updateTax = function(key, val) {
  state[key] = val;
  // Recompute effective tax rate from income and tax settings
  const gross = state.yourIncome + state.partnerIncome;
  if (gross > 0) {
    const r = estimateNetIncome({ gross, filingStatus: state.filingStatus, stateCode: state.stateCode });
    state.taxRate = Math.round(r.effectiveRate * 100) / 100;
  }
  invalidateCaches(); render();
};
window.setMode = function(m) { state.simMode = m; presetNote = null; invalidateCaches(); render(); };
window.setCashflowMode = function(m) {
  cashflowMode = m;
  if (cashflowChart && cashflowRows) {
    const d = computeCashflowData(cashflowRows, m);
    cashflowChart.data.datasets[0].data = d.d0.data;
    cashflowChart.data.datasets[0].backgroundColor = d.d0.bg;
    cashflowChart.data.datasets[0].label = d.d0.label;
    cashflowChart.data.datasets[1].data = d.d1.data;
    cashflowChart.data.datasets[1].backgroundColor = d.d1.bg;
    cashflowChart.data.datasets[1].label = d.d1.label;
    cashflowChart.data.datasets[2].data = d.d2.data;
    cashflowChart.data.datasets[2].backgroundColor = d.d2.bg;
    cashflowChart.data.datasets[2].label = d.d2.label;
    cashflowChart.options.plugins.legend.display = (m === 'breakdown');
    cashflowChart.update();
  }
  // Update toggle buttons without destroying the chart
  document.querySelectorAll('.cf-toggle').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === m);
  });
  // Update description
  const desc = document.getElementById('cf-desc');
  if (desc) desc.textContent = m === 'net' ? "Green bars mean you're adding to the portfolio. Red means you're drawing from it." : "Income sources stacked against spending. The gap is what comes from or goes to the portfolio.";
};
window.toggleMore = function() { showMoreOptions = !showMoreOptions; render(); };

// Live updates: immediate label + debounced chart, full render on release
let liveTimer = null;
let liveChartTimer = null;

function fmtSliderVal(key, val) {
  if (['guardrailCutPct','guardrailBoostPct'].includes(key)) return Math.round(val * 100) + '%';
  if (['returnRate','returnStdDev','yourIncomeGrowth','partnerIncomeGrowth'].includes(key)) return (val * 100).toFixed(1) + '%';
  if (['slowDownAge','yourStopWorkAge','partnerStopWorkAge','ssStartAge','mortgagePayoffAge'].includes(key)) return String(Math.round(val));
  return fmtMoney(val);
}

// Called on every oninput (during drag) — updates label + debounced chart
window.slideLive = function(el, key, rawVal) {
  const val = +rawVal;
  state[key] = val;
  // Immediate label update
  const row = el.parentElement.querySelector('.control-value');
  if (row) row.textContent = fmtSliderVal(key, val);
  // Debounced chart redraw (fast, keeps slider alive)
  clearTimeout(liveChartTimer);
  liveChartTimer = setTimeout(() => {
    invalidateCaches();
    const result = runForState(state); lastSimResult = result;
    drawMainChart(result); drawCashflowChart(result);
  }, 150);
};

// Called on onchange (slider release) — full render with all sections
window.sliderCommit = function(key, rawVal) {
  state[key] = +rawVal;
  maxSpendView = false;
  presetNote = null;
  // Sync accounts proportionally when portfolio changes
  if (key === 'portfolio' && state.accountsEnabled) {
    const total = state.accounts.traditional + state.accounts.roth + state.accounts.taxable;
    if (total > 0) {
      const ratio = state.portfolio / total;
      state.accounts.traditional = Math.round(state.accounts.traditional * ratio);
      state.accounts.roth = Math.round(state.accounts.roth * ratio);
      state.accounts.taxable = Math.round(state.accounts.taxable * ratio);
    }
  }
  invalidateCaches();
  const scrollY = window.scrollY;
  render();
  window.scrollTo(0, scrollY);
};

window.updateLive2 = function(el, k1, k2, rawVal) {
  const val = +rawVal;
  state[k1] = val; state[k2] = val;
  const row = el.parentElement.querySelector('.control-value');
  if (row) row.textContent = fmtSliderVal(k1, val);
  clearTimeout(liveChartTimer);
  liveChartTimer = setTimeout(() => { invalidateCaches(); const r = runForState(state); lastSimResult = r; drawMainChart(r); drawCashflowChart(r); }, 150);
};

window.resetBaseline = function() { baselineState = JSON.parse(JSON.stringify(state)); baselineResult = lastSimResult; render(); };

window.applySSAge = function(age) {
  const factors = { 62: 0.70, 67: 1.00, 70: 1.24 };
  const curFactor = factors[state.ssStartAge] || 1;
  const newFactor = factors[age] || 1;
  // Convert current amounts back to FRA-basis, then apply new factor
  state.yourSSAmount = Math.round((state.yourSSAmount / curFactor) * newFactor);
  state.partnerSSAmount = Math.round((state.partnerSSAmount / curFactor) * newFactor);
  state.ssStartAge = age;
  invalidateCaches(); render();
};

window.applySpending = function(spend) {
  const ratio = state.spending > 0 ? state.lateSpending / state.spending : 0.85;
  state.spending = spend;
  state.lateSpending = Math.round(spend * ratio);
  invalidateCaches(); render();
};

// ===== PRESETS =====
window.applyPreset = function(id) {
  presetNote = null; // cleared on each apply; set below for presets with arbitrary assumptions
  switch (id) {
    case 'stopNow': state.yourStopWorkAge = state.age; if (state.hasPartner) state.partnerStopWorkAge = state.partnerAge; break;
    case 'retire5early': state.yourStopWorkAge = Math.max(state.age, state.yourStopWorkAge - 5); break;
    case 'maxSpend': { state.simMode = 'fixed'; const ms = findMaxSpend(state); const ratio = state.spending > 0 ? state.lateSpending/state.spending : 0.85; state.spending = Math.round(ms.spend/1000)*1000; state.lateSpending = Math.round(state.spending*ratio); maxSpendView = true; break; }
    case 'partnerReturns':
      state.partnerIncome = state.partnerIncome > 0 ? state.partnerIncome : 60000;
      state.partnerStopWorkAge = Math.max(state.partnerAge + 5, 60);
      presetNote = `Assumed your partner earns ${fmtMoney(state.partnerIncome)}/yr until age ${state.partnerStopWorkAge}. Adjust both under \u201cMore options.\u201d`;
      break;
    case 'delaySS': state.ssStartAge = 70; { const f = 1.24; state.yourSSAmount = Math.round(state.yourSSAmount * f); state.partnerSSAmount = Math.round(state.partnerSSAmount * f); } presetNote = 'Estimated benefits boosted ~24% for claiming at 70 instead of full age. Use your ssa.gov figure for precision.'; break;
    case 'sellHome': if (!state.oneTimeEvents) state.oneTimeEvents = []; state.oneTimeEvents.push({ label: 'Home sale', age: 70, amount: 400000 }); presetNote = 'Assumed a one-time inflow of ' + fmtMoney(400000) + ' at age 70. Edit the amount and age under life events.'; break;
    case 'ltc': if (!state.oneTimeEvents) state.oneTimeEvents = []; for (let a = 85; a < 90; a++) state.oneTimeEvents.push({ label: 'Long-term care', age: a, amount: -90000 }); presetNote = 'Assumed ' + fmtMoney(90000) + '/yr of long-term-care cost from age 85 to 89. Edit under life events.'; break;
  }
  invalidateCaches(); render();
};

// ===== SAVE / LOAD SCENARIOS =====
window.saveScenario = function() {
  const el = document.getElementById('scenarioName'); const name = (el.value || '').trim();
  if (!name) { el.focus(); return; }
  if (savedScenarios.length >= 8) { alert('Max 8 saved scenarios. Delete one first.'); return; }
  savedScenarios.push({ name, state: JSON.parse(JSON.stringify(state)) });
  localStorage.setItem('zeroline_scenarios', JSON.stringify(savedScenarios));
  render();
};
window.loadScenario = function(i) { state = JSON.parse(JSON.stringify(savedScenarios[i].state)); invalidateCaches(); render(); };
window.deleteScenario = function(i) { savedScenarios.splice(i, 1); localStorage.setItem('zeroline_scenarios', JSON.stringify(savedScenarios)); render(); };

function openModal(html) { modalRoot.innerHTML = `<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true"><button class="modal-close" onclick="closeModal()" aria-label="Close">\u00d7</button>${html}</div></div>`; }
window.closeModal = function() { modalRoot.innerHTML = ''; };
document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && modalRoot.innerHTML) closeModal(); });

window.showFullDisclaimer = function() {
  openModal(`<h2>Important disclaimer</h2>
    <p>This tool is provided for educational purposes only and does not constitute financial, investment, tax, or legal advice.</p>
    <p>The results shown are hypothetical projections based on your inputs and historical data. They are not predictions of future performance and should not be the sole basis for any financial decision.</p>
    <p>Your actual results will depend on factors this tool cannot model, including actual market performance, tax law changes, inflation, health, and life events.</p>
    <p>Before making major decisions, consult a qualified financial advisor, tax professional, or estate-planning attorney. This tool creates no advisory or fiduciary relationship.</p>`);
};

window.showComparison = function() {
  if (savedScenarios.length < 2) return;
  const rows = savedScenarios.map(sc => {
    const r = runForState(sc.state);
    const isHist = sc.state.simMode === 'historical';
    return {
      name: sc.name,
      spending: sc.state.spending,
      portfolio: sc.state.portfolio,
      retireAge: sc.state.yourStopWorkAge,
      mode: sc.state.simMode === 'montecarlo' ? 'Simulated' : sc.state.simMode === 'historical' ? 'Historical' : 'Fixed',
      success: isHist ? r.successCount + '/' + r.totalPeriods : sc.state.simMode === 'montecarlo' ? Math.round(r.successRate * 100) + '%' : (r.successRate >= 1 ? 'Lasts' : 'Runs out'),
      medianFinal: r.medianFinal,
      tier: r.successRate >= 0.9 ? 'good' : r.successRate >= 0.7 ? 'mid' : 'bad',
    };
  });
  const table = `<table class="data-table"><thead><tr><th>Scenario</th><th>Spending</th><th>Portfolio</th><th>Retire at</th><th>Mode</th><th>Outcome</th><th>Median ending</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td style="font-weight:600">${r.name}</td><td>${fmtMoney(r.spending)}/yr</td><td>${fmtMoneyShort(r.portfolio)}</td><td>${r.retireAge}</td><td>${r.mode}</td><td style="color:var(--${r.tier==='good'?'moss':r.tier==='mid'?'gold':'danger'});font-weight:600">${r.success}</td><td>${fmtMoneyShort(r.medianFinal)}</td></tr>`).join('')}
  </tbody></table>`;
  openModal(`<h2>Compare scenarios</h2>
    <p style="margin-bottom:16px">Side-by-side comparison of your saved scenarios.</p>
    ${table}
    <p style="font-size:11px;color:var(--ink-faint);margin-top:12px">Each scenario is run with its own mode and settings. Click "load" in the sidebar to explore any scenario in detail.</p>`);
};

window.showAbout = function() {
  openModal(`<h2>Why this exists</h2>
    <p>Most retirement planning tools are designed around one fear: running out of money. They tell you to save more, spend less, and build a cushion big enough that you'll never touch zero. That's not bad advice. But it has a cost nobody talks about.</p>
    <p>If you're 55 with a million dollars and you spend like you have half that because a calculator told you to be careful, you don't get those years back. The vacations you skipped, the experiences you postponed, the generosity you deferred. Dying with two million dollars in the bank isn't a success story. It's a planning failure in the other direction.</p>
    <p>Bill Perkins made this case in <em>Die With Zero</em>, and it changed how a lot of people think about money and time. But knowing you should spend more and knowing how much you can safely spend are two different problems. The book gives you the philosophy. This tool gives you the math.</p>
    <p>You put in your numbers. It tests your plan against every real U.S. market environment since 1926 and shows you what would have happened. Not a single prediction, but a range. Where does it hold up? Where does it break? How much room do you actually have? The answers are yours to interpret. We don't tell you what to do. We show you the trade-offs and let you decide.</p>
    <p>This isn't financial advice and we're not advisors. It's a planning tool for people who want to make informed choices about how to use the money they've worked for.</p>`);
};

window.showScenarioDetail = function(id) {
  const s = HISTORICAL_SCENARIOS.find(x => x.id === id); if (!s) return;
  const run = runNamedScenario(state, s);
  const years = run.years;
  const survived = !years.some(y => y.ranOut);
  const final = years[years.length - 1];
  // worst drawdown
  let peak = years[0].portfolio, maxDD = 0, ddAge = years[0].age;
  years.forEach(y => { if (y.portfolio > peak) peak = y.portfolio; const dd = peak > 0 ? (peak - y.portfolio) / peak : 0; if (dd > maxDD) { maxDD = dd; ddAge = y.age; } });
  const crashYears = years.filter(y => y.marketReturn <= -0.15).length;
  let narrative = 'Starting in ' + s.startYear + ', ';
  if (maxDD > 0.25) narrative += 'the portfolio saw a drawdown of about ' + Math.round(maxDD * 100) + '% (around age ' + ddAge + '). ';
  if (crashYears > 0) narrative += 'There were ' + crashYears + ' year' + (crashYears > 1 ? 's' : '') + ' with a real market drop over 15%. ';
  narrative += survived ? 'The portfolio still lasted to age ' + state.targetAge + ', ending near ' + fmtMoneyShort(final.portfolio) + '.' : 'The portfolio was depleted around age ' + years.find(y => y.ranOut).age + '.';

  const sampleRows = years.filter((y, i) => i % 5 === 0 || y.ranOut).slice(0, 16);
  const table = `<table class="data-table"><thead><tr><th>Age</th><th>Market</th><th>Portfolio</th><th>Spending</th></tr></thead><tbody>${sampleRows.map(y => `<tr><td>${y.age}</td><td style="color:${y.marketReturn<0?'var(--danger)':'var(--moss)'}">${(y.marketReturn*100).toFixed(0)}%</td><td>${fmtMoneyShort(y.portfolio)}</td><td>${fmtMoneyShort(y.spending)}</td></tr>`).join('')}</tbody></table>`;
  openModal(`<h2>${s.name} \u00b7 ${s.startYear}\u2013${s.startYear + (state.targetAge - state.age)}${run.padded?'*':''}</h2>
    <div class="detail-narrative">${narrative}</div>
    ${table}
    ${run.padded ? '<p style="font-size:11px;color:var(--ink-faint)">*This horizon extends beyond available history; later years use the long-run average return.</p>' : ''}
    <p style="font-size:11px;color:var(--ink-faint)">Past performance does not predict future results.</p>`);
};

window.openTaxHelper = function() {
  openModal(`<h2>Estimate take-home income</h2>
    <p>Enter gross household income to see a rough net (after federal, state, and FICA).</p>
    <div class="field"><label>Gross annual income</label><input type="number" id="th_gross" placeholder="e.g. 150000"/></div>
    <div class="field" style="margin-top:10px"><label>Filing status</label><select id="th_filing"><option value="mfj">Married filing jointly</option><option value="single">Single</option></select></div>
    <div class="field" style="margin-top:10px"><label>State</label><select id="th_state">${Object.keys(STATE_CONFIG).map(k => `<option value="${k}">${STATE_CONFIG[k].name}</option>`).join('')}</select></div>
    <div style="margin-top:14px"><button class="btn-primary" onclick="runTaxHelper()">Estimate</button></div>
    <div id="th_result" style="margin-top:14px;font-size:13px;color:var(--ink-soft)"></div>`);
};
window.runTaxHelper = function() {
  const gross = parseFloat(document.getElementById('th_gross').value) || 0;
  const filing = document.getElementById('th_filing').value;
  const st = document.getElementById('th_state').value;
  const r = estimateNetIncome({ gross, filingStatus: filing, stateCode: st });
  document.getElementById('th_result').innerHTML = `Estimated net: <strong>${fmtMoney(r.net)}</strong> (federal ${fmtMoney(r.federal)}, state ${fmtMoney(r.state)}, FICA ${fmtMoney(r.fica)}). Effective rate ${(r.effectiveRate*100).toFixed(1)}%. <br/><span style="font-size:11px;color:var(--ink-faint)">A rough estimate, not tax advice.</span>`;
};
window.openSSHelper = function() {
  openModal(`<h2>Estimate Social Security</h2>
    <p>A rough estimate from your typical career income. Your ssa.gov statement is the official figure.</p>
    <div class="field"><label>Typical annual income (today's $)</label><input type="number" id="ss_gross" placeholder="e.g. 90000"/></div>
    <div style="margin-top:14px"><button class="btn-primary" onclick="runSSHelper()">Estimate</button></div>
    <div id="ss_result" style="margin-top:14px;font-size:13px;color:var(--ink-soft)"></div>`);
};
window.runSSHelper = function() {
  const g = parseFloat(document.getElementById('ss_gross').value) || 0;
  const b = estimateSSBenefit(g);
  document.getElementById('ss_result').innerHTML = `Estimated benefit at full retirement age: <strong>${fmtMoney(b)}/yr</strong> (${fmtMoney(Math.round(b/12))}/mo).<br/><span style="font-size:11px;color:var(--ink-faint)">Approximate \u2014 your ssa.gov statement is authoritative.</span>`;
};
